forme demandée (+, -, ?) et à l'utilisation de DID/DIDN'T !\u003c/p>\n\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>1. (+) Aron a joué à la console hier.\u003c/span><span class=\"ex-hint\">Verbe régulier : to play / Déclencheur : yesterday\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Aron played on the console yesterday.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>2. (-) Myriam n'est pas allée au Brésil la semaine dernière.\u003c/span><span class=\"ex-hint\">Verbe : to go (Attention, forme négative avec DIDN'T !) / Déclencheur : last week\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Myriam didn't go to Brazil last week.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>3. (?) Est-ce que Vincent a conduit sa Tesla il y a deux jours ?\u003c/span><span class=\"ex-hint\">Verbe : to drive / Déclencheur : two days ago\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Did Vincent drive his Tesla two days ago?\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>4. (+) Quand j'étais petit, je détestais l'école.\u003c/span><span class=\"ex-hint\">Verbe régulier : to hate / Déclencheur : When I was little...\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">When I was little, I hated school.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>5. (-) Nous n'avons pas regardé de film hier soir.\u003c/span><span class=\"ex-hint\">Verbe régulier : to watch / Déclencheur : last night\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">We didn't watch a movie last night.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>6. (+) Les chats ont mangé leurs croquettes ce matin.\u003c/span><span class=\"ex-hint\">Verbe irrégulier : to eat (2ème colonne : ate)\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The cats ate their food this morning.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>7. (?) Est-ce qu'Aron a fini ses devoirs mercredi ?\u003c/span><span class=\"ex-hint\">Verbe régulier : to finish / Déclencheur : on Wednesday\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Did Aron finish his homework on Wednesday?\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>8. (+) Sienna a dessiné un beau chat hier.\u003c/span><span class=\"ex-hint\">Verbe irrégulier : to draw (2ème colonne : drew)\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Sienna drew a beautiful cat yesterday.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>9. (-) Je n'ai pas aimé ce jeu vidéo (Resident Evil).\u003c/span><span class=\"ex-hint\">Verbe régulier : to like (Forme négative !)\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">I didn't like this video game (Resident Evil).\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>10. (?) Est-ce que tu as vu le dernier épisode de la série ?\u003c/span><span class=\"ex-hint\">Verbe : to see (Forme interrogative)\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Did you see the last episode of the series?\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>11. (+) L'imprimante 3D a terminé la figurine il y a une heure.\u003c/span><span class=\"ex-hint\">Verbe régulier : to finish / Déclencheur : one hour ago\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The 3D printer finished the figure one hour ago.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>12. (-) Nous ne sommes pas allés en Espagne le mois dernier.\u003c/span><span class=\"ex-hint\">Verbe : to go / Déclencheur : last month\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">We didn't go to Spain last month.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>13. (?) Est-ce qu'il a plu la semaine dernière ?\u003c/span><span class=\"ex-hint\">Verbe régulier : to rain / Déclencheur : last week\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Did it rain last week?\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>14. (+) J'ai imprimé un nouveau vaisseau spatial la semaine dernière.\u003c/span><span class=\"ex-hint\">Verbe régulier : to print\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">I printed a new spaceship last week.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>15. (-) Le casque de réalité virtuelle n'a pas fonctionné hier.\u003c/span><span class=\"ex-hint\">Verbe régulier : to work (fonctionner)\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The virtual reality headset didn't work yesterday.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>16. (+) Quand j'étais petit, je jouais à Metal Slug.\u003c/span><span class=\"ex-hint\">Déclencheur : When I was little\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">When I was little, I played Metal Slug.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>17. (?) Est-ce que tes grands-parents ont écrit ces lettres en 1970 ?\u003c/span><span class=\"ex-hint\">Verbe : to write (écrire) / Date dans un passé révolu\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Did your grandparents write these letters in 1970?\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>18. (-) Vincent n'a pas mangé de viande hier soir.\u003c/span><span class=\"ex-hint\">Verbe : to eat (Maintien de la base verbale car phrase négative)\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Vincent didn't eat meat last night.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>19. (+) Myriam a acheté un nouveau téléphone il y a deux ans.\u003c/span><span class=\"ex-hint\">Verbe irrégulier : to buy (2ème colonne : bought) / Déclencheur : two years ago\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Myriam bought a new phone two years ago.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>20. (?) Est-ce que l'équipe a gagné le match la semaine dernière ?\u003c/span><span class=\"ex-hint\">Verbe : to win (gagner)\u003c/span>\u003c/span><span class=\"ex-toggle\">Voir la traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">Did the team win the match last week?\u003c/span>\u003c/div>\n        \u003c/details>\n    \u003c/section>\n\n    \u003c!-- ONGLET 3 : MEGA QCM -->\n    <section id=\"quiz\" class=\"tab-content\">\n        <h2>🎯 Le Méga QCM (25 Questions)\u003c/h2>\n        <p>Coche la bonne réponse. La note finale sera calculée sur 20 ! N'oublie pas : Avec DID ou DIDN'T, le verbe reste à la base verbale !\u003c/p>\n\n        <form id=\"quiz-form\" class=\"quiz\" onsubmit=\"return false\">\n            <div class=\"quiz-head is-sticky\"><span class=\"quiz-count\">\u003c/span><div class=\"quiz-progress\"><span>\u003c/span>\u003c/div><span class=\"quiz-score\">\u003c/span>\u003c/div>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">1. Quelle phrase affirmative est correcte ?\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q1\" value=\"wrong\"> I plaied football yesterday.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q1\" value=\"correct\"> I played football yesterday.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q1\" value=\"wrong\"> I play football yesterday.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q1\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">2. Il a vu un bon film la semaine dernière. (to see est irrégulier)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q2\" value=\"wrong\"> He seed a good movie last week.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q2\" value=\"wrong\"> He seen a good movie last week.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q2\" value=\"correct\"> He saw a good movie last week.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q2\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">3. Phrase Négative : Laquelle est correcte ?\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q3\" value=\"wrong\"> She didn't worked yesterday.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q3\" value=\"correct\"> She didn't work yesterday.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q3\" value=\"wrong\"> She not worked yesterday.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q3\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">4. Phrase Interrogative : Laquelle est correcte ?\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q4\" value=\"correct\"> Did you watch TV last night?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q4\" value=\"wrong\"> Did you watched TV last night?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q4\" value=\"wrong\"> Do you watched TV last night?\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q4\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">5. Le mot déclencheur manquant : \"I met my friend two years _______.\"\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q5\" value=\"wrong\"> since\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q5\" value=\"wrong\"> yesterday\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q5\" value=\"correct\"> ago\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q5\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">6. Comment dit-on : \"Où es-tu allé ?\" (to go)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q6\" value=\"correct\"> Where did you go?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q6\" value=\"wrong\"> Where did you went?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q6\" value=\"wrong\"> Where you went?\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q6\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">7. La négation de \"I went\" (Je suis allé) :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q7\" value=\"correct\"> I didn't go.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q7\" value=\"wrong\"> I didn't went.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q7\" value=\"wrong\"> I don't went.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q7\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">8. Au prétérit affirmatif, le verbe irrégulier \"to eat\" devient :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q8\" value=\"wrong\"> eated\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q8\" value=\"correct\"> ate\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q8\" value=\"wrong\"> eaten\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q8\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">9. Au prétérit affirmatif, pour les verbes réguliers, on ajoute :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q9\" value=\"correct\"> -ed à la fin\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q9\" value=\"wrong\"> -ing à la fin\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q9\" value=\"wrong\"> -s à la fin\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q9\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">10. Comment dit-on \"Quand j'étais petit\" ?\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q10\" value=\"correct\"> When I was little...\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q10\" value=\"wrong\"> When I am little...\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q10\" value=\"wrong\"> When I did little...\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q10\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">11. \"La semaine dernière\" se dit :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q11\" value=\"correct\"> Last week\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q11\" value=\"wrong\"> Yesterday week\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q11\" value=\"wrong\"> The week last\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q11\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">12. Quelle est la bonne phrase pour \"As-tu aimé le film ?\"\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q12\" value=\"wrong\"> Do you liked the movie?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q12\" value=\"correct\"> Did you like the movie?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q12\" value=\"wrong\"> Did you liked the movie?\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q12\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">13. La négation de \"He played\" est :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q13\" value=\"wrong\"> He didn't played\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q13\" value=\"wrong\"> He not played\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q13\" value=\"correct\"> He didn't play\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q13\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">14. Le verbe \"to have\" (avoir) au prétérit affirmatif :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q14\" value=\"correct\"> had\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q14\" value=\"wrong\"> haved\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q14\" value=\"wrong\"> has\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q14\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">15. Le prétérit s'utilise pour une action... :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q15\" value=\"correct\"> Révolue et clairement définie dans le passé.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q15\" value=\"wrong\"> Qui vient juste de se terminer avec un lien au présent.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q15\" value=\"wrong\"> Qui se passe en ce moment.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q15\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">16. Comment traduit-on \"hier\" en anglais ?\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q16\" value=\"correct\"> yesterday\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q16\" value=\"wrong\"> tomorrow\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q16\" value=\"wrong\"> ago\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q16\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">17. Au prétérit (DID/DIDN'T), l'auxiliaire change-t-il avec \"He\" ou \"She\" ?\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q17\" value=\"correct\"> Non, l'auxiliaire est le même à toutes les personnes.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q17\" value=\"wrong\"> Oui, DID devient DOES.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q17\" value=\"wrong\"> Oui, on ajoute un -s.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q17\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">18. \"Il y a 3 jours\" se traduit par :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q18\" value=\"wrong\"> since 3 days\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q18\" value=\"correct\"> 3 days ago\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q18\" value=\"wrong\"> past 3 days\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q18\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">19. Au prétérit affirmatif, le verbe irrégulier \"to buy\" devient :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q19\" value=\"wrong\"> buyed\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q19\" value=\"correct\"> bought\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q19\" value=\"wrong\"> build\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q19\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">20. Laquelle de ces phrases est correcte (Ils n'ont pas écouté) :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q20\" value=\"correct\"> They didn't listen.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q20\" value=\"wrong\"> They didn't listened.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q20\" value=\"wrong\"> They didn't listening.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q20\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">21. Est-ce qu'elle a fini ? (to finish)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q21\" value=\"wrong\"> Did she finished?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q21\" value=\"wrong\"> Does she finish?\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q21\" value=\"correct\"> Did she finish?\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q21\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">22. Au prétérit affirmatif, le verbe \"to make\" devient :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q22\" value=\"wrong\"> maked\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q22\" value=\"correct\"> made\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q22\" value=\"wrong\"> maken\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q22\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">23. \"Mercredi dernier\" se dit :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q23\" value=\"wrong\"> Wednesday past\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q23\" value=\"wrong\"> The Wednesday before\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q23\" value=\"correct\"> Last Wednesday (ou On Wednesday)\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q23\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">24. Règle d'or : Que met-on avec DIDN'T ou DID ?\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q24\" value=\"correct\"> Toujours la Base Verbale (le verbe normal).\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q24\" value=\"wrong\"> Le verbe avec -ed.\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q24\" value=\"wrong\"> Le verbe de la 2ème colonne.\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q24\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">25. Si on voit le mot magique \"AGO\" dans une phrase, on est certain de devoir utiliser :\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q25\" value=\"wrong\"> Le present perfect\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q25\" value=\"correct\"> Le prétérit\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q25\" value=\"wrong\"> Le présent\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q25\">\u003c/div>\n            \u003c/article>\n\n            <div class=\"quiz-actions center\"><button type=\"button\" id=\"submit-quiz\" class=\"btn btn-primary btn-lg\">Terminer et voir ma note !\u003c/button>\u003c/div>\n            <div id=\"quiz-result\">\u003c/div>\n        \u003c/form>\n    \u003c/section>\n\u003c/main>\n\n<script>\n    var MSG = {\n        correct: \"✅ Parfait !\",\n        wrong: function (i) {\n            // Explications générales pour les erreurs\n            var explication = \"❌ Faux. Relis bien le cours !\";\n            // Pièges fréquents sur les verbes réguliers/irréguliers avec did/didn't\n            if ([3, 4, 6, 7, 12, 13, 20, 21].includes(i)) {\n                explication = \"❌ Règle d'or : Avec DID ou DIDN'T, le verbe repasse TOUJOURS à la Base Verbale (pas de -ed, pas de 2ème colonne) !\";\n            }\n            // Pièges sur AGO / Mots déclencheurs\n            if ([5, 11, 16, 18, 23, 25].includes(i)) {\n                explication = \"❌ Erreur sur un mot déclencheur. Souviens-toi : 'ago' veut dire 'il y a', 'last' veut dire 'dernier'.\";\n            }\n            return explication;\n        },\n        missing: \"⚠️ N'oublie pas de cocher une case !\",\n        result: function (score, total) {\n            // Calcul de la note sur 20\n            var noteSur20 = (score / total) * 20;\n            if (score === total) return \"🏆 Exceptionnel ! Note : 20/20. Tu es le boss absolu du Prétérit !\";\n            if (noteSur20 >= 15) return \"👍 Très bien ! Note : \" + noteSur20.toFixed(1) + \"/20. Excellent travail, relis tes erreurs.\";\n            if (noteSur20 >= 10) return \"🙂 C'est la moyenne ! Note : \" + noteSur20.toFixed(1) + \"/20. Tu as les bases, mais révise le cours (surtout la règle avec DID).\";\n            return \"💪 Continue de t'entraîner ! Note : \" + noteSur20.toFixed(1) + \"/20. Reprends la fiche de révision, tu vas y arriver !\";\n        }\n    };\n\n    // QCM : l'élève coche ses réponses puis valide l'ensemble (correction globale)\n    (function () {\n        var form = document.getElementById('quiz-form');\n        var head = form.querySelector('.quiz-head');\n        var cards = [].slice.call(form.querySelectorAll('.q-card'));\n        var submit = document.getElementById('submit-quiz');\n        var result = document.getElementById('quiz-result');\n        var total = cards.length;\n\n        function update() {\n            var n = cards.filter(function (c) { return c.querySelector('input:checked'); }).length;\n            Lecon.setProgress(head, n, total);\n            head.querySelector('.quiz-count').textContent = n + ' / ' + total + ' répondue' + (n > 1 ? 's' : '');\n            head.querySelector('.quiz-score').textContent = '';\n        }\n\n        function checkQuiz() {\n            var score = 0;\n            cards.forEach(function (card, idx) {\n                var i = idx + 1;\n                var choices = card.querySelector('.choices');\n                var chosen = card.querySelector('input:checked');\n                var good = card.querySelector('input[value=\"correct\"]').closest('.choice');\n                var fb = card.querySelector('.feedback');\n                Lecon.markChoices(choices, chosen ? chosen.closest('.choice') : null, good);\n                var answer = '<b>Bonne réponse : \u003c/b>' + good.textContent.trim();\n                if (!chosen) {\n                    Lecon.feedback(fb, false, MSG.missing, answer);\n                } else if (chosen.value === 'correct') {\n                    score++;\n                    Lecon.feedback(fb, true, MSG.correct);\n                } else {\n                    Lecon.feedback(fb, false, MSG.wrong(i), answer);\n                }\n            });\n            Lecon.setProgress(head, total, total);\n            head.querySelector('.quiz-count').textContent = 'Corrigé';\n            head.querySelector('.quiz-score').textContent = 'Score : ' + score + ' / ' + total;\n            submit.parentNode.hidden = true;\n            result.innerHTML = '';\n            var box = Lecon.resultCard(score, total, { message: MSG.result }, restart);\n            result.appendChild(box);\n            box.scrollIntoView({ behavior: 'smooth', block: 'center' });\n        }\n\n        function restart() {\n            form.reset();\n            [].forEach.call(form.querySelectorAll('.choices'), function (c) { c.classList.remove('is-answered'); });\n            [].forEach.call(form.querySelectorAll('.choice'), function (l) {\n                l.classList.remove('is-correct', 'is-wrong', 'is-selected');\n                l.removeAttribute('aria-disabled');\n                l.disabled = false;\n            });\n            [].forEach.call(form.querySelectorAll('.choice input'), function (r) { r.disabled = false; });\n            [].forEach.call(form.querySelectorAll('.feedback'), function (f) { Lecon.clearFeedback(f); });\n            result.innerHTML = '';\n            submit.parentNode.hidden = false;\n            update();\n            form.scrollIntoView({ behavior: 'smooth', block: 'start' });\n        }\n\n        form.addEventListener('change', update);\n        submit.addEventListener('click', checkQuiz);\n        update();\n    })();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n","Anglais/Irregular Verbs.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Révisions - Verbes Irréguliers Anglais\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n    <style>\n        /* Mise en page propre à cette leçon (variables du design system uniquement) */\n        .group-title { display: flex; align-items: center; gap: var(--space-2); }\n        .group-title::before { content: \"\"; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--group, var(--primary)); }\n        .group-1 { --group: var(--info); }\n        .group-2 { --group: var(--success); }\n        .group-3 { --group: var(--primary); }\n        .verb-table td.emoji, .verb-table th.emoji { width: 48px; text-align: center; }\n        .verb-table td.emoji { font-size: var(--text-xl); line-height: 1.2; }\n        .verb-table td.base { font-weight: 700; color: var(--text); }\n        .verb-table td.form { color: var(--text-2); }\n        .verb-table td.fr { font-style: italic; color: var(--text-2); }\n        @media (max-width: 480px) {\n            .verb-table th, .verb-table td { padding: 8px 6px; }\n            .verb-table th { letter-spacing: .02em; font-size: 10px; }\n            .verb-table td.emoji, .verb-table th.emoji { width: 30px; }\n            .verb-table td.emoji { font-size: var(--text-base); }\n        }\n        .verb-search { display: flex; margin: 0 0 var(--space-4); }\n        .verb-search .answer-input { max-width: none; }\n        .mcq-word { margin: calc(-1 * var(--space-2)) 0 var(--space-5); font-size: var(--text-3xl); font-weight: 800; letter-spacing: -.02em; line-height: 1.2; color: var(--primary); }\n        @media (max-width: 480px) { .mcq-word { font-size: var(--text-2xl); } }\n        .test-item { display: grid; gap: var(--space-3); align-items: center; margin-bottom: var(--space-3); padding: var(--space-4) var(--space-5); }\n        @media (min-width: 700px) { .test-item { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }\n        .test-item .q-title { margin: 0; font-size: var(--text-base); }\n        .test-item .q-title .kind { color: var(--primary); font-weight: 750; }\n        .test-item .q-title .verb { font-weight: 800; }\n        .test-item .q-hint { display: block; margin: var(--space-1) 0 0; font-style: italic; }\n        .test-item .answer-row { flex-wrap: nowrap; }\n        .test-item .answer-input { min-width: 0; max-width: none; }\n        .test-corr { flex: none; font-size: var(--text-sm); font-weight: 700; white-space: nowrap; }\n        .test-corr .solution { margin: 0; }\n        .intro-card { text-align: center; }\n    \u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">Anglais\u003c/div>\n        <h1>🇬🇧 Verbes Irréguliers - Objectif 3ème 🎯\u003c/h1>\n        <p class=\"lecon-subtitle\">Révise, entraîne-toi et teste tes connaissances !\u003c/p>\n    \u003c/header>\n\n    \u003c!-- Navigation Tabs -->\n    <nav class=\"tabs\" role=\"tablist\" id=\"tabs\">\n        <button type=\"button\" role=\"tab\" class=\"tab active\" aria-selected=\"true\" onclick=\"showTab('list', this)\">📚 Liste Complète\u003c/button>\n        <button type=\"button\" role=\"tab\" class=\"tab\" onclick=\"showTab('mcq-g1', this)\">🎮 QCM Groupe 1\u003c/button>\n        <button type=\"button\" role=\"tab\" class=\"tab\" onclick=\"showTab('mcq-g2', this)\">🎮 QCM Groupe 2\u003c/button>\n        <button type=\"button\" role=\"tab\" class=\"tab\" onclick=\"showTab('mcq-g3', this)\">🎮 QCM Groupe 3\u003c/button>\n        <button type=\"button\" role=\"tab\" class=\"tab\" onclick=\"showTab('mcq-all', this)\">🌟 QCM Total\u003c/button>\n        <button type=\"button\" role=\"tab\" class=\"tab\" onclick=\"showTab('test', this)\">📝 Test Écrit (20 Qs)\u003c/button>\n    \u003c/nav>\n\n    \u003c!-- Tab 1: List -->\n    <section id=\"view-list\" class=\"tab-content active\">\n        <h2>📖 Liste des Verbes Irréguliers\u003c/h2>\n\n        <div class=\"verb-search\">\n            <input type=\"search\" id=\"verb-search\" class=\"answer-input\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"🔍 Rechercher un verbe…\" aria-label=\"Rechercher un verbe\">\n        \u003c/div>\n\n        <div class=\"verb-group\" data-group=\"1\">\n            <h3 class=\"group-title group-1\">Groupe 1 (3 formes identiques)\u003c/h3>\n            <div class=\"table-wrap\">\n                <table class=\"verb-table\">\n                    <thead><tr><th class=\"emoji\">✨\u003c/th><th>Base Verbale\u003c/th><th>Prétérit\u003c/th><th>Participe Passé\u003c/th><th>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n                    <tbody id=\"table-g1\">\u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/div>\n\n        <div class=\"verb-group\" data-group=\"2\">\n            <h3 class=\"group-title group-2\">Groupe 2 (2 formes identiques)\u003c/h3>\n            <div class=\"table-wrap\">\n                <table class=\"verb-table\">\n                    <thead><tr><th class=\"emoji\">✨\u003c/th><th>Base Verbale\u003c/th><th>Prétérit\u003c/th><th>Participe Passé\u003c/th><th>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n                    <tbody id=\"table-g2\">\u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/div>\n\n        <div class=\"verb-group\" data-group=\"3\">\n            <h3 class=\"group-title group-3\">Groupe 3 (3 formes différentes)\u003c/h3>\n            <div class=\"table-wrap\">\n                <table class=\"verb-table\">\n                    <thead><tr><th class=\"emoji\">✨\u003c/th><th>Base Verbale\u003c/th><th>Prétérit\u003c/th><th>Participe Passé\u003c/th><th>Traduction\u003c/th>\u003c/tr>\u003c/thead>\n                    <tbody id=\"table-g3\">\u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/div>\n        <p id=\"verb-search-empty\" class=\"muted text-center\" hidden>Aucun verbe trouvé.\u003c/p>\n    \u003c/section>\n\n    \u003c!-- Tab 2 to 5: MCQs (Shared UI, dynamic content) -->\n    <section id=\"view-mcq\" class=\"tab-content\">\n        <h2 id=\"mcq-title\">QCM\u003c/h2>\n        <div class=\"quiz\" id=\"mcq-quiz\">\n            <div class=\"quiz-head\" id=\"mcq-head\">\n                <span class=\"quiz-count\">\u003c/span>\n                <div class=\"quiz-progress\"><span>\u003c/span>\u003c/div>\n                <span class=\"quiz-score\" id=\"mcq-score\">Score : 0\u003c/span>\n            \u003c/div>\n            <div id=\"mcq-stage\">\n                <article class=\"q-card\" id=\"mcq-question-container\">\n                    <h3 class=\"q-title\" id=\"mcq-question-text\">\u003c/h3>\n                    <p class=\"mcq-word\" id=\"mcq-question-word\">\u003c/p>\n                    <div class=\"choices\" id=\"mcq-options\" role=\"group\" aria-label=\"Choix de réponse\">\n                        \u003c!-- Buttons injected here by JS -->\n                    \u003c/div>\n                    <div class=\"feedback\" id=\"mcq-feedback\" aria-live=\"polite\">\u003c/div>\n                    <div class=\"quiz-actions\">\n                        <button type=\"button\" id=\"mcq-next-btn\" onclick=\"nextMCQQuestion()\" class=\"btn btn-primary\" hidden>Question Suivante ➡️\u003c/button>\n                    \u003c/div>\n                \u003c/article>\n            \u003c/div>\n            <div id=\"mcq-result\">\u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Tab 6: Written Test -->\n    <section id=\"view-test\" class=\"tab-content\">\n        <div class=\"card intro-card\">\n            <h2>📝 Le Grand Test\u003c/h2>\n            <p class=\"muted\">20 questions aléatoires. Remplis les champs avec la forme correcte.\u003c/p>\n            <div class=\"btn-row center\">\n                <button type=\"button\" onclick=\"startWrittenTest()\" class=\"btn btn-primary btn-lg\">🔄 Démarrer / Recommencer un test\u003c/button>\n            \u003c/div>\n        \u003c/div>\n\n        <div id=\"test-container\" class=\"quiz\" hidden>\n            <div class=\"quiz-head is-sticky\" id=\"test-head\">\n                <span class=\"quiz-count\">Questions :\u003c/span>\n                <div class=\"quiz-progress\"><span>\u003c/span>\u003c/div>\n                <span class=\"quiz-score\" id=\"test-final-score\">\u003c/span>\n            \u003c/div>\n            <div id=\"test-questions\">\n                \u003c!-- Inputs injected here -->\n            \u003c/div>\n            <div class=\"quiz-actions center\">\n                <button type=\"button\" id=\"test-submit-btn\" onclick=\"submitWrittenTest()\" class=\"btn btn-primary btn-lg\">✅ Corriger mon test\u003c/button>\n            \u003c/div>\n            <div id=\"test-result\">\u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n\u003c/main>\n\n<script>\n    // Database of all verbs categorized by groups\n    const verbsData = [\n        // GROUP 1\n        { base: \"bet\", preterit: \"bet\", pp: \"bet\", fr: \"parier\", group: 1, emoji: \"🎲\" },\n        { base: \"burst\", preterit: \"burst\", pp: \"burst\", fr: \"éclater\", group: 1, emoji: \"💥\" },\n        { base: \"cast\", preterit: \"cast\", pp: \"cast\", fr: \"lancer un sort\", group: 1, emoji: \"🪄\" },\n        { base: \"cost\", preterit: \"cost\", pp: \"cost\", fr: \"coûter\", group: 1, emoji: \"💰\" },\n        { base: \"cut\", preterit: \"cut\", pp: \"cut\", fr: \"couper\", group: 1, emoji: \"✂️\" },\n        { base: \"hit\", preterit: \"hit\", pp: \"hit\", fr: \"frapper\", group: 1, emoji: \"🥊\" },\n        { base: \"hurt\", preterit: \"hurt\", pp: \"hurt\", fr: \"blesser\", group: 1, emoji: \"🤕\" },\n        { base: \"let\", preterit: \"let\", pp: \"let\", fr: \"laisser\", group: 1, emoji: \"🚪\" },\n        { base: \"put\", preterit: \"put\", pp: \"put\", fr: \"mettre\", group: 1, emoji: \"⬇️\" },\n        { base: \"set\", preterit: \"set\", pp: \"set\", fr: \"placer\", group: 1, emoji: \"🍽️\" },\n        { base: \"shut\", preterit: \"shut\", pp: \"shut\", fr: \"fermer\", group: 1, emoji: \"🚪\" },\n        { base: \"split\", preterit: \"split\", pp: \"split\", fr: \"fendre\", group: 1, emoji: \"💔\" },\n        { base: \"spread\", preterit: \"spread\", pp: \"spread\", fr: \"répandre\", group: 1, emoji: \"🧈\" },\n\n        // GROUP 2\n        { base: \"bleed\", preterit: \"bled\", pp: \"bled\", fr: \"saigner\", group: 2, emoji: \"🩸\" },\n        { base: \"feed\", preterit: \"fed\", pp: \"fed\", fr: \"nou erit: \"spoilt\", pp: \"spoilt\", fr: \"gâter\", group: 2, emoji: \"🧸\" },\n        { base: \"sweep\", preterit: \"swept\", pp: \"swept\", fr: \"balayer\", group: 2, emoji: \"🧹\" },\n        { base: \"bring\", preterit: \"brought\", pp: \"brought\", fr: \"apporter\", group: 2, emoji: \"📦\" },\n        { base: \"buy\", preterit: \"bought\", pp: \"bought\", fr: \"acheter\", group: 2, emoji: \"🛒\" },\n        { base: \"catch\", preterit: \"caught\", pp: \"caught\", fr: \"attraper\", group: 2, emoji: \"⚾\" },\n        { base: \"fight\", preterit: \"fought\", pp: \"fought\", fr: \"combattre\", group: 2, emoji: \"⚔️\" },\n        { base: \"read\", preterit: \"read\", pp: \"read\", fr: \"lire\", group: 2, emoji: \"📖\" },\n        { base: \"teach\", preterit: \"taught\", pp: \"taught\", fr: \"enseigner\", group: 2, emoji: \"👨‍🏫\" },\n        { base: \"think\", preterit: \"thought\", pp: \"thought\", fr: \"penser\", group: 2, emoji: \"💭\" },\n        { base: \"become\", preterit: \"became\", pp: \"become\", fr: \"devenir\", group: 2, emoji: \"🦋\" },\n        { base: \"come\", preterit: \"came\", pp: \"come\", fr: \"venir\", group: 2, emoji: \"🚶\" },\n        { base: \"hang\", preterit: \"hung\", pp: \"hung\", fr: \"pendre / suspendre\", group: 2, emoji: \"🧥\" },\n        { base: \"run\", preterit: \"ran\", pp: \"run\", fr: \"courir\", group: 2, emoji: \"🏃\" },\n        { base: \"stick\", preterit: \"stuck\", pp: \"stuck\", fr: \"coller\", group: 2, emoji: \"🍯\" },\n        { base: \"strike\", preterit: \"struck\", pp: \"struck\", fr: \"frapper\", group: 2, emoji: \"🎳\" },\n        { base: \"swing\", preterit: \"swung\", pp: \"swung\", fr: \"balancer\", group: 2, emoji: \"🐒\" },\n        { base: \"win\", preterit: \"won\", pp: \"won\", fr: \"gagner\", group: 2, emoji: \"🏆\" },\n\n        // GROUP 3\n        { base: \"be\", preterit: \"was/were\", pp: \"been\", fr: \"être\", group: 3, emoji: \"👤\" },\n        { base: \"bite\", preterit: \"bit\", pp: \"bitten\", fr: \"mordre\", group: 3, emoji: \"🦷\" },\n        { base: \"break\", preterit: \"broke\", pp: \"broken\", fr: \"casser\", group: 3, emoji: \"🔨\" },\n        { base: \"choose\", preterit: \"chose\", pp: \"chosen\", fr: \"choisir\", group: 3, emoji: \"👈\" },\n        { base: \"drive\", preterit: \"drove\", pp: \"driven\", fr: \"conduire\", group: 3, emoji: \"🚗\" },\n        { base: \"eat\", preterit: \"ate\", pp: \"eaten\", fr: \"manger\", group: 3, emoji: \"🍔\" },\n        { base: \"fall\", preterit: \"fell\", pp: \"fallen\", fr: \"tomber\", group: 3, emoji: \"🍂\" },\n        { base: \"forbid\", preterit: \"forbade\", pp: \"forbidden\", fr: \"interdire\", group: 3, emoji: \"🚫\" },\n        { base: \"forgive\", preterit: \"forgave\", pp: \"forgiven\", fr: \"pardonner\", group: 3, emoji: \"🙏\" },\n        { base: \"forget\", preterit: \"forgot\", pp: \"forgotten\", fr: \"oublier\", group: 3, emoji: \"❓\" },\n        { base: \"freeze\", preterit: \"froze\", pp: \"frozen\", fr: \"geler\", group: 3, emoji: \"🧊\" },\n        { base: \"give\", preterit: \"gave\", pp: \"given\", fr: \"donner\", group: 3, emoji: \"🎁\" },\n        { base: \"hide\", preterit: \"hid\", pp: \"hidden\", fr: \"cacher\", group: 3, emoji: \"🙈\" },\n        { base: \"ride\", preterit: \"rode\", pp: \"ridden\", fr: \"aller à cheval\", group: 3, emoji: \"🏇\" },\n        { base: \"rise\", preterit: \"rose\", pp: \"risen\", fr: \"s'élever\", group: 3, emoji: \"🌅\" },\n        { base: \"see\", preterit: \"saw\", pp: \"seen\", fr: \"voir\", group: 3, emoji: \"👀\" },\n        { base: \"shake\", preterit: \"shook\", pp: \"shaken\", fr: \"secouer\", group: 3, emoji: \"🤝\" },\n        { base: \"speak\", preterit: \"spoke\", pp: \"spoken\", fr: \"parler\", group: 3, emoji: \"🗣️\" },\n        { base: \"steal\", preterit: \"stole\", pp: \"stolen\", fr: \"voler (qqch)\", group: 3, emoji: \"🦹\" },\n        { base: \"take\", preterit: \"took\", pp: \"taken\", fr: \"prendre\", group: 3, emoji: \"🖐️\" },\n        { base: \"wake\", preterit: \"woke\", pp: \"woken\", fr: \"réveiller\", group: 3, emoji: \"⏰\" },\n        { base: \"write\", preterit: \"wrote\", pp: \"written\", fr: \"écrire\", group: 3, emoji: \"✍️\" },\n        { base: \"blow\", preterit: \"blew\", pp: \"blown\", fr: \"souffler\", group: 3, emoji: \"🌬️\" },\n        { base: \"do\", preterit: \"did\", pp: \"done\", fr: \"faire\", group: 3, emoji: \"✅\" },\n        { base: \"draw\", preterit: \"drew\", pp: \"drawn\", fr: \"dessiner\", group: 3, emoji: \"🖍️\" },\n        { base: \"fly\", preterit: \"flew\", pp: \"flown\", fr: \"voler dans les airs\", group: 3, emoji: \"✈️\" },\n        { base: \"go\", preterit: \"went\", pp: \"gone\", fr: \"aller\", group: 3, emoji: \"➡️\" },\n        { base: \"grow\", preterit: \"grew\", pp: \"grown\", fr: \"pousser\", group: 3, emoji: \"🌱\" },\n        { base: \"know\", preterit: \"knew\", pp: \"known\", fr: \"connaître\", group: 3, emoji: \"🧠\" },\n        { base: \"lie\", preterit: \"lay\", pp: \"lain\", fr: \"être couché\", group: 3, emoji: \"🛌\" },\n        { base: \"show\", preterit: \"showed\", pp: \"shown\", fr: \"montrer\", group: 3, emoji: \"📺\" },\n        { base: \"swear\", preterit: \"swore\", pp: \"sworn\", fr: \"jurer\", group: 3, emoji: \"🤬\" },\n        { base: \"tear\", preterit: \"tore\", pp: \"torn\", fr: \"déchirer\", group: 3, emoji: \"📄\" },\n        { base: \"throw\", preterit: \"threw\", pp: \"thrown\", fr: \"lancer\", group: 3, emoji: \"⚾\" },\n        { base: \"wear\", preterit: \"wore\", pp: \"worn\", fr: \"porter (vêtement)\", group: 3, emoji: \"👕\" },\n        { base: \"begin\", preterit: \"began\", pp: \"begun\", fr: \"commencer\", group: 3, emoji: \"🏁\" },\n        { base: \"drink\", preterit: \"drank\", pp: \"drunk\", fr: \"boire\", group: 3, emoji: \"🥤\" },\n        { base: \"ring\", preterit: \"rang\", pp: \"rung\", fr: \"sonner\", group: 3, emoji: \"🔔\" },\n        { base: \"sing\", preterit: \"sang\", pp: \"sung\", fr: \"chanter\", group: 3, emoji: \"🎤\" },\n        { base: \"sink\", preterit: \"sank\", pp: \"sunk\", fr: \"couler\", group: 3, emoji: \"🚢\" },\n        { base: \"swim\", preterit: \"swam\", pp: \"swum\", fr: \"nager\", group: 3, emoji: \"🏊\" }\n    ];\n\n    // Utility to get random item from array\n    const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];\n    // Utility to shuffle array\n    const shuffle = (arr) => [...arr].sort(() => 0.5 - Math.random());\n\n    const escapeHtml = (s) => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n    function initTables() {\n        const createRow = (v) => `<tr data-search=\"${escapeHtml((v.base + ' ' + v.preterit + ' ' + v.pp + ' ' + v.fr).toLowerCase())}\"><td class=\"emoji\">${v.emoji}\u003c/td><td class=\"base\">${v.base}\u003c/td><td class=\"form\">${v.preterit}\u003c/td><td class=\"form\">${v.pp}\u003c/td><td class=\"fr\">${v.fr}\u003c/td>\u003c/tr>`;\n\n        document.getElementById('table-g1').innerHTML = verbsData.filter(v => v.group === 1).map(createRow).join('');\n        document.getElementById('table-g2').innerHTML = verbsData.filter(v => v.group === 2).map(createRow).join('');\n        document.getElementById('table-g3').innerHTML = verbsData.filter(v => v.group === 3).map(createRow).join('');\n    }\n\n    function filterTables(query) {\n        const q = Lecon.normalize(query, true);\n        let total = 0;\n        document.querySelectorAll('.verb-group').forEach(group => {\n            let visible = 0;\n            group.querySelectorAll('tbody tr').forEach(tr => {\n                const hay = Lecon.normalize(tr.dataset.search, true);\n                const show = !q || hay.includes(q);\n                tr.hidden = !show;\n                if (show) visible++;\n            });\n            group.hidden = visible === 0;\n            total += visible;\n        });\n        document.getElementById('verb-search-empty').hidden = total > 0;\n    }\n\n    function showTab(tabId, btnEl) {\n        // Update buttons\n        document.querySelectorAll('#tabs .tab').forEach(btn => {\n            btn.classList.toggle('active', btn === btnEl);\n            btn.setAttribute('aria-selected', String(btn === btnEl));\n        });\n\n        // Hide all views\n        document.querySelectorAll('.tab-content').forEach(view => view.classList.remove('active'));\n\n        // Show selected view and setup\n        if (tabId === 'list') {\n            document.getElementById('view-list').classList.add('active');\n        } else if (tabId.startsWith('mcq')) {\n            document.getElementById('view-mcq').classList.add('active');\n            let group = tabId === 'mcq-all' ? 'all' : parseInt(tabId.split('-')[1].substring(1));\n            startMCQ(group);\n        } else if (tabId === 'test') {\n            document.getElementById('view-test').classList.add('active');\n        }\n    }\n\n    // Number of questions in one MCQ round (progress bar + final score)\n    const MCQ_LENGTH = 20;\n    let currentMCQPool = [];\n    let currentMCQScore = 0;\n    let currentMCQCorrectAnswer = \"\";\n    let mcqAnswered = false;\n    let mcqModeTitle = \"\";\n    let currentMCQGroup = 'all';\n    let mcqIndex = 0;\n\n    function updateMCQHead(done) {\n        const head = document.getElementById('mcq-head');\n        Lecon.setProgress(head, done, MCQ_LENGTH);\n        document.getElementById('mcq-score').innerText = `Score : ${currentMCQScore}`;\n    }\n\n    function startMCQ(group) {\n        currentMCQGroup = group;\n        currentMCQScore = 0;\n        mcqIndex = 0;\n        document.getElementById('mcq-score').innerText = `Score : ${currentMCQScore}`;\n        document.getElementById('mcq-next-btn').hidden = true;\n        document.getElementById('mcq-result').innerHTML = \"\";\n        document.getElementById('mcq-stage').hidden = false;\n\n        if (group === 'all') {\n            currentMCQPool = verbsData;\n            mcqModeTitle = \"QCM : Tous les groupes\";\n        } else {\n            currentMCQPool = verbsData.filter(v => v.group === group);\n            mcqModeTitle = `QCM : Groupe ${group}`;\n        }\n        document.getElementById('mcq-title').innerText = mcqModeTitle;\n        renderMCQQuestion();\n    }\n\n    function generateTrickyDistractors(verb, askedForm) {\n        let fakes = new Set();\n        let base = verb.base;\n        let trueForm = verb[askedForm];\n\n        // Custom trick bank for specific tricky words (traps for students)\n        const tricks = {\n            'spread': ['spred', 'spreaded', 'sproat', 'spreaden'],\n            'cut': ['cutted', 'cat', 'cot'],\n            'hit': ['hitted', 'hat', 'hot'],\n            'catch': ['catched', 'cotch', 'caughted'],\n            'think': ['thinked', 'thank', 'thunk'],\n            'teach': ['teached', 'tought', 'toach'],\n            'choose': ['chosed', 'choosen', 'cheezen'],\n            'drive': ['drived', 'drove', 'driv'],\n            'ride': ['rided', 'rid', 'rode'],\n            'eat': ['eated', 'aten', 'ot'],\n            'fly': ['flyed', 'flied', 'flowed'],\n            'go': ['goed', 'went', 'goned'],\n            'know': ['knowed', 'knewed', 'knawn'],\n            'see': ['seed', 'sawed', 'seen']\n        };\n\n        if (tricks[base]) tricks[base].forEach(t => fakes.add(t));\n\n        // Programmatic tricky generation (adding 'ed' / doubling consonants)\n        fakes.add(base + (base.endsWith('e') ? 'd' : 'ed'));\n        if (base.match(/[bcdfghjklmnpqrstvwxyz]$/)) fakes.add(base + base.slice(-1) + 'ed');\n\n        // If they ask for preterit, offer PP, and vice versa\n        let otherForm = askedForm === 'preterit' ? verb.pp : verb.preterit;\n        if (otherForm !== trueForm) fakes.add(otherForm);\n\n        // Minor vowel mutations\n        let mutated1 = base.replace(/[aeiou]+/, 'a');\n        let mutated2 = base.replace(/[aeiou]+/, 'o');\n        if (mutated1 !== trueForm && mutated1 !== base) fakes.add(mutated1);\n        if (mutated2 !== trueForm && mutated2 !== base) fakes.add(mutated2);\n\n        fakes.delete(trueForm); // ensure correct answer is NOT in fakes\n\n        let fakeArray = Array.from(fakes);\n        return shuffle(fakeArray).slice(0, 3);\n    }\n\n    function generateTranslationDistractors(correctValue, key, excludeVerbBase) {\n        let distractors = new Set();\n        let poolToUse = currentMCQPool.length > 4 ? currentMCQPool : verbsData;\n\n        while(distractors.size < 3) {\n            let randomVerb = getRandom(poolToUse);\n            let val = randomVerb[key];\n            if (val !== correctValue && randomVerb.base !== excludeVerbBase) {\n                distractors.add(val);\n            }\n        }\n        return Array.from(distractors);\n    }\n\n    function nextMCQQuestion() {\n        mcqIndex++;\n        if (mcqIndex >= MCQ_LENGTH) {\n            showMCQResult();\n            return;\n        }\n        renderMCQQuestion();\n    }\n\n    function renderMCQQuestion() {\n        mcqAnswered = false;\n        updateMCQHead(mcqIndex);\n        const nextBtn = document.getElementById('mcq-next-btn');\n        nextBtn.hidden = true;\n        nextBtn.innerText = mcqIndex + 1 < MCQ_LENGTH ? \"Question Suivante ➡️\" : \"Voir mon score →\";\n        const optionsContainer = document.getElementById('mcq-options');\n        optionsContainer.innerHTML = \"\";\n        optionsContainer.classList.remove('is-answered');\n        Lecon.clearFeedback('#mcq-feedback');\n\n        const verb = getRandom(currentMCQPool);\n\n        // Types: 0 = Preterit, 1 = PP, 2 = French (EN->FR), 3 = Base (FR->EN)\n        let qType;\n\n        // Group 1 rule: 80% translation because forms are identical\n        if (verb.group === 1) {\n            let rand = Math.random();\n            if (rand < 0.4) qType = 2; // 40% chance EN->FR\n            else if (rand < 0.8) qType = 3; // 40% chance FR->EN\n            else if (rand < 0.9) qType = 0; // 10% chance Preterit\n            else qType = 1; // 10% chance PP\n        } else {\n            qType = Math.floor(Math.random() * 4); // 25% each for other groups\n        }\n\n        let questionText = \"\";\n        let questionWord = \"\";\n        let options = [];\n\n        switch(qType) {\n            case 0:\n                questionText = \"Quel est le prétérit de :\";\n                questionWord = `${verb.emoji} ${verb.base}`;\n                currentMCQCorrectAnswer = verb.preterit;\n                options = generateTrickyDistractors(verb, 'preterit');\n                break;\n            case 1:\n                questionText = \"Quel est le participe passé de :\";\n                questionWord = `${verb.emoji} ${verb.base}`;\n                currentMCQCorrectAnswer = verb.pp;\n                options = generateTrickyDistractors(verb, 'pp');\n                break;\n            case 2:\n                questionText = \"Comment traduit-on :\";\n                questionWord = `${verb.emoji} ${verb.base}`;\n                currentMCQCorrectAnswer = verb.fr;\n                options = generateTranslationDistractors(verb.fr, 'fr', verb.base);\n                break;\n            case 3:\n                questionText = \"Quelle est la base verbale de :\";\n                questionWord = verb.fr;\n                currentMCQCorrectAnswer = verb.base;\n                options = generateTranslationDistractors(verb.base, 'base', verb.base);\n                break;\n        }\n\n        // Fill missing options just in case (fallback security)\n        while(options.length < 3) options.push(options[0] + \"s\");\n\n        options.push(currentMCQCorrectAnswer);\n        options = shuffle(options);\n\n        document.getElementById('mcq-question-text').innerText = questionText;\n        document.getElementById('mcq-question-word').innerText = questionWord;\n\n        const card = document.getElementById('mcq-question-container');\n        card.classList.remove('is-enter');\n        void card.offsetWidth;\n        card.classList.add('is-enter');\n\n        options.forEach(opt => {\n            const btn = document.createElement('button');\n            btn.type = \"button\";\n            btn.className = \"choice\";\n            btn.innerText = opt;\n            btn.dataset.value = opt;\n            btn.onclick = () => handleMCQAnswer(btn, opt === currentMCQCorrectAnswer);\n            optionsContainer.appendChild(btn);\n        });\n    }\n\n    function handleMCQAnswer(btn, isCorrect) {\n        if (mcqAnswered) return;\n        mcqAnswered = true;\n\n        const container = document.getElementById('mcq-options');\n        const correctBtn = Array.from(container.querySelectorAll('.choice')).find(b => b.dataset.value === currentMCQCorrectAnswer);\n        Lecon.markChoices(container, btn, correctBtn);\n\n        if (isCorrect) {\n            currentMCQScore++;\n        }\n        updateMCQHead(mcqIndex + 1);\n        document.querySelector('#mcq-head .quiz-count').textContent = `Question ${mcqIndex + 1} / ${MCQ_LENGTH}`;\n        Lecon.feedback('#mcq-feedback', isCorrect, null,\n            isCorrect ? '' : '<b>Bonne réponse : \u003c/b>' + escapeHtml(currentMCQCorrectAnswer));\n\n        const nextBtn = document.getElementById('mcq-next-btn');\n        nextBtn.hidden = false;\n        nextBtn.focus({ preventScroll: true });\n    }\n\n    function showMCQResult() {\n        updateMCQHead(MCQ_LENGTH);\n        document.querySelector('#mcq-head .quiz-count').textContent = 'Terminé';\n        document.getElementById('mcq-stage').hidden = true;\n        const result = document.getElementById('mcq-result');\n        result.innerHTML = \"\";\n        result.appendChild(Lecon.resultCard(currentMCQScore, MCQ_LENGTH, { resultTitle: mcqModeTitle }, () => startMCQ(currentMCQGroup)));\n    }\n\n    let testQuestions = [];\n\n    function testFeedbackMessage(score) {\n        // Fun feedback\n        if(score === 20) return \"🏆 Parfait !\";\n        else if(score >= 15) return \"🌟 Excellent !\";\n        else if(score >= 10) return \"👍 C'est bien, continue !\";\n        else return \"💪 Il faut encore s'entraîner !\";\n    }\n\n    function updateTestProgress() {\n        const answered = testQuestions.filter((q, index) => document.getElementById(`test-input-${index}`).value.trim() !== \"\").length;\n        const head = document.getElementById('test-head');\n        Lecon.setProgress(head, answered, testQuestions.length);\n        head.querySelector('.quiz-count').textContent = `Questions : ${answered} / ${testQuestions.length}`;\n    }\n\n    function startWrittenTest() {\n        const container = document.getElementById('test-container');\n        container.hidden = false;\n        document.getElementById('test-submit-btn').hidden = false;\n        document.getElementById('test-final-score').innerText = \"\";\n        document.getElementById('test-result').innerHTML = \"\";\n        const qContainer = document.getElementById('test-questions');\n        qContainer.innerHTML = \"\";\n        testQuestions = [];\n\n        // Get 20 random verbs\n        let pool = shuffle([...verbsData]).slice(0, 20);\n\n        pool.forEach((verb, index) => {\n            // 50% chance to ask for preterit or past participle\n            const askPreterit = Math.random() > 0.5;\n            const expectedAnswer = askPreterit ? verb.preterit : verb.pp;\n            const questionType = askPreterit ? \"prétérit\" : \"participe passé\";\n\n            testQuestions.push({ expected: expectedAnswer.toLowerCase(), base: verb.base, type: questionType });\n\n            const qDiv = document.createElement('article');\n            qDiv.className = \"q-card test-item\";\n            qDiv.innerHTML = `\n                <label class=\"q-title\" for=\"test-input-${index}\">\n                    ${index + 1}. Quel est le <span class=\"kind\">${questionType}\u003c/span> de <span class=\"verb\">\"${verb.base}\"\u003c/span> ?\n                    <span class=\"q-hint\">(${verb.fr})\u003c/span>\n                \u003c/label>\n                <div class=\"answer-row\">\n                    <input type=\"text\" id=\"test-input-${index}\" class=\"answer-input\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"Ta réponse...\">\n                    <span id=\"test-corr-${index}\" class=\"test-corr\" hidden>\u003c/span>\n                \u003c/div>\n            `;\n            qContainer.appendChild(qDiv);\n        });\n\n        qContainer.oninput = updateTestProgress;\n        updateTestProgress();\n        document.getElementById('test-input-0').focus({ preventScroll: true });\n        container.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    }\n\n    function submitWrittenTest() {\n        let score = 0;\n        document.getElementById('test-submit-btn').hidden = true; // Hide submit after testing\n\n        testQuestions.forEach((q, index) => {\n            const inputEl = document.getElementById(`test-input-${index}`);\n            const corrEl = document.getElementById(`test-corr-${index}`);\n            const userAnswer = inputEl.value.trim().toLowerCase();\n\n            inputEl.disabled = true; // prevent changing answer\n\n            // Check answer (handling cases where multiple forms exist, e.g., \"was/were\")\n            const correctAnswersArray = q.expected.split('/').map(s => s.trim());\n            let isCorrect = correctAnswersArray.includes(userAnswer);\n\n            // Be lenient with was/were\n            if(q.base === \"be\" && q.type === \"prétérit\") {\n                 if(userAnswer === \"was\" || userAnswer === \"were\" || userAnswer === \"was/were\") {\n                     isCorrect = true;\n                 }\n            }\n\n            Lecon.markInput(inputEl, isCorrect);\n            if (isCorrect) {\n                score++;\n                corrEl.innerHTML = \"✅\";\n            } else {\n                corrEl.innerHTML = `<span class=\"solution\">→ ${q.expected}\u003c/span>`;\n            }\n            corrEl.hidden = false;\n        });\n\n        const head = document.getElementById('test-head');\n        Lecon.setProgress(head, testQuestions.length, testQuestions.length);\n        head.querySelector('.quiz-count').textContent = 'Corrigé';\n\n        const finalScoreEl = document.getElementById('test-final-score');\n        finalScoreEl.innerText = `${score} / 20`;\n\n        // Fun feedback\n        finalScoreEl.innerText += \" \" + testFeedbackMessage(score);\n\n        const result = document.getElementById('test-result');\n        result.innerHTML = \"\";\n        const card = Lecon.resultCard(score, 20, { resultTitle: \"📝 Le Grand Test\", message: (s) => testFeedbackMessage(s) }, startWrittenTest);\n        result.appendChild(card);\n        card.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    }\n\n    // Initialize App on load\n    window.onload = () => {\n        initTables();\n        document.getElementById('verb-search').addEventListener('input', (e) => filterTables(e.target.value));\n    };\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Anglais/Cas Possessif.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Masterclass Génitif : Entraînement et Quiz\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n    <style>\n        /* Exercices de traduction : phrase + indice dans le résumé dépliable */\n        .reveal > summary .ex { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n        .reveal > summary .ex-hint { font-weight: 400; font-style: italic; font-size: var(--text-sm); color: var(--muted); }\n        .reveal > summary .ex-toggle { flex: none; font-size: var(--text-xs); font-weight: 600; color: var(--primary); }\n        @media (max-width: 480px) { .reveal > summary .ex-toggle { display: none; } }\n        .reveal .solution { font-size: var(--text-md); }\n    \u003c/style>\n\u003c/head>\n<body>\n\n<main class=\"lecon\">\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">Anglais\u003c/div>\n        <h1>🇬🇧 Masterclass : Le Cas Possessif (Génitif)\u003c/h1>\n    \u003c/header>\n\n    <nav class=\"tabs\" role=\"tablist\">\n        <button class=\"tab active\" data-tab=\"entrainement\">📝 50 Phrases d'Entraînement\u003c/button>\n        <button class=\"tab\" data-tab=\"quiz\">🎯 Le Quiz Chrono\u003c/button>\n    \u003c/nav>\n\n    \u003c!-- ONGLET 1 : ENTRAINEMENT -->\n    <section id=\"entrainement\" class=\"tab-content active\">\n        <p class=\"lead\">Objectif : Traduis chaque phrase à voix haute ou sur un brouillon avant d'ouvrir la solution. L'ordre magique : <strong>Possesseur + 's + Possessé\u003c/strong>.\u003c/p>\n\n        <h2>Niveau 1 : Les pluriels (10 phrases)\u003c/h2>\n        <div class=\"callout retenir\"><p>Rappel : Quand le possesseur est au pluriel avec un \"s\", on ajoute juste l'apostrophe à la fin.\u003c/p>\u003c/div>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>1. La maison de mes parents est grande.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">My parents' house is big.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>2. La salle des professeurs est au premier étage.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The teachers' room is on the first floor.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>3. Le jardin des voisins est magnifique.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The neighbours' garden is beautiful.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>4. Les croquettes des chats sont dans la cuisine.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The cats' food is in the kitchen.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>5. L'équipe des filles a gagné le match.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The girls' team won the match.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>6. Les sacs à dos des élèves sont lourds.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The students' backpacks are heavy.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>7. La chambre des jumeaux est en désordre.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The twins' room is messy.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary><span class=\"ex\"><span>8. Les voitures des joueurs sont sur le parking.\u003c/span>\u003c/span><span class=\"ex-toggle\">Traduction\u003c/span>\u003c/summary>\n            <div class=\"reveal-body\"><span class=\"solution\">The players' cars are in the car park.\u003c/span>\u003c/div>\n        \u003c/details>\n        <details class n        <h2>🎯 Quiz Chrono : Teste tes réflexes\u003c/h2>\n        <p>Choisis la bonne réponse pour chaque phrase. Fais attention aux pièges du pluriel !\u003c/p>\n\n        <form id=\"quiz-form\" class=\"quiz\" onsubmit=\"return false\">\n            <div class=\"quiz-head is-sticky\"><span class=\"quiz-count\">\u003c/span><div class=\"quiz-progress\"><span>\u003c/span>\u003c/div><span class=\"quiz-score\">\u003c/span>\u003c/div>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">1. C'est le sac de ma sœur. (My ... bag)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q1\" value=\"wrong\"> sister bag's\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q1\" value=\"correct\"> sister's bag\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q1\" value=\"wrong\"> sisters' bag\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q1\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">2. C'est la voiture de mes grands-parents. (My ... car)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q2\" value=\"wrong\"> grandparents's\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q2\" value=\"wrong\"> grandparent's\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q2\" value=\"correct\"> grandparents'\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q2\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">3. Les chambres des enfants. (The ... rooms)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q3\" value=\"wrong\"> childrens'\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q3\" value=\"correct\"> children's\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q3\" value=\"wrong\"> children\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q3\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">4. Le chien de Thomas. (... dog)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q4\" value=\"correct\"> Thomas' (ou Thomas's)\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q4\" value=\"wrong\"> Thoma's\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q4\" value=\"wrong\"> The dog of Thomas\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q4\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">5. La femme de mon frère. (My ... wife)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q5\" value=\"wrong\"> brother wife's\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q5\" value=\"wrong\"> brothers'\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q5\" value=\"correct\"> brother's\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q5\">\u003c/div>\n            \u003c/article>\n\n            <article class=\"q-card\">\n                <h3 class=\"q-title\">6. L'ordinateur du frère de mon ami. (Double génitif !)\u003c/h3>\n                <div class=\"choices\" role=\"radiogroup\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"q6\" value=\"correct\"> My friend's brother's computer\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q6\" value=\"wrong\"> My brother's friend's computer\u003c/label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"q6\" value=\"wrong\"> The computer of my friend brother\u003c/label>\n                \u003c/div>\n                <div class=\"feedback\" id=\"fb-q6\">\u003c/div>\n            \u003c/article>\n\n            <div class=\"quiz-actions center\"><button type=\"button\" id=\"submit-quiz\" class=\"btn btn-primary btn-lg\">Vérifier mon score !\u003c/button>\u003c/div>\n            <div id=\"quiz-result\">\u003c/div>\n        \u003c/form>\n    \u003c/section>\n\u003c/main>\n\n<script>\n    var MSG = {\n        correct: \"✅ Bonne réponse !\",\n        wrong: function () { return \"❌ Mauvaise réponse, révise la règle !\"; },\n        missing: \"⚠️ Tu as oublié cette question !\",\n        result: function (score, total) {\n            if (score === total) return \"🏆 Parfait ! Score : \" + score + \"/\" + total + \" ! Tu maîtrises le génitif !\";\n            if (score >= total / 2) return \"👍 Pas mal ! Score : \" + score + \"/\" + total + \" ! Encore un peu d'entraînement.\";\n            return \"💪 Accroche-toi ! Score : \" + score + \"/\" + total + \". Relis bien les règles au Niveau 1.\";\n        }\n    };\n\n    // QCM : l'élève coche ses réponses puis valide l'ensemble (correction globale)\n    (function () {\n        var form = document.getElementById('quiz-form');\n        var head = form.querySelector('.quiz-head');\n        var cards = [].slice.call(form.querySelectorAll('.q-card'));\n        var submit = document.getElementById('submit-quiz');\n        var result = document.getElementById('quiz-result');\n        var total = cards.length;\n\n        function update() {\n            var n = cards.filter(function (c) { return c.querySelector('input:checked'); }).length;\n            Lecon.setProgress(head, n, total);\n            head.querySelector('.quiz-count').textContent = n + ' / ' + total + ' répondue' + (n > 1 ? 's' : '');\n            head.querySelector('.quiz-score').textContent = '';\n        }\n\n        function checkQuiz() {\n            var score = 0;\n            cards.forEach(function (card, idx) {\n                var i = idx + 1;\n                var choices = card.querySelector('.choices');\n                var chosen = card.querySelector('input:checked');\n                var good = card.querySelector('input[value=\"correct\"]').closest('.choice');\n                var fb = card.querySelector('.feedback');\n                Lecon.markChoices(choices, chosen ? chosen.closest('.choice') : null, good);\n                var answer = '<b>Bonne réponse : \u003c/b>' + good.textContent.trim();\n                if (!chosen) {\n                    Lecon.feedback(fb, false, MSG.missing, answer);\n                } else if (chosen.value === 'correct') {\n                    score++;\n                    Lecon.feedback(fb, true, MSG.correct);\n                } else {\n                    Lecon.feedback(fb, false, MSG.wrong(i), answer);\n                }\n            });\n            Lecon.setProgress(head, total, total);\n            head.querySelector('.quiz-count').textContent = 'Corrigé';\n            head.querySelector('.quiz-score').textContent = 'Score : ' + score + ' / ' + total;\n            submit.parentNode.hidden = true;\n            result.innerHTML = '';\n            var box = Lecon.resultCard(score, total, { message: MSG.result }, restart);\n            result.appendChild(box);\n            box.scrollIntoView({ behavior: 'smooth', block: 'center' });\n        }\n\n        function restart() {\n            form.reset();\n            [].forEach.call(form.querySelectorAll('.choices
