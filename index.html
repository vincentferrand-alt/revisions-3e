stique d'une résistance, qu'observe-t-on ?\",\n      choices: [\"Une courbe qui descend\",\"Une droite qui passe par l'origine\",\"Une ligne horizontale\"], answer: 1 },\n    { question: \"Que représente la \\\"branche principale\\\" dans un circuit en dérivation ?\",\n      choices: [\"La branche qui a la plus grosse résistance\",\"La branche contenant les lampes\",\"La branche contenant le générateur\"], answer: 2 },\n    { question: \"Si un ohmmètre affiche une erreur, que faut-il faire ?\",\n      choices: [\"Diminuer le calibre\",\"Augmenter le calibre\",\"Brancher l'ohmmètre en série\"], answer: 1 },\n    { question: \"Combien d'Ampères valent 150 mA ?\",\n      choices: [\"0,15 A\",\"1,5 A\",\"15 A\"], answer: 0 },\n    { question: \"Si U = 9V et R = 300 Ω, que vaut I ?\",\n      choices: [\"2700 A\",\"33,3 A\",\"0,03 A\"], answer: 2 },\n    { question: \"Pourquoi utilise-t-on une résistance pour protéger une DEL (Diode) ?\",\n      choices: [\"Pour diminuer l'intensité et éviter de griller la DEL\",\"Pour augmenter la luminosité de la DEL\",\"Pour chauffer la DEL\"], answer: 0 }\n  ], {\n    layout: 'list',\n    validate: 'submit',\n    resultTitle: 'Ton score',\n    message: function (score, total) {\n      if (score === 25) {\n        return \"Un sans-faute ! Félicitations Aron, tu es un génie de l'électricité ! 🌟\";\n      } else if (score >= 20) {\n        return \"Excellent travail Aron ! Tu maîtrises super bien ton chapitre. 🚀\";\n      } else if (score >= 12) {\n        return \"C'est bien Aron, tu as les bases ! Relis encore un peu tes cours pour être au top. 💪\";\n      }\n      return \"Ne te décourage pas Aron ! L'électricité ça s'apprend. Revois bien l'onglet des explications et réessaie ! 🧠\";\n    },\n    onFinish: function (score, total) {\n      var title = document.querySelector('#quiz-elec .quiz-result h3');\n      if (title) title.textContent = 'Ton score : ' + score + ' / ' + total;\n    }\n  });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","SVT/SVT Septembre.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>SVT 3ème - Révisions pour Aron\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n    <style>\n        .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); margin: 0 0 var(--space-4); }\n        .section-head h2 { margin: 0; }\n        .card h3 { margin-top: 0; }\n        .lexique .card h3 { color: var(--accent); }\n        .qa-num { color: var(--accent); font-weight: 800; margin-right: var(--space-2); }\n        .qa-label { font-weight: 750; color: var(--text); margin-right: var(--space-2); }\n    \u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">SVT\u003c/div>\n        <h1>🔬 SVT 3ème - Super Révisions d'Aron\u003c/h1>\n    \u003c/header>\n\n    <nav class=\"tabs\" role=\"tablist\">\n        <button type=\"button\" class=\"tab active\" data-tab=\"cours\">📖 Cours\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"fiches\">📋 Lexique\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"qcm\">🎮 QCM (30/50)\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"qa\">❓ Questions / Rép (20/50)\u003c/button>\n    \u003c/nav>\n\n    <section id=\"cours\" class=\"tab-content active\">\n        <h2>🎓 Unité, unicité, diversité et stabilité des êtres vivants\u003c/h2>\n\n        <div class=\"grid-2\">\n            \u003c!-- Bloc 1 -->\n            <div class=\"card card-accent\">\n                <h3>🌍 Introduction &amp; Espèce\u003c/h3>\n                <ul>\n                    <li><strong>Le vivant :\u003c/strong> Se nourrit, grandit, se reproduit et meurt.\u003c/li>\n                    <li><strong>Biodiversité :\u003c/strong> C'est la diversité incroyable de toutes les formes de vie sur Terre.\u003c/li>\n                    <li><strong>Une Espèce :\u003c/strong> Groupe d’individus qui :\n                        <ul>\n                            <li>Se ressemblent physiquement.\u003c/li>\n                            <li>Peuvent se reproduire entre eux (interfécondité).\u003c/li>\n                            <li>Ont une descendance fertile (qui peut se reproduire à son tour).\u003c/li>\n                        \u003c/ul>\n                    \u003c/li>\n                    <li><strong>Hybride :\u003c/strong> Croisement entre deux espèces proches (ex: tigre + lion). Un hybride est souvent stérile, ce n'est donc pas une nouvelle espèce !\u003c/li>\n                \u003c/ul>\n            \u003c/div>\n\n            \u003c!-- Bloc 2 -->\n            <div class=\"card card-accent\">\n                <h3>🧬 Caractères et Phénotype\u003c/h3>\n                <p>Tous les humains appartiennent à l'espèce <em>Homo sapiens\u003c/em>. Pourtant, nous sommes tous uniques.\u003c/p>\n                <ul>\n                    <li><strong>Caractères spécifiques :\u003c/strong> Communs à toute l'espèce (ex: avoir un nez, deux yeux, des bras).\u003c/li>\n                    <li><strong>Caractères individuels :\u003c/strong> Variations qui nous rendent uniques (ex: forme du nez, couleur des yeux).\u003c/li>\n                \u003c/ul>\n                <div class=\"callout definition\">\n                    <p><strong>LE PHÉNOTYPE : C'est l'ensemble des caractères observables d'un individu, à toutes les échelles (à l'œil nu, au microscope...).\u003c/strong>\u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Bloc 3 -->\n            <div class=\"card card-accent\">\n                <h3>🌱 Origine du Phénotype\u003c/h3>\n                <p>Deux facteurs principaux déterminent nos caractères :\u003c/p>\n                <ul>\n                    <li>\n                        <strong>1. L'Hérédité (Les parents) :\u003c/strong> Certains caractères se transmettent de génération en génération. Ce sont les <em>caractères héréditaires (innés)\u003c/em> (ex: groupe sanguin, couleur naturelle des cheveux).\n                    \u003c/li>\n                    <li>\n                        <strong>2. L'Environnement :\u003c/strong> Le mode de vie (alimentation, soleil, sport) modifie le phénotype.\n                    \u003c/li>\n                \u003c/ul>\n                <div class=\"callout attention\">\n                    <p><strong>Attention ! Ces modifications acquises NE SONT PAS transmissibles à la descendance (ex: le bronzage, la musculature).\u003c/strong>\u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Bloc 4 -->\n            <div class=\"card card-accent\">\n                <h3>⚥ Fécondation &amp; Cellule Œuf\u003c/h3>\n                <p>Si les caractères héréditaires sont transmis, c'est au moment de la reproduction.\u003c/p>\n                <div class=\"callout retenir text-center\">\n                    <p><strong>Spermatozoïde + Ovule <br>= <br>Cellule Œuf\u003c/strong>\u003c/p>\n                \u003c/div>\n                <ul>\n                    <li>C'est lors de la fécondation que l'information héréditaire est transmise.\u003c/li>\n                    <li><strong>Structure d'une cellule :\u003c/strong> Toute cellule (dont la cellule œuf) possède :\n                        <ul>\n                            <li>Une membrane (la limite)\u003c/li>\n                            <li>Un cytoplasme (le liquide interne)\u003c/li>\n                            <li><strong>Un noyau\u003c/strong> (qui contient l'information génétique)\u003c/li>\n                        \u003c/ul>\n                    \u003c/li>\n                \u003c/ul>\n            \u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    <section id=\"fiches\" class=\"tab-content lexique\">\n        <h2>📋 Lexique / Fiches de révision\u003c/h2>\n        <div class=\"card-grid\">\n            <div class=\"card card-accent\">\n                <h3>Espèce\u003c/h3>\n                <p>Groupe d'êtres vivants capables de se reproduire entre eux et dont la descendance est fertile (peut aussi se reproduire).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Hybride\u003c/h3>\n                <p>Individu issu du croisement de deux espèces différentes. Il est généralement stérile (ex: le mulet).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Phénotype\u003c/h3>\n                <p>L'ensemble des caractères observables d'un individu (couleur des yeux, groupe sanguin, taille...).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Caractère inné\u003c/h3>\n                <p>Caractère présent dès la naissance et codé par l'information génétique.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Caractère acquis\u003c/h3>\n                <p>Caractère qui apparaît au cours de la vie à cause de l'environnement (bronzage, cicatrice). NON transmissible.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Caractère héréditaire\u003c/h3>\n                <p>Caractère transmissible de génération en génération (des parents aux enfants).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Fécondation\u003c/h3>\n                <p>Rencontre et fusion d'une cellule reproductrice mâle (spermatozoïde) et femelle (ovule).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Cellule œuf\u003c/h3>\n                <p>La toute première cellule d'un être vivant, formée lors de la fécondation. Elle contient un noyau, un cytoplasme et une membrane.\u003c/p>\n            \u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    <section id=\"qcm\" class=\"tab-content\">\n        <div class=\"section-head\">\n            <h2>🎮 Test express (30 questions)\u003c/h2>\n            <button type=\"button\" class=\"btn btn-secondary\" onclick=\"startQCM()\">↻ Recommencer\u003c/button>\n        \u003c/div>\n\n        <div id=\"qcm-container\" class=\"quiz\">\n            <div id=\"qcm-setup\" class=\"q-card quiz-intro\">\n                <h3 class=\"q-title\">Prêt à tester tes connaissances, Aron ?\u003c/h3>\n                <p class=\"muted\">30 questions seront tirées au sort. Lis bien chaque proposition.\u003c/p>\n                <div class=\"quiz-actions center\">\n                    <button type=\"button\" class=\"btn btn-primary btn-lg\" onclick=\"startQCM()\">Démarrer le Quiz !\u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            <div id=\"qcm-play\" hidden>\n                <div class=\"quiz-head\" id=\"qcm-head\">\n                    <span class=\"quiz-count\">Question 1 / 30\u003c/span>\n                    <div class=\"quiz-progress\"><span>\u003c/span>\u003c/div>\n                    <span class=\"quiz-score\">Score : 0\u003c/span>\n                \u003c/div>\n                <article class=\"q-card\" id=\"qcm-card\">\n                    <h3 class=\"q-title\" id=\"qcm-question-text\">\u003c/h3>\n                    <div id=\"qcm-options\" class=\"choices\" role=\"group\" aria-label=\"Choix de réponse\">\u003c/div>\n                    <div id=\"qcm-feedback\" class=\"feedback\" aria-live=\"polite\">\u003c/div>\n                    <div class=\"quiz-actions\">\n                        <button type=\"button\" id=\"qcm-next-btn\" class=\"btn btn-primary\" onclick=\"nextQCMQuestion()\" hidden>Suivant →\u003c/button>\n                    \u003c/div>\n                \u003c/article>\n            \u003c/div>\n\n            <div id=\"qcm-result\" hidden>\u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    <section id=\"qa\" class=\"tab-content\">\n        <div class=\"section-head\">\n            <h2>❓ Flashcards : Questions / Réponses\u003c/h2>\n            <button type=\"button\" class=\"btn btn-secondary\" onclick=\"renderQA()\">🔀 Mélanger\u003c/button>\n        \u003c/div>\n        <p class=\"muted\">Voici 20 questions tirées au hasard. Clique sur une question pour dévoiler la réponse.\u003c/p>\n\n        <div id=\"qa-container\">\u003c/div>\n    \u003c/section>\n\n\u003c/main>\n\n<script>\n        // --- DONNÉES DU PROGRAMME (50 questions QCM & 50 Q/A) ---\n        // Le programme de 3ème tourne autour de la génétique, phénotype, division cellulaire, reproduction et évolution.\n\n        const FULL_QCM_BANK = [\n            { q: \"Qu'est-ce que le phénotype ?\", options: [\"L'information dans le noyau\", \"L'ensemble des caractères observables d'un individu\", \"Une maladie génétique\"], correct: 1 },\n            { q: \"Un caractère qui se transmet de génération en génération est dit :\", options: [\"Acquis\", \"Inné (ou héréditaire)\", \"Spécifique\"], correct: 1 },\n            { q: \"L'espèce humaine possède des caractères communs. Comment les appelle-t-on ?\", options: [\"Caractères individuels\", \"Caractères spécifiques\", \"Caractères exceptionnels\"], correct: 1 },\n            { q: \"Une modification du corps due au sport (gros muscles) est-elle transmissible aux enfants ?\", options: [\"Oui, toujours\", \"Seulement si la mère fait du sport\", \"Non, c'est un caractère lié à l'environnement\"], correct: 2 },\n            { q: \"Le bronzage est un exemple de :\", options: [\"Modification environnementale non transmissible\", \"Caractère héréditaire dominant\", \"Caractère spécifique humain\"], correct: 0 },\n            { q: \"Où se trouve l'information héréditaire dans une cellule ?\", options: [\"Dans la membrane\", \"Dans le cytoplasme\", \"Dans le noyau\"], correct: 2 },\n            { q: \"Qu'est-ce qu'une cellule œuf ?\", options: [\"Une cellule issue de la fécondation\", \"Une cellule de peau\", \"Un spermatozoïde\"], correct: 0 },\n            { q: \"La fécondation, c'est :\", options: [\"La division d'une cellule\", \"La fusion d'un spermatozoïde et d'un ovule\", \"La création d'un clone\"], correct: 1 },\n            { q: \"Sous quelle forme trouve-t-on l'information génétique dans le noyau lorsqu'une cellule se divise ?\", options: [\"Sous forme de chromosomes\", \"Sous forme d'eau\", \"Sous forme de protéines\"], correct: 0 },\n            { q: \"Combien de chromosomes contient une cellule humaine normale (hors cellules reproductrices) ?\", options: [\"23\", \"46\", \"48\"], correct: 1 },\n            { q: \"Comment les chromosomes sont-ils classés dans un caryotype humain normal ?\", options: [\"En 46 paires\", \"En 23 paires\", \"Ils ne sont pas en paires\"], correct: 1 },\n            { q: \"Quels sont les chromosomes sexuels d'une femme ?\", options: [\"XX\", \"XY\", \"YY\"], correct: 0 },\n            { q: \"Quels sont les chromosomes sexuels d'un homme ?\", options: [\"XX\", \"XY\", \"YY\"], correct: 1 },\n            { q: \"Qu'est-ce qu'une anomalie chromosomique ?\", options: [\"Un nombre anormal de chromosomes\", \"Une maladie attrapée à cause d'un virus\", \"Une blessure musculaire\"], correct: 0 },\n            { q: \"La trisomie 21 est caractérisée par :\", options: [\"3 chromosomes au lieu de 2 sur la paire 21\", \"L'absence du chromosome 21\", \"21 chromosomes au total\"], correct: 0 },\n            { q: \"De quoi sont constitués les chromosomes ?\", options: [\"De lipides\", \"D'ADN (Acide Désoxyribonucléique)\", \"De sucre\"], correct: 1 },\n            { q: \"Qu'est-ce qu'un gène ?\", options: [\"Une portion d'ADN portant une information génétique\", \"Une maladie\", \"Une cellule reproductrice\"], correct: 0 },\n            { q: \"Comment appelle-t-on les différentes versions d'un gène ?\", options: [\"Des allèles\", \"Des chromatides\", \"Des protéines\"], correct: 0 },\n            { q: \"Un individu possède pour chaque gène :\", options: [\"1 seul allèle\", \"2 allèles (un d'origine maternelle, un paternel)\", \"4 allèles\"], correct: 1 },\n            { q: \"Si un individu possède les allèles A et O pour le groupe sanguin, quel sera son groupe si A est dominant ?\", options: [\"Groupe O\", \"Groupe A\", \"Groupe AO\"], correct: 1 },\n            { q: \"Un allèle qui s'exprime toujours, même s'il n'est présent qu'en un seul exemplaire, est dit :\", options: [\"Récessif\", \"Dominant\", \"Codominant\"], correct: 1 },\n            { q: \"Pour que le groupe sanguin O s'exprime, il faut que l'individu possède :\", options: [\"Un allèle A et un allèle O\", \"Deux allèles O\", \"Un allèle B et un allèle O\"], correct: 1 },\n            { q: \"Comment s'appelle le processus par lequel une cellule se divise en deux cellules identiques ?\", options: [\"La fécondation\", \"La méiose\", \"La mitose\"], correct: 2 },\n            { q: \"Lors de la multiplication cellulaire (mitose), que se passe-t-il avant la division ?\", options: [\"L'ADN est copié/dupliqué\", \"Les chromosomes disparaissent\", \"La cellule meurt\"], correct: 0 },\n            { q: \"Toutes les cellules de notre corps (sauf les reproductrices) ont-elles la même information génétique ?\", options: [\"Oui\", \"Non, les cellules des yeux ont des gènes différents des cellules de la peau\", \"Seulement chez les garçons\"], correct: 0 },\n            { q: \"Les spermatozoïdes et les ovules s'appellent des :\", options: [\"Globules blancs\", \"Gamètes (cellules reproductrices)\", \"Cellules souches\"], correct: 1 },\n            { q: \"Combien de chromosomes contient un gamète humain (spermatozoïde ou ovule) ?\", options: [\"46\", \"23 (un de chaque paire)\", \"23 paires\"], correct: 1 },\n            { q: \"Comment s'appelle la division cellulaire qui permet de fabriquer les gamètes ?\", options: [\"La mitose\", \"La méiose\", \"La fécondation\"], correct: 1 },\n            { q: \"Lors de la formation des spermatozoïdes, la répartition des chromosomes se fait :\", options: [\"Au hasard\", \"En sélectionnant toujours les meilleurs gènes\", \"En choisissant toujours le chromosome X\"], correct: 0 },\n            { q: \"Quel gamète détermine le sexe de l'enfant lors de la fécondation chez l'humain ?\", options: [\"L'ovule\", \"Le spermatozoïde\", \"Ni l'un ni l'autre\"], correct: 1 },\n            { q: \"Pourquoi sommes-nous tous différents (hors vrais jumeaux) ?\", options: [\"À cause du brassage génétique lors de la méiose et de la fécondation au hasard\", \"Parce que nous mangeons différemment\", \"Parce que nos gènes mutent tous les jours\"], correct: 0 },\n            { q: \"Une espèce est définie par :\", options: [\"La couleur de peau des individus\", \"Leur capacité à se reproduire entre eux et avoir une descendance fertile\", \"Le fait qu'ils vivent au même endroit\"], correct: 1 },\n            { q: \"Qu'est-ce qu'un hybride ?\", options: [\"Une nouvelle espèce\", \"Un animal malade\", \"Le croisement entre deux espèces proches, souvent stérile\"], correct: 2 },\n            { q: \"Le mulet est l'hybride stérile de :\", options: [\"L'âne et du cheval\", \"Du chien et du loup\", \"Du lion et du tigre\"], correct: 0 },\n            { q: \"La biodiversité représente :\", options: [\"Seulement les animaux d'une forêt\", \"La diversité des climats\", \"La diversité du vivant (écosystèmes, espèces, allèles)\"], correct: 2 },\n            { q: \"L'ensemble de l'ADN d'un individu s'appelle le :\", options: [\"Phénotype\", \"Génome\", \"Caryotype\"], correct: 1 },\n            { q: \"L'image classée de l'ensemble des chromosomes d'une cellule est un :\", options: [\"Caryotype\", \"Échogramme\", \"Génogramme\"], correct: 0 },\n            { q: \"L'apparition d'un nouveau caractère inattendu dans une espèce est due à une :\", options: [\"Mutation de l'ADN\", \"Mauvaise alimentation\", \"Exposition au froid\"], correct: 0 },\n            { q: \"Les caractères spécifiques...\", options: [\"Varient beaucoup d'un individu à l'autre\", \"Sont communs à tous les individus d'une même espèce\", \"Ne sont pas héréditaires\"], correct: 1 },\n            { q: \"Laquelle de ces affirmations est vraie ?\", options: [\"L'ovule apporte 46 chromosomes.\", \"Le spermatozoïde et l'ovule apportent chacun 23 chromosomes.\", \"La cellule œuf a 23 chromosomes en tout.\"], correct: 1 },\n            { q: \"Quel est l'effet de l'environnement sur notre ADN (sauf cas de radiations extrêmes) ?\", options: [\"Il modifie nos gènes de façon héréditaire\", \"Il ne modifie pas notre information génétique\", \"Il supprime des chromosomes\"], correct: 1 },\n            { q: \"Vrai ou Faux : Les vrais jumeaux ont la même information génétique.\", options: [\"Faux, car ils sont deux individus distincts\", \"Vrai, car ils proviennent de la même cellule œuf de départ\", \"Vrai, mais seulement s'ils vivent ensemble\"], correct: 1 },\n            { q: \"Comment appelle-t-on le chromosome qui détermine le sexe masculin ?\", options: [\"Le chromosome X\", \"Le chromosome Y\", \"Le chromosome Z\"], correct: 1 },\n            { q: \"Si la paire 23 est composée d'un chromosome X et d'un Y, l'individu est génétiquement :\", options: [\"De sexe féminin\", \"De sexe masculin\", \"On ne peut pas savoir\"], correct: 1 },\n            { q: \"Combien d'allèles compte le système des groupes sanguins ABO ?\", options: [\"2 (A et B)\", \"3 (A, B, et O)\", \"4 (A, B, O, et AB)\"], correct: 1 },\n            { q: \"Les allèles A et B du groupe sanguin sont :\", options: [\"Codominants (s'expriment tous les deux : AB)\", \"L'un domine toujours l'autre\", \"Récessifs par rapport à O\"], correct: 0 },\n            { q: \"L'allèle O du groupe sanguin est :\", options: [\"Dominant\", \"Codominant\", \"Récessif (dominé par A et B)\"], correct: 2 },\n            { q: \"La division cellulaire qui maintient le nombre de chromosomes constant est la :\", options: [\"Méiose\", \"Mitose\", \"Mutation\"], correct: 1 },\n            { q: \"Un gène occupe :\", options: [\"Une place précise sur un chromosome\", \"N'importe quelle place dans le noyau\", \"Une place dans le cytoplasme\"], correct: 0 },\n            { q: \"En génétique, la loterie de la fécondation fait que...\", options: [\"Chaque individu a un programme génétique unique\", \"Tous les frères et soeurs sont identiques\", \"L'enfant est le clone exact du père\"], correct: 0 }\n        ];\n\n        const FULL_QA_BANK = [\n            { q: \"Qu'est-ce qu'une espèce ?\", a: \"C'est un groupe d'individus qui se ressemblent physiquement, peuvent se reproduire entre eux et avoir une descendance fertile.\" },\n            { q: \"Qu'est-ce qu'un hybride ?\", a: \"C'est un individu né du croisement de deux espèces différentes (mais proches). Il est généralement stérile (ne peut pas se reproduire).\" },\n            { q: \"Qu'est-ce que le phénotype ?\", a: \"C'est l'ensemble des caractères observables d'un individu (ex: couleur des yeux, groupe sanguin).\" },\n            { q: \"Qu'est-ce qu'un caractère spécifique ?\", a: \"C'est un caractère commun à tous les individus d'une même espèce (ex: chez l'humain : des bras, des jambes, un nez).\" },\n            { q: \"Qu'est-ce qu'un caractère individuel ?\", a: \"C'est une variation d'un caractère spécifique qui est propre à un individu (ex: cheveux blonds, nez retroussé).\" },\n            { q: \"L'environnement peut-il modifier le phénotype ?\", a: \"Oui. L'alimentation, le soleil (bronzage), le sport peuvent modifier l'apparence physique.\" },\n            { q: \"Les modifications liées à l'environnement sont-elles héréditaires ?\", a: \"Non ! Ce sont des caractères acquis qui ne se transmettent pas à la descendance.\" },\n            { q: \"Qu'est-ce qu'un caractère héréditaire (inné) ?\", a: \"C'est un caractère génétique qui se transmet de génération en génération (des parents aux enfants).\" },\n            { q: \"Où se trouve l'information héréditaire ?\", a: \"Elle est contenue dans le noyau des cellules.\" },\n            { q: \"Qu'est-ce qu'une cellule œuf ?\", a: \"C'est la première cellule d'un être vivant, issue de la fusion d'un spermatozoïde et d'un ovule.\" },\n            { q: \"Que contient une cellule type (sa structure) ?\", a: \"Elle contient une membrane, un cytoplasme et un noyau.\" },\n            { q: \"Que contient le noyau des cellules ?\", a: \"Il contient l'information génétique, visible sous forme de chromosomes au moment de la division cellulaire.\" },\n            { q: \"Combien de chromosomes l'espèce humaine possède-t-elle par cellule ?\", a: \"46 chromosomes, organisés en 23 paires.\" },\n            { q: \"Quels sont les chromosomes qui déterminent le sexe féminin ?\", a: \"Deux chromosomes X (XX).\" },\n            { q: \"Quels sont les chromosomes qui déterminent le sexe masculin ?\", a: \"Un chromosome X et un chromosome Y (XY).\" },\n            { q: \"Qu'est-ce qu'un caryotype ?\", a: \"C'est le classement organisé de tous les chromosomes d'une cellule.\" },\n            { q: \"Qu'est-ce qu'une trisomie ?\", a: \"C'est une anomalie chromosomique où l'on trouve 3 chromosomes au lieu de 2 sur une paire (ex: trisomie 21).\" },\n            { q: \"De quelle molécule sont formés les chromosomes ?\", a: \"D'ADN (Acide Désoxyribonucléique).\" },\n            { q: \"Qu'est-ce qu'un gène ?\", a: \"C'est un morceau (fragment) d'ADN situé à un endroit précis sur un chromosome et qui détermine un caractère.\" },\n            { q: \"Qu'est-ce qu'un allèle ?\", a: \"C'est une des différentes versions possibles d'un gène (ex: pour le gène du groupe sanguin, il y a les allèles A, B et O).\" },\n            { q: \"Combien d'allèles possède-t-on pour chaque gène ?\", a: \"Deux : un hérité de la mère et un hérité du père.\" },\n            { q: \"Que signifie un allèle dominant ?\", a: \"C'est un allèle qui impose son expression même s'il n'est présent qu'en un seul exemplaire (ex: allèle A du groupe sanguin).\" },\n            { q: \"Que signifie un allèle récessif ?\", a: \"C'est un allèle qui doit être présent en deux exemplaires pour s'exprimer (ex: allèle O).\" },\n            { q: \"Comment s'appelle la division cellulaire classique pour la croissance ?\", a: \"La mitose. Elle permet de fabriquer deux cellules génétiquement identiques.\" },\n            { q: \"Que se passe-t-il juste avant une mitose ?\", a: \"L'ADN de la cellule est copié (dupliqué) pour pouvoir être partagé équitablement.\" },\n            { q: \"Toutes les cellules du corps (sauf reproductrices) ont-elles le même caryotype ?\", a: \"Oui, elles possèdent toutes exactement les mêmes 46 chromosomes et les mêmes gènes.\" },\n            { q: \"Comment s'appellent les cellules reproductrices ?\", a: \"Les gamètes (spermatozoïdes et ovules).\" },\n            { q: \"Combien de chromosomes possède un gamète humain ?\", a: \"23 chromosomes (un seul représentant de chaque paire).\" },\n            { q: \"Comment s'appelle la division qui fabrique les gamètes ?\", a: \"La méiose. Elle réduit de moitié le nombre de chromosomes.\" },\n            { q: \"Pourquoi les frères et sœurs d'une même famille sont-ils différents ?\", a: \"Parce que lors de la formation des gamètes et lors de la fécondation, les chromosomes et les allèles sont répartis au hasard.\" },\n            { q: \"Qu'est-ce que le brassage génétique ?\", a: \"C'est le mélange des informations génétiques lors de la reproduction sexuée (méiose + fécondation).\" },\n            { q: \"Qui détermine le sexe du bébé lors de la fécondation ?\", a: \"C'est le spermatozoïde, car il peut porter soit un X, soit un Y (l'ovule porte toujours un X).\" },\n            { q: \"Quelle est l'origine des différents allèles dans une population ?\", a: \"Les mutations, qui sont des modifications accidentelles de l'ADN.\" },\n            { q: \"Le cancer est-il une maladie héréditaire ?\", a: \"Généralement non. C'est une mutation qui touche une cellule du corps, mais pas les cellules reproductrices.\" },\n            { q: \"Qu'est-ce que la biodiversité ?\", a: \"C'est la diversité naturelle des organismes vivants (diversité des espèces, des écosystèmes et diversité génétique).\" },\n            { q: \"Un enfant peut-il avoir les yeux bleus si ses deux parents ont les yeux marrons ?\", a: \"Oui, si les deux parents possèdent l'allèle récessif 'bleu' caché par l'allèle dominant 'marron'.\" },\n            { q: \"Que prouve le fait que toutes les cellules vivantes sont formées d'une membrane, cytoplasme, noyau ?\", a: \"Cela suggère que tous les êtres vivants ont une lointaine origine commune (ancêtre commun).\" },\n            { q: \"Qu'est-ce qu'un clone ?\", a: \"Un individu ou une cellule génétiquement identique à un autre.\" },\n            { q: \"Comment prouver qu'un caractère est héréditaire ?\", a: \"En étudiant un arbre généalogique et en voyant si le caractère se transmet sur plusieurs générations.\" },\n            { q: \"L'alimentation de la mère pendant la grossesse (environnement) peut-elle modifier l'ADN du bébé ?\", a: \"Non, cela influence le développement, mais ne change pas les gènes du bébé.\" },\n            { q: \"À quel moment le programme génétique d'un nouvel individu est-il fixé ?\", a: \"Dès l'instant de la fécondation, dans la cellule œuf.\" },\n            { q: \"Quel est le rôle du cytoplasme dans la cellule ?\", a: \"C'est la substance gélatineuse à l'intérieur de la cellule où se déroulent de nombreuses réactions chimiques.\" },\n            { q: \"Quel est le rôle de la membrane cellulaire ?\", a: \"Elle délimite la cellule et contrôle les échanges avec l'extérieur.\" },\n            { q: \"Une bactérie possède-t-elle un noyau ?\", a: \"Non, son information génétique est libre dans le cytoplasme. (Mais ce n'est pas le focus de ce chapitre !)\" },\n            { q: \"Qu'est-ce que l'évolution ?\", a: \"L'évolution est la transformation des espèces vivantes au cours du temps.\" },\n            { q: \"Qu'est-ce qu'une vraie paire de jumeaux ?\", a: \"Ce sont deux individus issus de la même cellule œuf qui s'est divisée en deux très tôt lors du développement. Ils ont le même ADN.\" },\n            { q: \"Que signifie 'interfécondité' ?\", a: \"Capacité pour deux individus de se reproduire entre eux et d'avoir une descendance fertile.\" },\n            { q: \"Pourquoi les vrais jumeaux peuvent-ils finir par ne plus se ressembler exactement à l'âge adulte ?\", a: \"À cause de l'influence de leur environnement et de leur mode de vie qui façonnent leur phénotype.\" },\n            { q: \"Le groupe sanguin est-il un caractère spécifique ou individuel ?\", a: \"Avoir un groupe sanguin est un caractère spécifique, mais être du groupe A ou O est un caractère individuel.\" },\n            { q: \"Où observe-t-on le phénotype ?\", a: \"À l'échelle de l'organisme (yeux), à l'échelle cellulaire (forme des globules) ou moléculaire.\" }\n        ];\n\n        // --- GESTION DES ONGLETS (boutons .tab[data-tab] gérés par quiz.js) ---\n        function switchTab(tabId) {\n            Lecon.openTab(tabId);\n            // Si onglet QA ouvert, initialiser si vide\n            if (tabId === 'qa' && document.getElementById('qa-container').innerHTML.trim() === \"\") {\n                renderQA();\n            }\n        }\n        document.querySelector('.tab[data-tab=\"qa\"]').addEventListener('click', function () { switchTab('qa'); });\n\n        // --- FONCTIONS UTILITAIRES ---\n        function shuffleArray(array) {\n            return Lecon.shuffle([...array]);\n        }\n\n        // --- GESTION DU QCM ---\n        let currentQCMSet = [];\n        let currentQuestionIndex = 0;\n        let score = 0;\n        const NUM_QUESTIONS = 30;\n\n        function startQCM() {\n            // Cacher l'intro et les résultats, montrer le jeu\n            document.getElementById('qcm-setup').hidden = true;\n            const result = document.getElementById('qcm-result');\n            result.hidden = true;\n            result.innerHTML = '';\n            document.getElementById('qcm-play').hidden = false;\n\n            // Sélectionner 30 questions au hasard\n            currentQCMSet = shuffleArray(FULL_QCM_BANK).slice(0, NUM_QUESTIONS);\n            currentQuestionIndex = 0;\n            score = 0;\n\n            showQCMQuestion();\n        }\n\n        function showQCMQuestion() {\n            const head = document.getElementById('qcm-head');\n            Lecon.setProgress(head, currentQuestionIndex, NUM_QUESTIONS, score);\n\n            const qData = currentQCMSet[currentQuestionIndex];\n            document.getElementById('qcm-question-text').textContent = qData.q;\n\n            const optionsContainer = document.getElementById('qcm-options');\n            optionsContainer.innerHTML = '';\n            optionsContainer.classList.remove('is-answered');\n\n            qData.options.forEach((opt, index) => {\n                const btn = document.createElement('button');\n                btn.type = 'button';\n                btn.className = 'choice';\n                btn.textContent = opt;\n                btn.onclick = () => selectQCMAnswer(index, btn, qData.correct);\n                optionsContainer.appendChild(btn);\n            });\n\n            Lecon.clearFeedback('#qcm-feedback');\n            document.getElementById('qcm-next-btn').hidden = true;\n\n            const card = document.getElementById('qcm-card');\n            card.classList.remove('is-enter');\n            void card.offsetWidth;\n            card.classList.add('is-enter');\n        }\n\n        function selectQCMAnswer(selectedIndex, btnElement, correctIndex) {\n            const optionsContainer = document.getElementById('qcm-options');\n            const buttons = optionsContainer.querySelectorAll('.choice');\n            Lecon.markChoices(optionsContainer, btnElement, buttons[correctIndex]);\n\n            if (selectedIndex === correctIndex) {\n                score++;\n                Lecon.feedback('#qcm-feedback', true, '✓ Bravo, bonne réponse !');\n            } else {\n                Lecon.feedback('#qcm-feedback', false, '✗ Oups ! La bonne réponse était :',\n                    '\"' + escapeHTML(currentQCMSet[currentQuestionIndex].options[correctIndex]) + '\"');\n            }\n\n            const head = document.getElementById('qcm-head');\n            Lecon.setProgress(head, currentQuestionIndex + 1, NUM_QUESTIONS, score);\n            head.querySelector('.quiz-count').textContent = `Question ${currentQuestionIndex + 1} / ${NUM_QUESTIONS}`;\n            const next = document.getElementById('qcm-next-btn');\n            next.hidden = false;\n            next.focus({ preventScroll: true });\n        }\n\n        function nextQCMQuestion() {\n            currentQuestionIndex++;\n            if (currentQuestionIndex < NUM_QUESTIONS) {\n                showQCMQuestion();\n            } else {\n                endQCM();\n            }\n        }\n\n        function endQCM() {\n            document.getElementById('qcm-play').hidden = true;\n            const resultScreen = document.getElementById('qcm-result');\n            resultScreen.innerHTML = '';\n            resultScreen.hidden = false;\n\n            const percentage = score / NUM_QUESTIONS;\n            let message;\n            if (percentage >= 0.8) {\n                message = \"🏆 Excellent Aron ! Tu maîtrises parfaitement ton cours de SVT !\";\n            } else if (percentage >= 0.5) {\n                message = \"👍 Bon travail ! Tu as de bonnes bases, relis encore un peu les fiches et tu seras au top !\";\n            } else {\n                message = \"💪 Ne te décourage pas ! Relis bien l'onglet 'Cours' et 'Lexique' et retente ta chance.\";\n            }\n\n            const box = Lecon.resultCard(score, NUM_QUESTIONS, {\n                resultTitle: 'Quiz Terminé !',\n                message: () => `Ton score final est de : <strong>${score} / ${NUM_QUESTIONS}\u003c/strong><br>${message}`\n            }, startQCM);\n            box.querySelector('.quiz-actions button').textContent = '↻ Rejouer une partie';\n            resultScreen.appendChild(box);\n            resultScreen.scrollIntoView({ block: 'nearest' });\n        }\n\n        function escapeHTML(s) {\n            return String(s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;');\n        }\n\n        // --- GESTION DES QUESTIONS / REPONSES (Accordéon) ---\n        function renderQA() {\n            const container = document.getElementById('qa-container');\n            container.innerHTML = '';\n\n            // Sélectionner 20 questions au hasard\n            const selectedQA = shuffleArray(FULL_QA_BANK).slice(0, 20);\n\n            selectedQA.forEach((qa, index) => {\n                const item = document.createElement('details');\n                item.className = 'reveal';\n                item.innerHTML = `\n                    <summary><span><span class=\"qa-num\">Q${index + 1}.\u003c/span> ${escapeHTML(qa.q)}\u003c/span>\u003c/summary>\n                    <div class=\"reveal-body\">\n                        <p><span class=\"qa-label\">Réponse:\u003c/span> ${escapeHTML(qa.a)}\u003c/p>\n                    \u003c/div>\n                `;\n                container.appendChild(item);\n            });\n        }\n\n        // Initialisation si nécessaire au chargement (le HTML a \"cours\" actif par défaut)\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","SVT/SVT Octobre.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>SVT 3ème - Révisions\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n    <style>\n        /* Chapitres du cours : liseré de couleur différent pour chaque chapitre */\n        .chapitre { border-left: 4px solid var(--primary); margin-bottom: var(--space-5); }\n        .chapitre.chapitre2 { border-left-color: var(--success); }\n        .chapitre.chapitre3 { border-left-color: var(--warning); }\n        .lecon .chapitre > h2 { font-size: var(--text-xl); }\n        .faq-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }\n        .lecon .faq-head h2 { margin: 0; }\n    \u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">SVT\u003c/div>\n        <h1>🧬 SVT 3ème : Le vivant et son évolution\u003c/h1>\n        <p class=\"lecon-subtitle\">Espace de révision d'Aron\u003c/p>\n    \u003c/header>\n\n    <nav class=\"tabs\" role=\"tablist\">\n        <button class=\"tab active\" data-tab=\"cours\">📖 Le Cours\u003c/button>\n        <button class=\"tab\" data-tab=\"lexique\">📝 Fiche de Révision\u003c/button>\n        <button class=\"tab\" data-tab=\"qcm\">🎯 QCM Aléatoire\u003c/button>\n        <button class=\"tab\" data-tab=\"faq\">💡 Questions / Réponses\u003c/button>\n    \u003c/nav>\n\n    \u003c!-- ONGLET COURS -->\n    <section id=\"cours\" class=\"tab-content active\">\n        <section class=\"card chapitre\">\n            <h2>Chapitre 1 : Unité, unicité et diversité des êtres vivants\u003c/h2>\n            <p><strong>Rappels :\u003c/strong> La <span class=\"highlight\">biodiversité\u003c/span> désigne la diversité du vivant. Les individus appartiennent à des <span class=\"highlight\">espèces\u003c/span> s'ils se ressemblent, vivent dans le même habitat, et peuvent se reproduire entre eux avec une descendance fertile (qui peut elle-même se reproduire).\u003c/p>\n            <p>Deux espèces très proches peuvent parfois s'accoupler (ex: le cheval et l'ânesse) pour donner un hybride (le mulet), mais l'hybride est stérile. Il ne s'agit donc pas d'une nouvelle espèce.\u003c/p>\n\n            <h3>La diversité des phénotypes\u003c/h3>\n            <p>Nous sommes tous de l'espèce humaine (<i>Homo sapiens\u003c/i>) avec des caractères propres à notre espèce. Cependant, chaque individu est unique ! L'ensemble des caractères visibles d'un individu constitue son <span class=\"highlight\">phénotype\u003c/span>.\u003c/p>\n            <p>D'où viennent nos caractères ?\u003c/p>\n            <ul>\n                <li><strong>Les caractères héréditaires :\u003c/strong> Ils sont présents d'une génération à l'autre et transmis à la descendance (ex: couleur des yeux, forme du nez).\u003c/li>\n                <li><strong>L'environnement :\u003c/strong> L'hygiène de vie, l'alimentation ou le soleil peuvent modifier certains caractères (ex: bronzage, musculature). <span class=\"highlight\">Ces modifications ne sont pas héréditaires\u003c/span>.\u003c/li>\n            \u003c/ul>\n        \u003c/section>\n\n        <section class=\"card chapitre chapitre2\">\n            <h2>Chapitre 2 : La localisation de l'information génétique\u003c/h2>\n            <p>Où est stockée l'information à l'origine de nos caractères héréditaires ? C'est lors de la fécondation (Spermatozoïde + Ovule = Cellule œuf) que le programme génétique est transmis.\u003c/p>\n            <p>Toutes les cellules de notre corps possèdent le même patrimoine génétique car elles proviennent toutes de la même cellule œuf de départ. Des expériences (comme le transfert de noyau) montrent que l'information héréditaire est <span class=\"highlight\">localisée dans le noyau\u003c/span> des cellules.\u003c/p>\n\n            <h3>Les chromosomes et le caryotype\u003c/h3>\n            <p>En observant une cellule en division, on voit apparaître dans le noyau des bâtonnets : les <span class=\"highlight\">chromosomes\u003c/span>. Ils sont le support matériel du programme génétique.\u003c/p>\n            <p>Lorsqu'on les classe par paires et par taille, on obtient un <span class=\"highlight\">caryotype\u003c/span>. Chaque espèce a un caryotype spécifique : l'espèce humaine possède <strong>46 chromosomes\u003c/strong> répartis en <strong>23 paires\u003c/strong>.\u003c/p>\n            <ul>\n                <li>Les 22 premières paires sont identiques chez l'homme et la femme.\u003c/li>\n                <li>La 23ème paire détermine le sexe : <span class=\"highlight\">XX chez la femme\u003c/span> et <span class=\"highlight\">XY chez l'homme\u003c/span>.\u003c/li>\n            \u003c/ul>\n            <p>Un nombre anormal de chromosomes (ex: 3 chromosomes sur la 21ème paire) entraîne des différences de caractères, c'est la trisomie 21.\u003c/p>\n        \u003c/section>\n\n        <section class=\"card chapitre chapitre3\">\n            <h2>Chapitre 3 : De l'ADN aux gènes et allèles\u003c/h2>\n            <p>En temps normal (quand la cellule ne se divise pas), on ne voit pas de bâtonnets. L'information se trouve sous forme de longs filaments d'<strong>ADN\u003c/strong> (Acide DésoxyriboNucléique). C'est seulement quand la cellule se divise que l'ADN se pelotonne (s'enroule fortement sur lui-même) pour former les chromosomes visibles.\u003c/p>\n\n            <h3>Les gènes et les allèles\u003c/h3>\n            <p>Un chromosome est composé de nombreux gènes. Un <span class=\"highlight\">gène\u003c/span> est une petite portion d'ADN qui porte une information déterminant un caractère héréditaire précis (ex: le gène du groupe sanguin).\u003c/p>\n            <p>Puisque nous avons des paires de chromosomes, nous avons chaque gène en double (un venant du père, un de la mère). Un gène peut exister sous plusieurs versions différentes qu'on appelle des <span class=\"highlight\">allèles\u003c/span> (ex: allèle A, allèle B ou allèle O pour le groupe sanguin).\u003c/p>\n            <ul>\n                <li>Si on possède deux allèles différents, il se peut que seul l'un des deux s'exprime : c'est un allèle <strong>dominant\u003c/strong>. Celui qui ne s'exprime pas est dit <strong>récessif\u003c/strong>.\u003c/li>\n                <li>Si les deux s'expriment en même temps, on dit qu'ils sont <strong>co-dominants\u003c/strong>.\u003c/li>\n            \u003c/ul>\n        \u003c/section>\n    \u003c/section>\n\n    \u003c!-- ONGLET LEXIQUE -->\n    <section id=\"lexique\" class=\"tab-content\">\n        <div class=\"card-grid\">\n            <div class=\"card card-accent\">\n                <h3>Espèce\u003c/h3>\n                <p>Groupe d'individus qui se ressemblent, vivent dans un même milieu et peuvent se reproduire entre eux pour donner une descendance fertile.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Phénotype\u003c/h3>\n                <p>L'ensemble des caractères observables d'un individu à un moment donné, à différentes échelles.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Caractère héréditaire\u003c/h3>\n                <p>Caractère présent dès la naissance et qui se transmet de génération en génération au sein d'une famille.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Cellule œuf\u003c/h3>\n                <p>La première cellule d'un être vivant, issue de la fécondation (fusion d'un spermatozoïde et d'un ovule).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Noyau\u003c/h3>\n                <p>Élément central de la cellule qui contient et protège l'information génétique (les chromosomes).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Chromosome\u003c/h3>\n                <p>Bâtonnet visible lors de la division cellulaire. C'est le support matériel de l'information génétique.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Caryotype\u003c/h3>\n                <p>Photographie de l'ensemble des chromosomes d'une cellule, classés par paires et par taille décroissante.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>ADN\u003c/h3>\n                <p>Acide DésoxyriboNucléique. C'est la longue molécule qui constitue les chromosomes en s'enroulant sur elle-même.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Gène\u003c/h3>\n                <p>Portion de l'ADN (sur un chromosome) qui contient l'information responsable d'un caractère héréditaire précis.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Allèle\u003c/h3>\n                <p>Version possible d'un gène. Un même gène peut exister sous plusieurs \"variantes\" appelées allèles.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Allèle dominant / récessif\u003c/h3>\n                <p>Un allèle dominant s'exprime toujours, même s'il n'est présent qu'en un seul exemplaire. Un allèle récessif ne s'exprime que s'il est présent en deux exemplaires.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Chromosomes sexuels\u003c/h3>\n                <p>C'est la 23ème paire de chromosomes chez l'Humain. Elle détermine le sexe de l'individu (XX pour les femmes, XY pour les hommes).\u003c/p>\n            \u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ONGLET QCM -->\n    <section id=\"qcm\" class=\"tab-content\">\n        <h2>QCM - 30 questions au hasard\u003c/h2>\n        <p class=\"muted\">Sélectionne la bonne réponse pour chaque question, puis valide en bas de page.\u003c/p>\n        <div class=\"quiz\" id=\"qcm-quiz\">\n            <div class=\"quiz-head is-sticky\" id=\"qcm-head\">\n                <span class=\"quiz-count\">\u003c/span>\n                <div class=\"quiz-progress\"><span>\u003c/span>\u003c/div>\n                <span class=\"quiz-score\">\u003c/span>\n            \u003c/div>\n            <div id=\"qcm-questions-container\">\u003c/div>\n            <div class=\"feedback\" id=\"qcm-warning\">\u003c/div>\n            <div class=\"quiz-actions center\" id=\"qcm-actions\">\n                <button type=\"button\" class=\"btn btn-primary btn-lg\" id=\"btn-valider\">Valider mes réponses\u003c/button>\n            \u003c/div>\n            <div id=\"qcm-result\">\u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ONGLET FAQ -->\n    <section id=\"faq\" class=\"tab-content\">\n        <div class=\"faq-head\">\n            <h2>Questions pour s'entraîner (20 au hasard)\u003c/h2>\n            <button type=\"button\" class=\"btn btn-secondary\" id=\"btn-faq\">Générer 20 autres questions\u003c/button>\n        \u003c/div>\n        <div id=\"faq-container\">\u003c/div>\n    \u003c/section>\n\n\u003c/main>\n\n<script>\n        // DATABASE DE 50 QUESTIONS POUR LE QCM\n        const bankQCM = [\n            { q: \"Qu'est-ce que la biodiversité ?\", options: [\"La diversité de toutes les formes de vie\", \"Le nom d'un chromosome\", \"Une maladie génétique\"], ans: 0 },\n            { q: \"Deux individus de la même espèce :\", options: [\"Sont toujours parfaitement identiques\", \"Peuvent se reproduire et avoir une descendance fertile\", \"Ont forcément le même âge\"], ans: 1 },\n            { q: \"Un hybride (comme le mulet) :\", options: [\"Peut se reproduire facilement\", \"Est toujours stérile et ne constitue pas une nouvelle espèce\", \"A un caryotype identique à l'Homme\"], ans: 1 },\n            { q: \"Le phénotype est :\", options: [\"L'ensemble des chromosomes\", \"L'ensemble des gènes\", \"L'ensemble des caractères observables d'un individu\"], ans: 2 },\n            { q: \"Un caractère qui se transmet de génération en génération est dit :\", options: [\"Environnemental\", \"Héréditaire\", \"Hybride\"], ans: 1 },\n            { q: \"L'environnement peut-il modifier le phénotype ?\", options: [\"Non, jamais\", \"Oui, mais ces modifications ne sont pas héréditaires\", \"Oui, et les modifications se transmettront aux enfants\"], ans: 1 },\n            { q: \"Le bronzage est un caractère :\", options: [\"Héréditaire\", \"Lié à l'environnement\", \"Lié à l'ADN de base\"], ans: 1 },\n            { q: \"Où se trouve l'information héréditaire dans une cellule ?\", options: [\"Dans la membrane\", \"Dans le cytoplasme\", \"Dans le noyau\"], ans: 2 },\n            { q: \"Comment s'appelle la première cellule d'un être humain ?\", options: [\"Le spermatozoïde\", \"La cellule œuf\", \"Le globule rouge\"], ans: 1 },\n            { q: \"Toutes les cellules du corps d'un individu (sauf reproductrices) :\", options: [\"Ont des noyaux différents\", \"Ont la même information génétique\", \"N'ont pas d'ADN\"], ans: 1 },\n            { q: \"Les chromosomes sont visibles :\", options: [\"Tout le temps\", \"Uniquement quand la cellule se divise\", \"Seulement chez les animaux, pas les plantes\"], ans: 1 },\n            { q: \"Le caryotype est :\", options: [\"Un classement des chromosomes par taille et par paires\", \"Un type de microscope\", \"Une liste d'allèles\"], ans: 0 },\n            { q: \"Combien de chromosomes l'espèce humaine possède-t-elle au total ?\", options: [\"23\", \"46\", \"48\"], ans: 1 },\n            { q: \"Combien de paires de chromosomes un humain possède-t-il ?\", options: [\"23\", \"46\", \"22\"], ans: 0 },\n            { q: \"La 23ème paire de chromosomes chez une femme est :\", options: [\"XY\", \"YY\", \"XX\"], ans: 2 },\n            { q: \"La 23ème paire de chromosomes chez un homme est :\", options: [\"XY\", \"XX\", \"YY\"], ans: 0 },\n            { q: \"La trisomie 21 est caractérisée par :\", options: [\"L'absence du chromosome 21\", \"Trois chromosomes sur la paire 21\", \"Un allèle manquant\"], ans: 1 },\n            { q: \"Le composant principal d'un chromosome est :\", options: [\"L'eau\", \"L'ADN\", \"Le gras\"], ans: 1 },\n            { q: \"Que signifie ADN ?\", options: [\"Acide DésoxyriboNucléique\", \"Action De Nucléarisation\", \"Acide Du Noyau\"], ans: 0 },\n            { q: \"Un gène est :\", options: [\"Une portion d'ADN portant une information génétique\", \"Une maladie\", \"Un synonyme de noyau\"], ans: 0 },\n            { q: \"Les différentes versions d'un même gène s'appellent :\", options: [\"Des allèles\", \"Des chromatides\", \"Des protéines\"], ans: 0 },\n            { q: \"Un allèle dominant :\", options: [\"Ne s'exprime jamais\", \"S'exprime seulement s'il est en double\", \"S'exprime toujours, même en un seul exemplaire\"], ans: 2 },\n            { q: \"Un allèle récessif :\", options: [\"Prend toujours le dessus\", \"Ne s'exprime que s'il n'y a pas d'allèle dominant avec lui\", \"S'exprime dans 100% des cas\"], ans: 1 },\n            { q: \"Si les deux allèles d'un individu s'expriment en même temps, ils sont :\", options: [\"Dominants\", \"Récessifs\", \"Co-dominants\"], ans: 2 },\n            { q: \"Pour un gène donné, combien d'allèles possède chaque cellule humaine (hors gamètes) ?\", options: [\"Un seul\", \"Deux (un sur chaque chromosome de la paire)\", \"Trois\"], ans: 1 },\n            { q: \"Une monosomie c'est :\", options: [\"Quand il y a 3 chromosomes sur une paire\", \"Quand il manque un chromosome sur une paire\", \"Quand les gènes disparaissent\"], ans: 1 },\n            { q: \"Le sexe génétique d'un individu est défini par :\", options: [\"L'alimentation\", \"Les chromosomes sexuels (23ème paire)\", \"La taille du caryotype\"], ans: 1 },\n            { q: \"Les membres d'une même famille :\", options: [\"Ont tous exactement les mêmes allèles\", \"Partagent de nombreux caractères héréditaires\", \"Ont des caryotypes avec des nombres de chromosomes différents\"], ans: 1 },\n            { q: \"L'expérience du transfert de noyau sert à prouver :\", options: [\"Que le noyau contient l'information génétique\", \"Que le cytoplasme est inutile\", \"Que la division cellulaire est rapide\"], ans: 0 },\n            { q: \"Avant de se diviser, que fait l'ADN pour former un chromosome visible ?\", options: [\"Il se détruit\", \"Il s'évapore\", \"Il se pelotonne (s'enroule fortement)\"], ans: 2 },\n            { q: \"Notre espèce s'appelle :\", options: [\"Dendrolagus goodfellowi\", \"Homo sapiens\", \"Homo erectus\"], ans: 1 },\n            { q: \"Le groupe sanguin est déterminé par :\", options: [\"Un caractère environnemental\", \"Un gène avec plusieurs allèles possibles (A, B, O)\", \"Le nombre de chromosomes\"], ans: 1 },\n            { q: \"Lequel est un caractère individuel au sein de l'espèce humaine ?\", options: [\"Avoir deux bras\", \"Avoir la peau bronzée suite à l'été\", \"Respirer de l'oxygène\"], ans: 1 },\n            { q: \"Que se passe-t-il lors de la fécondation pour les chromosomes ?\", options: [\"On additionne les 23 chromosomes du spermatozoïde et les 23 de l'ovule\", \"Le spermatozoïde détruit les chromosomes de l'ovule\", \"Ils doublent tous pour faire 92 chromosomes\"], ans: 0 },\n            { q: \"Les cellules reproductrices (spermatozoïdes et ovules) contiennent :\", options: [\"46 chromosomes\", \"23 chromosomes (un seul par paire)\", \"23 paires complètes\"], ans: 1 },\n            { q: \"Si un ovule (contenant un X) rencontre un spermatozoïde contenant un Y, l'enfant sera :\", options: [\"Une fille\", \"Un garçon\", \"On ne peut pas savoir\"], ans: 1 },\n            { q: \"Si un ovule rencontre un spermatozoïde contenant un X, l'enfant sera :\", options: [\"Une fille\", \"Un garçon\", \"On ne peut pas savoir\"], ans: 0 },\n            { q: \"Qui détermine le sexe de l'enfant lors de la fécondation ?\", options: [\"La mère (ovule)\", \"Le père (spermatozoïde)\", \"L'environnement\"], ans: 1 },\n            { q: \"Un caryotype se lit en classant les chromosomes :\", options: [\"Par ordre alphabétique\", \"Par taille décroissante\", \"Du plus petit au plus grand\"], ans: 1 },\n            { q: \"La molécule d'ADN ressemble à :\", options: [\"Un cube carré\", \"Un très long filament\", \"Une sphère parfaite\"], ans: 1 },\n            { q: \"Un caractère acquis (ex: musculature) au cours de la vie :\", options: [\"S'inscrit dans l'ADN\", \"Sera transmis aux enfants\", \"Ne sera pas transmis aux enfants\"], ans: 2 },\n            { q: \"Un individu porteur des allèles A et O pour le groupe sanguin sera de groupe A car :\", options: [\"A est récessif\", \"A est dominant sur O\", \"O est dominant\"], ans: 1 },\n            { q: \"Un individu de groupe sanguin O possède obligatoirement :\", options: [\"Les allèles O et O\", \"Les allèles A et O\", \"L'allèle O et un gène vide\"], ans: 0 },\n            { q: \"Les individus d'une même espèce ont :\", options: [\"Le même caryotype\", \"Les mêmes empreintes digitales\", \"Le même âge\"], ans: 0 },\n            { q: \"Une erreur lors de la répartition des chromosomes produit :\", options: [\"Une nouvelle espèce\", \"Une anomalie chromosomique\", \"Des allèles en plus\"], ans: 1 },\n            { q: \"Qu'est-ce qui délimite la cellule de l'extérieur ?\", options: [\"Le noyau\", \"La membrane cellulaire\", \"Le cytoplasme\"], ans: 1 },\n            { q: \"Le mot 'inné' est souvent utilisé pour désigner un caractère :\", options: [\"Qui arrive tard dans la vie\", \"Présent à la naissance et héréditaire\", \"Modifié par le sport\"], ans: 1 },\n            { q: \"La génétique est la science qui étudie :\", options: [\"Les roches\", \"L'hérédité et les gènes\", \"Les climats\"], ans: 1 },\n            { q: \"Si je compare le caryotype d'une cellule de ma peau et d'une cellule de mon foie :\", options: [\"Ils sont identiques (46 chro.)\", \"Celui de la peau est plus grand\", \"Le foie n'a pas de caryotype\"], ans: 0 },\n            { q: \"Chaque chromosome d'une paire homologue vient de :\", options: [\"Tous les deux de la mère\", \"L'un du père, l'autre de la mère\", \"L'environnement\"], ans: 1 }\n        ];\n\n        // DATABASE DE 50 QUESTIONS POUR LA FAQ\n        const bankFAQ = [\n            { q: \"Qu'est-ce que la biodiversité ?\", a: \"C'est la diversité du vivant à toutes les échelles (écosystèmes, espèces, individus).\" },\n            { q: \"Comment définit-on une espèce ?\", a: \"C'est un groupe d'individus capables de se reproduire entre eux et dont la descendance est fertile.\" },\n            { q: \"Qu'est-ce qu'un hybride ?\", a: \"C'est le résultat d'un croisement entre deux espèces très proches (ex: l'âne et le cheval donnent le mulet). L'hybride est stérile.\" },\n            { q: \"Qu'est-ce que le phénotype ?\", a: \"C'est l'ensemble des caractères observables d'un individu.\" },\n            { q: \"Qu'est-ce qu'un caractère héréditaire ?\", a: \"C'est un caractère qui se transmet de génération en génération (ex: couleur des cheveux naturels).\" },\n            { q: \"Donne un exemple de caractère non héréditaire.\", a: \"Le bronzage, une cicatrice ou une forte musculature due au sport. Ils sont liés à l'environnement.\" },\n            { q: \"Où se trouve l'information génétique dans la cellule ?\", a: \"Elle est localisée dans le noyau.\" },\n            { q: \"De quoi est composée une cellule basique ?\", a: \"D'une membrane, d'un cytoplasme et d'un noyau.\" },\n            { q: \"Qu'est-ce que la cellule œuf ?\", a: \"C'est la première cellule de tout être vivant, issue de la fusion entre un ovule et un spermatozoïde.\" },\n            { q: \"Toutes les cellules ont-elles la même information génétique ?\", a: \"Oui, car elles proviennent toutes de la multiplication de la cellule œuf de départ.\" },\n            { q: \"Qu'est-ce qu'un chromosome ?\", a: \"C'est un bâtonnet visible dans le noyau lors de la division cellulaire. C'est le support du programme génétique.\" },\n            { q: \"Qu'est-ce qu'un caryotype ?\", a: \"C'est la présentation classée des chromosomes d'une cellule, ordonnés par paires et par taille.\" },\n            { q: \"Combien de chromosomes l'espèce humaine possède-t-elle ?\", a: \"46 chromosomes répartis en 23 paires.\" },\n            { q: \"Quelle paire de chromosomes détermine le sexe ?\", a: \"La 23ème paire (les chromosomes sexuels).\" },\n            { q: \"Quels sont les chromosomes sexuels d'une femme ?\", a: \"XX.\" },\n            { q: \"Quels sont les chromosomes sexuels d'un homme ?\", a: \"XY.\" },\n            { q: \"Qu'est-ce que la trisomie 21 ?\", a: \"C'est une anomalie chromosomique où l'individu possède 3 chromosomes sur la 21ème paire au lieu de 2.\" },\n            { q: \"Que signifie ADN ?\", a: \"Acide DésoxyriboNucléique.\" },\n            { q: \"Quel est le lien entre ADN et chromosome ?\", a: \"Le chromosome est constitué d'une molécule d'ADN super enroulée (pelotonnée) sur elle-même.\" },\n            { q: \"Qu'est-ce qu'un gène ?\", a: \"C'est une portion d'ADN qui porte l'information pour déterminer un caractère précis.\" },\n            { q: \"Qu'est-ce qu'un allèle ?\", a: \"C'est une version possible d'un gène. Par exemple, pour le gène de la couleur des yeux, il existe l'allèle bleu, l'allèle marron, etc.\" },\n            { q: \"Pourquoi a-t-on deux allèles pour chaque gène ?\", a: \"Parce que nous avons nos chromosomes par paires (l'un venant du père, l'autre de la mère).\" },\n            { q: \"Qu'est-ce qu'un allèle dominant ?\", a: \"C'est un allèle qui s'exprime toujours, même s'il n'est présent qu'en un seul exemplaire.\" },\n            { q: \"Qu'est-ce qu'un allèle récessif ?\", a: \"C'est un allèle qui ne s'exprime que s'il est présent en deux exemplaires (s'il n'est pas masqué par un dominant).\" },\n            { q: \"Qu'est-ce que la co-dominance ?\", a: \"C'est lorsque deux allèles différents s'expriment en même temps (ex: allèle A et allèle B donnant le groupe sanguin AB).\" },\n            { q: \"Les caractères liés au mode de vie modifient-ils l'ADN ?\", a: \"Non, l'environnement modifie le phénotype physique mais pas les gènes.\" },\n            { q: \"Combien de chromosomes possède un spermatozoïde humain ?\", a: \"23 chromosomes (un seul chromosome de chaque paire).\" },\n            { q: \"Combien de chromosomes possède un ovule humain ?\", a: \"23 chromosomes.\" },\n            { q: \"Qui détermine le sexe du futur bébé ?\", a: \"Le spermatozoïde du père, selon qu'il porte le chromosome X ou le chromosome Y.\" },\n            { q: \"Que prouve l'expérience de transfert de noyau ?\", a: \"Que c'est bien le noyau qui contient l'information déterminant les caractères de l'individu.\" },\n            { q: \"Comment l'ADN fait-il pour rentrer dans le petit noyau ?\", a: \"Il est extrêmement fin et très long, et il se condense (s'enroule) fortement pour former les chromosomes.\" },\n            { q: \"Où se situent les gènes ?\", a: \"Ils se situent sur les chromosomes, à des emplacements très précis.\" },\n            { q: \"Avoir le teint mat de naissance est-il inné ou acquis ?\", a: \"Inné (héréditaire).\" },\n            { q: \"Savoir jouer du piano est-il inné ou acquis ?\", a: \"Acquis (lié à l'apprentissage et l'environnement).\" },\n            { q: \"Est-ce que tous les êtres vivants ont des chromosomes ?\", a: \"Oui, les chromosomes sont présents chez tous les êtres vivants, ce qui montre l'unité du monde vivant.\" },\n            { q: \"Deux espèces différentes ont-elles le même caryotype ?\", a: \"Non, le nombre et la forme des chromosomes sont spécifiques à chaque espèce.\" },\n            { q: \"Qu'est-ce qu'une monosomie ?\", a: \"C'est la présence d'un seul chromosome au lieu de deux pour une paire donnée.\" },\n            { q: \"Laquelle des cellules du corps humain n'a pas 46 chromosomes ?\", a: \"Les gamètes (cellules reproductrices : spermatozoïdes et ovules) qui en ont 23.\" },\n            { q: \"Un père de groupe sanguin AB et une mère O peuvent-ils avoir un enfant O ?\", a: \"Non, car le père donnera forcément soit l'allèle A, soit le B (qui sont dominants sur le O de la mère).\" },\n            { q: \"Comment appelle-t-on la science qui étudie l'hérédité ?\", a: \"La génétique.\" },\n            { q: \"Un individu avec les chromosomes XY à la 23ème paire sera-t-il masculin ou féminin ?\", a: \"Masculin.\" },\n            { q: \"Un arbre généalogique sert à quoi en SVT ?\", a: \"Il permet de suivre la transmission d'un caractère héréditaire ou d'une maladie génétique au sein d'une famille.\" },\n            { q: \"Qu'est-ce qu'un individu homozygote pour un gène ? (Notion bonus)\", a: \"C'est un individu qui possède deux allèles identiques pour ce gène (ex: O et O).\" },\n            { q: \"Qu'est-ce qu'un individu hétérozygote pour un gène ? (Notion bonus)\", a: \"C'est un individu qui possède deux allèles différents pour ce gène (ex: A et O).\" },\n            { q: \"La myopathie est-elle héréditaire ?\", a: \"Oui, c'est une maladie génétique due à un allèle défectueux.\" },\n            { q: \"Si on coupe l'arbre d'un bonzaï pour le garder petit, ses graines donneront-elles de petits arbres ?\", a: \"Non, car la coupe est une modification environnementale non transmise à l'ADN.\" },\n            { q: \"L'allèle O du groupe sanguin est-il dominant ou récessif ?\", a: \"Il est récessif.\" },\n            { q: \"Quelle forme prend l'ADN quand la cellule ne se divise pas ?\", a: \"La forme d'un amas de longs filaments déroulés.\" },\n            { q: \"Comment les cellules de la peau et les cellules du foie peuvent-elles être si différentes ?\", a: \"Bien qu'elles aient la même information génétique, elles n'expriment pas les mêmes gènes (chacune lit la partie du programme qui lui est utile).\" },\n            { q: \"Pourquoi l'ovule possède-t-il obligatoirement le chromosome X ?\", a: \"Parce que la femme est XX, donc elle ne peut transmettre qu'un chromosome X lors de la formation de l'ovule.\" }\n        ];\n\n        // LOGIQUE D'APPLICATION\n        const QCM_SIZE = 30;\n        let currentAnswers = [];\n\n        function shuffleArray(array) {\n            return Lecon.shuffle(array);\n        }\n\n        function updateQCMProgress() {\n            const head = document.getElementById('qcm-head');\n            const done = currentAnswers.filter(a => a.selected !== null).length;\n            Lecon.setProgress(head, done, QCM_SIZE);\n            head.querySelector('.quiz-count').textContent = done + ' / ' + QCM_SIZE + ' répondu' + (done > 1 ? 'es' : 'e');\n        }\n\n        function initQCM() {\n            const container = document.getElementById('qcm-questions-container');\n            container.innerHTML = '';\n            document.getElementById('qcm-result').innerHTML = '';\n            document.getElementById('qcm-actions').hidden = false;\n            document.getElementById('qcm-head').querySelector('.quiz-score').textContent = '';\n            Lecon.clearFeedback('#qcm-warning');\n            currentAnswers = [];\n\n            // Prendre 30 questions au hasard\n            let selectedQCM = shuffleArray([...bankQCM]).slice(0, QCM_SIZE);\n\n            selectedQCM.forEach((qObj, index) => {\n                currentAnswers.push({ correct: qObj.ans, selected: null });\n\n                const card = document.createElement('article');\n                card.className = 'q-card';\n                card.id = `qcard-${index}`;\n\n                const num = document.createElement('p');\n                num.className = 'q-num';\n                num.textContent = `Question ${index + 1}/${QCM_SIZE}`;\n                const title = document.createElement('h3');\n                title.className = 'q-title';\n                title.textContent = qObj.q;\n\n                const list = document.createElement('div');\n                list.className = 'choices';\n                list.id = `qlist-${index}`;\n                list.setAttribute('role', 'group');\n                list.setAttribute('aria-label', 'Choix de réponse');\n\n                qObj.options.forEach((opt, optIndex) => {\n                    const b = document.createElement('button');\n                    b.type = 'button';\n                    b.className = 'choice';\n                    b.textContent = opt;\n                    b.setAttribute('aria-pressed', 'false');\n                    b.addEventListener('click', () => selectOption(index, optIndex));\n                    list.appendChild(b);\n                });\n\n                const fb = document.createElement('div');\n                fb.className = 'feedback';\n\n                card.append(num, title, list, fb);\n                container.appendChild(card);\n            });\n            updateQCMProgress();\n        }\n\n        function selectOption(qIndex, optIndex) {\n            // Empêcher le clic si déjà validé\n            if (document.getElementById('qcm-actions').hidden) return;\n\n            const choices = document.getElementById(`qlist-${qIndex}`).children;\n            for (let i = 0; i < choices.length; i++) {\n                choices[i].classList.toggle('is-selected', i === optIndex);\n                choices[i].setAttribute('aria-pressed', String(i === optIndex));\n            }\n            currentAnswers[qIndex].selected = optIndex;\n            updateQCMProgress();\n            if (currentAnswers.every(a => a.selected !== null)) Lecon.clearFeedback('#qcm-warning');\n        }\n\n        function checkQCM() {\n            let score = 0;\n            const firstMissing = currentAnswers.findIndex(ans => ans.selected === null);\n\n            if (firstMissing !== -1) {\n                Lecon.feedback('#qcm-warning', false, \"Attention, tu n'as pas répondu à toutes les questions !\");\n                document.getElementById(`qcard-${firstMissing}`).scrollIntoView({ behavior: 'smooth', block: 'center' });\n                return;\n            }\n            Lecon.clearFeedback('#qcm-warning');\n\n            currentAnswers.forEach((ans, index) => {\n                const list = document.getElementById(`qlist-${index}`);\n                const choices = list.children;\n                const ok = ans.selected === ans.correct;\n                if (ok) score++;\n                Lecon.markChoices(list, choices[ans.selected], choices[ans.correct]);\n                Lecon.feedback(list.parentElement.querySelector('.feedback'), ok);\n            });\n\n            document.getElementById('qcm-actions').hidden = true;\n            const head = document.getElementById('qcm-head');\n            Lecon.setProgress(head, QCM_SIZE, QCM_SIZE, score + ' / ' + QCM_SIZE);\n            head.querySelector('.quiz-count').textContent = 'Corrigé';\n\n            const resultDiv = document.getElementById('qcm-result');\n            resultDiv.innerHTML = '';\n            const box = Lecon.resultCard(score, QCM_SIZE, {\n                message: (s) => `Ton score final : ${s} / 30 !`\n            }, () => {\n                initQCM();\n                document.getElementById('qcm').scrollIntoView({ behavior: 'smooth', block: 'start' });\n            });\n            box.querySelector('button').textContent = '↻ Recommencer un nouveau QCM';\n            resultDiv.appendChild(box);\n            box.scrollIntoView({ behavior: 'smooth', block: 'center' });\n        }\n\n        function initFAQ() {\n            const container = document.getElementById('faq-container');\n            container.innerHTML = '';\n\n            // Prendre 20 questions au hasard\n            let selectedFAQ = shuffleArray([...bankFAQ]).slice(0, 20);\n\n            selectedFAQ.forEach((faqObj) => {\n                const item = document.createElement('details');\n                item.className = 'reveal';\n                const summary = document.createElement('summary');\n                summary.innerHTML = faqObj.q;\n                const body = document.createElement('div');\n                body.className = 'reveal-body';\n                body.innerHTML = `<span class=\"solution\">${faqObj.a}\u003c/span>`;\n                item.append(summary, body);\n                container.appendChild(item);\n            });\n        }\n\n        document.getElementById('btn-valider').addEventListener('click', checkQCM);\n        document.getElementById('btn-faq').addEventListener('click', initFAQ);\n\n        // INITIALISATION\n        initQCM();\n        initFAQ();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Math/Notion de Fonction.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Révisions de Mathématiques - Notion de fonction pour Aron\u003c/title>\n\u003c!--rev3e:css-->\n\u003c!--rev3e:quiz-->\n\u003c!--rev3e:mathtex-->\n<style>\n  /* ===== Mise en page propre à cette leçon ===== */\n  .callout-title.no-icon::before { content: none; }\n  .tbl-c td, .tbl-c th { text-align: center; }\n  .tbl-c td:first-child, .tbl-c th:first-child { text-align: left; font-weight: 650; }\n\n  /* Figures */\n  .fig { margin: var(--space-4) auto; padding: var(--space-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); text-align: center; box-shadow: var(--shadow-xs); }\n  .fig svg { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; }\n  .fig .cap { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--muted); }\n  .fig.small svg { max-width: 300px; }\n\n  /* Graphiques (générés par Graph()) : toutes les couleurs suivent le thème clair / sombre */\n  svg.gx .grid { stroke: var(--border); stroke-width: 1; }\n  svg.gx .axis { stroke: var(--text-2); stroke-width: 1.6; }\n  svg.gx .arrow { fill: var(--text-2); }\n  svg.gx text { fill: var(--text-2); font-size: 13px; font-family: var(--font); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }\n  svg.gx text.ax { font-style: italic; font-size: 14px; }\n  svg.gx text.lbl { font-weight: 700; fill: var(--text); font-size: 14px; }\n  svg.gx text.t1 { fill: var(--accent); } svg.gx text.t2 { fill: var(--danger); }\n  svg.gx text.t3 { fill: var(--success); } svg.gx text.t4 { fill: var(--warning); }\n  svg.gx .curve { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }\n  svg.gx .s1 { stroke: var(--accent); } svg.gx .s2 { stroke: var(--danger); }\n  svg.gx .s3 { stroke: var(--success); } svg.gx .s4 { stroke: var(--warning); }\n  svg.gx .pt { stroke: var(--surface); stroke-width: 1.5; }\n  svg.gx .p1 { fill: var(--accent); } svg.gx .p2 { fill: var(--danger); }\n  svg.gx .p3 { fill: var(--success); } svg.gx .p4 { fill: var(--warning); }\n  svg.gx .p0 { fill: var(--text); }\n  svg.gx .guide { stroke-width: 2.2; stroke-dasharray: 7 5; fill: none; }\n  svg.gx .g1 { stroke: var(--warning); } svg.gx .g2 { stroke: var(--success); }\n\n  /* Machine à fonction */\n  .machine { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-3); margin: var(--space-5) 0; }\n  .m-box { padding: 12px 16px; min-width: 64px; text-align: center; font-weight: 700; border-radius: var(--radius); border: 2px solid var(--border-strong); background: var(--surface); }\n  .m-box small { display: block; font-weight: 500; font-size: var(--text-sm); color: var(--text-2); }\n  .m-in { border-color: var(--warning); } .m-out { border-color: var(--success); }\n  .m-fn { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }\n  .m-arrow { font-size: 1.6rem; color: var(--muted); line-height: 1; }\n  .m-test { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }\n  .m-test label { font-weight: 650; }\n  .m-result { margin-top: var(--space-3); padding: var(--space-3) var(--space-4); border-left: 4px solid var(--success); background: var(--success-soft); border-radius: var(--radius-sm); color: var(--text); }\n\n  /* Diagramme à flèches (image / antécédent) */\n  svg.map { display: block; width: 100%; max-width: 380px; margin: 0 auto; height: auto; }\n  svg.map text { fill: var(--text); font-size: 15px; font-weight: 700; font-family: var(--font); text-anchor: middle; }\n  svg.map text.h { fill: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; }\n  svg.map .node { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }\n  svg.map .node.out { stroke: var(--success); }\n  svg.map .link { stroke: var(--text-2); stroke-width: 2; fill: none; }\n  svg.map .mk { fill: var(--text-2); }\n\n  /* Curseurs interactifs */\n  .ctrl { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-2) 0; }\n  .ctrl label { flex: none; min-width: 84px; font-weight: 650; }\n  .ctrl input[type=\"range\"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }\n  .read-out { margin: var(--space-3) 0 0; padding: var(--space-3) var(--space-4); background: var(--surface-2); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); }\n  .read-out.img { border-left-color: var(--warning); } .read-out.ant { border-left-color: var(--success); }\n\n  .ex-title { display: flex; align-items: center; gap: var(--space-2); }\n  .ex-title .tag { flex: none; }\n  .src { font-size: var(--text-xs); color: var(--muted); margin: calc(-1 * var(--space-2)) 0 var(--space-3); }\n  .reveal-body p { margin: var(--space-2) 0; }\n  .reveal-body .formula { font-size: 1.1em; }\n  @media (max-width: 480px) { .ctrl label { min-width: 72px; } .m-box { padding: 10px 12px; } }\n\u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n  <header class=\"lecon-header\">\n    <div class=\"lecon-eyebrow\">Mathématiques\u003c/div>\n    <h1>📈 Notion de fonction - Révise avec Aron !\u003c/h1>\n  \u003c/header>\n\n  <nav class=\"tabs\" role=\"tablist\">\n    <button type=\"button\" class=\"tab active\" data-tab=\"cours\">Le cours\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"graphique\">Courbe &amp; tableau\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"lire\">Lire un graphique\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"droites\">Droites\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"exercices\">Exercices\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"retenir\">À retenir\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"qcm\">QCM\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"vf\">Vrai / Faux\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"calculs\">Calculs\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- ===================== ONGLET 1 : LE COURS ===================== -->\n  <section id=\"cours\" class=\"tab-content active\">\n    <div class=\"callout retenir\">\n      <p class=\"callout-title no-icon\">🔑 Points clés à retenir :\u003c/p>\n      <ul>\n        <li>Une <strong>fonction\u003c/strong> fait correspondre à un nombre <i>x\u003c/i> un <strong>unique\u003c/strong> autre nombre, en utilisant toujours la même suite de calculs.\u003c/li>\n        <li>On note <i>f\u003c/i>(<i>x\u003c/i>) et on lit « <i>f\u003c/i> de <i>x\u003c/i> » : ce n'est <strong>pas\u003c/strong> un produit !\u003c/li>\n        <li><i>f\u003c/i>(<i>x\u003c/i>) est l'<strong>image\u003c/strong> de <i>x\u003c/i> : elle est <strong>unique\u003c/strong>.\u003c/li>\n        <li><i>x\u003c/i> est un <strong>antécédent\u003c/strong> de <i>f\u003c/i>(<i>x\u003c/i>) : un nombre peut en avoir <strong>plusieurs\u003c/strong>.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">1\u003c/span> Deux grandeurs qui dépendent l'une de l'autre\u003c/h2>\n    <p>Quand deux grandeurs mesurables dépendent l'une de l'autre, on dit que l'une est <strong>fonction\u003c/strong> de l'autre. Exemple : <strong>le périmètre d'un carré dépend de la longueur de son côté\u003c/strong>. Dans ce cas, on peut décrire le lien de trois façons :\u003c/p>\n\n    <div class=\"card-grid\">\n      <div class=\"card card-accent\">\n        <h3>✍️ Une formule\u003c/h3>\n        <p>Une
