<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1e293b; --muted: #64748b;
    --border: #e2e8f0; --soft: #eef2ff; --shadow: 0 2px 10px rgba(15, 23, 42, .07);
    --c: #4f46e5; --header-h: 56px;
  }
  html.dark {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --border: #334155; --soft: #1e293b; --shadow: 0 2px 10px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-tap-highlight-color: transparent;
    transition: background .2s, color .2s;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Barre du haut ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20;
    height: calc(var(--header-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
    display: flex; align-items: center; gap: 8px;
    background: var(--c); color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    transition: background .25s;
  }
  .home-btn { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
  .home-btn .logo {
    width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .2);
    display: grid; place-items: center; font-weight: 800;
  }
  .crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: .95rem; opacity: .95; overflow: hidden; }
  .crumbs a, .crumbs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs .sep { opacity: .6; flex: none; }
  .crumbs a:hover { text-decoration: underline; }
  .icon-btn {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px;
    background: rgba(255, 255, 255, .15); display: grid; place-items: center; color: #fff;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, .28); }
  .icon-btn svg { width: 22px; height: 22px; }
  @media (max-width: 600px) { .home-btn .label { display: none; } }

  /* ---------- Contenu ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h2.section { font-size: 1.15rem; margin: 28px 0 12px; display: flex; align-items: center; gap: 8px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s, background .2s;
  }
  a.card:hover, button.card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15, 23, 42, .12); }

  .hero { padding: 22px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border: 0; }
  .hero h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .hero p { margin: 0; opacity: .9; }
  .ring { --p: 0; width: 84px; height: 84px; border-radius: 50%; flex: none;
    background: conic-gradient(#fff calc(var(--p) * 1%), rgba(255, 255, 255, .25) 0);
    display: grid; place-items: center; }
  .ring > div { width: 66px; height: 66px; border-radius: 50%; background: #5b3fe0; display: grid; place-items: center;
    font-weight: 800; font-size: 1.05rem; text-align: center; line-height: 1.1; }
  .ring small { display: block; font-weight: 600; font-size: .65rem; opacity: .85; }

  .search { margin-top: 16px; position: relative; }
  .search input {
    width: 100%; padding: 13px 14px 13px 42px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 1rem; outline: none;
  }
  .search input:focus { border-color: var(--c); box-shadow: 0 0 0 3px rgba(79, 70, 229, .2); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }

  .resume { display: flex; align-items: center; gap: 14px; padding: 16px; border-left: 6px solid var(--sc); }
  .resume .go { margin-left: auto; background: var(--sc); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 700; white-space: nowrap; }

  .badge-ico { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--sc); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }

  /* « Derniers ajouts » : chips compactes de largeur fixe (pas d'étirement) */
  .recent { display: grid; grid-auto-flow: column; grid-auto-columns: 200px; gap: 10px;
    overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
  .recent > * { scroll-snap-align: start; }
  .recent.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent);
    mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip-wrap .chip { width: 200px; }
  .chip { height: 68px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-radius: 12px; min-width: 0; }
  .chip .ico { width: 38px; height: 38px; flex: none; border-radius: 10px; background: var(--sc); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: .8rem; letter-spacing: -.02em; }
  .chip .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .chip .t { font-weight: 650; font-size: .9rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .s { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: .74rem; color: var(--muted); white-space: nowrap; }
  .chip .s > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .chip .tag { padding: 1px 7px; font-size: .66rem; }
  a.card.chip:hover { border-color: var(--sc); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .subject { padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
  .subject::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--sc); }
  .subject .row { display: flex; align-items: center; gap: 12px; }
  .subject h3 { margin: 0; font-size: 1.1rem; }
  .subject .count { font-size: .85rem; color: var(--muted); }
  .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--sc, var(--c)); border-radius: 99px; transition: width .4s; }

  .tag { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .tag.new { background: #fde68a; color: #92400e; }
  .tag.seen { background: #dbeafe; color: #1e40af; }
  .tag.done { background: #dcfce7; color: #166534; }
  .tag.todo { background: var(--border); color: var(--muted); }

  /* ---------- Page matière ---------- */
  .banner { padding: 22px; color: #fff; background: var(--sc); border: 0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .banner .badge-ico { background: rgba(255, 255, 255, .22); width: 58px; height: 58px; font-size: 1.4rem; }
  .banner h1 { margin: 0; font-size: 1.5rem; }
  .banner .bar { background: rgba(255, 255, 255, .3); margin-top: 8px; width: min(320px, 70vw); }
  .banner .bar > i { background: #fff; }
  .chapters { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .chap { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-left: 6px solid var(--sc); }
  .chap .num { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; background: var(--soft); color: var(--sc); border: 2px solid var(--sc); }
  .chap.is-done .num { background: var(--sc); color: #fff; }
  .chap .info { flex: 1; min-width: 0; }
  .chap .t { font-weight: 700; font-size: 1.02rem; }
  .chap .meta { font-size: .8rem; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chap .arrow { color: var(--sc); font-size: 1.4rem; font-weight: 800; }

  .empty { text-align: center; color: var(--muted); padding: 30px; }

  /* ---------- Page chapitre ---------- */
  body.reading main { max-width: none; padding: 0; }
  .reader { display: flex; flex-direction: column; height: calc(100dvh - var(--header-h) - env(safe-area-inset-top)); }
  .reader-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--card); border-bottom: 3px solid var(--sc); flex-wrap: nowrap;
  }
  .reader-bar .title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 8px 12px;
    font-size: .88rem; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  }
  .pill:disabled { opacity: .35; cursor: default; }
  .pill.done-on { background: #16a34a; border-color: #16a34a; color: #fff; }
  .reader iframe { flex: 1; width: 100%; border: 0; background: var(--bg); transition: opacity .15s; }
  .reader iframe.loading { opacity: 0; }
  /* Les leçons qui chargent assets/quiz.js gèrent leur propre mode sombre (html.dark).
     Repli pour les anciennes leçons uniquement : inversion des couleurs. */
  .reader iframe.legacy { background: #fff; }
  html.dark .reader iframe.legacy { filter: invert(1) hue-rotate(180deg); }
  @media (max-width: 600px) { .pill .lbl { display: none; } .reader-bar .title { font-size: .92rem; } }

  /* Mode focus (repli quand le plein écran n'est pas disponible, ex. iPhone) */
  body.focus header.top, body.focus .reader-bar { display: none; }
  body.focus .reader { height: 100dvh; }
  .exit-focus {
    display: none; position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30;
    border: 0; border-radius: 99px; padding: 10px 16px; background: rgba(15, 23, 42, .8); color: #fff; font-weight: 700;
  }
  body.focus .exit-focus { display: block; }
</style>
</head>

<header class="top">
  <a class="home-btn" href="#/" title="Accueil">
    <span class="logo">3e</span><span class="label">Révisions</span>
  </a>
  <nav class="crumbs" id="crumbs"></nav>
  <button class="icon-btn" id="themeBtn" title="Mode sombre / clair" aria-label="Mode sombre / clair"></button>
  <button class="icon-btn" id="fsBtn" title="Plein écran" aria-label="Plein écran"></button>
</header>

<main id="app"></main>
<button class="exit-focus" id="exitFocus">Quitter le plein écran</button>

 }\n::selection { background: var(--primary-soft); }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }\nhr { border: 0; border-top: 1px solid var(--border); margin: var(--space-8) 0; }\nstrong, b { font-weight: 650; }\ncode, kbd { font-family: var(--font-mono); font-size: .9em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }\nmark, .highlight { background: var(--warning-soft); color: inherit; box-shadow: inset 0 -2px 0 var(--warning-border); border-radius: 4px; padding: 0 4px; font-weight: 600; }\n[hidden] { display: none !important; }\n.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n\n/* ---------- 3. Mise en page ---------- */\n.lecon {\n  max-width: var(--container);\n  margin: 0 auto;\n  padding: var(--space-6) var(--space-5) var(--space-16);\n}\n@media (max-width: 480px) { .lecon { padding: var(--space-4) var(--space-4) var(--space-12); } }\n\n.lecon-header { padding: var(--space-4) 0 var(--space-6); }\n.lecon-eyebrow {\n  display: inline-flex; align-items: center; gap: var(--space-2);\n  font-size: var(--text-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;\n  color: var(--accent); margin-bottom: var(--space-2);\n}\n.lecon-eyebrow::before { content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }\n.lecon-header h1, .lecon h1 {\n  font-size: var(--text-3xl); line-height: 1.2; font-weight: 800; letter-spacing: -.02em; margin: 0;\n}\n.lecon-subtitle { margin: var(--space-2) 0 0; color: var(--muted); font-size: var(--text-md); }\n@media (max-width: 480px) { .lecon-header h1, .lecon h1 { font-size: var(--text-2xl); } }\n\n.lecon h2 {\n  font-size: var(--text-2xl); line-height: 1.3; font-weight: 750; letter-spacing: -.015em;\n  margin: var(--space-10) 0 var(--space-3);\n}\n.lecon h3 { font-size: var(--text-lg); line-height: 1.4; font-weight: 700; margin: var(--space-6) 0 var(--space-2); }\n.lecon h4 { font-size: var(--text-base); font-weight: 700; margin: var(--space-4) 0 var(--space-2); }\n.lecon h2:first-child, .lecon h3:first-child, .lecon h4:first-child { margin-top: 0; }\n.lecon p { margin: 0 0 var(--space-4); }\n.lecon ul, .lecon ol { margin: 0 0 var(--space-4); padding-left: 1.4em; }\n.lecon li { margin: var(--space-1) 0; }\n.lecon li::marker { color: var(--muted); }\n\n/* Titre de section avec numéro : <h2 class=\"section-title\"><span class=\"num\">1\u003c/span> Titre\u003c/h2> */\n.section-title { display: flex; align-items: center; gap: var(--space-3); }\n.section-title .num {\n  flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;\n  font-size: var(--text-sm); font-weight: 800; background: var(--primary-soft); color: var(--primary-text);\n}\n.lead { font-size: var(--text-lg); color: var(--text-2); }\n.muted { color: var(--muted); }\n.small { font-size: var(--text-sm); }\n.text-center { text-align: center; }\n.stack > * + * { margin-top: var(--space-4); }\n\n.grid-2, .grid-3, .card-grid { display: grid; gap: var(--space-3); grid-template-columns: minmax(0, 1fr); margin: var(--space-4) 0; }\n@media (min-width: 600px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (min-width: 700px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }\n.card-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }\n\n/* ---------- 4. Onglets ---------- */\n.tabs {\n  position: sticky; top: 0; z-index: 20;\n  display: flex; gap: var(--space-1); padding: var(--space-1);\n  margin: 0 0 var(--space-6);\n  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);\n  overflow-x: auto; scrollbar-width: none;\n  box-shadow: 0 -8px 0 8px var(--bg); /* masque le contenu qui défile dessous */\n}\n.tabs::-webkit-scrollbar { display: none; }\n/* PC : les onglets passent à la ligne ; mobile : défilement horizontal */\n@media (min-width: 700px) { .tabs { flex-wrap: wrap; overflow-x: visible; } }\n.tab {\n  flex: 1 0 auto; border: 0; background: transparent; cursor: pointer;\n  padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm);\n  font-size: var(--text-sm); font-weight: 600; color: var(--muted); white-space: nowrap; text-decoration: none;\n  text-align: center;\n  transition: background-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast);\n}\n.tab:hover { color: var(--text); }\n.tab.active, .tab.is-active, .tab[aria-selected=\"true\"] {\n  background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm);\n}\n.tab:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }\n.tab-content { display: none; }\n.tab-content.active, .tab-content.is-active { display: block; animation: lecon-fade-in 250ms var(--ease); }\n\n/* ---------- 5. Cartes, encadrés, tableaux ---------- */\n.card {\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);\n  padding: var(--space-5); box-shadow: var(--shadow-xs);\n}\n.card + .card { margin-top: var(--space-3); }\n.card-grid .card + .card, .grid-2 .card + .card, .grid-3 .card + .card { margin-top: 0; }\n.card > :first-child { margin-top: 0; }\n.card > :last-child { margin-bottom: 0; }\n.card-accent { border-top: 3px solid var(--accent); }\n\n.callout {\n  position: relative; margin: var(--space-4) 0; padding: var(--space-4) var(--space-5);\n  border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--radius);\n  background: var(--surface);\n}\n.callout > :last-child { margin-bottom: 0; }\n.callout-title {\n  display: flex; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-2);\n  font-size: var(--text-xs); font-weight: 800; letter-spacing: .07em; text-transform: uppercase;\n}\n.callout-title::before { font-size: 1rem; letter-spacing: 0; }\n.callout.retenir    { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 30%, transparent); border-left-color: var(--primary); }\n.callout.retenir .callout-title { color: var(--primary-text); }\n.callout.retenir .callout-title::before { content: \"📌\"; }\n.callout.definition { background: var(--info-soft); border-color: var(--info-border); border-left-color: var(--info); }\n.callout.definition .callout-title { color: var(--info-text); }\n.callout.definition .callout-title::before { content: \"📖\"; }\n.callout.exemple    { background: var(--surface-2); border-left-color: var(--muted); }\n.callout.exemple .callout-title { color: var(--text-2); }\n.callout.exemple .callout-title::before { content: \"💡\"; }\n.callout.attention  { background: var(--warning-soft); border-color: var(--warning-border); border-left-color: var(--warning); }\n.callout.attention .callout-title { color: var(--warning-text); }\n.callout.attention .callout-title::before { content: \"⚠️\"; }\n\n.table-wrap { overflow-x: auto; margin: var(--space-4) 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }\n.lecon table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); margin: var(--space-4) 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\n.table-wrap table { margin: 0; border: 0; border-radius: 0; }\n.lecon th, .lecon td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }\n.lecon th { background: var(--surface-2); color: var(--text-2); font-weight: 650; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .05em; }\n.lecon tr:last-child td { border-bottom: 0; }\n@media (hover: hover) { .lecon tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); } }\n\n/* Liste de définitions */\n.terms { margin: var(--space-4) 0; }\n.terms dt { font-weight: 700; }\n.terms dd { margin: 0 0 var(--space-3); color: var(--text-2); }\n\n/* Formules (MathJax ou texte) */\n.formula { display: block; text-align: center; font-size: 1.3em; margin: var(--space-3) 0; overflow-x: auto; overflow-y: hidden; padding: var(--space-1) 0; color: var(--text); }\n\n/* Badges */\n.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 650; line-height: 1.5; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); vertical-align: middle; }\n.tag.primary { background: var(--primary-soft); color: var(--primary-text); border-color: transparent; }\n.tag.success { background: var(--success-soft); color: var(--success-text); border-color: var(--success-border); }\n.tag.danger  { background: var(--danger-soft);  color: var(--danger-text);  border-color: var(--danger-border); }\n.tag.warning { background: var(--warning-soft); color: var(--warning-text); border-color: var(--warning-border); }\n\n/* Frise chronologique */\n.timeline { list-style: none; margin: var(--space-4) 0; padding: 0 0 0 var(--space-8); position: relative; }\n.timeline::before { content: \"\"; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--border); border-radius: 2px; }\n.timeline-item { position: relative; margin: 0 0 var(--space-5); }\n.timeline-item::before {\n  content: \"\"; position: absolute; left: calc(-1 * var(--space-8) + 3px); top: 5px; width: 14px; height: 14px; border-radius: 50%;\n  background: var(--surface); border: 3px solid var(--accent);\n}\n.timeline-date { font-size: var(--text-xs); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }\n.timeline-item h3 { margin: 2px 0 var(--space-1); font-size: var(--text-base); }\n.timeline-item p { margin: 0; color: var(--text-2); }\n\n/* ---------- 6. Boutons ---------- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);\n  min-height: 42px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;\n  font-size: var(--text-sm); font-weight: 650; line-height: 1.2; text-decoration: none; cursor: pointer; user-select: none;\n  transition: background-color var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast), color var(--t-fast);\n}\n.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }\n.btn:active:not(:disabled) { transform: translateY(1px); }\n.btn:disabled, .btn.is-disabled { opacity: .5; cursor: not-allowed; }\n.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-xs); }\n.btn-primary:hover:not(:disabled) { background: var(--primary-hover); color: var(--on-primary); }\n.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow-xs); }\n.btn-secondary:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }\n.btn-ghost { background: transparent; color: var(--text-2); }\n.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }\n.btn-success { background: var(--success); color: #fff; }\n.btn-lg { min-height: 48px; padding: 12px 22px; font-size: var(--text-base); }\n.btn-sm { min-height: 34px; padding: 6px 12px; font-size: var(--text-xs); }\n.btn-block { display: flex; width: 100%; }\n.btn-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: var(--space-4); }\n.btn-row.center { justify-content: center; }\n\n/* ---------- 7. Quiz / QCM ---------- */\n.quiz { margin: var(--space-6) 0; }\n.quiz-intro { text-align: center; }\n.quiz-head {\n  display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4);\n  font-size: var(--text-sm); font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums;\n}\n.quiz-head.is-sticky {\n  position: sticky; top: var(--sticky-top); z-index: 15; padding: var(--space-3) var(--space-4);\n  background: color-mix(in srgb, var(--surface) 92%, transparent);\n  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);\n  border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);\n}\n.quiz-count { white-space: nowrap; }\n.quiz-score { white-space: nowrap; color: var(--text-2); }\n.quiz-progress {\n  flex: 1; min-width: 60px; height: 8px; border-radius: var(--radius-full);\n  background: var(--surface-3); overflow: hidden;\n}\n.quiz-progress > span, .quiz-progress > i {\n  display: block; height: 100%; width: var(--p, 0%); border-radius: inherit;\n  background: var(--primary); transition: width 400ms var(--ease);\n}\n\n.q-card {\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);\n  padding: var(--space-6); box-shadow: var(--shadow-sm); margin: 0 0 var(--space-4);\n}\n@media (max-width: 480px) { .q-card { padding: var(--space-4); } }\n.q-card.is-enter { animation: lecon-slide-in 300ms var(--ease); }\n.q-num { margin: 0 0 var(--space-1); font-size: var(--text-xs); font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }\n.lecon .q-title, .q-title { margin: 0 0 var(--space-4); font-size: var(--text-lg); font-weight: 650; line-height: 1.45; letter-spacing: -.005em; }\n.q-hint { margin: calc(-1 * var(--space-2)) 0 var(--space-4); font-size: var(--text-sm); color: var(--muted); }\n\n.choices {\n  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;\n  list-style: none; margin: 0; padding: 0; counter-reset: choice;\n}\n@media (min-width: 700px) { .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n.choices.cols-1 { grid-template-columns: minmax(0, 1fr); }\n\n.choice {\n  position: relative; counter-increment: choice;\n  display: flex; align-items: center; gap: var(--space-3);\n  width: 100%; min-height: 52px; margin: 0; padding: 12px 14px;\n  border: 1.5px solid var(--border); border-radius: var(--radius);\n  background: var(--surface); color: var(--text);\n  font-size: var(--text-base); font-weight: 500; line-height: 1.4; text-align: left;\n  cursor: pointer; user-select: none;\n  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease),\n              border-color var(--t-fast), background-color var(--t-fast), color var(--t-fast), opacity var(--t-fast);\n}\n.choice::before {\n  content: counter(choice, upper-alpha);\n  flex: none; width: 28px; height: 28px; border-radius: 50%;\n  display: grid; place-items: center;\n  font-size: var(--text-xs); font-weight: 750; line-height: 1;\n  background: var(--surface-2); color: var(--text-2); border: 1.5px solid var(--border);\n  transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);\n}\n.choice[data-letter]::before { content: attr(data-letter); }\n.choices.no-letters .choice::before { display: none; }\n.choice input[type=\"radio\"], .choice input[type=\"checkbox\"] {\n  position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none;\n}\n\n@media (hover: hover) {\n  .choice:not(:disabled):not(.is-disabled):not(.is-correct):not(.is-wrong):not(:has(input:disabled)):hover {\n    transform: translateY(-2px); box-shadow: var(--shadow-md);\n    border-color: var(--primary); background: var(--primary-soft);\n  }\n  .choice:not(:disabled):not(.is-disabled):not(.is-correct):not(.is-wrong):not(:has(input:disabled)):hover::before {\n    border-color: var(--primary); color: var(--primary-text);\n  }\n}\n.choice:active:not(:disabled):not(.is-disabled) { transform: translateY(0) scale(.99); box-shadow: none; }\n.choice:focus-visible, .choice:has(input:focus-visible) {\n  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring);\n}\n\n/* Sélectionné (avant validation) — :where() garde une spécificité faible pour que .is-correct / .is-wrong l'emportent */\n.choice.is-selected, .choice:has(:where(input:checked)) n.feedback .explain b:first-child { color: var(--text); }\n\n.quiz-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }\n.quiz-actions.center { justify-content: center; }\n\n/* Résultat final */\n.quiz-result {\n  text-align: center; padding: var(--space-8) var(--space-6);\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);\n  box-shadow: var(--shadow-sm); animation: lecon-pop 350ms var(--ease);\n}\n.lecon .quiz-result h3, .quiz-result h3 { margin: var(--space-4) 0 var(--space-1); font-size: var(--text-xl); }\n.lecon .quiz-result p, .quiz-result p { margin: 0 auto var(--space-4); color: var(--muted); max-width: 46ch; }\n.score-ring {\n  --p: 0; --c: var(--primary);\n  width: 112px; height: 112px; margin: 0 auto; border-radius: 50%;\n  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-3) 0);\n  display: grid; place-items: center;\n}\n.score-ring.is-good { --c: var(--success); }\n.score-ring.is-low { --c: var(--warning); }\n.score-ring > span {\n  width: 88px; height: 88px; border-radius: 50%; background: var(--surface);\n  display: grid; place-items: center; align-content: center;\n  font-size: var(--text-2xl); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;\n}\n.score-ring small { display: block; margin-top: 4px; font-size: var(--text-xs); font-weight: 600; color: var(--muted); }\n\n/* Réponse à saisir */\n.answer-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }\n.answer-input {\n  flex: 1 1 220px; max-width: 360px; min-height: 48px; padding: 10px 14px;\n  border: 1.5px solid var(--border-strong); border-radius: var(--radius);\n  background: var(--surface); color: var(--text); font-size: var(--text-base); font-weight: 500;\n  transition: border-color var(--t-fast), box-shadow var(--t-fast), background-color var(--t-fast);\n}\n.answer-input::placeholder { color: var(--muted); font-weig a[j]; a[j] = t; }\n    return a;\n  }\n  function normalize(s, ignoreAccents) {\n    s = String(s == null ? '' : s).trim().toLowerCase()\n      .replace(/[’‘`´]/g, \"'\").replace(/\\s+/g, ' ').replace(/[.!?;]+$/, '').trim();\n    if (ignoreAccents) s = s.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n    return s;\n  }\n  function typeset(el) {\n    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(function () {});\n  }\n  function scrollIntoViewIfNeeded(el) {\n    var r = el.getBoundingClientRect();\n    if (r.top < 0 || r.bottom > window.innerHeight) el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });\n  }\n\n  /* Met à jour un en-tête de quiz : .quiz-count / .quiz-progress / .quiz-score */\n  function setProgress(head, done, total, score) {\n    head = $(head); if (!head) return;\n    var c = head.querySelector('.quiz-count'), p = head.querySelector('.quiz-progress'), s = head.querySelector('.quiz-score');\n    if (c) c.textContent = 'Question ' + Math.min(done + 1, total) + ' / ' + total;\n    if (p) {\n      p.style.setProperty('--p', (total ? done / total * 100 : 0) + '%');\n      p.setAttribute('role', 'progressbar'); p.setAttribute('aria-valuemin', '0');\n      p.setAttribute('aria-valuemax', String(total)); p.setAttribute('aria-valuenow', String(done));\n    }\n    if (s && score != null) s.textContent = 'Score : ' + score;\n  }\n\n  function headHTML(sticky) {\n    return '<div class=\"quiz-head' + (sticky ? ' is-sticky' : '') + '\">' +\n      '<span class=\"quiz-count\">\u003c/span><div class=\"quiz-progress\"><span>\u003c/span>\u003c/div><span class=\"quiz-score\">\u003c/span>\u003c/div>';\n  }\n\n  /* Remplit un bloc .feedback (ok = true / false) */\n  function feedback(el, ok, title, explain) {\n    el = $(el); if (!el) return;\n    el.className = 'feedback ' + (ok ? 'is-correct' : 'is-wrong');\n    el.setAttribute('aria-live', 'polite');\n    el.innerHTML = '<span class=\"feedback-t " class=\"btn btn-primary\">↻ Recommencer\u003c/button>\u003c/div>';\n    box.querySelector('button').addEventListener('click', restart);\n    return box;\n  }\n\n  /* ---------- 4a. QCM ----------\n     Lecon.qcm('#cible', [\n       { question: 'Texte (HTML autorisé)', choices: ['A', 'B', 'C'], answer: 1, explanation: '…' },\n     ], { layout: 'step' | 'list', validate: 'instant' | 'submit', shuffle: false, shuffleChoices: false,\n          sampleSize: 50, letters: ['V','F'], message: function (score, total) { return '…'; }, onFinish: fn })\n     - answer : index (0 = premier choix) ou texte exact du bon choix.\n     - sampleSize : tirage sans remise, renouvelé à chaque redémarrage ; absent = toute la banque.\n     - layout 'step' : une question à la fois (par défaut) ; 'list' : toutes les questions visibles.\n     - validate 'submit' (layout list) : l'élève choisit puis clique « Valider mes réponses ». */\n  function answerIndex(q) {\n    var a = q.answer != null ? q.answer : q.correct;\n    if (typeof a === 'number') return a;\n    var ch = q.choices || q.options || [];\n    for (var i = 0; i < ch.length; i++) if (normalize(ch[i]) === normalize(a)) return i;\n    return -1;\n  }\n\n  function qcm(target, questions, opts) {\n    target = $(target);\n    opts = Object.assign({ layout: 'step', validate: 'instant', shuffle: false, shuffleChoices: false }, opts || {});\n    if (opts.sampleSize != null && (!Number.isInteger(opts.sampleSize) || opts.sampleSize < 1 || opts.sampleSize > questions.length)) {\n      throw new RangeError('sampleSize doit être un entier entre 1 et le nombre de questions.');\n    }\n    var data, score, answered;\n\n    function prepare() {\n      var selected = questions.slice();\n      if (opts.sampleSize != null) selected = shuffle(selected).slice(0, opts.sampleSize);\n      data = selected.map(function (q) {\n        var choices = (q.choices || q.options || []).map(function (c, i) { return { html: c, ok: i === answerIndex(q) }; });\n        if (opts.shuffleChoices || q.shuffle) shuffle(choices);\n        return { q: q, choices: choices, letters: q.letters || opts.letters };\n      });\n      if (opts.shuffle) shuffle(data);\n      score = 0; answered = 0;\n    }\n\n    function buildCard(item, i, total) {\n      var card = h('article', 'q-card');\n      if (opts.layout === 'list') card.appendChild(h('p', 'q-num', 'Question ' + (i + 1) + ' / ' + total));\n      card.appendChild(h('h3', 'q-title', item.q.question || item.q.q || ''));\n      if (item.q.hint) card.appendChild(h('p', 'q-hint', item.q.hint));\n      var list = h('div', 'choices' + (item.q.cols1 || opts.cols1 ? ' cols-1' : ''));\n      list.setAttribute('role', 'group');\n      list.setAttribute('aria-label', 'Choix de réponse');\n      item.choices.forEach(function (c, k) {\n        var b = h('button', 'choice', c.html);\n        b.type = 'button';\n        if (item.letters && item.letters[k]) b.setAttribute('data-letter', item.letters[k]);\n        b._ok = c.ok;\n        list.appendChild(b);\n      });\n      var fb = h('div', 'feedback'); fb.setAttribute('aria-live', 'polite');\n      card.appendChild(list); card.appendChild(fb);\n      return { card: card, list: list, fb: fb };\n    }\n\n    function correct(item, ui, chosen) {\n      var good = null;\n      [].forEach.call(ui.list.children, function (b) { if (b._ok) good = b; });\n      var ok = chosen === good;\n      markChoices(ui.list, chosen, good);\n      if (ok) score++;\n      answered++;\n      var title = chosen ? (ok ? '✓ Bonne réponse !' : '✗ Pas tout à fait…') : '— Pas de réponse';\n      var explain = '';\n      if (!ok && good) explain += '<b>Bonne réponse : \u003c/b>' + good.innerHTML + (item.q.explanation ? '<br>' : '');\n      if (item.q.explanation) explain += item.q.explanation;\n      feedback(ui.fb, ok, title, explain);\n      return ok;\n    }\n\n    function finish(container) {\n      var box = resultCard(score, data.length, opts, start);\n      container.append  });\n      var footer = h('div');\n      wrap.appendChild(footer);\n      function update() {\n        setProgress(head, answered, data.length, score);\n        head.querySelector('.quiz-count').textContent = answered + ' / ' + data.length + ' répondu' + (answered > 1 ? 'es' : 'e');\n      }\n      update();\n\n      if (opts.validate === 'submit') {\n        head.querySelector('.quiz-score').textContent = '';\n        var actions = h('div', 'quiz-actions center');\n        var submit = h('button', 'btn btn-primary btn-lg', 'Valider mes réponses');\n        submit.type = 'button';\n        actions.appendChild(submit); footer.appendChild(actions);\n        var picked = data.map(function () { return null; });\n        uis.forEach(function (ui, i) {\n          ui.list.addEventListener('click', function (e) {\n            var b = e.target.closest('.choice');\n            if (!b || b.disabled) return;\n            [].forEach.call(ui.list.children, function (x) { x.classList.toggle('is-selected', x === b); x.setAttribute('aria-pressed', String(x === b)); });\n            if (!picked[i]) { answered++; update(); head.querySelector('.quiz-score').textContent = ''; }\n            picked[i] = b;\n          });\n        });\n        submit.addEventListener('click', function () {\n          answered = 0;\n          uis.forEach(function (ui, i) { correct(data[i], ui, picked[i]); });\n          setProgress(head, data.length, data.length, score);\n          head.querySelector('.quiz-count').textContent = 'Corrigé';\n          actions.remove();\n          finish(footer);\n        });\n      } else {\n        uis.forEach(function (ui, i) {\n          ui.list.addEventListener('click', function (e) {\n            var b = e.target.closest('.choice');\n            if (!b || b.disabled) return;\n            correct(data[i], ui, b);\n            update();\n            if (answered === data.length) finish(footer);\n          });\n        });\n      }\n      typeset(wrap);\n    }\n\n    function start() {\n      prepare();\n      (opts.layout === 'list' ? renderList : renderStep)();\n      if (opts.onStart) opts.onStart();\n    }\n    start();\n    return { restart: start };\n  }\n\n  /* ---------- 4b. Vrai / Faux ----------\n     Lecon.vraiFaux('#cible', [{ question: 'Affirmation', answer: true, explanation: '…' }], options) */\n  function vraiFaux(target, items, opts) {\n    return qcm(target, items.map(function (it) {\n      return Object.assign({}, it, {\n        question: it.question || it.statement, choices: ['Vrai', 'Faux'],\n        answer: it.answer === true || it.answer === 'Vrai' || it.answer === 'vrai' ? 0 : 1, letters: ['V', 'F']\n      });\n    }), opts);\n  }\n\n  /* ---------- 4c. Réponse à saisir ----------\n     Lecon.saisie('#cible', [{ question: '…', answer: 'went' | ['went', 'gone'], explanation: '…', placeholder: '…' }],\n                  { ignoreAccents: false, shuffle: false, check: function (valeur, item) { return true/false; } }) */\n  function saisie(target, items, opts) {\n    target = $(target);\n    opts = Object.assign({ shuffle: false, ignoreAccents: false }, opts || {});\n    var data, score;\n    function start() {\n      data = items.slice(); if (opts.shuffle) shuffle(data);\n      score = 0;\n      target.innerHTML = '';\n      var wrap = h('div', 'quiz');\n      wrap.innerHTML = headHTML(false);\n      var head = wrap.firstChild, stage = h('div');\n      wrap.appendChild(stage); target.appendChild(wrap);\n      var i = 0;\n      function show() {\n        setProgress(head, i, data.length, score);\n        stage.innerHTML = '';\n        if (i >= data.length) {\n          head.querySelector('.quiz-count').textContent = 'Terminé';\n          var box = resultCard(score, data.length, opts, start);\n          stage.appendChild(box);\n          if (opts.onFinish) opts.onFinish(score, data.length);\n          return;\n        }\n        var it = data[i];\n        var card = h('article', 'q-card is-enter');\n        card.a tColor;padding:0 .1em}.mjx-text{font-style:normal}';\n  function addStyle() {\n    if (document.getElementById('mathtex-style')) return;\n    var st = document.createElement('style');\n    st.id = 'mathtex-style';\n    st.textContent = css;\n    (document.head || document.documentElement).appendChild(st);\n  }\n  addStyle();\n\n  var ready;\n  var startup = new Promise(function (resolve) { ready = resolve; });\n  window.MathJax = {\n    version: 'mathtex',\n    tex2html: render,\n    typeset: typeset,\n    typesetPromise: function (els) { return startup.then(function () { typeset(els); }); },\n    startup: { promise: startup }\n  };\n  function init() { typeset(); ready(); }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\n  else init();\n})();\n","lessons":{"Math/Fractions et Puissances.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Révisions Mathématiques - Aron\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n    \u003c!--rev3e:mathtex-->\n    <style>\n        /* Mise en page propre à cette leçon : énoncé en grand et saisie d'une fraction / d'un exposant */\n        .q-math { font-size: 1.6em; text-align: center; margin: var(--space-2) 0 var(--space-5); overflow-x: auto; overflow-y: hidden; color: var(--text); }\n        .math-input { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-2); }\n        .frac-input { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-2); }\n        .frac-line { width: 104px; height: 3px; border-radius: 2px; background: var(--text); }\n        .pow-input { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xl); }\n        .pow-input sup { font-size: var(--text-sm); color: var(--muted); }\n        .math-input .q-hint { margin: 0; text-align: center; }\n        @media (max-width: 480px) { .q-math { font-size: 1.3em; } }\n    \u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">Mathématiques\u003c/div>\n        <h1>Révisions de Mathématiques pour Aron\u003c/h1>\n    \u003c/header>\n\n    <nav class=\"tabs\" role=\"tablist\">\n        <button type=\"button\" class=\"tab active\" onclick=\"openTab('cours-frac', event)\">Cours Fractions\u003c/button>\n        <button type=\"button\" class=\"tab\" onclick=\"openTab('cours-puiss', event)\">Cours Puissances\u003c/button>\n        <button type=\"button\" class=\"tab\" onclick=\"openTab('quiz', event); preparerQuiz('frac')\">Quiz Fractions\u003c/button>\n        <button type=\"button\" class=\"tab\" onclick=\"openTab('quiz', event); preparerQuiz('puiss')\">Quiz Puissances\u003c/button>\n        <button type=\"button\" class=\"tab\" onclick=\"openTab('quiz', event); preparerQuiz('mix')\">Quiz Mixte\u003c/button>\n    \u003c/nav>\n\n    \u003c!-- Cours Fractions -->\n    <section id=\"cours-frac\" class=\"tab-content active\">\n        <h2>Les Fractions : Ce qu'il faut retenir\u003c/h2>\n        <div class=\"callout retenir\">\n            <p class=\"callout-title\">1. Addition et Soustraction\u003c/p>\n            <p><strong>Règle :\u003c/strong> Il faut toujours réduire au même dénominateur avant d'ajouter ou de soustraire les numérateurs.\u003c/p>\n            <span class=\"formula\">\\(\\frac{3}{4} + \\frac{5}{12} = \\frac{3 \\times 3}{4 \\times 3} + \\frac{5}{12} = \\frac{9}{12} + \\frac{5}{12} = \\frac{14}{12} = \\frac{7}{6}\\)\u003c/span>\n        \u003c/div>\n        <div class=\"callout retenir\">\n            <p class=\"callout-title\">2. Multiplication\u003c/p>\n            <p><strong>Règle :\u003c/strong> On multiplie les numérateurs entre eux et les dénominateurs entre eux (inutile de réduire au même dénominateur).\u003c/p>\n            <span class=\"formula\">\\(\\frac{4}{3} \\times \\frac{5}{7} = \\frac{4 \\times 5}{3 \\times 7} = \\frac{20}{21}\\)\u003c/span>\n        \u003c/div>\n        <div class=\"callout retenir\">\n            <p class=\"callout-title\">3. Division\u003c/p>\n            <p><strong>Règle :\u003c/strong> Diviser par une fraction, c'est multiplier par son inverse.\u003c/p>\n            <span class=\"formula\">\\(\\frac{7}{3} \\div \\frac{2}{5} = \\frac{7}{3} \\times \\frac{5}{2} = \\frac{35}{6}\\)\u003c/span>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Cours Puissances -->\n    <section id=\"cours-puiss\" class=\"tab-content\">\n        <h2>Les Puissances : Ce qu'il faut retenir\u003c/h2>\n        <div class=\"callout retenir\">\n            <p class=\"callout-title\">Règles de calcul de base\u003c/p>\n            <p><strong>Multiplication :\u003c/strong> On additionne les exposants.\u003c/p>\n            <span class=\"formula\">\\(a^m \\times a^n = a^{m+n}\\) &nbsp;&nbsp;&nbsp; (Ex: \\(10^6 \\times 10^4 = 10^{10}\\))\u003c/span>\n\n            <p><strong>Division :\u003c/strong> On soustrait les exposants.\u003c/p>\n            <span class=\"formula\">\\(\\frac{a^m}{a^n} = a^{m-n}\\) &nbsp;&nbsp;&nbsp; (Ex: \\(\\frac{5^8}{5^3} = 5^5\\))\u003c/span>\n\n            <p><strong>Puissance d'une puissance :\u003c/strong> On multiplie les exposants.\u003c/p>\n            <span class=\"formula\">\\((a^m)^n = a^{m \\times n}\\) &nbsp;&nbsp;&nbsp; (Ex: \\((4^3)^2 = 4^6\\))\u003c/span>\n\n            <p><strong>Inverse :\u003c/strong> L'exposant devient négatif.\u003c/p>\n            <span class=\"formula\">\\(a^{-n} = \\frac{1}{a^n}\\) &nbsp;&nbsp;&nbsp; (Ex: \\(2^{-3} = \\frac{1}{2^3}\\))\u003c/span>\n        \u003c/div>\n        <div class=\"callout retenir\">\n            <p class=\"callout-title\">Écriture Scientifique\u003c/p>\n            <p>L'écriture scientifique d'un nombre décimal est de la forme \\(a \\times 10^n\\), où \\(a\\) est un nombre compris entre 1 et 9,999..., et \\(n\\) est un entier relatif.\u003c/p>\n            <span class=\"formula\">\\(12 \\ 300 = 1,23 \\times 10^4\\)\u003c/span>\n            <span class=\"formula\">\\(0,0056 = 5,6 \\times 10^{-3}\\)\u003c/span>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Interface Unique de Quiz -->\n    <section id=\"quiz\" class=\"tab-content\">\n        <h2 id=\"quiz-title\">Quiz\u003c/h2>\n\n        \u003c!-- Écran de démarrage -->\n        <div id=\"quiz-start\" class=\"q-card quiz-intro\">\n            <p class=\"lead\">Ce quiz contient 25 questions générées aléatoirement.\u003c/p>\n            <p class=\"muted\"><em>Rappel : Simplifie toujours les fractions au maximum !\u003c/em>\u003c/p>\n            <div class=\"quiz-actions center\">\n                <button type=\"button\" class=\"btn btn-primary btn-lg\" onclick=\"demarrerQuiz()\">Commencer le Quiz\u003c/button>\n            \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Écran de jeu -->\n        <div id=\"quiz-play\" class=\"quiz\" hidden>\n            <div class=\"quiz-head\" id=\"quiz-head\">\n                <span class=\"quiz-count\">Question 1 / 25\u003c/span>\n                <div class=\"quiz-progress\"><span>\u003c/span>\u003c/div>\n                <span class=\"quiz-score\">\u003c/span>\n            \u003c/div>\n            <article class=\"q-card\" id=\"quiz-card\">\n                <div id=\"question-text\" class=\"q-math\">\u003c/div>\n\n                <form id=\"answer-form\" autocomplete=\"off\" onsubmit=\"event.preventDefault(); validerReponse();\">\n                    <div id=\"input-area\" class=\"math-input\">\n                        \u003c!-- Les inputs seront injectés ici par JS -->\n                    \u003c/div>\n                    <div id=\"feedback\" class=\"feedback\" aria-live=\"polite\">\u003c/div>\n                    <div class=\"quiz-actions center\">\n                        <button type=\"submit\" id=\"btn-valider\" class=\"btn btn-primary btn-lg\">Valider\u003c/button>\n                        <button type=\"button\" id=\"btn-suivant\" class=\"btn btn-primary btn-lg\" onclick=\"questionSuivante()\" hidden>Question Suivante →\u003c/button>\n                    \u003c/div>\n                \u003c/form>\n            \u003c/article>\n        \u003c/div>\n\n        \u003c!-- Écran de fin -->\n        <div id=\"quiz-end\" hidden>\u003c/div>\n    \u003c/section>\n\n\u003c/main>\n\n<script>\n    // --- GESTION DES ONGLETS ---\n    function openTab(tabId, event) {\n        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));\n        document.querySelectorAll('.tabs .tab').forEach(link => {\n            link.classList.remove('active');\n            link.setAttribute('aria-selected', 'false');\n        });\n        document.getElementById(tabId).classList.add('active');\n        if (event) {\n            event.currentTarget.classList.add('active');\n            event.currentTarget.setAttribute('aria-selected', 'true');\n        }\n    }\n\n    // --- OUTILS MATHÉMATIQUES ---\n    function pgcd(a, b) {\n        a = Math.abs(a); b = Math.abs(b);\n        return b === 0 ? a : pgcd(b, a % b);\n    }\n    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;\n\n    // --- MOTEUR DE QUIZ ---\n    const NB_QUESTIONS = 25;\n    let typeQuizActuel = '';\n    let questions = [];\n    let indexCourant = 0;\n    let score = 0;\n\n    const TITRES = {\n        'frac': 'Entraînement : Fractions',\n        'puiss': 'Entraînement : Puissances de 10',\n        'mix': 'Entraînement : Mixte'\n    };\n\n    function preparerQuiz(type) {\n        typeQuizActuel = type;\n        document.getElementById('quiz-title').innerText = TITRES[type];\n        document.getElementById('quiz-start').hidden = false;\n        document.getElementById('quiz-play').hidden = true;\n        document.getElementById('quiz-end').hidden = true;\n        document.getElementById('quiz-end').innerHTML = '';\n    }\n\n    function genererQuestion(type) {\n        let qType = type === 'mix' ? (Math.random() > 0.5 ? 'frac' : 'puiss') : type;\n\n        if (qType === 'frac') {\n            const ops = ['+', '-', '\\\\times', '\\\\div'];\n            const op = ops[rand(0, 3)];\n            const n1 = rand(1, 10), d1 = rand(2, 7);\n            let n2 = rand(1, 10), d2 = rand(2, 7);\n\n            // Pour addition/soustraction, on met souvent le même dénominateur ou un multiple pour que ce soit faisable\n            if (op === '+' || op === '-') {\n                d2 = Math.random() > 0.5 ? d1 : d1 * rand(2,3);\n            }\n\n            let numReel, denReel;\n            if (op === '+') { numReel = n1 * d2 + n2 * d1; denReel = d1 * d2; }\n            else if (op === '-') { numReel = n1 * d2 - n2 * d1; denReel = d1 * d2; }\n            else if (op === '\\\\times') { numReel = n1 * n2; denReel = d1 * d2; }\n            else if (op === '\\\\div') { numReel = n1 * d2; denReel = d1 * n2; }\n\n            const div = pgcd(numReel, denReel);\n            let numSimp = numReel / div;\n            let denSimp = denReel / div;\n\n            if (denSimp < 0) { numSimp = -numSimp; denSimp = -denSimp; }\n            if (denSimp === 1) { denSimp = 1; } // Géré dans l'affichage si besoin\n\n            return {\n                type: 'frac',\n                texte: `\\\\( \\\\frac{${n1}}{${d1}} ${op} \\\\frac{${n2}}{${d2}} = ? \\\\)`,\n                repNum: numSimp.toString(),\n                repDen: denSimp.toString()\n            };\n        } else {\n            const rules = ['mult', 'div', 'pow'];\n            const rule = rules[rand(0, 2)];\n            const e1 = rand(-9, 9), e2 = rand(-7, 7);\n            let ans, texte;\n\n            if (rule === 'mult') {\n                ans = e1 + e2;\n                texte = `\\\\( 10^{${e1}} \\\\times 10^{${e2}} = ? \\\\)`;\n            } else if (rule === 'div') {\n                ans = e1 - e2;\n                texte = `\\\\( \\\\frac{10^{${e1}}}{10^{${e2}}} = ? \\\\)`;\n            } else {\n                ans = e1 * e2;\n                texte = `\\\\( (10^{${e1}})^{${e2}} = ? \\\\)`;\n            }\n\n            return {\n                type: 'puiss',\n                texte: texte,\n                repPow: ans.toString()\n            };\n        }\n    }\n\n    function demarrerQuiz() {\n        questions = [];\n        for (let i = 0; i < NB_QUESTIONS; i++) {\n            questions.push(genererQuestion(typeQuizActuel));\n        }\n        indexCourant = 0;\n        score = 0;\n\n        document.getElementById('quiz-start').hidden = true;\n        document.getElementById('quiz-end').hidden = true;\n        document.getElementById('quiz-end').innerHTML = '';\n        document.getElementById('quiz-play').hidden = false;\n\n        afficherQuestion();\n    }\n\n    function focusPlusTard(id) {\n        setTimeout(() => {\n            const el = document.getElementById(id);\n            if (el && !el.disabled) el.focus({ preventScroll: true });\n        }, 100);\n    }\n\n    function afficherQuestion() {\n        const q = questions[indexCourant];\n        const card = document.getElementById('quiz-card');\n\n        // Mise à jour de l'UI\n        Lecon.setProgress('#quiz-head', indexCourant, NB_QUESTIONS, score);\n        document.getElementById('question-text').innerHTML = q.texte;\n        Lecon.clearFeedback('#feedback');\n        document.getElementById('btn-valider').hidden = false;\n        document.getElementById('btn-suivant').hidden = true;\n\n        const inputArea = document.getElementById('input-area');\n        if (q.type === 'frac') {\n            inputArea.innerHTML = `\n                <div class=\"frac-input\">\n                    <input type=\"number\" id=\"in-num\" class=\"answer-input sm\" placeholder=\"Num\" aria-label=\"Numérateur\">\n                    <div class=\"frac-line\" aria-hidden=\"true\">\u003c/div>\n                    <input type=\"number\" id=\"in-den\" class=\"answer-input sm\" placeholder=\"Dén\" value=\"1\" aria-label=\"Dénominateur\">\n                \u003c/div>\n                <small class=\"q-hint\">(Laisse 1 en bas si c'est un entier)\u003c/small>\n            `;\n            focusPlusTard('in-num');\n        } else {\n            inputArea.innerHTML = `\n                <div class=\"pow-input\">\n                    <span>\\\\( 10 \\\\) <sup>exposant\u003c/sup> \u003c/span>\n                    <input type=\"number\" id=\"in-pow\" class=\"answer-input sm\" placeholder=\"?\" aria-label=\"Exposant\">\n                \u003c/div>\n            `;\n            focusPlusTard('in-pow');\n        }\n\n        // Animation d'entrée de la carte\n        card.classList.remove('is-enter');\n        void card.offsetWidth;\n        card.classList.add('is-enter');\n\n        // Rendu des mathématiques via MathJax\n        Lecon.typeset(card);\n    }\n\n    function validerReponse() {\n        if (!document.getElementById('btn-suivant').hidden) return;\n        const q = questions[indexCourant];\n        let estCorrect = false;\n        let messageCorrection = '';\n\n        if (q.type === 'frac') {\n            const inNum = document.getElementById('in-num');\n            const inDen = document.getElementById('in-den');\n            const valNum = inNum.value.trim();\n            const valDen = inDen.value.trim();\n\n            if (valNum === q.repNum && valDen === q.repDen) {\n                estCorrect = true;\n            } else {\n                messageCorrection = `Faux. La bonne réponse simplifiée était : \\\\( \\\\frac{${q.repNum}}{${q.repDen}} \\\\)`;\n            }\n            Lecon.markInput(inNum, valNum === q.repNum);\n            Lecon.markInput(inDen, valDen === q.repDen);\n            inNum.disabled = true; inDen.disabled = true;\n        } else {\n            const inPow = document.getElementById('in-pow');\n            const valPow = inPow.value.trim();\n\n            if (valPow === q.repPow) {\n                estCorrect = true;\n            } else {\n                messageCorrection = `Faux. La bonne réponse était : \\\\( 10^{${q.repPow}} \\\\)`;\n            }\n            Lecon.markInput(inPow, estCorrect);\n            inPow.disabled = true;\n        }\n\n        if (estCorrect) {\n            score++;\n            Lecon.feedback('#feedback', true, 'Excellent ! C\\'est la bonne réponse. ✅');\n        } else {\n            Lecon.feedback('#feedback', false, `${messageCorrection} ❌`);\n        }\n\n        Lecon.setProgress('#quiz-head', indexCourant + 1, NB_QUESTIONS, score);\n        document.querySelector('#quiz-head .quiz-count').textContent = `Question ${indexCourant + 1} / ${NB_QUESTIONS}`;\n\n        // Bascule des boutons\n        const suivant = document.getElementById('btn-suivant');\n        suivant.textContent = indexCourant + 1 < NB_QUESTIONS ? 'Question Suivante →' : 'Voir mon score →';\n        document.getElementById('btn-valider').hidden = true;\n        suivant.hidden = false;\n        suivant.focus({ preventScroll: true });\n    }\n\n    function questionSuivante() {\n        indexCourant++;\n        if (indexCourant < NB_QUESTIONS) {\n            afficherQuestion();\n        } else {\n            terminerQuiz();\n        }\n    }\n\n    function messageFinal(score) {\n        let message = \"\";\n        if (score === 25) message = \"Incroyable Aron ! Un sans-faute ! 🏆\";\n        else if (score >= 20) message = \"Très bon travail ! Tu maîtrises le sujet. 💪\";\n        else if (score >= 12) message = \"Pas mal, mais tu peux encore t'améliorer. Relis bien le cours ! 📚\";\n        else message = \"Accroche-toi, l'entraînement paie toujours. N'hésite pas à revoir les règles. 🚀\";\n        return message;\n    }\n\n    function terminerQuiz() {\n        document.getElementById('quiz-play').hidden = true;\n        const end = document.getElementById('quiz-end');\n        end.innerHTML = '';\n        const box = Lecon.resultCard(score, NB_QUESTIONS, {\n            resultTitle: 'Quiz Terminé !',\n            message: (s) => messageFinal(s)\n        }, demarrerQuiz);\n        box.querySelector('button').textContent = '↻ Refaire un quiz';\n        end.appendChild(box);\n        end.hidden = false;\n    }\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Français/Autobiographie.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Révisions de Français - L'Autobiographie\u003c/title>\n\u003c!--rev3e:css-->\n\u003c!--rev3e:quiz-->\n<style>\n  .temoignage { font-style: italic; font-size: var(--text-md); line-height: 1.75; }\n  .temoignage mark { font-style: normal; cursor: help; }\n  .card .callout:last-child { margin-bottom: 0; }\n\u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n  <header class=\"lecon-header\">\n    <div class=\"lecon-eyebrow\">Français\u003c/div>\n    <h1>L'Autobiographie : Méthode et Analyse\u003c/h1>\n    <p class=\"lecon-subtitle\">Document d'aide pour les révisions de 3ème\u003c/p>\n  \u003c/header>\n\n  <nav class=\"tabs\" role=\"tablist\">\n    <button type=\"button\" class=\"tab active\" data-tab=\"cours\">L'essentiel\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"explication\">Texte de G. Sand\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"questions34\">Questions 3 &amp; 4\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"questions56\">Questions 5 &amp; 6\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"methode\">Conseils d'écriture\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"exemple\">Exemple par Aron\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"quiz\">Quiz express\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- Onglet 1 : L'essentiel sur l'autobiographie -->\n  <section id=\"cours\" class=\"tab-content active\">\n    <h2>Ce qu'il faut retenir de l'autobiographie\u003c/h2>\n    <div class=\"callout definition\">\n      <p>Le mot <strong>autobiographie\u003c/strong> vient du grec : <em>auto\u003c/em> (soi-même), <em>bio\u003c/em> (la vie) et <em>graphie\u003c/em> (l'écriture). C'est le récit qu'une personne fait de sa propre vie.\u003c/p>\n    \u003c/div>\n    <div class=\"callout retenir\">\n      <ul>\n        <li><strong>La règle d'or (le pacte autobiographique) :\u003c/strong> L'Auteur = Le Narrateur = Le Personnage principal. L'auteur s'engage à être sincère et à dire la vérité sur lui-même.\u003c/li>\n        <li><strong>L'usage du pronom :\u003c/strong> Le texte est majoritairement écrit à la première personne du singulier (\"Je\").\u003c/li>\n        <li><strong>Les enjeux (pourquoi écrire sur soi ?) :\u003c/strong>\n          <ul>\n            <li>Pour laisser une trace de son existence.\u003c/li>\n            <li>Pour se justifier ou témoigner d'une époque.\u003c/li>\n            <li>Pour faire le point sur sa vie et mieux se connaître.\u003c/li>\n          \u003c/ul>\n        \u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    <div class=\"callout attention\">\n      <p><strong>La difficulté :\u003c/strong> La mémoire peut être défaillante (on oublie des choses), ou subjective (on raconte les choses de son propre point de vue).\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Onglet 2 : Explication du texte de George Sand -->\n  <section id=\"explication\" class=\"tab-content\">\n    <h2>Explication de l'extrait de George Sand\u003c/h2>\n    <p>Ce texte est tiré de <em>Histoire de ma vie\u003c/em> (1855). Voici comment comprendre les différents paragraphes :\u003c/p>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">Paragraphes 1 et 2 : Un devoir difficile mais nécessaire\u003c/p>\n      <p>George Sand explique d'emblée qu'il n'y a ni \"orgueil\" ni \"impertinence\" à raconter sa vie. Au contraire, elle considère cela comme un \"devoir, assez pénible même\". C'est difficile car l'étude de soi est complexe (\"plus on s'y absorbe, moins on y voit clair\"). Elle veut faire une \"étude sincère\" de sa propre nature.\u003c/p>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">Paragraphe 3 : Les raisons du retard\u003c/p>\n      <p>L'autrice avoue qu'une \"insurmontable paresse\" l'a poussée à repousser l'écriture de ce livre. Le déclic ? Elle regrette d'avoir laissé d'autres personnes publier des biographies à son sujet, qui sont \"pleines d'erreurs\" (que ce soit pour la critiquer ou la flatter). Rétablir sa propre vérité devient essentiel.\u003c/p>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">Paragraphe 4 : Le but fraternel\u003c/p>\n      <p>Elle conclut en donnant un sens noble à son projet. Raconter son \"cœur\", c'est offrir un \"enseignement fraternel\". En partageant ses propres pensées et sentiments intimes, elle espère que son témoignage servira de \"stimulant\", d'\"encouragement\" et de \"conseil\" à ceux qui la liront pour s'orienter dans le \"labyrinthe de la vie\".\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Onglet 3 : Aide aux questions 3 et 4 -->\n  <section id=\"questions34\" class=\"tab-content\">\n    <h2>Aide pour les questions 3 et 4\u003c/h2>\n\n    <div class=\"card card-accent\">\n      <h3>Question 3 : Quels reproches pourrait-on adresser à quelqu’un qui décide d’écrire son autobiographie selon George Sand ?\u003c/h3>\n      <p>On pourrait reprocher à un autobiographe d’être <strong>narcissique\u003c/strong> (c'est-à-dire d'avoir un amour excessif porté à l'image de soi, de l'orgueil ou de la prétention).\u003c/p>\n      <p>Cependant, ce reproche peut être évacué si l’autobiographe fait le nécessaire pour se raconter tel qu’il est réellement, avec sincérité : en évoquant ses qualités (en bien) mais aussi ses défauts (en mal). L’autobiographie devient alors un outil qui permet à l’auteur de s’étudier lui-même avec honnêteté.\u003c/p>\n    \u003c/div>\n\n    <div class=\"card card-accent\">\n      <h3>Question 4 : Selon George Sand, qu’est-ce qui fait que l’écriture est un « travail pénible » ? Relevez le champ lexical.\u003c/h3>\n      <p>Il peut être difficile, voire pénible, de tenter de se définir. En effet, cet exercice implique un regard analytique sur soi-même, ce qui peut faire ressurgir des images et des souvenirs douloureux. Comme l'écrit l'auteure, c'est un difficile « voyage dans le monde abstrait de l’intelligence ou du sentiment ».\u003c/p>\n      <p>Malgré cette difficulté, ce travail reste, pour George Sand, un véritable « devoir » envers elle-même, afin de regarder, d'étudier sa propre existence et, au final, de mieux se connaître.\u003c/p>\n      <div class=\"callout exemple\">\n        <p><em>Rappel pour le champ lexical de l'effort et de la difficulté : Pense à repérer dans le texte des mots comme « pénible », « malaisé », « fastidieuse » ou « insurmontable ».\u003c/em>\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Onglet 4 : Questions 5 et 6 -->\n  <section id=\"questions56\" class=\"tab-content\">\n    <h2>Questions 5 et 6 : Réponses et explications\u003c/h2>\n    <p>Voici les réponses détaillées aux deux dernières questions du texte de George Sand, avec les explications pour t'aider à formuler tes propres phrases.\u003c/p>\n\n    \u003c!-- Question 5 -->\n    <div class=\"card card-accent\">\n      <h3>Question 5 : Pourquoi doit-elle faire son autobiographie selon elle ? Relevez les arguments qu'elle avance.\u003c/h3>\n      <p><strong>Réponse et explication :\u003c/strong> George Sand considère que l'écriture de son autobiographie est un « devoir ». Elle justifie ce choix en avançant deux arguments principaux dans le texte :\u003c/p>\n      <ol>\n        <li><strong>Rétablir la vérité (Paragraphe 3) :\u003c/strong> Elle a laissé d'autres personnes publier des biographies sur elle qui sont « pleines d'erreurs », aussi bien pour la louer (la complimenter) que pour la blâmer (la critiquer). Elle doit donc prendre la plume pour corriger ces fausses images d'elle-même.\u003c/li>\n        <li><strong>Mieux se connaître (Paragraphe 2) :\u003c/strong> Elle souhaite réaliser une « étude sincère » de sa nature et un « examen attentif » de sa propre existence. C'est une démarche personnelle d'introspection.\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n\n    \u003c!-- Question 6 -->\n    <div class=\"card card-accent\">\n      <h3>Question 6 : Quel est le but final de l'autobiographie selon George Sand ? Qui désigne-t-elle par l'expression « celui qui raconte et celui qui écoute » ? Quel rapport doit-il établir avec son lecteur ?\u003c/h3>\n      <p><strong>Réponse et explication :\u003c/strong>\u003c/p>\n      <ul>\n        <li><strong>Le but final :\u003c/strong> Il s'agit d'offrir un « enseignement fraternel ». L'autrice espère que son récit intime (la « vie de l'âme ») servira de « stimulant », d'« encouragement » et de « conseil » pour aider les autres personnes à s'orienter dans le labyrinthe de la vie. L'écriture intime a donc une utilité collective.\u003c/li>\n        <li><strong>Les personnes désignées :\u003c/strong> L'expression « celui qui raconte » désigne logiquement <strong>l'auteur\u003c/strong> (ici, George Sand elle-même), et « celui qui écoute » désigne <strong>le lecteur\u003c/strong>.\u003c/li>\n        <li><strong>Le rapport avec le lecteur :\u003c/strong> Pour que cette autobiographie soit vraiment utile et atteigne son but, l'auteur et le lecteur doivent nouer une relation saine basée sur un « échange de confiance et de sympathie ». L'auteur se livre avec sincérité, et le lecteur reçoit ce témoignage avec bienveillance.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Onglet 5 : Conseils de méthode -->\n  <section id=\"methode\" class=\"tab-content\">\n    <h2>Comment exprimer ses idées à l'écrit\u003c/h2>\n    <p>Il n'est pas toujours facile de mettre des mots sur ce qu'on pense. Voici quelques astuces simples pour t'aider à structurer tes idées :\u003c/p>\n\n    <div class=\"card\">\n      <ul>\n        <li><strong>Ne commence jamais directement sur ta copie :\u003c/strong> Utilise toujours un brouillon. Jettes-y tes mots-clés, tes idées en vrac, sans faire de phrases. Ensuite seulement, tu tries.\u003c/li>\n        <li><strong>La règle du S.V.C (Sujet + Verbe + Complément) :\u003c/strong> Si tu as du mal à t'exprimer, fais des phrases courtes. Une idée = une phrase. Évite les phrases à rallonge avec trop de \"qui\", \"que\", \"dont\". C'est le meilleur moyen de garder un propos clair.\u003c/li>\n        <li><strong>Pour lire une autobiographie :\u003c/strong> Pose-toi toujours les questions : <em>Que ressent l'auteur ici ? Pourquoi me raconte-t-il ce souvenir en particulier ?\u003c/em> L'autobiographie parle des faits, mais surtout des émotions liées à ces faits.\u003c/li>\n        <li><strong>Pour écrire sur soi :\u003c/strong> Si tu dois rédiger un texte autobiographique, ne te contente pas de raconter une action. Ajoute des sensations (ce que tu as vu, entendu) et tes sentiments (la peur, la joie, la frustration).\u003c/li>\n        <li><strong>L'astuce de la relecture chuchotée :\u003c/strong> Quand tu as fini d'écrire une réponse, relis-la en chuchotant. Si tu butes sur tes propres mots ou que tu n'as plus de souffle avant la fin de la phrase, c'est qu'elle est mal construite. Coupe-la en deux avec un point.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Onglet 6 : L'autobiographie d'Aron -->\n  <section id=\"exemple\" class=\"tab-content\">\n    <h2>Si Aron écrivait son autobiographie...\u003c/h2>\n    <p>Voici un court exemple de texte autobiographique fictif. Regarde comment les éléments de ta propre vie peuvent être transformés en récit en respectant les codes du genre littéraire.\u003c/p>\n\n    <div class=\"callout exemple temoignage\">\n      <p>« <mark title=\"L'auteur, le narrateur et le personnage sont la même personne\">Je m'appelle Aron\u003c/mark> et je suis aujourd'hui en classe de troisième. En regardant en arrière, <mark title=\"Le pacte autobiographique\">je promets de raconter avec la plus grande sincérité\u003c/mark> les moments qui ont marqué mon enfance. J'ai grandi à Bouc-Bel-Air. Notre maison a toujours été animée, rythmée par les éclats de rire de ma petite sœur Sienna, mais aussi par les courses folles de nos deux chattes : Vénus, la tigrée, et Vega, la grise. <mark title=\"Expression des sentiments et émotions\">L'un de mes souvenirs les plus vifs\u003c/mark> reste l'excitation incroyable que j'ai ressentie le jour où la borne d'arcade a fait son apparition dans le salon, ou encore l'émerveillement face aux paysages lors de nos vacances en famille au Brésil... »\u003c/p>\n    \u003c/div>\n\n    <h3>Les marqueurs à repérer dans ce texte :\u003c/h3>\n    <ul>\n      <li><strong>L'utilisation de la première personne :\u003c/strong> Le \"Je\" confirme que l'auteur, le narrateur et le personnage sont une seule et même personne.\u003c/li>\n      <li><strong>Le pacte autobiographique :\u003c/strong> \"Je promets de raconter avec la plus grande sincérité\" montre l'engagement à dire la vérité.\u003c/li>\n      <li><strong>L'ancrage dans le temps :\u003c/strong> On voit la différence entre le présent de l'écriture (\"je suis aujourd'hui en classe de troisième\") et le passé des souvenirs (\"J'ai grandi...\").\u003c/li>\n      <li><strong>L'expression des sentiments :\u003c/strong> On ne liste pas juste des faits, on partage une émotion (\"l'excitation\", \"l'émerveillement\").\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003c!-- Onglet 7 : Quiz express -->\n  <section id=\"quiz\" class=\"tab-content\">\n    <h2>Quiz sur l'autobiographie\u003c/h2>\n    <p class=\"muted\">Teste tes connaissances ! Essaie de répondre à la question dans ta tête avant de cliquer pour déplier la réponse.\u003c/p>\n\n    <details class=\"reveal\">\n      <summary>1. Qu'est-ce que le \"pacte autobiographique\" ?\u003c/summary>\n      <div class=\"reveal-body\">\n        <p>C'est l'engagement que prend l'auteur d'être totalement sincère envers son lecteur. Il s'engage à dire la vérité sur sa vie, en avouant ses qualités comme ses défauts.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    <details class=\"reveal\">\n      <summary>2. Quelle est la règle des \"3 identités\" dans une autobiographie ?\u003c/summary>\n      <div class=\"reveal-body\">\n        <p>Dans ce genre littéraire, <strong>l'Auteur\u003c/strong> (celui qui a écrit le livre) = <strong>le Narrateur\u003c/strong> (celui qui raconte l'histoire) = <strong>le Personnage principal\u003c/strong> (celui qui vit l'histoire).\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    <details class=\"reveal\">\n      <summary>3. À quelle personne l'autobiographie est-elle écrite la plupart du temps ?\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">À la première personne du singulier (\"Je\"), car l'auteur parle de lui-même.\u003c/span>\n      \u003c/div>\n    \u003c/details>\n\n    <details class=\"reveal\">\n      <summary>4. Selon le texte de George Sand, pourquoi n'a-t-elle pas écrit son autobiographie plus tôt ?\u003c/summary>\n      <div class=\"reveal-body\">\n        <p>Elle avoue qu'elle a d'abord fait preuve de \"paresse\", mais aussi que c'est un travail \"pénible\" et \"malaisé\" car il est très difficile de s'analyser et de se définir soi-même.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    <details class=\"reveal\">\n      <summary>5. Quels sont les deux temps principaux utilisés dans une autobiographie ?\u003c/summary>\n      <div class=\"reveal-body\">\n        <p>On trouve le <strong>temps de l'écriture\u003c/strong> (souvent au présent : \"Aujourd'hui je me souviens...\") et le <strong>temps des souvenirs\u003c/strong> (souvent à l'imparfait, au passé simple ou au passé composé : \"J'avais dix ans, nous habitions...\").\u003c/p>\n      \u003c/div>\n    \u003c/details>\n  \u003c/section>\n\n\u003c/main>\n\u003c/body>\n\u003c/html>\n","Anglais/Preterit.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Masterclass : Le Prétérit (Simple Past)\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n    <style>\n        /* Exercices de traduction : phrase + indice dans le résumé dépliable */\n        .reveal > summary .ex { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n        .reveal > summary .ex-hint { font-weight: 400; font-style: italic; font-size: var(--text-sm); color: var(--muted); }\n        .reveal > summary .ex-toggle { flex: none; font-size: var(--text-xs); font-weight: 600; color: var(--primary); }\n        @media (max-width: 480px) { .reveal > summary .ex-toggle { display: none; } }\n        .reveal .solution { font-size: var(--text-md); }\n        /* Fiche de révision : les trois formes */\n        .forms .card { text-align: center; }\n        .form-sign { display: grid; place-items: center; width: 40px; height: 40px; margin: 0 auto var(--space-2); border-radius: 50%; font-size: var(--text-2xl); font-weight: 800; line-height: 1; }\n        .form-sign.plus { background: var(--success-soft); color: var(--success); }\n        .form-sign.minus { background: var(--danger-soft); color: var(--danger); }\n        .form-sign.question { background: var(--info-soft); color: var(--info); }\n    \u003c/style>\n\u003c/head>\n<body>\n\n<main class=\"lecon\">\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">Anglais\u003c/div>\n        <h1>🇬🇧 Objectif 3ème : Maîtriser le Prétérit\u003c/h1>\n        <p class=\"lecon-subtitle\">Le temps du passé révolu\u003c/p>\n    \u003c/header>\n\n    <nav class=\"tabs\" role=\"tablist\">\n        <button class=\"tab active\" data-tab=\"cours\">📚 Cours & Fiche\u003c/button>\n        <button class=\"tab\" data-tab=\"exercices\">🏋️ Exercices (20 Phrases)\u003c/button>\n        <button class=\"tab\" data-tab=\"quiz\">🎯 Méga QCM (25 Q)\u003c/button>\n    \u003c/nav>\n\n    \u003c!-- ONGLET 1 : COURS ET FICHE -->\n    <section id=\"cours\" class=\"tab-content active\">\n        <h2>Le Cours Précis\u003c/h2>\n        <p class=\"lead\">Le prétérit (ou simple past) est un temps du passé <strong>sans aucun lien avec le présent\u003c/strong>. Il décrit une action dans un <strong>passé révolu\u003c/strong>, c'est-à-dire clairement définie dans le passé.\u003c/p>\n\n        <div class=\"callout attention\">\n            <p class=\"callout-title\">L'Astuce de survie (Très important) :\u003c/p>\n            <p>En français, on veut souvent comparer avec notre passé composé ou notre imparfait. C'est incorrect ! La seule question à te poser pour le différencier du Present Perfect est : <i>Y'a-t-il un marqueur de temps, est-ce une action révolue clairement définie dans le passé ?\u003c/i> Si oui ➡️ Prétérit.\u003c/p>\n            <p>S'il y a le mot <strong>AGO\u003c/strong> dans la phrase, tu es certain à 100% de devoir utiliser le prétérit.\u003c/p>\n        \u003c/div>\n\n        <div class=\"callout definition\">\n            <h3>Les Mots Déclencheurs (Indicateurs de temps)\u003c/h3>\n            <ul>\n                <li><strong>yesterday\u003c/strong> (hier)\u003c/li>\n                <li><strong>last\u003c/strong> week / month / year (la semaine dernière, le mois dernier...)\u003c/li>\n                <li>two years <strong>ago\u003c/strong> / one week <strong>ago\u003c/strong> (il y a deux ans / il y a une semaine)\u003c/li>\n                <li><strong>on Wednesday...\u003c/strong> (mercredi dernier...)\u003c/li>\n                <li>Des paraphrases comme : <strong>When I was little...\u003c/strong> (Quand j'étais petit...)\u003c/li>\n            \u003c/ul>\n        \u003c/div>\n\n        <div class=\"callout retenir forms\">\n            <h3 class=\"text-center\">📝 Fiche de Révision Synthétique : La Formation\u003c/h3>\n            <div class=\"grid-3\">\n                <div class=\"card card-accent\">\n                    <span class=\"form-sign plus\" aria-hidden=\"true\">+\u003c/span>\n                    <h3>Forme Affirmative\u003c/h3>\n                    <p>Sujet + <strong>Verbe au prétérit\u003c/strong>\u003c/p>\n                    <p><i>Régulier :\u003c/i> Base Verbale + <strong>-ed\u003c/strong><br><i>Irrégulier :\u003c/i> 2ème colonne de la liste !\u003c/p>\n                \u003c/div>\n                <div class=\"card card-accent\">\n                    <span class=\"form-sign minus\" aria-hidden=\"true\">-\u003c/span>\n                    <h3>Forme Négative\u003c/h3>\n                    <p>Sujet + <strong>DIDN'T\u003c/strong> + <strong>Base Verbale\u003c/strong>\u003c/p>\n                    <p>(L'auxiliaire DID porte la marque du passé, le verbe ne change pas !)\u003c/p>\n                \u003c/div>\n                <div class=\"card card-accent\">\n                    <span class=\"form-sign question\" aria-hidden=\"true\">?\u003c/span>\n                    <h3>Forme Interrogative\u003c/h3>\n                    <p><strong>DID\u003c/strong> + Sujet + <strong>Base Verbale\u003c/strong> ?\u003c/p>\n                    <p>(Même règle : DID fait tout le travail, le verbe reste à l'infinitif).\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            <p class=\"text-center\"><em>Remarque : L'auxiliaire (DID/DIDN'T) est le même à <strong>toutes les personnes\u003c/strong> (I, you, he, she, we, they).\u003c/em>\u003c/p>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ONGLET 2 : EXERCICES DÉROULANTS -->\n    <section id=\"exercices\" class=\"tab-content\">\n        <h2>Traduis ces 20 phrases (Entraînement)\u003c/h2>\n        <p>Pense à voix haute, puis vérifie la réponse. Fais très attention à la
