'), function (c) { c.classList.remove('is-answered'); });\n            [].forEach.call(form.querySelectorAll('.choice'), function (l) {\n                l.classList.remove('is-correct', 'is-wrong', 'is-selected');\n                l.removeAttribute('aria-disabled');\n                l.disabled = false;\n            });\n            [].forEach.call(form.querySelectorAll('.choice input'), function (r) { r.disabled = false; });\n            [].forEach.call(form.querySelectorAll('.feedback'), function (f) { Lecon.clearFeedback(f); });\n            result.innerHTML = '';\n            submit.parentNode.hidden = false;\n            update();\n            form.scrollIntoView({ behavior: 'smooth', block: 'start' });\n        }\n\n        form.addEventListener('change', update);\n        submit.addEventListener('click', checkQuiz);\n        update();\n    })();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n","Histoire/1ère Guerre Mondiale.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Révisions 3ème : La Première Guerre mondiale\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n    <style>\n        /* Encadrés des alliances : couleur de chaque camp + pays en pastilles */\n        .alliance { border-top: 3px solid var(--info); }\n        .alliance.centraux { border-top-color: var(--danger); }\n        .alliance h3 { text-align: center; }\n        .alliance ul { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--space-2); }\n        .alliance li {\n            margin: 0; padding: var(--space-2) var(--space-3); text-align: center; font-weight: 650;\n            background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);\n        }\n    \u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">Histoire\u003c/div>\n        <h1>La Première Guerre mondiale (1914-1918)\u003c/h1>\n        <p class=\"lecon-subtitle\">Site de révisions spécial 3ème : Cours, Synthèses et Entraînements\u003c/p>\n    \u003c/header>\n\n    <nav class=\"tabs\" role=\"tablist\">\n        <button type=\"button\" class=\"tab active\" data-tab=\"synthese\">Synthèse du Cours\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"essentiel\">L'Essentiel &amp; Vocabulaire\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"chronologie\">Frise Chronologique\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"acteurs\">Pays &amp; Acteurs\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"bilan\">Le Bilan de la Guerre\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"quiz-flash\">Quiz Flash\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"grand-qcm\">Grand QCM (50 Q)\u003c/button>\n    \u003c/nav>\n\n    \u003c!-- SECTION 1 : SYNTHESE -->\n    <section id=\"synthese\" class=\"tab-content active\">\n        <h2>L'histoire de la Grande Guerre en bref\u003c/h2>\n        <p><strong>L'étincelle et l'engrenage :\u003c/strong> Au début du XXe siècle, l'Europe est sous tension. Les pays se font concurrence pour les colonies et l'industrie. Deux grands camps se sont formés : la Triple Entente et la Triple Alliance. L'étincelle survient le 28 juin 1914 avec l'assassinat de l'archiduc François-Ferdinand à Sarajevo. Par le jeu des alliances, presque toute l'Europe bascule dans la guerre en août 1914. Tout le monde pense que la guerre sera courte.\u003c/p>\n\n        <p><strong>De la guerre de mouvement à l'enfer des tranchées :\u003c/strong> Au début (1914), c'est une guerre de mouvement, les armées avancent rapidement. Mais très vite, les offensives échouent. Dès 1915, les armées s'enterrent face à face sur des centaines de kilomètres : c'est le début de la longue <em>guerre de position\u003c/em> (ou guerre de tranchées). Les soldats, appelés les \"Poilus\" en France, vivent un véritable enfer. Ils souffrent de la boue, du froid, des rats, et surtout d'une violence de masse inédite. De nouvelles armes industrielles terrifiantes font leur apparition : gaz asphyxiants, lance-flammes, mitrailleuses et obus à l'infini (comme lors de la terrible bataille de Verdun ou de la Somme en 1916).\u003c/p>\n\n        <p><strong>Une guerre totale qui n'épargne personne :\u003c/strong> Ce conflit n'implique pas que les soldats au front. C'est une guerre \"totale\". À l'arrière, les femmes (les \"munitionnettes\") remplacent les hommes dans les usines ou les champs. Les États utilisent la censure pour cacher la vérité et font du \"bourrage de crâne\" (propagande) pour maintenir le moral. Toute l'économie est tournée vers la production d'armes. Les civils subissent aussi les bombardements, les pénuries et même le premier génocide du XXe siècle : celui des Arméniens par l'Empire ottoman en 1915.\u003c/p>\n\n        <p><strong>1917, le grand tournant, et la fin du conflit :\u003c/strong> L'année 1917 change tout. Les soldats, épuisés par des attaques inutiles, se révoltent (les mutineries). En Russie, une Révolution éclate et le pays finit par quitter la guerre. En revanche, les États-Unis entrent en guerre aux côtés de l'Entente, apportant des hommes et du matériel frais. En 1918, la guerre de mouvement reprend. L'Allemagne, épuisée, finit par reculer et signe l'Armistice le 11 novembre 1918.\u003c/p>\n\n        <div class=\"callout retenir\">\n            <p><strong>Un bilan catastrophique :\u003c/strong> La guerre a fait environ 10 millions de morts et 20 millions de blessés (dont les fameuses \"gueules cassées\"). L'Europe est ruinée. Le Traité de Versailles en 1919 punit durement l'Allemagne, la déclarant seule responsable. La carte de l'Europe est redessinée et la SDN (Société des Nations) est créée pour tenter de maintenir la paix, mais les rancœurs restent fortes.\u003c/p>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- SECTION 2 : L'ESSENTIEL -->\n    <section id=\"essentiel\" class=\"tab-content\">\n        <h2>Les notions à retenir absolument\u003c/h2>\n        <div class=\"grid-2\">\n            <div class=\"card card-accent\">\n                <h3>Violence de masse\u003c/h3>\n                <p>Violences extrêmes exercées à grande échelle, visant à détruire le plus grand nombre d'ennemis possible (soldats et civils).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Guerre totale\u003c/h3>\n                <p>Mobilisation de toutes les ressources d'un pays (humaines, économiques, financières, psychologiques) dans le but de vaincre.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Tranchée &amp; Front\u003c/h3>\n                <p><strong>Tranchée :\u003c/strong> Fossé creusé dans le sol, protégé par des barbelés, où vivent et combattent les soldats.<br><strong>Front :\u003c/strong> Zone où les armées s'affrontent.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Guerre de position\u003c/h3>\n                <p>Phase défensive de la guerre (1915-1917) où les troupes se terrent dans des tranchées et tentent de conserver leurs positions sans avancer.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Poilu &amp; Gueules cassées\u003c/h3>\n                <p><strong>Poilu :\u003c/strong> Surnom affectueux donné aux soldats français.<br><strong>Gueules cassées :\u003c/strong> Surnom donné aux soldats survivants gravement mutilés au visage.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Mutinerie\u003c/h3>\n                <p>Révolte des soldats contre l'autorité militaire, refusant de monter à l'assaut (particulièrement nombreuses en 1917).\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Censure &amp; Propagande\u003c/h3>\n                <p><strong>Censure :\u003c/strong> Interdiction de publier certaines informations (lettres, journaux).<br><strong>Propagande :\u003c/strong> \"Bourrage de crâne\" pour convaincre la population que la guerre se passe bien.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Génocide\u003c/h3>\n                <p>Extermination volontaire et programmée de tout un peuple (Ex: Le génocide des Arméniens en 1915).\u003c/p>\n            \u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- SECTION 3 : FRISE CHRONOLOGIQUE -->\n    <section id=\"chronologie\" class=\"tab-content\">\n        <h2>Dates clés et grandes phases\u003c/h2>\n        <ol class=\"timeline\">\n            <li class=\"timeline-item\">\n                <span class=\"timeline-date\">28 Juin 1914\u003c/span>\n                <p><strong>Attentat de Sarajevo.\u003c/strong> L'archiduc d'Autriche est assassiné. C'est l'étincelle qui déclenche la guerre par le jeu des alliances.\u003c/p>\n            \u003c/li>\n            <li class=\"timeline-item\">\n                <span class=\"timeline-date\">Août - Décembre 1914\u003c/span>\n                <p><strong>Guerre de mouvement.\u003c/strong> Les armées sont mobiles et avancent rapidement, mais les fronts finissent par se bloquer.\u003c/p>\n            \u003c/li>\n            <li class=\"timeline-item\">\n                <span class=\"timeline-date\">1915\u003c/span>\n                <p><strong>Début de la guerre de position.\u003c/strong> Les armées s'enterrent. <br><br><em>Génocide arménien par l'Empire Ottoman (1,2 à 1,5 million de morts).\u003c/em>\u003c/p>\n            \u003c/li>\n            <li class=\"timeline-item\">\n                <span class=\"timeline-date\">1916\u003c/span>\n                <p><strong>Guerre d'usure totale.\u003c/strong> Batailles titanesques de <strong>Verdun\u003c/strong> (février-décembre) et de la <strong>Somme\u003c/strong> (juillet-novembre). Des centaines de milliers de morts pour des gains de territoire minuscules.\u003c/p>\n            \u003c/li>\n            <li class=\"timeline-item\">\n                <span class=\"timeline-date\">1917\u003c/span>\n                <p><strong>L'année charnière.\u003c/strong> <br>- Entrée en guerre des États-Unis.<br>- Révolutions en Russie qui quitte le conflit.<br>- Mutineries dans les tranchées (ras-le-bol des soldats).\u003c/p>\n            \u003c/li>\n            <li class=\"timeline-item\">\n                <span class=\"timeline-date\">11 Novembre 1918\u003c/span>\n                <p><strong>L'Armistice.\u003c/strong> Fin des combats. L'Allemagne, épuisée par la reprise de la guerre de mouvement et l'arrivée des Américains, se rend.\u003c/p>\n            \u003c/li>\n            <li class=\"timeline-item\">\n                <span class=\"timeline-date\">28 Juin 1919\u003c/span>\n                <p><strong>Le Traité de Versailles.\u003c/strong> Traité de paix qui rend l'Allemagne seule responsable et la condamne à de lourdes réparations. Création de la SDN.\u003c/p>\n            \u003c/li>\n        \u003c/ol>\n    \u003c/section>\n\n    \u003c!-- SECTION 4 : ACTEURS ET PAYS -->\n    <section id=\"acteurs\" class=\"tab-content\">\n        <h2>Les Alliances et les Hommes\u003c/h2>\n\n        <div class=\"grid-2\">\n            <div class=\"card alliance\">\n                <h3>L'Entente (et ses alliés)\u003c/h3>\n                <ul>\n                    <li>🇫🇷 France (et ses colonies)\u003c/li>\n                    <li>🇬🇧 Royaume-Uni (et ses colonies)\u003c/li>\n                    <li>🇷🇺 Empire Russe (jusqu'en 1917)\u003c/li>\n                    <li>🇮🇹 Italie (à partir de 1915)\u003c/li>\n                    <li>🇺🇸 États-Unis (à partir de 1917)\u003c/li>\n                \u003c/ul>\n            \u003c/div>\n            <div class=\"card alliance centraux\">\n                <h3>Les Empires Centraux\u003c/h3>\n                <ul>\n                    <li>🇩🇪 Empire Allemand\u003c/li>\n                    <li>🇦🇹🇭🇺 Empire d'Autriche-Hongrie\u003c/li>\n                    <li>🇹🇷 Empire Ottoman\u003c/li>\n                    <li>🇧🇬 Bulgarie\u003c/li>\n                \u003c/ul>\n            \u003c/div>\n        \u003c/div>\n\n        <h2>Les personnages et éléments de culture\u003c/h2>\n        <div class=\"grid-2\">\n            <div class=\"card card-accent\">\n                <h3>Georges Clemenceau\u003c/h3>\n                <p>Surnommé \"Le Tigre\", il est le chef du gouvernement français à la fin de la guerre et négocie le traité de Versailles.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Général Pétain\u003c/h3>\n                <p>Général français devenu célèbre pour avoir dirigé la défense lors de la sanglante bataille de Verdun en 1916.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Woodrow Wilson\u003c/h3>\n                <p>Président des États-Unis. Il décide l'entrée en guerre de son pays en 1917 et propose la création de la SDN après la guerre.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Otto Dix\u003c/h3>\n                <p>Peintre allemand, ancien soldat. Son tableau <em>Les joueurs de skat (1920)\u003c/em> montre trois \"gueules cassées\" mutilées pour dénoncer l'absurdité et l'horreur de la guerre.\u003c/p>\n            \u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- SECTION 5 : LE BILAN DE LA GUERRE -->\n    <section id=\"bilan\" class=\"tab-content\">\n        <h2>Le Bilan de la Guerre : Conséquences et Bouleversements\u003c/h2>\n        <div class=\"grid-2\">\n            <div class=\"card card-accent\">\n                <h3>Un bilan humain dramatique\u003c/h3>\n                <p>La guerre a fait environ <strong>10 millions de morts parmi les soldats\u003c/strong> et 6 millions de blessés mutilés, dont les fameuses <em>Gueules cassées\u003c/em>. Il faut ajouter à cela les nombreuses victimes civiles (bombardements, pénuries) et les victimes du génocide arménien. Le traumatisme psychologique est immense pour les survivants.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Des sociétés bouleversées\u003c/h3>\n                <p>Les civils de l'arrière ont énormément souffert. L'économie est détruite. La mobilisation totale a cependant mis en lumière le rôle crucial des femmes dans l'effort de guerre. L'épuisement général et la colère ont aussi conduit à des vagues de <strong>révolutions\u003c/strong> en Europe, notamment la Révolution russe en 1917 et la Révolution allemande en novembre 1918.\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Le Traité de Versailles (1919)\u003c/h3>\n                <p>Signé le 28 juin 1919, il organise la paix mais <strong>affaiblit sévèrement l'Allemagne\u003c/strong>. Jugée seule responsable, l'Allemagne subit de lourdes pertes territoriales (l'Alsace-Lorraine redevient française), son armée est démilitarisée, et elle doit payer de colossales réparations. Les Allemands le perçoivent comme un véritable \"Diktat\".\u003c/p>\n            \u003c/div>\n            <div class=\"card card-accent\">\n                <h3>Une nouvelle carte de l'Europe\u003c/h3>\n                <p>C'est la fin des grands empires (Allemand, Austro-Hongrois, Russe et Ottoman). Les traités de paix (1919-1920) dessinent une nouvelle carte politique avec la <strong>création de nouveaux États\u003c/strong> en Europe centrale et orientale (comme la Pologne ou la Tchécoslovaquie). La Société des Nations (SDN) est également créée pour tenter de préserver la paix à l'avenir.\u003c/p>\n            \u003c/div>\n        \u003c/div>\n    \u003c/section>\n\n    \u003c!-- SECTION 6 : QUIZ FLASH -->\n    <section id=\"quiz-flash\" class=\"tab-content\">\n        <h2>Quiz Flash : Clique pour révéler la réponse\u003c/h2>\n        <p class=\"muted\">Lis la question, essaie de répondre dans ta tête, puis clique sur la flèche pour vérifier !\u003c/p>\n\n        <details class=\"reveal\">\n            <summary>Quel est le surnom donné aux soldats français pendant la Première Guerre mondiale ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\">Les <strong>Poilus\u003c/strong>.\u003c/p>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary>Quel événement a été l'étincelle qui a déclenché la guerre et quand a-t-il eu lieu ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\"><strong>L'attentat de Sarajevo\u003c/strong>, le 28 juin 1914.\u003c/p>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary>Quelles sont les 3 grandes phases de la guerre ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\">1. Guerre de <strong>mouvement\u003c/strong> (1914) <br>2. Guerre de <strong>position / tranchées\u003c/strong> (1915-1917) <br>3. Retour de la guerre de <strong>mouvement\u003c/strong> (1918).\u003c/p>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary>Que s'est-il passé lors du génocide arménien ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\">En 1915, l'Empire ottoman a exterminé de façon programmée la population arménienne, faisant plus d'un million de morts.\u003c/p>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary>Pourquoi dit-on que c'est une \"Guerre Totale\" ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\">Car elle mobilise <strong>toutes les ressources\u003c/strong> du pays : les militaires au front, mais aussi les civils à l'arrière (usines, femmes), l'économie, et même les esprits (propagande, censure).\u003c/p>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary>Quels sont les deux grands événements de l'année 1917 ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\">L'entrée en guerre des <strong>États-Unis\u003c/strong> et la <strong>Révolution russe\u003c/strong> (la Russie quittera ensuite la guerre).\u003c/p>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary>Que montre le tableau \"Les joueurs de skat\" d'Otto Dix ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\">Il montre trois anciens combattants atrocement mutilés (les <strong>gueules cassées\u003c/strong>) jouant aux cartes. Il dénonce l'horreur et la violence de masse de la guerre.\u003c/p>\u003c/div>\n        \u003c/details>\n        <details class=\"reveal\">\n            <summary>Quelle est la date exacte de l'Armistice ?\u003c/summary>\n            <div class=\"reveal-body\"><p class=\"solution\">Le <strong>11 novembre 1918\u003c/strong>.\u003c/p>\u003c/div>\n        \u003c/details>\n    \u003c/section>\n\n    \u003c!-- SECTION 7 : GRAND QCM -->\n    <section id=\"grand-qcm\" class=\"tab-content\">\n        <h2>Le Grand QCM de Révision (50 questions)\u003c/h2>\n        <p class=\"muted\">Teste tes connaissances sur tout le chapitre. Clique sur une réponse, tu sauras immédiatement si tu as juste ou faux !\u003c/p>\n\n        <div id=\"qcm-container\">\u003c/div>\n    \u003c/section>\n\n\u003c/main>\n\n<script>\n    // Base de données des 50 questions\n    const questionsData = [\n        // Causes et débuts\n        { q: \"Où a lieu l'attentat qui déclenche la Première Guerre mondiale ?\", options: [\"Paris\", \"Berlin\", \"Sarajevo\", \"Vienne\"], correct: 2, feedback: \"L'archiduc François-Ferdinand est assassiné à Sarajevo, en Bosnie.\" },\n        { q: \"Quelle est la date précise de cet attentat ?\", options: [\"28 juin 1914\", \"1er août 1914\", \"11 novembre 1918\", \"28 juin 1919\"], correct: 0, feedback: \"C'est l'étincelle qui va faire exploser l'Europe un mois plus tard.\" },\n        { q: \"Quels pays composent la Triple Entente au début de la guerre ?\", options: [\"France, Royaume-Uni, Russie\", \"Allemagne, Autriche, Italie\", \"France, USA, Royaume-Uni\", \"Allemagne, Russie, Ottoman\"], correct: 0, feedback: \"La France, le Royaume-Uni et l'Empire Russe s'étaient alliés avant la guerre.\" },\n        { q: \"Quels pays composent l'alliance des Empires centraux en 1914 ?\", options: [\"France et Angleterre\", \"Allemagne et Autriche-Hongrie\", \"États-Unis et Russie\", \"Italie et Japon\"], correct: 1, feedback: \"Rejoints ensuite par l'Empire ottoman et la Bulgarie.\" },\n        { q: \"Quel pays rejoint l'Entente en 1915 en trahissant son alliance d'avant-guerre ?\", options: [\"La Bulgarie\", \"L'Espagne\", \"L'Italie\", \"La Belgique\"], correct: 2, feedback: \"L'Italie rejoint l'Entente avec la promesse de récupérer des territoires.\" },\n        { q: \"En quel mois de quelle année la guerre éclate-t-elle partout en Europe ?\", options: [\"Janvier 1914\", \"Août 1914\", \"Octobre 1914\", \"Juin 1915\"], correct: 1, feedback: \"Fin juillet / début août 1914, le jeu des alliances entraîne tout le continent en guerre.\" },\n        \n        // Les phases\n        { q: \"Comment s'appelle la première phase de la guerre (août-déc 1914) ?\", options: [\"Guerre de position\", \"Guerre de mouvement\", \"Guerre éclair\", \"Guerre totale\"], correct: 1, feedback: \"Les armées sont très mobiles et avancent, mais finissent par se bloquer mutuellement.\" },\n        { q: \"Que se passe-t-il lors d'une guerre de position ?\", options: [\"Les soldats voyagent d'un pays à l'autre\", \"La guerre ne se passe que sur la mer\", \"Les soldats s'enterrent dans des tranchées et le front ne bouge presque plus\", \"On utilise uniquement des avions\"], correct: 2, feedback: \"C'est la guerre des tranchées, longue, boueuse et meurtrière.\" },\n        { q: \"Combien de temps dure la guerre de position environ ?\", options: [\"Quelques semaines\", \"De 1914 à 1915\", \"De fin 1914 à début 1918\", \"Uniquement l'année 1916\"], correct: 2, feedback: \"Elle représente la plus grande partie de la guerre, de fin 1914 jusqu'aux offensives de 1918.\" },\n        { q: \"Que se passe-t-il au printemps 1918 ?\", options: [\"Le retour de la guerre de mouvement\", \"Le début de la guerre de position\", \"Le Traité de Versailles\", \"L'entrée en guerre des Russes\"], correct: 0, feedback: \"Avec l'arrivée des chars et des Américains, le front se débloque enfin.\" },\n        \n        // Tranchées et violence de masse\n        { q: \"Quel surnom donne-t-on aux soldats français de 14-18 ?\", options: [\"Les G.I.\", \"Les Poilus\", \"Les Grognards\", \"Les Biffins\"], correct: 1, feedback: \"Surnom affectueux désignant leur courage (le poil = la virilité, le courage), bien qu'ils ne pouvaient souvent pas se raser au front.\" },\n        { q: \"Qu'est-ce qu'une tranchée ?\", options: [\"Une arme redoutable\", \"Un fossé où les soldats vivent et combattent\", \"Un hôpital de campagne\", \"Un traité de paix\"], correct: 1, feedback: \"Protégée par des barbelés, c'est le lieu de vie principal des soldats.\" },\n        { q: \"Comment appelle-t-on la zone située entre deux tranchées ennemies ?\", options: [\"La zone franche\", \"Le no man's land\", \"Le secteur mort\", \"Le paradis\"], correct: 1, feedback: \"C'est la zone la plus mortelle, sans aucune protection.\" },\n        { q: \"De quoi les soldats souffrent-ils dans les tranchées ?\", options: [\"Le froid, la boue, les rats\", \"Le manque de vacances\", \"La mauvaise connexion\", \"La chaleur extrême\"], correct: 0, feedback: \"Les conditions de vie matérielles y étaient épouvantables.\" },\n        { q: \"Qu'est-ce qu'une mutinerie ?\", options: [\"Une fête militaire\", \"La révolte des soldats qui refusent d'attaquer\", \"Une nouvelle arme\", \"Un grade militaire\"], correct: 1, feedback: \"Lassés des offensives inutiles, de nombreux soldats se mutinent, surtout en 1917.\" },\n        { q: \"Quelle arme n'a PAS été utilisée pendant la Première Guerre mondiale ?\", options: [\"Les gaz asphyxiants\", \"Les lance-flammes\", \"Les chars d'assaut\", \"La bombe atomique\"], correct: 3, feedback: \"La bombe atomique n'apparaîtra qu'à la fin de la Seconde Guerre mondiale (1945).\" },\n        { q: \"Qu'est-ce que l'artillerie ?\", options: [\"Les avions de chasse\", \"Les canons qui tirent des obus\", \"Les sous-marins\", \"Les fusils à baïonnette\"], correct: 1, feedback: \"L'artillerie a causé environ 75% des blessures de la guerre.\" },\n        { q: \"La violence des combats de 14-18 est qualifiée de...\", options: [\"Violence de masse\", \"Guerre courtoise\", \"Affrontement ciblé\", \"Guerre propre\"], correct: 0, feedback: \"La violence est exercée à une échelle industrielle pour tuer massivement.\" },\n        { q: \"Comment appelle-t-on les soldats survivants gravement défigurés ?\", options: [\"Les miraculés\", \"Les gueules cassées\", \"Les immortels\", \"Les balafrés\"], correct: 1, feedback: \"Ces blessures au visage étaient causées par les éclats d'obus.\" },\n        { q: \"Qui sont les 'marraines de guerre' ?\", options: [\"Des infirmières\", \"Des femmes qui écrivent aux soldats pour les soutenir moralement\", \"Les mères des soldats\", \"Des femmes qui fabriquent des armes\"], correct: 1, feedback: \"Elles permettaient aux soldats de garder un lien affectif et psychologique avec l'arrière.\" },\n        \n        // Batailles\n        { q: \"Quand a eu lieu la célèbre bataille de Verdun ?\", options: [\"1914\", \"1915\", \"1916\", \"1917\"], correct: 2, feedback: \"De février à décembre 1916, elle a fait plus de 700 000 victimes (morts et blessés).\" },\n        { q: \"Quel général français s'est illustré pour la défense de Verdun ?\", options: [\"Charles de Gaulle\", \"Philippe Pétain\", \"Ferdinand Foch\", \"Napoléon\"], correct: 1, feedback: \"Le Général Pétain a organisé la logistique de la bataille via la 'Voie Sacrée'.\" },\n        { q: \"Quelle autre bataille gigantesque a lieu en 1916 avec les Britanniques ?\", options: [\"La bataille de la Somme\", \"La bataille de la Marne\", \"La bataille d'Austerlitz\", \"La bataille de Normandie\"], correct: 0, feedback: \"La bataille de la Somme, encore plus meurtrière que Verdun avec 1,2 million de victimes.\" },\n        { q: \"Vrai ou Faux : À Verdun, le front a reculé de 50 kilomètres.\", options: [\"Vrai\", \"Faux\"], correct: 1, feedback: \"Faux : Malgré la violence incroyable et les morts, le front n'a presque pas bougé.\" },\n        { q: \"Où se battent les soldats ?\", options: [\"Uniquement sur terre\", \"Uniquement sur mer\", \"Sur terre, sur mer, et pour la première fois dans les airs\", \"Uniquement dans les airs\"], correct: 2, feedback: \"C'est une guerre totale : tranchées, sous-marins et les premiers combats aériens.\" },\n\n        // Guerre totale et Arrière\n        { q: \"Qu'est-ce que l'Arrière ?\", options: [\"Le dos du front\", \"La zone hors des combats où vivent les civils\", \"La retraite des troupes\", \"Un hôpital\"], correct: 1, feedback: \"L'Arrière participe aussi à l'effort de guerre.\" },\n        { q: \"Comment appelle-t-on les femmes qui fabriquent des obus dans les usines ?\", options: [\"Les obusettes\", \"Les canonnières\", \"Les munitionnettes\", \"Les usinières\"], correct: 2, feedback: \"Elles ont remplacé les hommes partis au front dans les usines d'armement.\" },\n        { q: \"Qu'est-ce que la guerre totale ?\", options: [\"Une guerre où tout le monde meurt\", \"La mobilisation de toutes les ressources (humaines, économiques...) pour gagner\", \"Une guerre sur tous les continents\", \"Une guerre sans règles\"], correct: 1, feedback: \"Tout le pays (civils, industriels, gouvernement) est tourné vers un seul but : la victoire.\" },\n        { q: \"Pour maintenir le moral à l'arrière, l'État interdit les mauvaises nouvelles. C'est :\", options: [\"La propagande\", \"La censure\", \"Le pacifisme\", \"L'armistice\"], correct: 1, feedback: \"La censure contrôlait les journaux et les lettres des soldats (Anastasie).\" },\n        { q: \"Pour convaincre les civils que la guerre se passe bien, on utilise...\", options: [\"La vérité\", \"Le bourrage de crâne (propagande)\", \"Des photos de blessés\", \"Des sondages\"], correct: 1, feedback: \"La propagande glorifiait l'armée et diabolisait l'ennemi.\" },\n        { q: \"Les civils de l'arrière subissent aussi...\", options: [\"Le froid dans les tranchées\", \"Les pénuries, l'inflation et les bombardements\", \"Rien, la vie est normale\", \"Les mutineries\"], correct: 1, feedback: \"La nourriture est rationnée, tout coûte cher, et certaines villes sont bombardées.\" },\n        { q: \"Quelles troupes l'Empire français fait-il venir pour combattre en Europe ?\", options: [\"Des mercenaires suisses\", \"Des troupes coloniales (ex: Tirailleurs sénégalais)\", \"L'armée chinoise\", \"Des robots industriels\"], correct: 1, feedback: \"L'Empire colonial a fourni des centaines de milliers de soldats et de travailleurs.\" },\n        { q: \"L'économie de guerre signifie que...\", options: [\"L'État fait faillite\", \"Les usines automobiles fabriquent désormais des chars et des obus\", \"On ne paye plus d'impôts\", \"La guerre est gratuite\"], correct: 1, feedback: \"Toute l'industrie est reconvertie pour la guerre (ex: Renault).\" },\n        { q: \"Qui prête de l'argent à la France et au Royaume-Uni pour tenir ?\", options: [\"L'Allemagne\", \"L'Espagne\", \"Les États-Unis\", \"La Suisse\"], correct: 2, feedback: \"Cela explique en partie l'entrée en guerre des USA pour protéger leurs investissements.\" },\n\n        // Génocide arménien\n        { q: \"Quel peuple subit un génocide en 1915 ?\", options: [\"Les Juifs\", \"Les Arméniens\", \"Les Tziganes\", \"Les Serbes\"], correct: 1, feedback: \"C'est le premier grand génocide du XXe siècle.\" },\n        { q: \"Quel pays/empire est responsable de ce génocide ?\", options: [\"L'Empire allemand\", \"L'Empire russe\", \"L'Empire ottoman (Turquie)\", \"L'Autriche-Hongrie\"], correct: 2, feedback: \"Le gouvernement ottoman accusait la minorité arménienne de trahison avec la Russie.\" },\n        { q: \"Qu'est-ce qu'un génocide ?\", options: [\"Un massacre au hasard\", \"L'extermination volontaire et programmée d'un peuple\", \"Une bataille très meurtrière\", \"Une famine naturelle\"], correct: 1, feedback: \"Le but est de faire disparaître totalement le peuple visé.\" },\n        { q: \"Combien d'Arméniens ont été victimes de ce génocide ?\", options: [\"10 000\", \"Entre 1,2 et 1,5 million\", \"5 millions\", \"6 millions\"], correct: 1, feedback: \"Ils ont été massacrés ou déportés dans des camps dans le désert syrien.\" },\n\n        // 1917 et la fin de la guerre\n        { q: \"Pourquoi l'année 1917 est-elle le tournant de la guerre ?\", options: [\"La paix est signée\", \"Génocide arménien\", \"Entrée en guerre des USA et Révolution russe\", \"Invention de l'avion\"], correct: 2, feedback: \"Les équilibres mondiaux changent brutalement cette année-là.\" },\n        { q: \"Quel président américain décide l'entrée en guerre des États-Unis ?\", options: [\"Roosevelt\", \"Lincoln\", \"Kennedy\", \"Wilson\"], correct: 3, feedback: \"Le président Woodrow Wilson, suite à la guerre sous-marine allemande.\" },\n        { q: \"Que se passe-t-il en Russie en 1917 ?\", options: [\"Rien de spécial\", \"Deux révolutions menées notamment par les Bolcheviks\", \"Un essor économique\", \"Une victoire totale sur l'Allemagne\"], correct: 1, feedback: \"La population, épuisée par la guerre, renverse le Tsar.\" },\n        { q: \"Qui est le chef des Bolcheviks en Russie ?\", options: [\"Staline\", \"Le Tsar Nicolas II\", \"Lénine\", \"Trotski\"], correct: 2, feedback: \"Lénine prend le pouvoir et signe la paix avec l'Allemagne (Brest-Litovsk).\" },\n        { q: \"Quelle est la date de l'arrêt des combats (Armistice) ?\", options: [\"11 novembre 1918\", \"8 mai 1945\", \"28 juin 1919\", \"1er septembre 1939\"], correct: 0, feedback: \"Signé dans un wagon à Rethondes.\" },\n        { q: \"Quelle est la différence entre un armistice et un traité de paix ?\", options: [\"Aucune\", \"L'armistice arrête les combats, le traité fixe les règles de la paix\", \"Le traité est signé avant l'armistice\", \"L'armistice ne concerne que la mer\"], correct: 1, feedback: \"L'armistice n'est qu'un cessez-le-feu en attendant les négociations politiques.\" },\n\n        // Bilan et Arts\n        { q: \"Où et quand est signé le traité de paix imposé à l'Allemagne ?\", options: [\"À Berlin (1918)\", \"À Paris (1920)\", \"À Versailles (28 juin 1919)\", \"À Londres (1919)\"], correct: 2, feedback: \"La date est symbolique : 5 ans jour pour jour après l'attentat de Sarajevo.\" },\n        { q: \"Comment les Allemands surnomment-ils le traité de Versailles ?\", options: [\"Le Miracle\", \"Le Diktat (chose dictée/imposée)\", \"Le Contrat\", \"L'Erreur\"], correct: 1, feedback: \"Ils le trouvent injuste, ce qui nourrira un fort sentiment de vengeance.\" },\n        { q: \"Quel est le bilan humain global de la guerre (militaires) ?\", options: [\"1 million de morts\", \"Environ 10 millions de morts\", \"50 millions de morts\", \"3 millions de morts\"], correct: 1, feedback: \"C'est un véritable désastre démographique pour l'Europe, sans compter la grippe espagnole ensuite.\" },\n        { q: \"Quelle organisation internationale est créée après la guerre pour maintenir la paix ?\", options: [\"L'ONU\", \"L'OTAN\", \"La SDN (Société des Nations)\", \"L'Union Européenne\"], correct: 2, feedback: \"C'est l'ancêtre de l'ONU, proposée par le président Wilson.\" },\n        { q: \"Quel peintre allemand a réalisé le tableau 'Les Joueurs de Skat' (1920) ?\", options: [\"Picasso\", \"Léonard de Vinci\", \"Otto Dix\", \"Van Gogh\"], correct: 2, feedback: \"Otto Dix a lui-même combattu et dessine l'horreur des mutilations de guerre.\" },\n        { q: \"Que dénonce le tableau d'Otto Dix ?\", options: [\"La triche aux cartes\", \"L'horreur de la guerre et l'hypocrisie de la société envers les gueules cassées\", \"La beauté des uniformes\", \"La défaite de l'Allemagne\"], correct: 1, feedback: \"Les soldats mutilés sont représentés comme des pantins effrayants, symboles d'une humanité détruite.\" }\n    ];\n\n    // Grand QCM : toutes les questions visibles, correction immédiate (moteur d'origine, classes du design system)\n    function renderQCM() {\n        const target = document.getElementById('qcm-container');\n        const total = questionsData.length;\n        let currentScore = 0;\n        let answeredQuestions = new Set();\n\n        target.innerHTML = '';\n        const quiz = document.createElement('div');\n        quiz.className = 'quiz';\n        quiz.innerHTML = '<div class=\"quiz-head is-sticky\"><span class=\"quiz-count\">\u003c/span>' +\n            '<div class=\"quiz-progress\"><span>\u003c/span>\u003c/div><span class=\"quiz-score\">\u003c/span>\u003c/div>';\n        const head = quiz.firstChild;\n        target.appendChild(quiz);\n\n        function updateHead() {\n            Lecon.setProgress(head, answeredQuestions.size, total);\n            head.querySelector('.quiz-count').textContent = answeredQuestions.size + ' / ' + total + ' répondue' + (answeredQuestions.size > 1 ? 's' : '');\n            head.querySelector('.quiz-score').textContent = 'Score : ' + currentScore + ' / ' + total;\n        }\n\n        questionsData.forEach((qObj, index) => {\n            const card = document.createElement('article');\n            card.className = 'q-card';\n            card.id = 'q' + index;\n\n            const num = document.createElement('p');\n            num.className = 'q-num';\n            num.textContent = 'Question ' + (index + 1) + ' / ' + total;\n            const qTitle = document.createElement('h3');\n            qTitle.className = 'q-title';\n            qTitle.textContent = qObj.q;\n\n            const optionsContainer = document.createElement('div');\n            optionsContainer.className = 'choices';\n            optionsContainer.setAttribute('role', 'group');\n            optionsContainer.setAttribute('aria-label', 'Choix de réponse');\n\n            const buttons = qObj.options.map((optText, optIndex) => {\n                const btn = document.createElement('button');\n                btn.type = 'button';\n                btn.className = 'choice';\n                btn.textContent = optText;\n                btn.addEventListener('click', () => handleAnswer(optIndex, btn));\n                optionsContainer.appendChild(btn);\n                return btn;\n            });\n\n            const feedback = document.createElement('div');\n            feedback.className = 'feedback';\n            feedback.setAttribute('aria-live', 'polite');\n\n            card.append(num, qTitle, optionsContainer, feedback);\n            quiz.appendChild(card);\n\n            function handleAnswer(selectedIndex, clickedBtn) {\n                // Empêcher de répondre plusieurs fois\n                if (answeredQuestions.has(index)) return;\n                answeredQuestions.add(index);\n\n                const isCorrect = (selectedIndex === qObj.correct);\n                Lecon.markChoices(optionsContainer, clickedBtn, buttons[qObj.correct]);\n\n                if (isCorrect) {\n                    currentScore++;\n                    Lecon.feedback(feedback, true, '✅ Bonne réponse !', qObj.feedback);\n                } else {\n                    Lecon.feedback(feedback, false, '❌ Faux !', qObj.feedback);\n                }\n                updateHead();\n\n                if (answeredQuestions.size === total) {\n                    const box = Lecon.resultCard(currentScore, total, {}, () => {\n                        renderQCM();\n                        target.scrollIntoView({ block: 'start' });\n                    });\n                    quiz.appendChild(box);\n                    box.scrollIntoView({ behavior: 'smooth', block: 'center' });\n                }\n            }\n        });\n\n        updateHead();\n    }\n\n    // Initialisation du QCM au chargement\n    renderQCM();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Histoire/Seconde Guerre Mondiale.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Révisions 3ème : La Seconde Guerre mondiale\u003c/title>\n    \u003c!--rev3e:css-->\n    \u003c!--rev3e:quiz-->\n\u003c/head>\n<body>\n<main class=\"lecon\">\n    <header class=\"lecon-header\">\n        <div class=\"lecon-eyebrow\">Histoire\u003c/div>\n        <h1>La Seconde Guerre mondiale (1939-1945)\u003c/h1>\n        <p class=\"lecon-subtitle\">Comprendre, retenir et s'entraîner — niveau 3e\u003c/p>\n    \u003c/header>\n    <nav class=\"tabs\" role=\"tablist\" aria-label=\"Rubriques de la leçon\">\n        <button type=\"button\" class=\"tab active\" data-tab=\"synthese\">Synthèse du cours\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"essentiel\">L'essentiel &amp; vocabulaire\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"chronologie\">Frise chronologique\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"acteurs\">Pays &amp; acteurs\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"bilan\">Le bilan\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"documents\">Documents du cours\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"questions-documents\">Questions sur les documents\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"quiz-flash\">Quiz flash\u003c/button>\n        <button type=\"button\" class=\"tab\" data-tab=\"grand-qcm\">Grand QCM (50 sur 200)\u003c/button>\n    \u003c/nav>\n\n    <section id=\"synthese\" class=\"tab-content active\">\n        <h2>Une guerre mondiale et une guerre d'anéantissement\u003c/h2>\n        <div class=\"callout definition\">\n            <p><strong>Leçon évolutive — documents reçus le 1er novembre 2026.\u003c/strong> Pour l'instant, les documents étudiés concernent <em>Mein Kampf\u003c/em>, Hitler et le programme nazi. Ils éclairent les origines idéologiques du conflit, mais ne racontent pas toute la guerre.\u003c/p>\n            <p><strong>Pour la suite du cours :\u003c/strong> les rubriques ci-dessous offrent dès maintenant une vue d'ensemble du programme de 3e. De nouveaux documents et leurs exercices pourront compléter les deux onglets dédiés au fil des séances. Le grand QCM porte sur l'ensemble du chapitre ; les questions documentaires portent uniquement sur les pièces déjà reçues.\u003c/p>\n        \u003c/div>\n        <h3>1. Avant la guerre : une idéologie raciste et une dictature\u003c/h3>\n        <p>Après l'échec de son putsch de Munich en 1923, Hitler prépare en prison <em>Mein Kampf\u003c/em>, publié en deux volumes en 1925 et 1926. Il y expose une idéologie <strong>raciste, antisémite, antidémocratique et expansionniste\u003c/strong>. La prétendue hiérarchie des « races » est une croyance fausse, pas un fait scientifique. Le projet d'« espace vital » sert à justifier la conquête de territoires à l'Est de l'Europe.\u003c/p>\n        <p>Nommé chancelier le <strong>30 janvier 1933\u003c/strong>, Hitler détruit progressivement les libertés et la démocratie. Le parti nazi devient le parti unique. En 1934, il cumule les fonctions de chef de l'État et du gouvernement : c'est le <strong>Führer\u003c/strong>. Le régime totalitaire contrôle la population par la propagande, l'embrigadement (notamment les Jeunesses hitlériennes) et la terreur. Les Juifs sont exclus et persécutés, notamment par les lois de Nuremberg de 1935.\u003c/p>\n        <h3>2. 1939-1942 : les conquêtes de l'Axe\u003c/h3>\n        <p>L'Allemagne envahit la Pologne le <strong>1er septembre 1939\u003c/strong>. La France et le Royaume-Uni lui déclarent la guerre le 3 septembre. En 1940, les offensives allemandes aboutissent à la défaite française ; le Royaume-Uni poursuit le combat. En juin 1941, Hitler attaque l'URSS malgré le pacte germano-soviétique de 1939. En décembre 1941, le Japon attaque Pearl Harbor : les États-Unis entrent en guerre. Le conflit s'étend en Europe, en Afrique du Nord, en Asie et dans le Pacifique.\u003c/p>\n        <h3>3. Une guerre totale et d'anéantissement\u003c/h3>\n        <p>Les États mobilisent soldats, travailleurs, usines, sciences, argent et propagande : c'est une <strong>guerre totale\u003c/strong>. Le radar et la recherche atomique illustrent la mobilisation scientifique. Les colonies participent aussi à l'effort de guerre. Les civils subissent bombardements, pénuries, déplacements et massacres. Sur le front de l'Est, les combats et la politique nazie visent à détruire l'adversaire et des populations entières : c'est une <strong>guerre d'anéantissement\u003c/strong>. Stalingrad (1942-1943) en est un exemple : combats acharnés, pertes considérables et ville ravagée.\u003c/p>\n        <h3>4. Les génocides des Juifs et des Roms et Sinti\u003c/h3>\n        <p>La persécution antisémite se radicalise pendant la guerre : enfermement dans des ghettos (comme à Varsovie), fusillades de masse par les <strong>Einsatzgruppen\u003c/strong> à partir de 1941 (comme à Babi Yar, près de Kiev), puis déportations, souvent en train, et assassinats dans des centres de mise à mort, comme Treblinka et Auschwitz-Birkenau. La conférence de Wannsee, en janvier 1942, coordonne la « solution finale », déjà engagée : elle ne constitue pas le début de toutes les tueries.\u003c/p>\n        <p>Environ <strong>six millions de Juifs\u003c/strong> sont assassinés : c'est la <strong>Shoah\u003c/strong>. Les nazis et leurs alliés commettent aussi le génocide des Roms et Sinti (appelés « Tziganes » dans le programme). Les estimations varient, souvent entre 200 000 et 500 000 victimes. D'autres groupes subissent persécutions et massacres. Tous les camps n'ont pas la même fonction : un camp de concentration n'est pas nécessairement un centre de mise à mort.\u003c/p>\n        <h3>5. La France défaite, occupée et résistante\u003c/h3>\n        <p>La défaite provoque l'<strong>exode\u003c/strong> de millions de civils. Le gouvernement de Pétain fait signer l'armistice le <strong>22 juin 1940\u003c/strong>. Le régime de Vichy, autoritaire et antisémite, remplace la République et collabore avec l'Allemagne nazie : la rencontre de <strong>Montoire en octobre 1940\u003c/strong> symbolise ce choix. Il adopte ses propres mesures antisémites et participe aux arrestations et aux déportations. À Paris, la rafle du Vél' d'Hiv des 16 et 17 juillet 1942 est réalisée par la police française.\u003c/p>\n        <p>De Gaulle appelle à poursuivre le combat depuis Londres le <strong>18 juin 1940\u003c/strong> et organise la France libre. La Résistance intérieure diffuse des journaux clandestins, recueille des renseignements, cache des personnes persécutées et mène des sabotages. Jean Moulin contribue à unir les mouvements au sein du <strong>CNR en 1943\u003c/strong>. Les résistants risquent arrestation, torture, déportation et mort.\u003c/p>\n        <h3>6. 1942-1945 : les victoires alliées et la fin de la guerre\u003c/h3>\n        <p>Midway, El-Alamein et Stalingrad marquent le tournant de 1942-1943. Les Alliés progressent ensuite sur plusieurs fronts. Le débarquement en Normandie a lieu le <strong>6 juin 1944\u003c/strong>. L'Allemagne capitule en mai 1945 ; on commémore cette victoire le <strong>8 mai\u003c/strong>. Après les bombes atomiques américaines sur Hiroshima et Nagasaki et l'entrée en guerre de l'URSS contre le Japon, le Japon capitule le <strong>2 septembre 1945\u003c/strong>.\u003c/p>\n        <div class=\"callout retenir\"><p><strong>Phrase bilan :\u003c/strong> la Seconde Guerre mondiale est un conflit planétaire, total et d'anéantissement, marqué par des génocides et une immense violence contre les civils. Elle transforme profondément le monde en 1945.\u003c/p>\u003c/div>\n        <details><summary>Le programme de 3e et les sources de cadrage\u003c/summary>\n            <p>Thème 1 : « L'Europe, un théâtre majeur des guerres totales (1914-1945) ». Cette leçon relie les expériences totalitaires, « La Seconde Guerre mondiale, une guerre d'anéantissement » et « La France défaite et occupée. Régime de Vichy, collaboration, Résistance ».\u003c/p>\n            <ul>\n                <li><a href=\"https://www.education.gouv.fr/bo/20/Hebdo31/MENE2018714A.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Bulletin officiel : programmes des cycles 2, 3 et 4 (2020)\u003c/a>.\u003c/li>\n                <li><a href=\"https://eduscol.education.gouv.fr/sites/default/files/document/c4his3th1leuropetheatremajeurguerrestotales-dm593802pdf-78228.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Éduscol : ressources d'accompagnement du thème 1 en 3e\u003c/a>.\u003c/li>\n            \u003c/ul>\n            <p>Les résumés et exercices sont rédigés pour cette leçon. Les liens permettent d'aller plus loin ; le cours et tous les quiz fonctionnent hors ligne.\u003c/p>\n        \u003c/details>\n    \u003c/section>\n\n    <section id=\"essentiel\" class=\"tab-content\">\n        <h2>L'essentiel en six idées\u003c/h2>\n        <ol>\n            <li><strong>1939-1945 :\u003c/strong> l'Axe combat les Alliés à l'échelle mondiale.\u003c/li>\n            <li><strong>1942-1943 :\u003c/strong> le rapport de force bascule au profit des Alliés.\u003c/li>\n            <li><strong>Guerre totale :\u003c/strong> toutes les ressources sont mobilisées.\u003c/li>\n            <li><strong>Guerre d'anéantissement :\u003c/strong> destruction de l'adversaire, violences extrêmes contre soldats et civils.\u003c/li>\n            <li><strong>Génocides :\u003c/strong> les Juifs et les Roms et Sinti sont visés pour ce qu'ils sont.\u003c/li>\n            <li><strong>En France :\u003c/strong> Vichy collabore ; la Résistance lutte contre l'occupant et pour la liberté.\u003c/li>\n        \u003c/ol>\n        <h2>Les mots pour expliquer\u003c/h2>\n        <div class=\"grid-2\">\n            <article class=\"card card-accent\"><h3>Nazisme\u003c/h3><p>Idéologie d'Hitler : racisme, antisémitisme, dictature et conquêtes. Elle repose sur de fausses théories raciales.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Antisémitisme\u003c/h3><p>Haine, préjugés et discrimination envers les Juifs.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Totalitarisme\u003c/h3><p>Régime qui cherche à contrôler toute la société et les individus : parti unique, chef, propagande, embrigadement et terreur.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Propagande &amp; censure\u003c/h3><p>La propagande cherche à imposer des idées ; la censure empêche la diffusion d'informations ou d'opinions.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Espace vital (Lebensraum)\u003c/h3><p>Projet nazi de conquête de territoires, surtout à l'Est, présenté comme nécessaire au peuple allemand.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Guerre éclair\u003c/h3><p>Offensives rapides combinant notamment chars et aviation pour désorganiser l'adversaire.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Guerre totale\u003c/h3><p>Mobilisation de toutes les ressources humaines, économiques, scientifiques et morales pour la guerre.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Guerre d'anéantissement\u003c/h3><p>Guerre visant la destruction de l'adversaire, avec des violences extrêmes qui frappent aussi les civils.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Génocide &amp; Shoah\u003c/h3><p>Un génocide vise à détruire, en tout ou en partie, un groupe national, ethnique, racial ou religieux. La Shoah désigne le génocide des Juifs.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Ghetto\u003c/h3><p>Quartier où les nazis enferment les Juifs, avec privations, surpopulation et forte mortalité.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Einsatzgruppen\u003c/h3><p>Unités mobiles nazies qui commettent des fusillades de masse, notamment de Juifs, derrière le front de l'Est.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Déportation\u003c/h3><p>Transfert forcé de personnes vers des camps ou d'autres lieux de détention, d'exploitation ou de mise à mort.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Camp de concentration\u003c/h3><p>Lieu de détention, de terreur et souvent de travail forcé, où la mortalité est très élevée.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Centre de mise à mort\u003c/h3><p>Lieu conçu pour assassiner massivement les déportés, notamment dans des chambres à gaz.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Collaboration\u003c/h3><p>Aide apportée à l'occupant nazi, notamment par le régime de Vichy.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Résistance &amp; maquis\u003c/h3><p>Actions contre l'occupation et Vichy. Les maquis sont des groupes de résistants armés installés dans des zones difficiles d'accès.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>STO &amp; Milice\u003c/h3><p>En 1943, le Service du travail obligatoire impose à des Français de travailler pour l'Allemagne ; des réfractaires rejoignent les maquis. La Milice de Vichy traque notamment les résistants et les Juifs.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>FFL, FFI &amp; CNR\u003c/h3><p>Forces françaises libres : combattent avec De Gaulle. Forces françaises de l'intérieur : regroupent des forces résistantes en 1944. Conseil national de la Résistance : unifie la Résistance en 1943 et prépare des réformes en 1944.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Rationnement &amp; travail forcé\u003c/h3><p>Le rationnement répartit les produits rares. Le travail forcé est imposé sous la contrainte, notamment au profit de l'économie allemande.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Occupation &amp; zone dite libre\u003c/h3><p>En 1940, une partie de la France est occupée, tandis que Vichy administre la zone dite libre sans démocratie. En novembre 1942, l'Allemagne et l'Italie occupent aussi cette zone.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Armistice &amp; capitulation\u003c/h3><p>Un armistice suspend les combats par un accord ; une capitulation reconnaît une défaite militaire. Ce n'est pas nécessairement un traité de paix.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Crime contre l'humanité\u003c/h3><p>Notion juridique utilisée à Nuremberg pour juger notamment des meurtres, déportations et persécutions de populations civiles.\u003c/p>\u003c/article>\n        \u003c/div>\n        <div class=\"callout retenir\"><p><strong>Ne pas confondre :\u003c/strong> « totale » explique la mobilisation ; « d'anéantissement » explique la volonté de destruction. La Shoah est un génocide, pas une bataille.\u003c/p>\u003c/div>\n    \u003c/section>\n\n    <section id=\"chronologie\" class=\"tab-content\">\n        <h2>Les repères avant et pendant la guerre\u003c/h2>\n        <ol class=\"timeline\">\n            <li class=\"timeline-item\"><span class=\"timeline-date\">1923 puis 1925-1926\u003c/span><p>Putsch de Munich raté ; préparation de <em>Mein Kampf\u003c/em> en prison, puis publication.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">30 janvier 1933 / 1934\u003c/span><p>Hitler nommé chancelier ; dictature installée en 1933, cumul des fonctions en 1934.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">1935\u003c/span><p>Lois antisémites de Nuremberg.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">1938\u003c/span><p>Annexion de l'Autriche (Anschluss) en mars ; accords de Munich en septembre ; violences de la « Nuit de cristal » en novembre.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">Août 1939\u003c/span><p>Signature du pacte germano-soviétique.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">1er et 3 septembre 1939\u003c/span><p>Invasion de la Pologne ; déclarations de guerre française et britannique.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">Mai-juin 1940\u003c/span><p>Défaite française. Appel de De Gaulle le <strong>18 juin\u003c/strong> ; armistice le <strong>22 juin\u003c/strong>.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">10 juillet 1940\u003c/span><p>Pétain reçoit les pleins pouvoirs constituants ; mise en place du régime de Vichy.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">22 juin / 7 décembre 1941\u003c/span><p>Invasion de l'URSS (Barbarossa) ; attaque japonaise de Pearl Harbor.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">1941-1942\u003c/span><p>Fusillades de masse, extension des déportations et des centres de mise à mort ; Wannsee le 20 janvier 1942.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">16-17 juillet 1942\u003c/span><p>Rafle du Vél' d'Hiv à Paris.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">1942-1943 : le tournant\u003c/span><p>Midway (juin 1942), El-Alamein (automne 1942), Stalingrad (été 1942 au <strong>2 février 1943\u003c/strong>).\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">27 mai 1943\u003c/span><p>Première réunion du Conseil national de la Résistance (CNR).\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">6 juin / 15 août / 25 août 1944\u003c/span><p>Débarquements de Normandie et de Provence ; libération de Paris.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">27 janvier / 8 mai 1945\u003c/span><p>Libération d'Auschwitz par l'Armée rouge ; victoire alliée en Europe en mai.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">6 et 9 août / 2 septembre 1945\u003c/span><p>Bombes atomiques sur Hiroshima et Nagasaki ; capitulation du Japon et fin de la guerre mondiale.\u003c/p>\u003c/li>\n            <li class=\"timeline-item\"><span class=\"timeline-date\">1945-1946\u003c/span><p>Création de l'ONU en 1945 ; procès de Nuremberg de novembre 1945 à octobre 1946.\u003c/p>\u003c/li>\n        \u003c/ol>\n        <div class=\"callout retenir\"><p><strong>Trois grandes phases :\u003c/strong> victoires de l'Axe (1939-1942) → tournant (1942-1943) → victoires alliées (1943-1945).\u003c/p>\u003c/div>\n    \u003c/section>\n\n    <section id=\"acteurs\" class=\"tab-content\">\n        <h2>Les camps : des alliances qui évoluent\u003c/h2>\n        <div class=\"grid-2\">\n            <article class=\"card card-accent\"><h3>L'Axe\u003c/h3><ul><li><strong>Allemagne nazie :\u003c/strong> Hitler.\u003c/li><li><strong>Italie fasciste :\u003c/strong> Mussolini. En 1943, le régime tombe ; l'Italie signe un armistice, mais les combats continuent dans un pays divisé.\u003c/li><li><strong>Japon :\u003c/strong> empereur Hirohito ; gouvernement et armée mènent une politique expansionniste, notamment sous le gouvernement de Tojo à partir de 1941.\u003c/li>\u003c/ul>\u003c/article>\n            <article class=\"card card-accent\"><h3>Les Alliés\u003c/h3><ul><li><strong>Royaume-Uni :\u003c/strong> Churchill à partir de mai 1940.\u003c/li><li><strong>France :\u003c/strong> combat en 1939-1940, puis France libre de De Gaulle.\u003c/li><li><strong>URSS :\u003c/strong> Staline, rejoint les Alliés après l'invasion de juin 1941.\u003c/li><li><strong>États-Unis :\u003c/strong> Roosevelt, puis Truman en 1945 ; entrée en guerre en décembre 1941.\u003c/li><li><strong>Chine :\u003c/strong> combat le Japon depuis 1937. De nombreux autres pays et les empires coloniaux participent.\u003c/li>\u003c/ul>\u003c/article>\n        \u003c/div>\n        <div class=\"callout attention\"><p><strong>Attention :\u003c/strong> le pacte germano-soviétique de 1939 est un accord de non-agression assorti d'un partage territorial secret, pas une adhésion de l'URSS à l'Axe. Les Alliés n'ont pas tous le même régime politique : l'URSS de Staline est une dictature.\u003c/p>\u003c/div>\n        <h2>La France : faire les bons liens\u003c/h2>\n        <div class=\"grid-2\">\n            <article class=\"card\"><h3>Philippe Pétain\u003c/h3><p>Chef de l'État français à Vichy. Autoritarisme, antisémitisme et collaboration avec l'Allemagne nazie.\u003c/p>\u003c/article>\n            <article class=\"card\"><h3>Charles de Gaulle\u003c/h3><p>Appel du 18 juin 1940 depuis Londres ; chef de la France libre, puis du Gouvernement provisoire.\u003c/p>\u003c/article>\n            <article class=\"card\"><h3>Jean Moulin\u003c/h3><p>Résistant envoyé par De Gaulle pour unifier la Résistance intérieure ; rôle majeur dans le CNR en 1943.\u003c/p>\u003c/article>\n            <article class=\"card\"><h3>Des acteurs collectifs\u003c/h3><p>Soldats, résistantes et résistants, travailleurs, populations colonisées, civils persécutés. L'histoire ne se limite pas aux dirigeants.\u003c/p>\u003c/article>\n        \u003c/div>\n    \u003c/section>\n\n    <section id=\"bilan\" class=\"tab-content\">\n        <h2>Un monde bouleversé\u003c/h2>\n        <div class=\"grid-2\">\n            <article class=\"card card-accent\"><h3>Bilan humain\u003c/h3><p>Des dizaines de millions de morts : environ <strong>60 millions\u003c/strong> dans de nombreux bilans scolaires, et jusqu'à 70-85 millions selon les périmètres et estimations. Les civils représentent une part majeure des victimes. Environ six millions de Juifs sont assassinés.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Bilan matériel\u003c/h3><p>Villes, logements, routes, ponts, usines et campagnes ravagés. Les bombardements, comme celui de Dresde en 1945, détruisent les villes et tuent des civils. Pénuries, déplacements de populations et reconstruction de longue durée.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Bilan moral et judiciaire\u003c/h3><p>Découverte de l'ampleur des crimes nazis ; choc des génocides et de l'arme atomique. Nuremberg (1945-1946) juge de grands responsables nazis, notamment pour crimes contre l'humanité.\u003c/p>\u003c/article>\n            <article class=\"card card-accent\"><h3>Bilan politique\u003c/h3><p>Défaite de l'Axe, Allemagne occupée et divisée en zones, Europe affaiblie. Les États-Unis et l'URSS deviennent les deux grandes puissances ; leurs tensions conduiront à la guerre froide.\u003c/p>\u003c/article>\n        \u003c/div>\n        <div class=\"callout retenir\"><p><strong>L'ONU, créée en 1945,\u003c/strong> cherche à préserver la paix et la sécurité internationales. Elle succède à la SDN, créée après la Première Guerre mondiale. En France, la Libération rétablit la République et ouvre la voie à des réformes inspirées notamment du programme du CNR. Les Françaises obtiennent le droit de vote et d'éligibilité en 1944 et votent pour la première fois en 1945.\u003c/p>\u003c/div>\n        <h3>Pour une réponse de brevet\u003c/h3>\n        <p>Explique une idée, donne un exemple précis, puis relie-le au sujet : <em>« La guerre frappe massivement les civils. Les bombardements détruisent des villes, et les nazis organisent le génocide des Juifs. Ces violences montrent le caractère d'anéantissement du conflit. »\u003c/em>\u003c/p>\n    \u003c/section>\n\n    <section id=\"documents\" class=\"tab-content\">\n        <h2>Les documents déjà étudiés : Hitler et Mein Kampf\u003c/h2>\n        <p>Voici des <strong>résumés commentés des six photos reçues\u003c/strong>, et non une reproduction intégrale des pages. Les deux photos de la carte mentale montrent le même travail : elles ne constituent pas deux sources indépendantes. Les numéros suivent l'ordre des pièces jointes.\u003c/p>\n        <div class=\"callout definition\"><p><strong>Méthode :\u003c/strong> identifier la nature et l'auteur, relever les informations, expliquer avec le cours, puis signaler les limites. Une carte mentale ou une fiche pédagogique est une synthèse ; un extrait de <em>Mein Kampf\u003c/em> expose une idéologie à analyser de façon critique, pas une vérité à accepter.\u003c/p>\u003c/div>\n        <article class=\"card\" id=\"doc1\">\n            <h3>Document 1 — Carte de synthèse « Mein Kampf »\u003c/h3>\n            <p><strong>Nature :\u003c/strong> fiche pédagogique imprimée ; auteur de la fiche non identifié sur la photo. Quatre branches : auteur et contexte, idées principales, projet politique, conséquences.\u003c/p>\n            <ul><li>Hitler prépare son livre après le putsch raté de Munich et l'emprisonnement.\u003c/li><li>La fiche relie racisme, antisémitisme, conquête vers l'Est et pouvoir d'un chef unique.\u003c/li><li>Elle montre le passage d'un programme à une dictature et rappelle les conséquences criminelles du nazisme.\u003c/li>\u003c/ul>\n            <p><strong>À préciser :\u003c/strong> 1925 est la date du premier volume, 1926 celle du second. Hitler est chancelier en 1933, puis cumule les fonctions en 1934. Le génocide ne doit pas être présenté comme un plan opérationnel entièrement décrit dans ce livre.\u003c/p>\n        \u003c/article>\n        <article class=\"card\" id=\"doc2\">\n            <h3>Documents 2 et 4 — Carte mentale manuscrite\u003c/h3>\n            <p><strong>Nature :\u003c/strong> travail de cours photographié deux fois ; auteur et date de rédaction non indiqués. La seconde vue montre davantage le bas de la page.\u003c/p>\n            <p>Au centre : <em>Mein Kampf\u003c/em> (« Mon combat »). Les branches évoquent le contexte de rédaction, les dates de publication, Rudolf Hess, la propagande, le rejet de la démocratie, le racisme et la conquête de terres. Le lien avec l'accession au pouvoir en 1933 apparaît aussi.\u003c/p>\n            <p><strong>À préciser :\u003c/strong> la branche sur le nombre de lecteurs ne permet pas d'établir un chiffre exact et fiable sur cette photo. Ne pas confondre exemplaires diffusés, acheteurs et lecteurs. Hess aide Hitler dans la préparation du texte, mais Hitler en est l'auteur. La propagande n'est pas une information neutre.\u003c/p>\n        \u003c/article>\n        <article class=\"card\" id=\"doc3\">\n            <h3>Document 3 — Entretien de Fabrice d'Almeida, France TV Info\u003c/h3>\n            <p><strong>Nature :\u003c/strong> transcription imprimée d'un entretien avec un historien, intitulé « 6 questions très simples sur Mein Kampf ». La date de publication de l'article n'est pas visible sur la feuille.\u003c/p>\n            <ul><li>Le livre est préparé en prison après l'échec du putsch de 1923.\u003c/li><li>Il mêle récit personnel et programme idéologique ; Rudolf Hess participe à sa mise par écrit.\u003c/li><li>Son succès s'amplifie avec celui du parti nazi et l'arrivée d'Hitler au pouvoir en 1933.\u003c/li><li>L'historien distingue l'antisémitisme du livre du déroulement concret du génocide pendant la guerre.\u003c/li><li>La publication française de 1934 par Fernand Sorlot est expliquée par une volonté de dénoncer une menace allemande contre la France. Le document précise aussi les positions d'extrême droite de cet éditeur.\u003c/li>\u003c/ul>\n            <p><strong>À retenir :\u003c/strong> un historien contextualise et analyse. Son commentaire n'a pas la même nature que les propos d'Hitler. L'absence de description détaillée de la Shoah dans le livre ne signifie pas l'absence d'antisémitisme.\u003c/p>\n        \u003c/article>\n        <article class=\"card\" id=\"doc5\">\n            <h3>Document 5 — « Groupe 3 – Mein Kampf »\u003c/h3>\n            <p><strong>Nature :\u003c/strong> fiche de travail : présentation de l'historien Claude Quétel, lien vidéo, biographie d'Hitler et deux extraits attribués à <em>Mein Kampf\u003c/em>. La date de réalisation de la fiche n'est pas donnée.\u003c/p>\n            <ul><li><strong>Biographie :\u003c/strong> Hitler est né en Autriche en 1889, sert pendant la Première Guerre mondiale, tente un putsch en 1923, puis devient chancelier en 1933.\u003c/li><li><strong>Extrait 1 :\u003c/strong> il justifie la conquête de terres à l'Est par une prétendue supériorité raciale et les besoins du peuple allemand : racisme et expansionnisme.\u003c/li><li><strong>Extrait 2 :\u003c/strong> il refuse les décisions des citoyens et concentre l'autorité dans les mains d'un seul chef : rejet de la démocratie.\u003c/li>\u003c/ul>\n            <p><strong>Lecture critique :\u003c/strong> les accusations visant les Juifs sont des préjugés antisémites. La nomination d'Hitler par Hindenburg respecte une procédure constitutionnelle, mais cela ne fait pas de son projet un projet démocratique.\u003c/p>\n            <p><strong>Correction d'un raccourci :\u003c/strong> la dictature se met en place dès 1933, après l'incendie du Reichstag et la suppression des libertés ; elle ne commence pas seulement en 1934.\u003c/p>\n        \u003c/article>\n        <article class=\"card\" id=\"doc6\">\n            <h3>Document 6 — « Adolf Hitler : le programme »\u003c/h3>\n            <p><strong>Nature :\u003c/strong> affiche pédagogique de révision pour l'oral ; auteur et date non visibles. Elle résume quatre idées : racisme et antisémitisme, conquêtes, rejet de la démocratie, dictature.\u003c/p>\n            <p><strong>Phrase de synthèse reformulée :\u003c/strong> Hitler veut un État raciste, expansionniste et dirigé par un chef unique. La mise en œuvre du nazisme conduit aux persécutions, à la guerre et aux génocides.\u003c/p>\n            <p><strong>Attention :\u003c/strong> la prétendue « race supérieure » est une invention idéologique. Le génocide résulte d'un processus de radicalisation, notamment pendant la guerre : il ne faut pas effacer les étapes entre l'écriture du livre et les crimes.\u003c/p>\n        \u003c/article>\n        <h3>Ce que ces documents ne suffisent pas à expliquer\u003c/h3>\n        <p>Ils éclairent surtout les origines idéologiques et la dictature. Pour comprendre toute la Seconde Guerre mondiale, il faut aussi étudier les fronts, la mobilisation des sociétés, le processus des génocides, Vichy, la Résistance et le bilan. Ces éléments figurent dans les autres onglets ; leurs documents de cours seront ajoutés quand ils seront disponibles.\u003c/p>\n    \u003c/section>\n\n    <section id=\"questions-documents\" class=\"tab-content\">\n        <h2>S'entraîner uniquement sur les documents reçus\u003c/h2>\n        <p><strong>24 questions corrigées\u003c/strong> sur les documents 1 à 6. Les questions qui rectifient une fiche s'appuient aussi sur la précision historique donnée dans l'onglet Documents.\u003c/p>\n        <div id=\"document-quiz\">\u003c/div>\n        <h2>Questions ouvertes : préparer une réponse à l'oral\u003c/h2>\n        <p>Essaie de répondre avant d'ouvrir chaque correction.\u003c/p>\n        <details><summary>1. Présente la nature des documents et distingue les voix qui s'expriment.\u003c/summary><p>Les documents 1 et 6 sont des synthèses pédagogiques ; 2 et 4 sont deux photos d'une carte mentale ; 3 est un entretien avec Fabrice d'Almeida ; 5 est une fiche comprenant une biographie et des extraits d'Hitler. Il faut distinguer les commentaires des historiens et les affirmations idéologiques d'Hitler.\u003c/p>\u003c/details>\n        <details><summary>2. Documents 1, 2, 3 et 5 : dans quel contexte le livre est-il préparé ?\u003c/summary><p>Après le putsch raté de Munich en 1923, Hitler est emprisonné. Il prépare le livre avec l'aide de Rudolf Hess. Les volumes paraissent en 1925 et 1926. Il veut diffuser ses idées et préparer la conquête du pouvoir.\u003c/p>\u003c/details>\n        <details><summary>3. Document 5, extrait 1 : explique le lien entre racisme et conquête.\u003c/summary><p>Hitler présente à tort les Allemands comme appartenant à une « race supérieure » et invoque le besoin de terres à l'Est. Cette idée d'« espace vital » justifie à ses yeux une expansion aux dépens d'autres populations. Il faut attribuer ces affirmations au nazisme, et non les reprendre comme des faits.\u003c/p>\u003c/details>\n        <details><summary>4. Document 5, extrait 2 : pourquoi ce programme est-il antidémocratique ?\u003c/summary><p>Les citoyens ne décident plus ; un seul chef impose les lois et détient toute l'autorité. Cela contredit la participation des citoyens, le pluralisme et la séparation des pouvoirs.\u003c/p>\u003c/details>\n        <details><summary>5. Document 3 : peut-on dire que le livre décrit précisément la Shoah ?\u003c/summary><p>Non. L'historien souligne l'antisémitisme du livre, sans y trouver une description des modalités du génocide ultérieur. Il faut distinguer l'idéologie, les persécutions et la mise en œuvre du génocide pendant la guerre.\u003c/p>\u003c/details>\n        <details><summary>6. Documents 1, 5 et 6 : remets les étapes du pouvoir dans l'ordre.\u003c/summary><p>30 janvier 1933 : nomination comme chancelier par Hindenburg. En 1933 : destruction des libertés et mise en place de la dictature. En 1934, après la mort d'Hindenburg : cumul des fonctions et titre de Führer.\u003c/p>\u003c/details>\n        <details><summary>7. Documents 2 et 4 : quelles sont les limites de la carte mentale ?\u003c/summary><p>Elle simplifie beaucoup et certains mots ou chiffres sont difficiles à lire. Les deux photos montrent le même travail et ne se confirment pas comme deux sources indépendantes. On ne peut pas transformer un chiffre ambigu sur la diffusion en un nombre exact de lecteurs.\u003c/p>\u003c/details>\n        <details><summary>8. Fais une synthèse en quatre phrases du programme nazi.\u003c/summary><p>Le nazisme repose sur le racisme et l'antisémitisme. Hitler veut conquérir des territoires, surtout à l'Est. Il rejette la démocratie et concentre le pouvoir dans les mains d'un chef unique. La mise en œuvre de cette idéologie entraîne une dictature, des persécutions, la guerre et des génocides.\u003c/p>\u003c/details>\n    \u003c/section>\n\n    <section id=\"quiz-flash\" class=\"tab-content\">\n        <h2>Quiz flash : 10 repères pour réviser vite\u003c/h2>\n        <p>Dix questions tirées au hasard dans une petite sélection de vingt repères essentiels. Correction immédiate après chaque réponse.\u003c/p>\n        <div id=\"flash-quiz\">\u003c/div>\n    \u003c/section>\n    <section id=\"grand-qcm\" class=\"tab-content\">\n        <h2>Le grand QCM : 50 questions parmi 200\u003c/h2>\n        <p>Une seule bonne réponse par question. À chaque nouvelle série ou clic sur <strong>Recommencer\u003c/strong>, 50 questions sont tirées <strong>sans doublon\u003c/strong> dans la banque de 200. Les choix sont également mélangés. Certaines questions peuvent revenir d'une série à l'autre.\u003c/p>\n        <div class=\"quiz-actions\"><button type=\"button\" class=\"btn btn-secondary\" id=\"new-series\">Tirer une nouvelle série de 50\u003c/button>\u003c/div>\n        <div id=\"main-quiz\">\u003c/div>\n    \u003c/section>\n\u003c/main>\n<script>\n    // Chaque ligne : question | bonne réponse | trois distracteurs | explication.\n    const questionRows = [\n        // Origines et nazisme (1-25).\n        \"Quelles années encadrent la Seconde Guerre mondiale ?|1939-1945|1914-1918|1929-1933|1947-1991|Le conflit mondial commence en Europe en 1939 et se termine en 1945.\",\n        \"Quel pays Hitler dirige-t-il pendant la guerre ?|L'Allemagne|L'Italie|Le Japon|L'URSS|Hitler dirige l'Allemagne nazie.\",\n        \"Que signifie Mein Kampf en français ?|Mon combat|Ma victoire|Mon pays|La paix|Ce livre mêle récit personnel et programme idéologique.\",\n        \"Après quel événement Hitler prépare-t-il Mein Kampf en prison ?|Le putsch raté de Munich de 1923|La défaite de Stalingrad|Le débarquement de Normandie|La capitulation du Japon|L'échec du coup de force de 1923 conduit à son emprisonnement.\",\n        \"Quand paraît le premier volume de Mein Kampf ?|1925|1918|1939|1945|Le premier volume paraît en 1925, le second en 1926.\",\n        \"Quand paraît le second volume de Mein Kampf ?|1926|1923|1933|1941|Le livre est publié en deux volumes, en 1925 et 1926.\",\n        \"Qui aide Hitler à préparer son livre en prison ?|Rudolf Hess|Jean Moulin|Winston Churchill|Harry Truman|Hess participe à la mise par écrit ; Hitler reste l'auteur.\",\n        \"Qu'est-ce que l'antisémitisme ?|La haine et la discrimination envers les Juifs|Le refus de toute guerre|L'aide aux réfugiés|La défense du pluralisme|L'antisémitisme est un élément central du nazisme.\",\n        \"La prétendue hiérarchie des races nazie est-elle scientifique ?|Non, c'est une idéologie raciste sans fondement scientifique|Oui, c'est une loi biologique|Oui, elle est reconnue par l'ONU|Elle désigne uniquement les nationalités|Il faut analyser cette croyance raciste, jamais la présenter comme une vérité.\",\n        \"Vers quelle direction l'espace vital nazi vise-t-il surtout des conquêtes ?|L'Est de l'Europe|L'Amérique tation|La propagande cherche à influencer les opinions.\",\n        \"Que désigne la censure ?|L'interdiction de diffuser certaines informations ou opinions|Le droit de publier sans restriction|La liberté d'association|Un accord militaire|Elle limite la liberté d'expression.\",\n        \"À quoi servent les Jeunesses hitlériennes ?|Embrigader la jeunesse au service du régime|Défendre les partis d'opposition|Organiser la Résistance française|Préparer les élections libres|Le régime cherche à contrôler les jeunes et leur éducation.\",\n        \"Que font les lois de Nuremberg de 1935 ?|Elles excluent les Juifs de droits et imposent des discriminations|Elles créent l'ONU|Elles jugent les chefs nazis|Elles libèrent les camps|Ne pas les confondre avec le procès de Nuremberg de 1945-1946.\",\n        \"Que désigne la Nuit de cristal de novembre 1938 ?|Des violences antisémites organisées contre les Juifs|Une victoire alliée dans le Pacifique|La libération de Paris|La signature de l'armistice français|Synagogues et commerces sont attaqués ; des Juifs sont arrêtés et tués.\",\n        \"Qu'est-ce que l'Anschluss en 1938 ?|L'annexion de l'Autriche par l'Allemagne|L'entrée des États-Unis en guerre|La création du CNR|La capitulation du Japon|Cette annexion est une étape de l'expansion allemande.\",\n        \"Les accords de Munich de 1938 empêchent-ils durablement la guerre ?|Non, les conquêtes allemandes continuent|Oui, jusqu'en 1960|Oui, l'Allemagne désarme définitivement|Ils mettent fin à la guerre mondiale|Les concessions faites à Hitler ne garantissent pas la paix.\",\n        // Déclenchement et victoires de l'Axe (26-50).\n        \"Quel événement déclenche la guerre en Europe en septembre 1939 ?|L'invasion allemande de la Pologne|L'attaque de Pearl Harbor|La libération de Paris|La bataille de Midway|La France et le Royaume-Uni déclarent ensuite la guerre à l'Allemagne.\",\n        \"À quelle date l'Allemagne envahit-elle la Pologne ?|1er septembre 1939|6 juin 1944|22 juin 1941|2 septembre 1945|C'est le repère du début de la Seconde Guerre mondiale en Europe.\",\n        \"Quand la France et le Royaume-Uni déclarent-ils la guerre à l'Allemagne ?|3 septembre 1939|30 janvier 1933|7 décembre 1941|8 mai 1945|Ils réagissent à l'invasion de la Pologne.\",\n        \"Quel accord l'Allemagne et l'URSS signent-elles en août 1939 ?|Le pacte germano-soviétique|Le traité de Versailles|La charte de l'ONU|Le programme du CNR|C'est un pacte de non-agression avec un protocole territorial secret.\",\n        \"Que prévoit le protocole secret du pacte de 1939 ?|Un partage de zones d'influence en Europe orientale|La création de l'Union européenne|Le débarquement de Normandie|La fin de la dictature de Staline|Il prévoit notamment un partage de la Pologne.\",\n        \"L'URSS est-elle membre de l'Axe du fait du pacte de 1939 ?|Non, ce pacte ne constitue pas une adhésion à l'Axe|Oui, elle dirige le Japon|Oui, jusqu'en 1945|L'Axe est une organisation de l'ONU|Non-agression et appartenance à un camp ne sont pas synonymes.\",\n        \"Quels sont les trois principaux pays de l'Axe ?|Allemagne, Italie, Japon|France, Royaume-Uni, États-Unis|URSS, Chine, France|Canada, Australie, Royaume-Uni|Les autres pays liés à l'Axe ne sont pas tous cités dans cette liste.\",\n        \"Qui dirige l'Italie fasciste au début du conflit ?|Benito Mussolini|Winston Churchill|Joseph Staline|Jean Moulin|Mussolini est l'allié d'Hitler.\",\n        \"Quel pays mène une expansion militaire en Asie et dans le Pacifique ?|Le Japon|La Suisse|Le Portugal|La Suède|Le Japon combat notamment la Chine et les États-Unis.\",\n        \"Qui est l'empereur du Japon pendant la guerre ?|Hirohito|Hitler|Hindenburg|Roosevelt|Hirohito est empereur ; le gouvernement et l'armée jouent aussi un rôle majeur.\",\n        \"Depuis quelle année la Chine combat-elle le Japon dans une guerre à grande échelle ?|1937|1944|1950|1925|Le conflit en Asie commence avant le déclenchement européen de 1939.\",\n
