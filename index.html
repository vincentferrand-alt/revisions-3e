 relation algébrique permet de passer d'une grandeur à l'autre.\u003c/p>\n        <span class=\"formula\">\\(P = 4 \\times c\\)\u003c/span>\n      \u003c/div>\n      <div class=\"card card-accent\">\n        <h3>📋 Un tableau\u003c/h3>\n        <p>Il associe les nombres des deux grandeurs.\u003c/p>\n        <div class=\"table-wrap\">\n          <table class=\"tbl-c\">\n            <tbody>\n              <tr><td>Côté <i>c\u003c/i>\u003c/td><td>1\u003c/td><td>2\u003c/td><td>3\u003c/td><td>4\u003c/td>\u003c/tr>\n              <tr><td>Périmètre <i>P\u003c/i>\u003c/td><td>4\u003c/td><td>8\u003c/td><td>12\u003c/td><td>16\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n      <div class=\"card card-accent\">\n        <h3>📈 Une courbe\u003c/h3>\n        <p>Une courbe relie les deux grandeurs.\u003c/p>\n        <div class=\"fig small\" id=\"g-carre\" style=\"padding:0;border:0;box-shadow:none\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">2\u003c/span> Définition et notation\u003c/h2>\n    <div class=\"callout definition\">\n      <p class=\"callout-title\">Définition\u003c/p>\n      <p>Une <strong>fonction\u003c/strong> est un <strong>processus\u003c/strong> qui, à un nombre <i>x\u003c/i>, fait correspondre <strong>un unique\u003c/strong> autre nombre <i>y\u003c/i>, en utilisant <strong>toujours la même suite de calculs\u003c/strong>.\u003c/p>\n    \u003c/div>\n\n    <div class=\"machine\" aria-label=\"Schéma d'une fonction : x entre, la fonction calcule, f(x) sort\">\n      <div class=\"m-box m-in\"><small>entrée\u003c/small><i>x\u003c/i>\u003c/div>\n      <div class=\"m-arrow\">➜\u003c/div>\n      <div class=\"m-box m-fn\"><small>la fonction <i>f\u003c/i> calcule\u003c/small>\\(x^2 - 3\\)\u003c/div>\n      <div class=\"m-arrow\">➜\u003c/div>\n      <div class=\"m-box m-out\"><small>sortie\u003c/small><i>f\u003c/i>(<i>x\u003c/i>)\u003c/div>\n    \u003c/div>\n\n    <div class=\"card\">\n      <h3>🧪 Teste la machine <i>f\u003c/i> : <i>x\u003c/i> ↦ <i>x\u003c/i>² − 3\u003c/h3>\n      <div class=\"m-test\">\n        <label for=\"mach-x\">Choisis un nombre <i>x\u003c/i> :\u003c/label>\n        <input type=\"number\" id=\"mach-x\" class=\"answer-input sm\" value=\"2\" step=\"any\" inputmode=\"decimal\">\n      \u003c/div>\n      <div class=\"m-result\" id=\"mach-out\" aria-live=\"polite\">\u003c/div>\n    \u003c/div>\n\n    <div class=\"callout definition\">\n      <p class=\"callout-title\">Notations\u003c/p>\n      <p>La fonction <i>f\u003c/i>, qui à chaque nombre <i>x\u003c/i> associe le nombre <i>y\u003c/i>, se note <strong><i>f\u003c/i> : <i>x\u003c/i> ↦ <i>y\u003c/i>\u003c/strong>. On peut aussi écrire <strong><i>y\u003c/i> = <i>f\u003c/i>(<i>x\u003c/i>)\u003c/strong>, et on lit « <i>f\u003c/i> de <i>x\u003c/i> ».\u003c/p>\n    \u003c/div>\n    <div class=\"callout attention\">\n      <p class=\"callout-title\">Attention !\u003c/p>\n      <p>Il ne s'agit <strong>pas du produit\u003c/strong> de <i>f\u003c/i> par <i>x\u003c/i>. <i>x\u003c/i> et <i>f\u003c/i>(<i>x\u003c/i>) sont des <strong>nombres\u003c/strong>, mais pas <i>f\u003c/i> (<i>f\u003c/i> est le nom de la fonction).\u003c/p>\n    \u003c/div>\n    <div class=\"callout exemple\">\n      <p class=\"callout-title\">Exemple\u003c/p>\n      <p>Soit <i>f\u003c/i> : <i>x\u003c/i> ↦ <i>x\u003c/i>² − 3. À chaque nombre <i>x\u003c/i>, on associe le nombre <i>y\u003c/i> tel que <i>y\u003c/i> = <i>x\u003c/i>² − 3.\u003c/p>\n      <p>La fonction peut aussi être définie par l'égalité <span class=\"formula\" style=\"display:inline;font-size:1.1em\">\\(f(x) = x^2 - 3\\)\u003c/span>, appelée <strong>expression\u003c/strong> de la fonction <i>f\u003c/i>.\u003c/p>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">3\u003c/span> Vocabulaire : image et antécédent\u003c/h2>\n    <div class=\"grid-2\">\n      <div class=\"card card-accent\">\n        <h3>🎯 L'image\u003c/h3>\n        <p>Le nombre <i>f\u003c/i>(<i>x\u003c/i>) est <strong>l'image\u003c/strong> du nombre <i>x\u003c/i> par la fonction <i>f\u003c/i>.\u003c/p>\n        <p><strong>L'image est unique.\u003c/strong>\u003c/p>\n      \u003c/div>\n      <div class=\"card card-accent\">\n        <h3>🔎 L'antécédent\u003c/h3>\n        <p>Le nombre <i>x\u003c/i> est <strong>un antécédent\u003c/strong> du nombre <i>f\u003c/i>(<i>x\u003c/i>).\u003c/p>\n        <p><strong>Un nombre peut avoir plusieurs antécédents.\u003c/strong>\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    <div class=\"machine\" aria-label=\"x a pour image f(x)\">\n      <div class=\"m-box m-in\"><small>antécédent\u003c/small><i>x\u003c/i>\u003c/div>\n      <div class=\"m-arrow\">⟼\u003c/div>\n      <div class=\"m-box m-out\"><small>image\u003c/small><i>f\u003c/i>(<i>x\u003c/i>)\u003c/div>\n    \u003c/div>\n\n    <p>Reprenons <i>f\u003c/i>(<i>x\u003c/i>) = <i>x\u003c/i>² − 3 avec un tableau de valeurs :\u003c/p>\n    <div class=\"table-wrap\">\n      <table class=\"tbl-c\">\n        <tbody>\n          <tr><td><i>x\u003c/i>\u003c/td><td>−2\u003c/td><td>−1\u003c/td><td>0\u003c/td><td>1\u003c/td><td>2\u003c/td>\u003c/tr>\n          <tr><td><i>f\u003c/i>(<i>x\u003c/i>)\u003c/td><td>1\u003c/td><td>−2\u003c/td><td>−3\u003c/td><td>−2\u003c/td><td>1\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n\n    <div class=\"fig\">\n      <svg class=\"map\" viewBox=\"0 0 380 190\" role=\"img\" aria-label=\"Diagramme à flèches : -2 et 2 ont pour image 1, et 0 a pour image -3\">\n        <defs>\n          <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n            <path d=\"M0 0L10 5L0 10z\" class=\"mk\"/>\n          \u003c/marker>\n        \u003c/defs>\n        <text class=\"h\" x=\"70\" y=\"16\">Antécédents\u003c/text>\n        <text class=\"h\" x=\"310\" y=\"16\">Images\u003c/text>\n        <line class=\"link\" x1=\"96\" y1=\"52\" x2=\"282\" y2=\"86\" marker-end=\"url(#ah)\"/>\n        <line class=\"link\" x1=\"96\" y1=\"102\" x2=\"282\" y2=\"92\" marker-end=\"url(#ah)\"/>\n        <line class=\"link\" x1=\"96\" y1=\"152\" x2=\"282\" y2=\"152\" marker-end=\"url(#ah)\"/>\n        <circle class=\"node\" cx=\"70\" cy=\"52\" r=\"24\"/><text x=\"70\" y=\"58\">−2\u003c/text>\n        <circle class=\"node\" cx=\"70\" cy=\"102\" r=\"24\"/><text x=\"70\" y=\"108\">2\u003c/text>\n        <circle class=\"node\" cx=\"70\" cy=\"152\" r=\"24\"/><text x=\"70\" y=\"158\">0\u003c/text>\n        <circle class=\"node out\" cx=\"310\" cy=\"89\" r=\"24\"/><text x=\"310\" y=\"95\">1\u003c/text>\n        <circle class=\"node out\" cx=\"310\" cy=\"152\" r=\"24\"/><text x=\"310\" y=\"158\">−3\u003c/text>\n      \u003c/svg>\n      <p class=\"cap\">Chaque nombre de gauche a <strong>une seule\u003c/strong> image. Mais <strong>1\u003c/strong> a <strong>deux antécédents\u003c/strong> : −2 et 2.\u003c/p>\n    \u003c/div>\n\n    <h2>✅ Teste-toi (clique pour voir la réponse)\u003c/h2>\n    <details class=\"reveal\">\n      <summary><span>Pour <i>f\u003c/i>(<i>x\u003c/i>) = <i>x\u003c/i>² − 3, quelle est l'image de 3 ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Réponse : <i>f\u003c/i>(3) = 6\u003c/span>\n        <p>3² − 3 = 9 − 3 = 6. L'image de 3 par <i>f\u003c/i> est 6.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Quels sont les antécédents de 6 par cette même fonction ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Réponse : 3 et −3\u003c/span>\n        <p>On cherche <i>x\u003c/i> tel que <i>x\u003c/i>² − 3 = 6, donc <i>x\u003c/i>² = 9, donc <i>x\u003c/i> = 3 ou <i>x\u003c/i> = −3. Le nombre 6 a <strong>deux antécédents\u003c/strong>.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 2 : COURBE & TABLEAU ===================== -->\n  <section id=\"graphique\" class=\"tab-content\">\n    <h2>📊 La représentation graphique d'une fonction\u003c/h2>\n    <div class=\"callout definition\">\n      <p class=\"callout-title\">Définition\u003c/p>\n      <p>Dans un repère, la <strong>représentation graphique\u003c/strong> d'une fonction <i>f\u003c/i> est formée de l'ensemble des points de coordonnées <strong>(<i>x\u003c/i> ; <i>f\u003c/i>(<i>x\u003c/i>))\u003c/strong>.\u003c/p>\n    \u003c/div>\n\n    <div class=\"grid-2\">\n      <div class=\"card card-accent\">\n        <h3>➡️ Axe horizontal\u003c/h3>\n        <p>Les <strong>abscisses\u003c/strong> (<i>x\u003c/i>) sont les <strong>antécédents\u003c/strong>.\u003c/p>\n      \u003c/div>\n      <div class=\"card card-accent\">\n        <h3>⬆️ Axe vertical\u003c/h3>\n        <p>Les <strong>ordonnées\u003c/strong> (<i>y\u003c/i>) sont les <strong>images\u003c/strong> <i>f\u003c/i>(<i>x\u003c/i>).\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">1\u003c/span> Méthode pour tracer une courbe\u003c/h2>\n    <ol>\n      <li>On construit un <strong>tableau de valeurs\u003c/strong> : on calcule <i>f\u003c/i>(<i>x\u003c/i>) pour plusieurs valeurs de <i>x\u003c/i>.\u003c/li>\n      <li>On place chaque point de coordonnées (<i>x\u003c/i> ; <i>f\u003c/i>(<i>x\u003c/i>)) dans le repère.\u003c/li>\n      <li>On <strong>relie\u003c/strong> les points par une courbe régulière. Plus on a de points, plus le tracé est précis.\u003c/li>\n    \u003c/ol>\n\n    <div class=\"callout exemple\">\n      <p class=\"callout-title\">Exemple : la fonction carré\u003c/p>\n      <p>Soit <i>f\u003c/i>(<i>x\u003c/i>) = <i>x\u003c/i>². On calcule un tableau de valeurs :\u003c/p>\n      <div class=\"table-wrap\">\n        <table class=\"tbl-c\">\n          <tbody>\n            <tr><td><i>x\u003c/i>\u003c/td><td>−3\u003c/td><td>−2\u003c/td><td>−1\u003c/td><td>0\u003c/td><td>1\u003c/td><td>2\u003c/td><td>3\u003c/td>\u003c/tr>\n            <tr><td><i>f\u003c/i>(<i>x\u003c/i>)\u003c/td><td>9\u003c/td><td>4\u003c/td><td>1\u003c/td><td>0\u003c/td><td>1\u003c/td><td>4\u003c/td><td>9\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      <p>Par exemple <i>f\u003c/i>(−3) = (−3)² = 9 : on place le point de coordonnées (−3 ; 9).\u003c/p>\n    \u003c/div>\n\n    <div class=\"fig\">\n      <div id=\"g-parab\">\u003c/div>\n      <p class=\"cap\">Courbe de la fonction <i>f\u003c/i> : <i>x\u003c/i> ↦ <i>x\u003c/i>². On remarque qu'elle est symétrique par rapport à l'axe des ordonnées.\u003c/p>\n    \u003c/div>\n\n    <div class=\"callout attention\">\n      <p class=\"callout-title\">Attention !\u003c/p>\n      <p>Une courbe se trace à la main <strong>sans règle\u003c/strong> : on relie les points avec un trait souple, sans faire de « pointes ». Pour être plus précis, on ajoute des points intermédiaires (par exemple <i>x\u003c/i> = 0,5 ; 1,5 ; 2,5…).\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 3 : LIRE UN GRAPHIQUE ===================== -->\n  <section id=\"lire\" class=\"tab-content\">\n    <h2>👀 Lire sur un graphique\u003c/h2>\n\n    <h2 class=\"section-title\"><span class=\"num\">a\u003c/span> Lire des images\u003c/h2>\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">Méthode\u003c/p>\n      <p>À partir de <i>x\u003c/i> sur l'axe des <strong>abscisses\u003c/strong>, on se déplace <strong>verticalement\u003c/strong> jusqu'à la courbe, puis <strong>horizontalement\u003c/strong> jusqu'à l'axe des <strong>ordonnées\u003c/strong>.\u003c/p>\n    \u003c/div>\n\n    <div class=\"card\">\n      <h3>🕹️ À toi de jouer : déplace <i>x\u003c/i>\u003c/h3>\n      <div class=\"ctrl\">\n        <label for=\"sl-x\"><i>x\u003c/i> = <output id=\"o-x\">2\u003c/output>\u003c/label>\n        <input type=\"range\" id=\"sl-x\" min=\"0\" max=\"10\" step=\"0.5\" value=\"2\">\n      \u003c/div>\n      <div class=\"fig\" style=\"margin-bottom:0\"><div id=\"g-img\">\u003c/div>\u003c/div>\n      <p class=\"read-out img\" id=\"t-img\" aria-live=\"polite\">\u003c/p>\n    \u003c/div>\n    <p class=\"muted small\">Sur un graphique, la lecture est souvent une valeur <strong>approchée\u003c/strong> (on écrit « ≈ »). Elle est <strong>exacte\u003c/strong> seulement quand la courbe passe pile sur un croisement de la grille.\u003c/p>\n\n    <h2 class=\"section-title\"><span class=\"num\">b\u003c/span> Lire des antécédents\u003c/h2>\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">Méthode\u003c/p>\n      <p>À partir de <i>y\u003c/i> sur l'axe des <strong>ordonnées\u003c/strong>, on se déplace <strong>horizontalement\u003c/strong> jusqu'à la courbe, puis <strong>verticalement\u003c/strong> jusqu'à l'axe des <strong>abscisses\u003c/strong>. Il peut y avoir <strong>plusieurs\u003c/strong> antécédents… ou <strong>aucun\u003c/strong> !\u003c/p>\n    \u003c/div>\n\n    <div class=\"card\">\n      <h3>🕹️ À toi de jouer : déplace <i>y\u003c/i>\u003c/h3>\n      <div class=\"ctrl\">\n        <label for=\"sl-y\"><i>y\u003c/i> = <output id=\"o-y\">3\u003c/output>\u003c/label>\n        <input type=\"range\" id=\"sl-y\" min=\"0\" max=\"6\" step=\"0.5\" value=\"3\">\n      \u003c/div>\n      <div class=\"fig\" style=\"margin-bottom:0\"><div id=\"g-ant\">\u003c/div>\u003c/div>\n      <p class=\"read-out ant\" id=\"t-ant\" aria-live=\"polite\">\u003c/p>\n    \u003c/div>\n    <div class=\"callout exemple\">\n      <p class=\"callout-title\">À retenir sur cette courbe\u003c/p>\n      <ul>\n        <li>Les antécédents de <strong>3\u003c/strong> sont <strong>2 et 8\u003c/strong> : <i>f\u003c/i>(2) = 3 et <i>f\u003c/i>(8) = 3.\u003c/li>\n        <li>Les antécédents de <strong>2\u003c/strong> sont environ <strong>1 et 10\u003c/strong>.\u003c/li>\n        <li><strong>6\u003c/strong> n'a <strong>pas d'antécédent\u003c/strong> : la courbe n'atteint jamais cette hauteur.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">c\u003c/span> Exemple corrigé\u003c/h2>\n    <p>Le graphique ci-dessous représente la fonction <i>f\u003c/i> : <i>x\u003c/i> ↦ <i>x\u003c/i>² − 4.\u003c/p>\n    <div class=\"fig\">\n      <div id=\"g-lire-ex\">\u003c/div>\n      <p class=\"cap\"><span style=\"color:var(--warning);font-weight:700\">Orange\u003c/span> : on lit une image. <span style=\"color:var(--success);font-weight:700\">Vert\u003c/span> : on lit des antécédents.\u003c/p>\n    \u003c/div>\n    <details class=\"reveal\">\n      <summary><span>a. Détermine graphiquement <i>f\u003c/i>(1,5).\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\"><i>f\u003c/i>(1,5) = −1,75\u003c/span>\n        <p>On part de 1,5 sur l'axe des abscisses, on va <strong>verticalement\u003c/strong> jusqu'à la courbe, puis <strong>horizontalement\u003c/strong> jusqu'à l'axe des ordonnées. (Vérification : 1,5² − 4 = 2,25 − 4 = −1,75.)\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Détermine graphiquement le (les) antécédent(s) de −3 par <i>f\u003c/i>.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">−3 a deux antécédents par <i>f\u003c/i> : −1 et 1.\u003c/span>\n        <p>On part de −3 sur l'axe des ordonnées, on va <strong>horizontalement\u003c/strong> : on rencontre la courbe en deux points, puis on descend <strong>verticalement\u003c/strong> vers l'axe des abscisses.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 4 : DROITES ===================== -->\n  <section id=\"droites\" class=\"tab-content\">\n    <h2>📏 Fonctions linéaires et fonctions affines\u003c/h2>\n    <div class=\"grid-2\">\n      <div class=\"card card-accent\">\n        <h3>Fonction linéaire\u003c/h3>\n        <span class=\"formula\">\\(f(x) = ax\\)\u003c/span>\n        <p>Sa représentation graphique est une <strong>droite qui passe par l'origine\u003c/strong> du repère.\u003c/p>\n        <p>👉 <strong>Un seul point\u003c/strong> (autre que l'origine) suffit pour la tracer.\u003c/p>\n      \u003c/div>\n      <div class=\"card card-accent\">\n        <h3>Fonction affine\u003c/h3>\n        <span class=\"formula\">\\(g(x) = ax + b\\)\u003c/span>\n        <p>Sa représentation graphique est une <strong>droite\u003c/strong>.\u003c/p>\n        <p>👉 <strong>Deux points\u003c/strong> suffisent pour la tracer.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">1\u003c/span> Exemple corrigé : construire une représentation graphique\u003c/h2>\n    <div class=\"callout exemple\">\n      <p class=\"callout-title\">a. Fonction linéaire\u003c/p>\n      <p>Soit <i>f\u003c/i>(<i>x\u003c/i>) = −0,5<i>x\u003c/i>. <i>f\u003c/i> est une fonction linéaire, donc sa représentation graphique est une droite qui passe par l'origine du repère. Il suffit de connaître un de ses points : <i>f\u003c/i>(6) = −0,5 × 6 = <strong>−3\u003c/strong>.\u003c/p>\n      <p>La droite (<i>d<sub>f\u003c/sub>\u003c/i>) est la droite (OA) avec <strong>A(6 ; −3)\u003c/strong>.\u003c/p>\n    \u003c/div>\n    <div class=\"callout exemple\">\n      <p class=\"callout-title\">b. Fonction affine\u003c/p>\n      <p>Soit <i>g\u003c/i> : <i>x\u003c/i> ↦ 3<i>x\u003c/i> − 2. <i>g\u003c/i> est une fonction affine, donc sa représentation graphique est une droite. Il faut connaître deux de ses points :\u003c/p>\n      <p><i>g\u003c/i>(−1) = 3 × (−1) − 2 = <strong>−5\u003c/strong> et <i>g\u003c/i>(2) = 3 × 2 − 2 = <strong>4\u003c/strong>.\u003c/p>\n      <p>La droite (<i>d<sub>g\u003c/sub>\u003c/i>) est la droite (BC) avec <strong>B(−1 ; −5)\u003c/strong> et <strong>C(2 ; 4)\u003c/strong>.\u003c/p>\n    \u003c/div>\n    <div class=\"fig\">\n      <div id=\"g-droites\">\u003c/div>\n      <p class=\"cap\">Les deux droites de l'exemple.\u003c/p>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">2\u003c/span> Explore : change <i>a\u003c/i> et <i>b\u003c/i>\u003c/h2>\n    <div class=\"card\">\n      <h3>🕹️ La droite d'équation <i>y\u003c/i> = <i>a\u003c/i><i>x\u003c/i> + <i>b\u003c/i>\u003c/h3>\n      <div class=\"ctrl\">\n        <label for=\"sl-a\"><i>a\u003c/i> = <output id=\"o-a\">1\u003c/output>\u003c/label>\n        <input type=\"range\" id=\"sl-a\" min=\"-3\" max=\"3\" step=\"0.5\" value=\"1\">\n      \u003c/div>\n      <div class=\"ctrl\">\n        <label for=\"sl-b\"><i>b\u003c/i> = <output id=\"o-b\">-1\u003c/output>\u003c/label>\n        <input type=\"range\" id=\"sl-b\" min=\"-4\" max=\"4\" step=\"1\" value=\"-1\">\n      \u003c/div>\n      <div class=\"fig\" style=\"margin-bottom:0\"><div id=\"g-explore\">\u003c/div>\u003c/div>\n      <p class=\"read-out\" id=\"t-explore\" aria-live=\"polite\">\u003c/p>\n    \u003c/div>\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">Ce que tu peux observer\u003c/p>\n      <ul>\n        <li>Quand <strong><i>b\u003c/i> = 0\u003c/strong>, la droite passe par l'origine : c'est une fonction <strong>linéaire\u003c/strong>.\u003c/li>\n        <li><i>b\u003c/i> est la <strong>hauteur où la droite coupe l'axe des ordonnées\u003c/strong> : c'est <i>g\u003c/i>(0).\u003c/li>\n        <li>Quand <i>a\u003c/i> est positif, la droite <strong>monte\u003c/strong> ; quand <i>a\u003c/i> est négatif, elle <strong>descend\u003c/strong>.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 5 : EXERCICES ===================== -->\n  <section id=\"exercices\" class=\"tab-content\">\n    <h2>✏️ Exercices guidés\u003c/h2>\n    <p class=\"muted\">Cherche d'abord sur ton cahier, puis clique sur la question pour vérifier ta réponse.\u003c/p>\n\n    \u003c!-- Exercice 1 -->\n    <h3 class=\"ex-title\"><span class=\"tag primary\">Exercice 1\u003c/span> Images et antécédents avec une formule\u003c/h3>\n    <p>Soit <i>f\u003c/i> la fonction définie par \\(f(x) = x^2 - 3\\).\u003c/p>\n    <details class=\"reveal\">\n      <summary><span>a. Calcule l'image de 5 par <i>f\u003c/i>.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\"><i>f\u003c/i>(5) = 22\u003c/span>\n        <p><i>f\u003c/i>(5) = 5² − 3 = 25 − 3 = 22.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Calcule <i>f\u003c/i>(−4).\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\"><i>f\u003c/i>(−4) = 13\u003c/span>\n        <p><i>f\u003c/i>(−4) = (−4)² − 3 = 16 − 3 = 13. Attention aux parenthèses : (−4)² = 16 (et pas −16).\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>c. Quels sont les antécédents de 1 par <i>f\u003c/i> ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Les antécédents de 1 sont 2 et −2.\u003c/span>\n        <p>On résout <i>x\u003c/i>² − 3 = 1, donc <i>x\u003c/i>² = 4, donc <i>x\u003c/i> = 2 ou <i>x\u003c/i> = −2.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>d. Quels sont les antécédents de −3 ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Un seul antécédent : 0.\u003c/span>\n        <p><i>x\u003c/i>² − 3 = −3 donne <i>x\u003c/i>² = 0, donc <i>x\u003c/i> = 0.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>e. Le nombre −5 a-t-il un antécédent ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Non, −5 n'a aucun antécédent.\u003c/span>\n        <p><i>x\u003c/i>² − 3 = −5 donnerait <i>x\u003c/i>² = −2. Or un carré n'est jamais négatif : c'est impossible.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    \u003c!-- Exercice 2 -->\n    <h3 class=\"ex-title\" style=\"margin-top:var(--space-8)\"><span class=\"tag primary\">Exercice 2\u003c/span> Tableau de valeurs et courbe\u003c/h3>\n    <p class=\"src\">Dans l'esprit de la fiche « Construire une représentation graphique » (série 6).\u003c/p>\n    <p>On considère la fonction <i>f\u003c/i> définie par \\(f(x) = x^2 - 2x - 1\\) pour <i>x\u003c/i> compris entre −1 et 4.\u003c/p>\n    <details class=\"reveal\">\n      <summary><span>a. Complète le tableau de valeurs pour <i>x\u003c/i> = −1 ; 0 ; 1 ; 2 ; 3 ; 4.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <div class=\"table-wrap\">\n          <table class=\"tbl-c\">\n            <tbody>\n              <tr><td><i>x\u003c/i>\u003c/td><td>−1\u003c/td><td>0\u003c/td><td>1\u003c/td><td>2\u003c/td><td>3\u003c/td><td>4\u003c/td>\u003c/tr>\n              <tr><td><i>f\u003c/i>(<i>x\u003c/i>)\u003c/td><td>2\u003c/td><td>−1\u003c/td><td>−2\u003c/td><td>−1\u003c/td><td>2\u003c/td><td>7\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        <p>Exemples : <i>f\u003c/i>(−1) = (−1)² − 2 × (−1) − 1 = 1 + 2 − 1 = 2 ; <i>f\u003c/i>(3) = 9 − 6 − 1 = 2 ; <i>f\u003c/i>(4) = 16 − 8 − 1 = 7.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Donne les coordonnées des six points A, B, C, D, E et F de la courbe.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">A(−1 ; 2) · B(0 ; −1) · C(1 ; −2) · D(2 ; −1) · E(3 ; 2) · F(4 ; 7)\u003c/span>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>c. Pour être plus précis, calcule aussi <i>f\u003c/i>(−0,5), <i>f\u003c/i>(0,5), <i>f\u003c/i>(1,5), <i>f\u003c/i>(2,5) et <i>f\u003c/i>(3,5).\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <div class=\"table-wrap\">\n          <table class=\"tbl-c\">\n            <tbody>\n              <tr><td><i>x\u003c/i>\u003c/td><td>−0,5\u003c/td><td>0,5\u003c/td><td>1,5\u003c/td><td>2,5\u003c/td><td>3,5\u003c/td>\u003c/tr>\n              <tr><td><i>f\u003c/i>(<i>x\u003c/i>)\u003c/td><td>0,25\u003c/td><td>−1,75\u003c/td><td>−1,75\u003c/td><td>0,25\u003c/td><td>4,25\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        <span class=\"solution\">G(−0,5 ; 0,25) · H(0,5 ; −1,75) · I(1,5 ; −1,75) · J(2,5 ; 0,25) · K(3,5 ; 4,25)\u003c/span>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>d. Place tous ces points et trace la courbe : voir la correction.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <div class=\"fig\"><div id=\"g-ex2\">\u003c/div>\n          <p class=\"cap\">Les points A à F sont les gros points, G à K les petits points intermédiaires.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/details>\n\n    \u003c!-- Exercice 3 -->\n    <h3 class=\"ex-title\" style=\"margin-top:var(--space-8)\"><span class=\"tag primary\">Exercice 3\u003c/span> Fonctions linéaires\u003c/h3>\n    <p class=\"src\">Dans l'esprit de la fiche « Construire une représentation graphique » (série 6).\u003c/p>\n    <p>Soit les fonctions <i>f\u003c/i> : <i>x\u003c/i> ↦ 4<i>x\u003c/i> et <i>g\u003c/i> : <i>x\u003c/i> ↦ −4<i>x\u003c/i>.\u003c/p>\n    <details class=\"reveal\">\n      <summary><span>a. Quelle est la nature de leur représentation graphique ? Justifie.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Ce sont deux droites qui passent par l'origine.\u003c/span>\n        <p><i>f\u003c/i> et <i>g\u003c/i> sont des fonctions linéaires (de la forme <i>x\u003c/i> ↦ <i>ax\u003c/i>).\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Calcule les coordonnées des points F et G d'abscisse 1 de la courbe de <i>f\u003c/i> puis de celle de <i>g\u003c/i>.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">F(1 ; 4) et G(1 ; −4)\u003c/span>\n        <p><i>f\u003c/i>(1) = 4 × 1 = 4 et <i>g\u003c/i>(1) = −4 × 1 = −4.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <p>Trace la représentation graphique de chaque fonction dans un repère orthonormé : \\(f_1(x) = 2x\\) ; \\(f_2(x) = -3x\\) ; \\(f_3(x) = -1,5x\\) ; \\(f_4(x) = \\frac{1}{2}x\\).\u003c/p>\n    <details class=\"reveal\">\n      <summary><span>c. Voir la correction.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <p>Chaque droite passe par l'origine ; on calcule un seul autre point :\u003c/p>\n        <ul>\n          <li><i>f\u003c/i><sub>1\u003c/sub>(1) = 2 → point (1 ; 2)\u003c/li>\n          <li><i>f\u003c/i><sub>2\u003c/sub>(1) = −3 → point (1 ; −3)\u003c/li>\n          <li><i>f\u003c/i><sub>3\u003c/sub>(2) = −1,5 × 2 = −3 → point (2 ; −3)\u003c/li>\n          <li><i>f\u003c/i><sub>4\u003c/sub>(2) = ½ × 2 = 1 → point (2 ; 1)\u003c/li>\n        \u003c/ul>\n        <div class=\"fig\"><div id=\"g-ex3\">\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/details>\n\n    \u003c!-- Exercice 4 -->\n    <h3 class=\"ex-title\" style=\"margin-top:var(--space-8)\"><span class=\"tag primary\">Exercice 4\u003c/span> Une fonction affine\u003c/h3>\n    <p class=\"src\">Dans l'esprit de la fiche « Construire une représentation graphique » (série 6).\u003c/p>\n    <p>Soit la fonction <i>g\u003c/i> : <i>x\u003c/i> ↦ 2<i>x\u003c/i> − 1.\u003c/p>\n    <details class=\"reveal\">\n      <summary><span>a. Quelle est la nature de sa représentation graphique ? Complète le tableau pour <i>x\u003c/i> = 0 et <i>x\u003c/i> = 1.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\"><i>g\u003c/i> est une fonction affine : sa représentation graphique est une droite.\u003c/span>\n        <div class=\"table-wrap\">\n          <table class=\"tbl-c\">\n            <tbody>\n              <tr><td><i>x\u003c/i>\u003c/td><td>0\u003c/td><td>1\u003c/td>\u003c/tr>\n              <tr><td><i>g\u003c/i>(<i>x\u003c/i>)\u003c/td><td>−1\u003c/td><td>1\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        <p>Deux points de la droite : (0 ; −1) et (1 ; 1).\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Trace la droite dans un repère.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <div class=\"fig\"><div id=\"g-ex4\">\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>c. Complète (graphiquement ou par le calcul).\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <div class=\"table-wrap\">\n          <table class=\"tbl-c\">\n            <thead><tr><th>Question\u003c/th><th>Réponse\u003c/th><th>Calcul\u003c/th>\u003c/tr>\u003c/thead>\n            <tbody>\n              <tr><td>Image de 2 par <i>g\u003c/i>\u003c/td><td>3\u003c/td><td>2 × 2 − 1 = 3\u003c/td>\u003c/tr>\n              <tr><td>Nombre dont l'image est 2\u003c/td><td>1,5\u003c/td><td>2<i>x\u003c/i> − 1 = 2 donc <i>x\u003c/i> = 1,5\u003c/td>\u003c/tr>\n              <tr><td>Image de 0,5\u003c/td><td>0\u003c/td><td>2 × 0,5 − 1 = 0\u003c/td>\u003c/tr>\n              <tr><td>Antécédent de −3\u003c/td><td>−1\u003c/td><td>2<i>x\u003c/i> − 1 = −3 donc <i>x\u003c/i> = −1\u003c/td>\u003c/tr>\n              <tr><td><i>g\u003c/i>(−1,5)\u003c/td><td>−4\u003c/td><td>2 × (−1,5) − 1 = −4\u003c/td>\u003c/tr>\n              <tr><td><i>g\u003c/i>(2,5)\u003c/td><td>4\u003c/td><td>2 × 2,5 − 1 = 4\u003c/td>\u003c/tr>\n              <tr><td><i>g\u003c/i>( … ) = 1\u003c/td><td>1\u003c/td><td>2<i>x\u003c/i> − 1 = 1 donc <i>x\u003c/i> = 1\u003c/td>\u003c/tr>\n              <tr><td><i>g\u003c/i>( … ) = −1,5\u003c/td><td>−0,25\u003c/td><td>2<i>x\u003c/i> − 1 = −1,5 donc <i>x\u003c/i> = −0,25\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n    \u003c/details>\n\n    \u003c!-- Exercice 5 -->\n    <h3 class=\"ex-title\" style=\"margin-top:var(--space-8)\"><span class=\"tag primary\">Exercice 5\u003c/span> Lire une courbe\u003c/h3>\n    <p class=\"src\">Dans l'esprit de la fiche « Déterminer une image ou un antécédent à partir d'une courbe » (série 5).\u003c/p>\n    <p>Ce graphique représente la fonction <i>f\u003c/i> : <i>x\u003c/i> ↦ <i>x\u003c/i>² − 4 pour <i>x\u003c/i> compris entre −3 et 3.\u003c/p>\n    <div class=\"fig\"><div id=\"g-ex5\">\u003c/div>\u003c/div>\n    <details class=\"reveal\">\n      <summary><span>a. Détermine graphiquement les images de −1, de 0 et de 2.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\"><i>f\u003c/i>(−1) = −3 · <i>f\u003c/i>(0) = −4 · <i>f\u003c/i>(2) = 0\u003c/span>\n        <p>On part de l'axe des abscisses, on monte (ou on descend) jusqu'à la courbe, puis on va vers l'axe des ordonnées.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Quels sont les antécédents de 0 ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">−2 et 2\u003c/span>\n        <p>La courbe coupe l'axe des abscisses en deux points, d'abscisses −2 et 2.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>c. Combien d'antécédents a le nombre −4 ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Un seul : 0.\u003c/span>\n        <p>−4 est la valeur la plus basse de la courbe : elle n'est atteinte qu'en un seul point.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>d. Combien d'antécédents a −5 ? Et le nombre 1 ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">−5 n'a aucun antécédent ; 1 en a deux.\u003c/span>\n        <p>La courbe ne descend jamais sous −4, donc −5 n'est jamais atteint. En revanche, à la hauteur 1 on coupe la courbe en deux points (environ −2,2 et 2,2).\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>e. Que peut-on dire de l'image de 2 et de l'image de −2 ? Que peut-on dire de la courbe ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">C'est la même : <i>f\u003c/i>(2) = <i>f\u003c/i>(−2) = 0.\u003c/span>\n        <p>La courbe est <strong>symétrique par rapport à l'axe des ordonnées\u003c/strong>.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    \u003c!-- Exercice 6 -->\n    <h3 class=\"ex-title\" style=\"margin-top:var(--space-8)\"><span class=\"tag primary\">Exercice 6\u003c/span> Une formule avec une fraction\u003c/h3>\n    <p class=\"src\">Dans l'esprit de la fiche « Déterminer une image ou un antécédent à partir d'une courbe » (série 5).\u003c/p>\n    <p>Soit <i>f\u003c/i> la fonction définie par \\(f(x) = \\frac{4}{1 + x^2}\\) pour <i>x\u003c/i> compris entre −4 et 4.\u003c/p>\n    <details class=\"reveal\">\n      <summary><span>a. Détermine l'image de 2 et de −2 par <i>f\u003c/i> (résultat sous forme décimale).\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\"><i>f\u003c/i>(2) = <i>f\u003c/i>(−2) = 0,8\u003c/span>\n        <p><i>f\u003c/i>(2) = 4 ÷ (1 + 2²) = 4 ÷ 5 = 0,8 et <i>f\u003c/i>(−2) = 4 ÷ (1 + (−2)²) = 4 ÷ 5 = 0,8.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Quelle est l'ordonnée du point A d'abscisse 3 de la courbe de <i>f\u003c/i> ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">L'ordonnée de A est 0,4.\u003c/span>\n        <p><i>f\u003c/i>(3) = 4 ÷ (1 + 3²) = 4 ÷ 10 = 0,4. Donc A(3 ; 0,4).\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>c. Montre que ½ est un antécédent de 3,2.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">On vérifie que <i>f\u003c/i>(0,5) = 3,2.\u003c/span>\n        <p><i>f\u003c/i>(0,5) = 4 ÷ (1 + 0,5²) = 4 ÷ (1 + 0,25) = 4 ÷ 1,25 = 3,2. Donc 0,5 est bien un antécédent de 3,2.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <p>Voici le graphique de la fonction <i>f\u003c/i> :\u003c/p>\n    <div class=\"fig\"><div id=\"g-ex6\">\u003c/div>\u003c/div>\n    <details class=\"reveal\">\n      <summary><span>d. Détermine graphiquement <i>f\u003c/i>(0), l'image de 2 et l'image de −2.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\"><i>f\u003c/i>(0) = 4 · l'image de 2 est 0,8 · l'image de −2 est 0,8\u003c/span>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>e. Détermine graphiquement les antécédents de 2, puis de 3,2.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Antécédents de 2 : −1 et 1 · Antécédents de 3,2 : −0,5 et 0,5\u003c/span>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>f. Donne un nombre qui a un seul antécédent, un qui en a deux, un qui n'en a aucun.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Un seul : 4 · Deux : par exemple 3 (ou 2, ou 0,8…) · Aucun : par exemple 4,5 (ou 5, ou −1…)\u003c/span>\n        <p>Le maximum de la courbe est 4, atteint seulement en <i>x\u003c/i> = 0. Tous les nombres strictement compris entre 0 et 4 ont deux antécédents. Les nombres plus grands que 4 (ou négatifs) n'en ont aucun.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 6 : À RETENIR ===================== -->\n  <section id=\"retenir\" class=\"tab-content\">\n    <h2>📌 Ce qu'il faut retenir\u003c/h2>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">1. Fonction, image, antécédent\u003c/p>\n      <p>Une fonction <i>f\u003c/i> associe à chaque nombre <i>x\u003c/i> <strong>un unique\u003c/strong> nombre <i>f\u003c/i>(<i>x\u003c/i>) par la même suite de calculs.\u003c/p>\n      <span class=\"formula\">\\(f : x ↦ f(x)\\)\u003c/span>\n      <ul>\n        <li><i>f\u003c/i>(<i>x\u003c/i>) est l'<strong>image\u003c/strong> de <i>x\u003c/i> (une seule).\u003c/li>\n        <li><i>x\u003c/i> est un <strong>antécédent\u003c/strong> de <i>f\u003c/i>(<i>x\u003c/i>) (il peut y en avoir plusieurs, ou aucun).\u003c/li>\n        <li><i>f\u003c/i>(<i>x\u003c/i>) n'est <strong>pas\u003c/strong> un produit.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">2. Représentation graphique\u003c/p>\n      <p>C'est l'ensemble des points de coordonnées <strong>(<i>x\u003c/i> ; <i>f\u003c/i>(<i>x\u003c/i>))\u003c/strong> : abscisse = antécédent, ordonnée = image.\u003c/p>\n      <p>Pour la tracer : <strong>tableau de valeurs\u003c/strong> → <strong>points\u003c/strong> → <strong>courbe\u003c/strong>.\u003c/p>\n    \u003c/div>\n\n    <div class=\"grid-2\">\n      <div class=\"callout retenir\" style=\"margin:0\">\n        <p class=\"callout-title no-icon\">👀 Lire une image\u003c/p>\n        <p>Axe des <strong>abscisses\u003c/strong> → <strong>verticalement\u003c/strong> jusqu'à la courbe → <strong>horizontalement\u003c/strong> jusqu'à l'axe des <strong>ordonnées\u003c/strong>.\u003c/p>\n      \u003c/div>\n      <div class=\"callout retenir\" style=\"margin:0\">\n        <p class=\"callout-title no-icon\">🔎 Lire un antécédent\u003c/p>\n        <p>Axe des <strong>ordonnées\u003c/strong> → <strong>horizontalement\u003c/strong> jusqu'à la courbe → <strong>verticalement\u003c/strong> jusqu'à l'axe des <strong>abscisses\u003c/strong>.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">3. Droites\u003c/p>\n      <ul>\n        <li><strong>Fonction linéaire\u003c/strong> <span style=\"white-space:nowrap\">\\(f(x) = ax\\)\u003c/span> : droite passant par l'<strong>origine\u003c/strong> → <strong>1 point\u003c/strong> suffit.\u003c/li>\n        <li><strong>Fonction affine\u003c/strong> <span style=\"white-space:nowrap\">\\(g(x) = ax + b\\)\u003c/span> : droite → <strong>2 points\u003c/strong> suffisent.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <h2>🃏 Cartes mémoire\u003c/h2>\n    <p class=\"muted\">Réponds dans ta tête, puis touche la carte pour la retourner.\u003c/p>\n    <div id=\"cartes\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 7 : QCM ===================== -->\n  <section id=\"qcm\" class=\"tab-content\">\n    <h2>🎯 QCM : 12 questions tirées au hasard\u003c/h2>\n    <p class=\"muted\">À chaque nouvelle partie, les questions changent. Clique sur « Recommencer » pour rejouer.\u003c/p>\n    <div id=\"quiz-qcm\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 8 : VRAI / FAUX ===================== -->\n  <section id=\"vf\" class=\"tab-content\">\n    <h2>✔️ Vrai ou faux ?\u003c/h2>\n    <p class=\"muted\">Lis bien chaque affirmation avant de répondre.\u003c/p>\n    <div id=\"quiz-vf\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 9 : CALCULS ===================== -->\n  <section id=\"calculs\" class=\"tab-content\">\n    <h2>🧮 Entraînement au calcul\u003c/h2>\n    <p class=\"muted\">Écris seulement le nombre (par exemple <strong>-3\u003c/strong> ou <strong>1,5\u003c/strong>). Chaque série est différente.\u003c/p>\n    <div id=\"quiz-calc\">\u003c/div>\n  \u003c/section>\n\n\u003c/main>\n\n<script>\n(function () {\n  'use strict';\n\n  /* ============ Outils d'affichage ============ */\n  function f2(n, d) {\n    var p = Math.pow(10, d == null ? 2 : d);\n    var r = Math.round(n * p) / p;\n    if (r === 0) r = 0;\n    return String(r).replace('.', ',').replace('-', '−');\n  }\n  var gid = 0;\n\n  /* Dessine un repère (grille, axes, courbes, points, pointillés) et renvoie le code SVG. */\n  function Graph(o) {\n    gid++;\n    var ux = o.ux, uy = o.uy || o.ux;\n    var M = { l: 30, r: 24, t: 22, b: 26 };\n    var W = (o.xmax - o.xmin) * ux + M.l + M.r;\n    var H = (o.ymax - o.ymin) * uy + M.t + M.b;\n    function sx(x) { return Math.round((M.l + (x - o.xmin) * ux) * 100) / 100; }\n    function sy(y) { return Math.round((M.t + (o.ymax - y) * uy) * 100) / 100; }\n    var tx = o.tx || 1, ty = o.ty || 1, x, y, i;\n    var s = '<svg class=\"gx\" viewBox=\"0 0 ' + W + ' ' + H + '\" role=\"img\" aria-label=\"' + (o.label || 'Graphique') + '\">';\n    s += '<defs><clipPath id=\"cp' + gid + '\"><rect x=\"' + sx(o.xmin) + '\" y=\"' + sy(o.ymax) + '\" width=\"' + ((o.xmax - o.xmin) * ux) + '\" height=\"' + ((o.ymax - o.ymin) * uy) + '\"/>\u003c/clipPath>\u003c/defs>';\n\n    for (x = Math.ceil(o.xmin); x <= o.xmax; x++) s += '<line class=\"grid\" x1=\"' + sx(x) + '\" y1=\"' + sy(o.ymax) + '\" x2=\"' + sx(x) + '\" y2=\"' + sy(o.ymin) + '\"/>';\n    for (y = Math.ceil(o.ymin); y <= o.ymax; y++) s += '<line class=\"grid\" x1=\"' + sx(o.xmin) + '\" y1=\"' + sy(y) + '\" x2=\"' + sx(o.xmax) + '\" y2=\"' + sy(y) + '\"/>';\n\n    // axes + flèches\n    var ox = sx(0), oy = sy(0);\n    s += '<line class=\"axis\" x1=\"' + sx(o.xmin) + '\" y1=\"' + oy + '\" x2=\"' + (sx(o.xmax) + 12) + '\" y2=\"' + oy + '\"/>';\n    s += '<line class=\"axis\" x1=\"' + ox + '\" y1=\"' + sy(o.ymin) + '\" x2=\"' + ox + '\" y2=\"' + (sy(o.ymax) - 12) + '\"/>';\n    s += '<polygon class=\"arrow\" points=\"' + (sx(o.xmax) + 16) + ',' + oy + ' ' + (sx(o.xmax) + 7) + ',' + (oy - 4.5) + ' ' + (sx(o.xmax) + 7) + ',' + (oy + 4.5) + '\"/>';\n    s += '<polygon class=\"arrow\" points=\"' + ox + ',' + (sy(o.ymax) - 16) + ' ' + (ox - 4.5) + ',' + (sy(o.ymax) - 7) + ' ' + (ox + 4.5) + ',' + (sy(o.ymax) - 7) + '\"/>';\n    s += '<text class=\"ax\" x=\"' + (sx(o.xmax) + 8) + '\" y=\"' + (oy - 9) + '\" text-anchor=\"middle\">x\u003c/text>';\n    s += '<text class=\"ax\" x=\"' + (ox + 13) + '\" y=\"' + (sy(o.ymax) - 6) + '\" text-anchor=\"middle\">y\u003c/text>';\n\n    // courbes\n    (o.curves || []).forEach(function (c) {\n      var pts = c.pts;\n      if (!pts) {\n        pts = [];\n        var st = c.step || 0.05, n = Math.round((c.to - c.from) / st);\n        for (i = 0; i <= n; i++) { var xx = c.from + i * st; pts.push([xx, c.f(xx)]); }\n      }\n      var d = pts.map(function (p, k) { return (k ? 'L' : 'M') + sx(p[0]) + ' ' + sy(p[1]); }).join(' ');\n      s += '<g clip-path=\"url(#cp' + gid + ')\"><path class=\"curve ' + (c.cls || 's1') + '\" d=\"' + d + '\"/>\u003c/g>';\n    });\n\n    // pointillés de lecture\n    (o.guides || []).forEach(function (g) {\n      s += '<line class=\"guide ' + (g.cls || 'g1') + '\" x1=\"' + sx(g.x1) + '\" y1=\"' + sy(g.y1) + '\" x2=\"' + sx(g.x2) + '\" y2=\"' + sy(g.y2) + '\"/>';\n    });\n\n    // points\n    (o.points || []).forEach(function (p) {\n      s += '<circle class=\"pt ' + (p.cls || 'p1') + '\" cx=\"' + sx(p.x) + '\" cy=\"' + sy(p.y) + '\" r=\"' + (p.r || 5) + '\"/>';\n      if (p.l) s += '<text class=\"lbl ' + (p.tcls || '') + '\" x=\"' + (sx(p.x) + (p.dx == null ? 9 : p.dx)) + '\" y=\"' + (sy(p.y) + (p.dy == null ? -9 : p.dy)) + '\" text-anchor=\"' + (p.a || 'start') + '\">' + p.l + '\u003c/text>';\n    });\n\n    // graduations (dessinées en dernier : elles restent lisibles par-dessus les pointillés)\n    var tk = '';\n    for (x = Math.ceil(o.xmin / tx) * tx; x <= o.xmax + 1e-9; x += tx) {\n      if (Math.abs(x) < 1e-9) continue;\n      tk += '<text x=\"' + sx(x) + '\" y=\"' + (oy + 16) + '\" text-anchor=\"middle\">' + f2(x) + '\u003c/text>';\n    }\n    for (y = Math.ceil(o.ymin / ty) * ty; y <= o.ymax + 1e-9; y += ty) {\n      if (Math.abs(y) < 1e-9) continue;\n      tk += '<text x=\"' + (ox - 7) + '\" y=\"' + (sy(y) + 4.5) + '\" text-anchor=\"end\">' + f2(y) + '\u003c/text>';\n    }\n    tk += '<text x=\"' + (ox - 7) + '\" y=\"' + (oy + 16) + '\" text-anchor=\"end\">0\u003c/text>';\n\n    s += tk;\n\n    // textes libres\n    (o.texts || []).forEach(function (t) {\n      s += '<text class=\"lbl ' + (t.cls || '') + '\" x=\"' + (sx(t.x) + (t.dx || 0)) + '\" y=\"' + (sy(t.y) + (t.dy || 0)) + '\" text-anchor=\"' + (t.a || 'middle') + '\">' + t.t + '\u003c/text>';\n    });\n    return s + '\u003c/svg>';\n  }\n  function put(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }\n\n  /* ============ Graphiques fixes ============ */\n  // 1. Périmètre du carré\n  put('g-carre', Graph({\n    xmin: 0, xmax: 5, ymin: 0, ymax: 20, ux: 44, uy: 11, ty: 4, label: 'Périmètre du carré en fonction du côté',\n    curves: [{ pts: [[0, 0], [5, 20]], cls: 's1' }],\n    points: [{ x: 1, y: 4 }, { x: 2, y: 8 }, { x: 3, y: 12 }, { x: 4, y: 16 }]\n  }));\n\n  // 2. f(x) = x²\n  put('g-parab', Graph({\n    xmin: -4, xmax: 4, ymin: -1, ymax: 10, ux: 50, uy: 24, label: 'Courbe de la fonction carré',\n    curves: [{ f: function (x) { return x * x; }, from: -3.2, to: 3.2, cls: 's1' }],\n    points: [\n      { x: -3, y: 9, l: '(−3 ; 9)', a: 'end', dx: -9, dy: 4 },\n      { x: -2, y: 4 }, { x: -1, y: 1 },\n      { x: 0, y: 0 },\n      { x: 1, y: 1 }, { x: 2, y: 4 },\n      { x: 3, y: 9, l: '(3 ; 9)', dx: 9, dy: 4 }\n    ]\n  }));\n\n  // 3. Droites de l'exemple corrigé\n  put('g-droites', Graph({\n    xmin: -3, xmax: 7, ymin: -6, ymax: 5, ux: 40, uy: 28, label: 'Droites de f(x) = -0,5x et g(x) = 3x - 2',\n    curves: [\n      { pts: [[-3, 1.5], [7, -3.5]], cls: 's2' },\n      { pts: [[-3, -11], [7, 19]], cls: 's1' }\n    ],\n    points: [\n      { x: 6, y: -3, cls: 'p2', l: 'A(6 ; −3)', tcls: 't2', dx: 0, dy: -12, a: 'middle' },\n      { x: -1, y: -5, cls: 'p1', l: 'B(−1 ; −5)', tcls: 't1', dx: -11, dy: 5, a: 'end' },\n      { x: 2, y: 4, cls: 'p1', l: 'C(2 ; 4)', tcls: 't1', dx: 10, dy: 5 }\n    ],\n    texts: [\n      { x: -3, y: 1.5, t: '(d<tspan dy=\"4\" font-size=\"10\">f\u003c/tspan><tspan dy=\"-4\">)\u003c/tspan>', cls: 't2', dx: 28, dy: -10 },\n      { x: 2.33, y: 5, t: '(d<tspan dy=\"4\" font-size=\"10\">g\u003c/tspan><tspan dy=\"-4\">)\u003c/tspan>', cls: 't1', dx: -38, dy: 12 }\n    ]\n  }));\n\n  // 4. Exercice 2 : f(x) = x² − 2x − 1\n  var f2x = function (x) { return x * x - 2 * x - 1; };\n  var ex2pts = [];\n  [['A', -1, -14, -8, 'end'], ['B', 0, 10, 16, 'start'], ['C', 1, 0, 22, 'middle'], ['D', 2, 10, 20, 'start'], ['E', 3, 11, -6, 'start'], ['F', 4, 11, 5, 'start']].forEach(function (a) {\n    ex2pts.push({ x: a[1], y: f2x(a[1]), l: a[0], dx: a[2], dy: a[3], a: a[4], cls: 'p1', r: 5.5 });\n  });\n  [-0.5, 0.5, 1.5, 2.5, 3.5].forEach(function (x) { ex2pts.push({ x: x, y: f2x(x), cls: 'p2', r: 4 }); });\n  put('g-ex2', Graph({\n    xmin: -2, xmax: 5, ymin: -3, ymax: 8, ux: 48, uy: 26, label: 'Courbe de f(x) = x² − 2x − 1',\n    curves: [{ f: f2x, from: -1, to: 4, cls: 's1' }], points: ex2pts\n  }));\n\n  // 5. Exercice 3 : quatre droites\n  put('g-ex3', Graph({\n    xmin: -4, xmax: 4, ymin: -6, ymax: 6, ux: 44, uy: 26, label: 'Droites de f1, f2, f3 et f4',\n    curves: [\n      { pts: [[-4, -8], [4, 8]], cls: 's1' },\n      { pts: [[-4, 12], [4, -12]], cls: 's2' },\n      { pts: [[-4, 6], [4, -6]], cls: 's3' },\n      { pts: [[-4, -2], [4, 2]], cls: 's4' }\n    ],\n    points: [\n      { x: 1, y: 2, cls: 'p1' }, { x: 1, y: -3, cls: 'p2' }, { x: 2, y: -3, cls: 'p3' }, { x: 2, y: 1, cls: 'p4' }\n    ],\n    texts: [\n      { x: 2.6, y: 5.2, t: 'f<tspan dy=\"4\" font-size=\"10\">1\u003c/tspan>', cls: 't1', dx: 14, dy: 0 },\n      { x: -1.9, y: 5.7, t: 'f<tspan dy=\"4\" font-size=\"10\">2\u003c/tspan>', cls: 't2', dx: -16, dy: 0 },\n      { x: 3.3, y: -4.95, t: 'f<tspan dy=\"4\" font-size=\"10\">3\u003c/tspan>', cls: 't3', dx: 4, dy: -12 },\n      { x: 3.5, y: 1.75, t: 'f<tspan dy=\"4\" font-size=\"10\">4\u003c/tspan>', cls: 't4', dx: 0, dy: -12 }\n    ]\n  }));\n\n  // 6. Exercice 4 : g(x) = 2x − 1\n  put('g-ex4', Graph({\n    xmin: -3, xmax: 4, ymin: -6, ymax: 6, ux: 50, uy: 26, label: 'Droite de g(x) = 2x − 1',\n    curves: [{ pts: [[-3, -7], [4, 7]], cls: 's1' }],\n    points: [\n      { x: 0, y: -1, l: '(0 ; −1)', dx: 10, dy: 18 },\n      { x: 1, y: 1, l: '(1 ; 1)', dx: 10, dy: 4 }\n    ]\n  }));\n\n  // 7. Exercice 5 + exemple corrigé : f(x) = x² − 4\n  var fm4 = function (x) { return x * x - 4; };\n  var baseM4 = { xmin: -3, xmax: 3, ymin: -5, ymax: 5, ux: 56, uy: 30, curves: [{ f: fm4, from: -3, to: 3, cls: 's1' }] };\n  function clone(o, extra) { var r = {}, k; for (k in o) r[k] = o[k]; for (k in extra) r[k] = extra[k]; return r; }\n  put('g-ex5', Graph(clone(baseM4, { label: 'Courbe de f(x) = x² − 4' })));\n  put('g-lire-ex', Graph(clone(baseM4, {\n    label: 'Lecture de f(1,5) et des antécédents de −3',\n    guides: [\n      { x1: 1.5, y1: 0, x2: 1.5, y2: -1.75, cls: 'g1' }, { x1: 1.5, y1: -1.75, x2: 0, y2: -1.75, cls: 'g1' },\n      { x1: 0, y1: -3, x2: 1, y2: -3, cls: 'g2' }, { x1: 0, y1: -3, x2: -1, y2: -3, cls: 'g2' },\n      { x1: 1, y1: -3, x2: 1, y2: 0, cls: 'g2' }, { x1: -1, y1: -3, x2: -1, y2: 0, cls: 'g2' }\n    ],\n    points: [\n      { x: 1.5, y: -1.75, cls: 'p4' }, { x: 1.5, y: 0, cls: 'p4', r: 4 }, { x: 0, y: -1.75, cls: 'p4', r: 4 },\n      { x: 1, y: -3, cls: 'p3' }, { x: -1, y: -3, cls: 'p3' }, { x: 1, y: 0, cls: 'p3', r: 4 }, { x: -1, y: 0, cls: 'p3', r: 4 }\n    ],\n    texts: [\n      { x: 1.5, y: 0, t: '1,5', cls: 't4', dy: -11 },\n      { x: 0, y: -1.75, t: '−1,75', cls: 't4', dx: -8, dy: 4, a: 'end' }\n    ]\n  })));\n\n  // 8. Exercice 6 : f(x) = 4 / (1 + x²)\n  put('g-ex6', Graph({\n    xmin: -4, xmax: 4, ymin: -1, ymax: 5, ux: 46, uy: 44, label: 'Courbe de f(x) = 4 / (1 + x²)',\n    curves: [{ f: function (x) { return 4 / (1 + x * x); }, from: -4, to: 4, cls: 's1' }],\n    points: [{ x: 0, y: 4, l: '(0 ; 4)', dx: 10, dy: 4 }]\n  }));\n\n  /* ============ Courbe interactive (lire images / antécédents) ============ */\n  var PTS = [[0, 1], [2, 3], [4, 5], [5, 5.4], [6, 4], [8, 3], [10, 2]];\n  function F(x) {\n    for (var i = 0; i < PTS.length - 1; i++) {\n      var a = PTS[i], b = PTS[i + 1];\n      if (x >= a[0] - 1e-9 && x <= b[0] + 1e-9) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);\n    }\n    return null;\n  }\n  function antecedents(y) {\n    var res = [];\n    for (var i = 0; i < PTS.length - 1; i++) {\n      var a = PTS[i], b = PTS[i + 1];\n      if (a[1] === b[1]) continue;\n      var lo = Math.min(a[1], b[1]), hi = Math.max(a[1], b[1]);\n      if (y >= lo - 1e-9 && y <= hi + 1e-9) {\n        var x = a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);\n        if (!res.some(function (r) { return Math.abs(r - x) < 1e-6; })) res.push(x);\n      }\n    }\n    return res.sort(function (p, q) { return p - q; });\n  }\n  var readBase = { xmin: -1, xmax: 11, ymin: -1, ymax: 7, ux: 34, uy: 34, curves: [{ pts: PTS, cls: 's1' }] };\n\n  var slX = document.getElementById('sl-x');\n  function drawImage() {\n    var x = parseFloat(slX.value), y = F(x);\n    document.getElementById('o-x').textContent = f2(x);\n    put('g-img', Graph(clone(readBase, {\n      label: 'Lecture de l\\'image de ' + f2(x),\n      guides: [{ x1: x, y1: 0, x2: x, y2: y, cls: 'g1' }, { x1: x, y1: y, x2: 0, y2: y, cls: 'g1' }],\n      points: [{ x: x, y: y, cls: 'p4' }, { x: x, y: 0, cls: 'p4', r: 4 }, { x: 0, y: y, cls: 'p4', r: 4 }]\n    })));\n    document.getElementById('t-img').innerHTML = 'Pour <b><i>x\u003c/i> = ' + f2(x) + '\u003c/b>, on lit <b><i>f\u003c/i>(' + f2(x) + ') = ' + f2(y, 1) + '\u003c/b>. L\\'image de ' + f2(x) + ' par <i>f\u003c/i> est <b>' + f2(y, 1) + '\u003c/b>.';\n  }\n  if (slX) { slX.addEventListener('input', drawImage); drawImage(); }\n\n  var slY = document.getElementById('sl-y');\n  function exact1(x) { return Math.abs(x * 10 - Math.round(x * 10)) < 1e-6; }\n  function drawAnt() {\n    var y = parseFloat(slY.value), xs = antecedents(y);\n    document.getElementById('o-y').textContent = f2(y);\n    var guides = [{ x1: 0, y1: y, x2: 10, y2: y, cls: 'g2' }], points = [{ x: 0, y: y, cls: 'p3', r: 4 }];\n    xs.forEach(function (x) {\n      guides.push({ x1: x, y1: y, x2: x, y2: 0, cls: 'g2' });\n      points.push({ x: x, y: y, cls: 'p3' }); points.push({ x: x, y: 0, cls: 'p3', r: 4 });\n    });\n    put('g-ant', Graph(clone(readBase, { label: 'Lecture des antécédents de ' + f2(y), guides: guides, points: points })));\n    var txt;\n    if (!xs.length) txt = 'Pour <b><i>y\u003c/i> = ' + f2(y) + '\u003c/b>, la droite horizontale ne rencontre jamais la courbe : <b>' + f2(y) + ' n\\'a aucun antécédent\u003c/b> par <i>f\u003c/i>.';\n    else {\n      var list = xs.map(function (x) { return (exact1(x) ? '' : '≈ ') + f2(x, 1); }).join(' et ');\n      txt = 'Pour <b><i>y\u003c/i> = ' + f2(y) + '\u003c/b>, on lit <b>' + xs.length + ' antécédent' + (xs.length > 1 ? 's' : '') + '\u003c/b> : <b>' + list + '\u003c/b>.';\n    }\n    document.getElementById('t-ant').innerHTML = txt;\n  }\n  if (slY) { slY.addEventListener('input', drawAnt); drawAnt(); }\n\n  /* ============ Explorateur y = ax + b ============ */\n  var slA = document.getElementById('sl-a'), slB = document.getElementById('sl-b');\n  function drawExplore() {\n    var a = parseFloat(slA.value), b = parseFloat(slB.value);\n    document.getElementById('o-a').textContent = f2(a);\n    document.getElementById('o-b').textContent = f2(b);\n    var pts = [], p1y = a + b;\n    if (Math.abs(b) <= 5) pts.push({ x: 0, y: b, cls: 'p2', l: '(0 ; ' + f2(b) + ')', dx: 10, dy: b >= 0 ? -10 : 18 });\n    if (Math.abs(p1y) <= 5) pts.push({ x: 1, y: p1y, cls: 'p3', l: '(1 ; ' + f2(p1y) + ')', dx: 10, dy: p1y >= 0 ? -10 : 18 });\n    put('g-explore', Graph({\n      xmin: -5, xmax: 5, ymin: -5, ymax: 5, ux: 34, label: 'Droite y = ' + f2(a) + 'x + ' + f2(b),\n      curves: [{ pts: [[-5, -5 * a + b], [5, 5 * a + b]], cls: 's1' }], points: pts\n    }));\n    var expr = a === 0 ? f2(b) : (a === 1 ? '' : a === -1 ? '−' : f2(a)) + '<i>x\u003c/i>';\n    if (a !== 0 && b > 0) expr += ' + ' + f2(b);\n    if (a !== 0 && b < 0) expr += ' − ' + f2(-b);\n    var kind;\n    if (a === 0) kind = 'Ici <i>a\u003c/i> = 0 : la droite est <b>horizontale\u003c/b> (fonction constante, cas particulier de fonction affine).';\n    else if (b === 0) kind = 'Ici <i>b\u003c/i> = 0 : c\\'est une fonction <b>linéaire\u003c/b>, la droite passe par l\\'<b>origine\u003c/b>.';\n    else kind = 'Ici <i>b\u003c/i> ≠ 0 : c\\'est une fonction <b>affine\u003c/b>, la droite <b>ne passe pas\u003c/b> par l\\'origine.';\n    document.getElementById('t-explore').innerHTML = '<i>g\u003c/i>(<i>x\u003c/i>) = <b>' + expr + '\u003c/b><br>' + kind;\n  }\n  if (slA && slB) { slA.addEventListener('input', drawExplore); slB.addEventListener('input', drawExplore); drawExplore(); }\n\n  /* ============ Machine à fonction ============ */\n  var mx = document.getElementById('mach-x'), mo = document.getElementById('mach-out');\n  function paren(v) { return v < 0 ? '(' + f2(v, 4) + ')' : f2(v, 4); }\n  function machine() {\n    var v = parseFloat(String(mx.value).replace(',', '.'));\n    if (isNaN(v)) { mo.textContent = 'Écris un nombre pour tester la machine.'; return; }\n    var sq = v * v, r = sq - 3;\n    mo.innerHTML = 'On entre <b>' + f2(v, 4) + '\u003c/b> → on calcule ' + paren(v) + '² = ' + f2(sq, 4) + ' → puis ' + f2(sq, 4) + ' − 3 = <b>' + f2(r, 4) + '\u003c/b>.<br>Donc <i>f\u003c/i>(' + f2(v, 4) + ') = <b>' + f2(r, 4) + '\u003c/b> : l\\'image de ' + f2(v, 4) + ' est ' + f2(r, 4) + '.';\n  }\n  if (mx) { mx.addEventListener('input', machine); machine(); }\n\n  /* ============ Cartes mémoire ============ */\n  Lecon.flashcards('#cartes', [\n    { front: 'Fonction', back: 'Processus qui, à un nombre <i>x\u003c/i>, fait correspondre <b>un unique\u003c/b> nombre, par la même suite de calculs.' },\n    { front: 'Que lit-on dans <i>f\u003c/i>(<i>x\u003c/i>) ?', back: '« <i>f\u003c/i> de <i>x\u003c/i> ». Ce n\\'est <b>pas\u003c/b> un produit !' },\n    { front: 'Image de <i>x\u003c/i>', back: 'Le nombre <i>f\u003c/i>(<i>x\u003c/i>). Elle est <b>unique\u003c/b>.' },\n    { front: 'Antécédent', back: 'Un nombre <i>x\u003c/i> dont l\\'image est <i>f\u003c/i>(<i>x\u003c/i>). Il peut y en avoir <b>plusieurs\u003c/b>, ou aucun.' },\n    { front: 'Représentation graphique', back: 'L\\'ensemble des points de coordonnées (<i>x\u003c/i> ; <i>f\u003c/i>(<i>x\u003c/i>)).' },\n    { front: 'Abscisse ou ordonnée ?', back: 'Abscisse = antécédent (axe horizontal).<br>Ordonnée = image (axe vertical).' },\n    { front: 'Lire une image', back: 'Abscisses → <b>verticalement\u003c/b> jusqu\\'à la courbe → <b>horizontalement\u003c/b> jusqu\\'aux ordonnées.' },\n    { front: 'Lire un antécédent', back: 'Ordonnées → <b>horizontalement\u003c/b> jusqu\\'à la courbe → <b>verticalement\u003c/b> jusqu\\'aux abscisses.' },\n    { front: 'Fonction linéaire', back: '<i>f\u003c/i>(<i>x\u003c/i>) = <i>ax\u003c/i> : droite qui passe par l\\'<b>origine\u003c/b>. <b>1 point\u003c/b> suffit.' },\n    { front: 'Fonction affine', back: '<i>g\u003c/i>(<i>x\u003c/i>) = <i>ax\u003c/i> + <i>b\u003c/i> : une <b>droite\u003c/b>. <b>2 points\u003c/b> suffisent.' }\n  ]);\n\n  /* ============ QCM (12 questions tirées parmi 22) ============ */\n  Lecon.qcm('#quiz-qcm', [\n    { question: 'Une fonction fait correspondre à un nombre <i>x\u003c/i>…', choices: ['un unique autre nombre', 'plusieurs autres nombres', 'aucun nombre en particulier'], answer: 0,\n      explanation: 'À chaque <i>x\u003c/i> correspond <b>un seul\u003c/b> nombre : son image.' },\n    { question: 'Comment lit-on « <i>f\u003c/i>(<i>x\u003c/i>) » ?', choices: ['« f de x »', '« f fois x »', '« f sur x »'], answer: 0,\n      explanation: 'Ce n\\'est pas un produit : <i>f\u003c/i> est le nom de la fonction.' },\n    { question: 'Soit \\\\(f(x) = x^2 - 3\\\\). Quelle est l\\'image de 2 ?', choices: ['1', '7', '−1'], answer: 0,\n      explanation: '\\\\(f(2) = 2^2 - 3 = 4 - 3 = 1\\\\).' },\n    { question: 'Soit \\\\(f(x) = x^2 - 3\\\\). Quelle est l\\'image de 0 ?', choices: ['0', '−3', '3'], answer: 1,\n      explanation: '\\\\(f(0) = 0^2 - 3 = -3\\\\).' },\n    { question: 'Si <i>f\u003c/i>(3) = 5, on peut dire que…', choices: ['5 est l\\'image de 3 par <i>f\u003c/i>', '3 est l\\'image de 5 par <i>f\u003c/i>', '<i>f\u003c/i> est égal à 15'], answer: 0,\n      explanation: 'L\\'image de 3 est 5, et 3 est <b>un antécédent\u003c/b> de 5.' },\n    { question: 'Le nombre <i>x\u003c/i> est… du nombre <i>f\u003c/i>(<i>x\u003c/i>).', choices: ['une image', 'un antécédent', 'un produit'], answer: 1,\n      explanation: '<i>f\u003c/i>(<i>x\u003c/i>) est l\\'image de <i>x\u003c/i>, et <i>x\u003c/i> est un antécédent de <i>f\u003c/i>(<i>x\u003c/i>).' },\n    { question: 'Un nombre peut avoir…', choices: ['une seule image mais plusieurs antécédents', 'plusieurs images mais un seul antécédent', 'toujours un seul antécédent'], answer: 0,\n      explanation: 'L\\'image est unique, mais un nombre peut avoir plusieurs antécédents (par exemple 4 a deux antécédents par <i>x\u003c/i> ↦ <i>x\u003c/i>² : 2 et −2).' },\n    { question: 'Soit \\\\(g(x) = 3x - 2\\\\). Que vaut <i>g\u003c/i>(4) ?', choices: ['10', '14', '6'], answer: 0,\n      explanation: '\\\\(g(4) = 3 \\\\times 4 - 2 = 12 - 2 = 10\\\\).' },\n    { question: 'Soit \\\\(g(x) = 3x - 2\\\\). Quel est l\\'antécédent de 7 ?', choices: ['3', '19', '5'], answer: 0,\n      explanation: 'On résout 3<i>x\u003c/i> − 2 = 7, donc 3<i>x\u003c/i> = 9, donc <i>x\u003c/i> = 3.' },\n    { question: 'Soit \\\\(g(x) = 2x - 1\\\\). Que vaut <i>g\u003c/i>(−1) ?', choices: ['−3', '−1', '1'], answer: 0,\n      explanation: '\\\\(g(-1) = 2 \\\\times (-1) - 1 = -2 - 1 = -3\\\\).' },\n    { question: 'Dans un repère, les points de la courbe d\\'une fonction <i>f\u003c/i> ont pour coordonnées…', choices: ['(<i>x\u003c/i> ; <i>f\u003c/i>(<i>x\u003c/i>))', '(<i>f\u003c/i>(<i>x\u003c/i>) ; <i>x\u003c/i>)', '(<i>x\u003c/i> ; <i>x\u003c/i>)'], answer: 0,\n      explanation: 'L\\'abscisse est <i>x\u003c/i> (l\\'antécédent) et l\\'ordonnée est <i>f\u003c/i>(<i>x\u003c/i>) (l\\'image).' },\n    { question: 'Sur un graphique, les <b>antécédents\u003c/b> se lisent…', choices: ['sur l\\'axe des abscisses', 'sur l\\'axe des ordonnées', 'sur la courbe seulement'], answer: 0,\n      explanation: 'Abscisses = antécédents ; ordonnées = images.' },\n    { question: 'Pour lire une <b>image\u003c/b> sur un graphique, on…', choices: [\n        'part de l\\'axe des abscisses, on va verticalement jusqu\\'à la courbe, puis horizontalement',\n        'part de l\\'axe des ordonnées, on va horizontalement jusqu\\'à la courbe, puis verticalement',\n        'mesure la longueur de la courbe'], answer: 0, cols1: true,\n      explanation: 'Abscisses → verticalement → courbe → horizontalement → ordonnées.' },\n    { question: 'Pour lire un <b>antécédent\u003c/b> sur un graphique, on…', choices: [\n        'part de l\\'axe des ordonnées, on va horizontalement jusqu\\'à la courbe, puis verticalement',\n        'part de l\\'axe des abscisses, on va verticalement jusqu\\'à la courbe, puis horizontalement',\n        'lit directement la valeur sur la courbe'], answer: 0, cols1: true,\n      explanation: 'Ordonnées → horizontalement → courbe → verticalement → abscisses.' },\n    { question: 'La représentation graphique d\\'une fonction <b>linéaire\u003c/b> est…', choices: ['une droite qui passe par l\\'origine', 'une droite qui ne passe jamais par l\\'origine', 'une courbe en forme de U'], answer: 0,\n      explanation: '\\\\(f(x) = ax\\\\) donne <i>f\u003c/i>(0) = 0 : la droite passe par le point (0 ; 0).' },\n    { question: 'Combien de points faut-il au minimum pour tracer la droite d\\'une fonction <b>affine\u003c/b> ?', choices: ['2', '1', '3'], answer: 0,\n      explanation: 'Une droite est déterminée par deux points.' },\n    { question: 'Pour tracer la droite d\\'une fonction <b>linéaire\u003c/b>, il suffit de connaître…', choices: ['un point autre que l\\'origine', 'trois points', 'son nom'], answer: 0,\n      explanation: 'On sait déjà qu\\'elle passe par l\\'origine : un seul autre point suffit.' },\n    { question: 'Soit \\\\(f(x) = -0,5x\\\\). Que vaut <i>f\u003c/i>(6) ?', choices: ['−3', '3', '−12'], answer: 0,\n      explanation: '\\\\(f(6) = -0,5 \\\\times 6 = -3\\\\). La droite passe donc par A(6 ; −3).' },\n    { question: 'Laquelle de ces fonctions n\\'est <b>pas\u003c/b> linéaire ?', choices: ['\\\\(x ↦ 2x - 1\\\\)', '\\\\(x ↦ 5x\\\\)', '\\\\(x ↦ -x\\\\)'], answer: 0,\n      explanation: '2<i>x\u003c/i> − 1 est affine mais pas linéaire (son <i>b\u003c/i> vaut −1). Sa droite ne passe pas par l\\'origine.' },\n    { question: 'Soit \\\\(f(x) = x^2 - 4\\\\). Quels sont les antécédents de 0 ?', choices: ['−2 et 2', '2 seulement', '0'], answer: 0,\n      explanation: '<i>x\u003c/i>² − 4 = 0 donne <i>x\u003c/i>² = 4, donc <i>x\u003c/i> = 2 ou <i>x\u003c/i> = −2.' },\n    { question: 'Soit \\\\(f(x) = x^2 - 4\\\\). Combien d\\'antécédents a −5 ?', choices: ['Aucun', 'Un', 'Deux'], answer: 0,\n      explanation: '<i>x\u003c/i>² − 4 = −5 donnerait <i>x\u003c/i>² = −1, impossible car un carré n\\'est jamais négatif.' },\n    { question: 'Soit \\\\(f(x) = \\\\frac{4}{1 + x^2}\\\\). Que vaut <i>f\u003c/i>(0) ?', choices: ['4', '0', '1'], answer: 0,\n      explanation: '\\\\(f(0) = \\\\frac{4}{1 + 0} = 4\\\\).' }\n  ], { layout: 'step', shuffle: true, shuffleChoices: true, sampleSize: 12 });\n\n  /* ============ Vrai / Faux ============ */\n  Lecon.vraiFaux('#quiz-vf', [\n    { statement: 'Un nombre peut avoir plusieurs antécédents par une fonction.', answer: true,\n      explanation: 'Par exemple, 4 a deux antécédents (2 et −2) par la fonction <i>x\u003c/i> ↦ <i>x\u003c/i>².' },\n    { statement: 'Un nombre peut avoir plusieurs images par une fonction.', answer: false,\n      explanation: 'Une fonction associe à chaque nombre <b>un unique\u003c/b> nombre : l\\'image est unique.' },\n    { statement: '<i>f\u003c/i>(<i>x\u003c/i>) signifie « <i>f\u003c/i> multiplié par <i>x\u003c/i> ».', answer: false,\n      explanation: '<i>f\u003c/i>(<i>x\u003c/i>) se lit « <i>f\u003c/i> de <i>x\u003c/i> » : c\\'est l\\'image de <i>x\u003c/i>, pas un produit.' },\n    { statement: 'Si <i>f\u003c/i>(2) = 5, alors 2 est l\\'image de 5.', answer: false,\n      explanation: 'C\\'est l\\'inverse : 5 est l\\'image de 2, et 2 est un antécédent de 5.' },\n    { statement: 'Pour <i>f\u003c/i>(<i>x\u003c/i>) = <i>x\u003c/i>², le nombre −3 a pour image 9.', answer: true,\n      explanation: '(−3)² = 9.' },\n    { statement: 'Pour <i>f\u003c/i>(<i>x\u003c/i>) = <i>x\u003c/i>², le nombre −4 a un antécédent.', answer: false,\n      explanation: 'Un carré n\\'est jamais négatif : <i>x\u003c/i>² = −4 est impossible. −4 n\\'a aucun antécédent.' },\n    { statement: 'Les points de la courbe de <i>f\u003c/i> ont pour coordonnées (<i>f\u003c/i>(<i>x\u003c/i>) ; <i>x\u003c/i>).', answer: false,\n      explanation: 'Les coordonnées sont (<i>x\u003c/i> ; <i>f\u003c/i>(<i>x\u003c/i>)) : l\\'abscisse d\\'abord, puis l\\'ordonnée.' },\n    { statement: 'Pour lire une image sur un graphique, on part de l\\'axe des abscisses.', answer: true,\n      explanation: 'On part de <i>x\u003c/i> (abscisse), on rejoint la courbe, puis on lit l\\'ordonnée.' },\n    { statement: 'La représentation graphique d\\'une fonction linéaire passe toujours par l\\'origine du repère.', answer: true,\n      explanation: '\\\\(f(x) = ax\\\\), donc <i>f\u003c/i>(0) = 0 : le point (0 ; 0) est sur la droite.' },\n    { statement: 'La représentation graphique d\\'une fonction affine est une droite.', answer: true,\n      explanation: 'Oui : \\\\(g(x) = ax + b\\\\) est représentée par une droite.' },\n    { statement: 'Pour tracer la droite d\\'une fonction affine, un seul point suffit toujours.', answer: false,\n      explanation: 'Il faut <b>deux\u003c/b> points. Un seul point suffit pour une fonction <b>linéaire\u003c/b>, car on connaît déjà l\\'origine.' },\n    { statement: 'Le point (0 ; 0) appartient à la droite représentant \\\\(f(x) = -0,5x\\\\).', answer: true,\n      explanation: '<i>f\u003c/i>(0) = −0,5 × 0 = 0.' }\n  ], { layout: 'step', shuffle: true });\n\n  /* ============ Calculs (séries aléatoires) ============ */\n  function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }\n  function nz(a, b) { var v = 0; while (v === 0) v = ri(a, b); return v; }\n  function lin(a, b) {\n    var t = (a === 1 ? '' : a === -1 ? '-' : String(a)) + 'x';\n    if (b > 0) t += ' + ' + b; else if (b < 0) t += ' - ' + (-b);\n    return t;\n  }\n  function par(v) { return v < 0 ? '(' + f2(v) + ')' : f2(v); }\n  function genItems(n) {\n    var items = [];\n    for (var i = 0; i < n; i++) {\n      var kind = i % 4, it, a, b, k, y;\n      if (kind === 0) {\n        a = nz(-4, 5); b = nz(-6, 6); k = nz(-4, 4); y = a * k + b;\n        it = { question: 'Soit \\\\(f(x) = ' + lin(a, b) + '\\\\). Calcule l\\'image de ' + f2(k) + ' par <i>f\u003c/i>.', num: y,\n          explanation: '<i>f\u003c/i>(' + f2(k) + ') = ' + f2(a) + ' × ' + par(k) + (b > 0 ? ' + ' + b : ' − ' + (-b)) + ' = ' + f2(y) + '.' };\n      } else if (kind === 1) {\n        a = nz(-4, 5); if (Math.abs(a) < 2) a = a < 0 ? -2 : 2;\n        b = nz(-6, 6); k = nz(-4, 5); y = a * k + b;\n        it = { question: 'Soit \\\\(g(x) = ' + lin(a, b) + '\\\\). Quel est l\\'antécédent de ' + f2(y) + ' par <i>g\u003c/i> ?', num: k,\n          explanation: 'On résout ' + f2(a) + '<i>x\u003c/i>' + (b > 0 ? ' + ' + b : ' − ' + (-b)) + ' = ' + f2(y) + ' : ' + f2(a) + '<i>x\u003c/i> = ' + f2(y - b) + ', donc <i>x\u003c/i> = ' + f2(k) + '.' };\n      } else if (kind === 2) {\n        var c = ri(1, 9); k = nz(-5, 5); y = k * k - c;\n        it = { question: 'Soit \\\\(h(x) = x^2 - ' + c + '\\\\). Calcule <i>h\u003c/i>(' + f2(k) + ').', num: y,\n          explanation: '<i>h\u003c/i>(' + f2(k) + ') = ' + par(k) + '² − ' + c + ' = ' + (k * k) + ' − ' + c + ' = ' + f2(y) + '.' };\n      } else {\n        a = nz(-5, 5); if (a === 1 || a === -1) a = 3 * a; k = nz(-5, 5); y = a * k;\n        it = { question: 'Soit \\\\(f(x) = ' + (a === 1 ? '' : a === -1 ? '-' : a) + 'x\\\\) (fonction linéaire). Calcule <i>f\u003c/i>(' + f2(k) + ').', num: y,\n          explanation: '<i>f\u003c/i>(' + f2(k) + ') = ' + f2(a) + ' × ' + par(k) + ' = ' + f2(y) + '.' };\n      }\n      it.answer = String(it.num);\n      it.placeholder = 'Un nombre…';\n      items.push(it);\n    }\n    return Lecon.shuffle(items);\n  }\n  function parseNum(v) { return parseFloat(String(v).replace(/[−–]/g, '-').replace(',', '.').replace(/\\s/g, '')); }\n  function numCheck(value, item) { var v = parseNum(value); return !isNaN(v) && Math.abs(v - item.num) < 1e-9; }\n  function newSerie() {\n    Lecon.saisie('#quiz-calc', genItems(8), {\n      check: numCheck, resultTitle: 'Série terminée !',\n      onFinish: function () {\n        var act = document.querySelector('#quiz-calc .quiz-result .quiz-actions');\n        if (!act) return;\n        var b = document.createElement('button');\n        b.type = 'button'; b.className = 'btn btn-secondary'; b.textContent = '🔀 Nouvelle série';\n        b.addEventListener('click', newSerie);\n        act.appendChild(b);\n      }\n    });\n  }\n  newSerie();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","SVT/Genes Genotype Phenotype.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>SVT 3ème - Gènes, génotype et division cellulaire pour Aron\u003c/title>\n\u003c!--rev3e:css-->\n\u003c!--rev3e:quiz-->\n<style>\n  /* ===== Mise en page propre à cette leçon ===== */\n  .chapitre { border-left: 4px solid var(--primary); margin-bottom: var(--space-5); }\n  .chapitre.c2 { border-left-color: var(--success); }\n  .chapitre.c3 { border-left-color: var(--warning); }\n  .lecon .chapitre > h2 { font-size: var(--text-xl); }\n  .callout-title.no-icon::before { content: none; }\n  .tbl-c td, .tbl-c th { text-align: center; }\n  .tbl-c td:first-child, .tbl-c th:first-child { text-align: left; font-weight: 650; }\n\n  /* Figures */\n  .fig { margin: var(--space-4) auto; padding: var(--space-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); text-align: center; box-shadow: var(--shadow-xs); }\n  .fig svg { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; }\n  .fig .cap { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--muted); }\n  .fig.small svg { max-width: 400px; }\n\n  /* Couleurs des schémas (suivent le thème clair / sombre) */\n  svg.bio text { fill: var(--text-2); font-size: 14.5px; font-family: var(--font); }\n  svg.bio text.b { font-weight: 700; fill: var(--text); }\n  svg.bio text.sm { font-size: 13px; }\n  svg.bio text.big { font-size: 22px; font-weight: 800; fill: var(--text); }\n  svg.bio text.wh { fill: #fff; font-weight: 800; }\n  svg.bio .line { stroke: var(--muted); stroke-width: 1.3; fill: none; }\n  svg.bio .dash { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }\n  svg.bio .cell { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 2.5; }\n  svg.bio .nuc { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.5; stroke-dasharray: 5 4; }\n  svg.bio .fa { fill: var(--info); } svg.bio .fb { fill: var(--danger); }\n  svg.bio .fa2 { fill: var(--info-soft); stroke: var(--info); stroke-width: 2; }\n  svg.bio .fb2 { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 2; }\n  svg.bio .band { fill: var(--warning); }\n  svg.bio .band2 { fill: var(--success); }\n  svg.bio .cen { fill: var(--text); }\n  svg.bio .sq { fill: var(--surface-2); stroke: var(--text-2); stroke-width: 2; }\n  svg.bio .pl { fill: var(--primary); stroke: var(--primary-text); stroke-width: 1; }\n  svg.bio .tube { fill: none; stroke: var(--text-2); stroke-width: 2.5; }\n  svg.bio .liq1 { fill: var(--warning-soft); }\n  svg.bio .liq2 { fill: var(--info-soft); }\n  svg.bio .dna { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; }\n\n  /* Pastilles d'étapes */\n  .steps-nav { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; margin: var(--space-3) 0; }\n  .step-pill { padding: 6px 12px; border-radius: var(--radius-full); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); font: inherit; font-size: var(--text-sm); font-weight: 650; cursor: pointer; }\n  .step-pill.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }\n  .stage-box { padding: var(--space-3) var(--space-4); border-left: 4px solid var(--primary); background: var(--primary-soft); border-radius: var(--radius-sm); color: var(--text); min-height: 4.2em; }\n  .count-row { display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: center; margin: var(--space-3) 0; }\n  .count { text-align: center; padding: var(--space-2) var(--space-4); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); min-width: 120px; }\n  .count b { display: block; font-size: var(--text-2xl); color: var(--primary-text); line-height: 1.1; }\n  .count small { color: var(--muted); }\n\n  /* Simulateur de croisement */\n  .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin: var(--space-3) 0; }\n  .ctrl label { font-weight: 650; min-width: 90px; }\n  .ctrl select { font: inherit; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); min-height: 44px; }\n  .punnett { border-collapse: separate; border-spacing: 6px; margin: var(--space-3) auto; }\n  .punnett th { font-weight: 800; color: var(--primary-text); padding: 6px 12px; }\n  .punnett td { text-align: center; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); min-width: 84px; }\n  .punnett td b { display: block; font-size: var(--text-lg); }\n  .punnett td small { color: var(--muted); }\n  .res-box { margin-top: var(--space-3); padding: var(--space-3) var(--space-4); border-left: 4px solid var(--success); background: var(--success-soft); border-radius: var(--radius-sm); color: var(--text); }\n  .gp { display: inline-block; padding: 2px 10px; border-radius: var(--radius-full); font-weight: 800; background: var(--primary-soft); color: var(--primary-text); border: 1px solid var(--border); margin: 0 2px; }\n\n  /* Étapes du TP */\n  .tp-step { display: grid; grid-template-columns: auto 1fr; gap: var(--space-3); align-items: start; }\n  .tp-num { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 800; font-size: var(--text-lg); }\n  .tp-step h3 { margin-top: 0; }\n  .tp-step p { margin: var(--space-1) 0; }\n  .src { font-size: var(--text-xs); color: var(--muted); margin: calc(-1 * var(--space-2)) 0 var(--space-3); }\n  .doc { padding: var(--space-3) var(--space-4); border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface-2); margin: var(--space-3) 0; }\n  .doc p { margin: var(--space-2) 0; }\n  .reveal-body p { margin: var(--space-2) 0; }\n  @media (max-width: 480px) { .ctrl label { min-width: 72px; } .punnett td { min-width: 70px; padding: 8px; } }\n\u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n  <header class=\"lecon-header\">\n    <div class=\"lecon-eyebrow\">SVT\u003c/div>\n    <h1>🧬 Gènes, génotype et division cellulaire\u003c/h1>\n    <p class=\"lecon-subtitle\">Révise avec Aron : à quoi servent les gènes ? Comment passent-ils d'une cellule à l'autre ?\u003c/p>\n  \u003c/header>\n\n  <nav class=\"tabs\" role=\"tablist\">\n    <button type=\"button\" class=\"tab active\" data-tab=\"cours\">📖 Le cours\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"division\">🔬 Division cellulaire\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"sang\">🩸 Groupes sanguins\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"adn\">🍌 TP : extraire l'ADN\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"exercices\">✏️ Exercices\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"retenir\">📌 À retenir\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"qcm\">🎯 QCM\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"vf\">✔️ Vrai / Faux\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- ===================== ONGLET 1 : LE COURS ===================== -->\n  <section id=\"cours\" class=\"tab-content active\">\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">Points clés à retenir :\u003c/p>\n      <ul>\n        <li>Un <strong>gène\u003c/strong> est une portion de chromosome qui commande <strong>un caractère héréditaire précis\u003c/strong>.\u003c/li>\n        <li>Chaque gène existe en <strong>2 exemplaires\u003c/strong> (un sur chaque chromosome d'une paire). Un gène peut avoir plusieurs versions : les <strong>allèles\u003c/strong>.\u003c/li>\n        <li>Le <strong>génotype\u003c/strong> = la combinaison des allèles. Le <strong>phénotype\u003c/strong> dépend du génotype <strong>et\u003c/strong> de l'environnement.\u003c/li>\n        <li>Avant chaque division, les chromosomes sont <strong>copiés\u003c/strong> : l'information passe <strong>sans perte\u003c/strong> aux cellules-filles (46 chromosomes).\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <section class=\"card chapitre\">\n      <h2>1. L'information génétique est organisée en gènes\u003c/h2>\n      <p>L'espèce humaine a des <strong>milliers de caractères\u003c/strong> pour seulement <strong>46 chromosomes\u003c/strong>. Comment est-ce possible ? Parce que chaque chromosome porte <strong>beaucoup de gènes\u003c/strong>.\u003c/p>\n\n      <div class=\"callout definition\">\n        <p class=\"callout-title\">Définitions\u003c/p>\n        <ul>\n          <li><strong>Gène\u003c/strong> : portion d'un chromosome qui commande l'expression d'un caractère héréditaire précis. Il occupe un <strong>emplacement déterminé\u003c/strong> sur le chromosome.\u003c/li>\n          <li><strong>Génome\u003c/strong> : l'ensemble des gènes d'une espèce. Chez l'être humain : environ <strong>30 000 gènes\u003c/strong> répartis sur <strong>23 paires\u003c/strong> de chromosomes.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      <div class=\"fig\">\n        <svg class=\"bio\" viewBox=\"0 0 480 270\" role=\"img\" aria-label=\"Une paire de chromosomes : chaque gène existe en deux exemplaires au même emplacement\">\n          \u003c!-- chromosomes -->\n          <rect class=\"fa2\" x=\"190\" y=\"24\" width=\"38\" height=\"200\" rx=\"19\"/>\n          <rect class=\"fb2\" x=\"282\" y=\"24\" width=\"38\" height=\"200\" rx=\"19\"/>\n          \u003c!-- bandes de gènes -->\n          <rect class=\"band2\" x=\"190\" y=\"62\" width=\"38\" height=\"14\"/>\n          <rect class=\"band2\" x=\"282\" y=\"62\" width=\"38\" height=\"14\"/>\n          <rect class=\"band\" x=\"190\" y=\"112\" width=\"38\" height=\"22\"/>\n          <rect class=\"band\" x=\"282\" y=\"112\" width=\"38\" height=\"22\"/>\n          <rect class=\"band2\" x=\"190\" y=\"170\" width=\"38\" height=\"14\"/>\n          <rect class=\"band2\" x=\"282\" y=\"170\" width=\"38\" height=\"14\"/>\n          \u003c!-- lignes d'emplacement -->\n          <path class=\"dash\" d=\"M126 123 H190 M228 123 H282 M320 123 H332\"/>\n          \u003c!-- allèles -->\n          <text class=\"wh\" x=\"209\" y=\"128\" text-anchor=\"middle\">A\u003c/text>\n          <text class=\"wh\" x=\"301\" y=\"128\" text-anchor=\"mi
