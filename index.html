ddle\">O\u003c/text>\n          \u003c!-- légendes -->\n          <text x=\"8\" y=\"69\">autre gène\u003c/text>\n          <text class=\"b\" x=\"8\" y=\"119\">gène du\u003c/text>\n          <text class=\"b\" x=\"8\" y=\"135\">groupe sanguin\u003c/text>\n          <text x=\"8\" y=\"177\">autre gène\u003c/text>\n          <text class=\"sm\" x=\"338\" y=\"96\">même\u003c/text>\n          <text class=\"sm\" x=\"338\" y=\"112\">emplacement\u003c/text>\n          <text class=\"sm\" x=\"338\" y=\"134\">2 exemplaires :\u003c/text>\n          <text class=\"sm\" x=\"338\" y=\"150\">allèles A et O\u003c/text>\n          <text class=\"b\" x=\"209\" y=\"246\" text-anchor=\"middle\">du père\u003c/text>\n          <text class=\"b\" x=\"301\" y=\"246\" text-anchor=\"middle\">de la mère\u003c/text>\n          <text class=\"sm\" x=\"255\" y=\"264\" text-anchor=\"middle\">(les 2 chromosomes d'une paire)\u003c/text>\n        \u003c/svg>\n        <p class=\"cap\">Une paire de chromosomes : chaque gène existe en <strong>2 exemplaires\u003c/strong>, au <strong>même endroit\u003c/strong> sur les 2 chromosomes.\u003c/p>\n      \u003c/div>\n\n      <div class=\"callout attention\">\n        <p class=\"callout-title\">Ne pas confondre\u003c/p>\n        <p><strong>Chromosome\u003c/strong> (un « bâtonnet » qui porte plein de gènes) ≠ <strong>gène\u003c/strong> (une petite portion d'un chromosome) ≠ <strong>ADN\u003c/strong> (la molécule dont sont faits les chromosomes et donc les gènes).\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    <section class=\"card chapitre c2\">\n      <h2>2. Allèles, génotype et phénotype\u003c/h2>\n      <p>Un gène peut exister sous <strong>différentes versions\u003c/strong> : ce sont les <span class=\"highlight\">allèles\u003c/span>. Pour le gène du groupe sanguin, il existe trois allèles : <strong>A\u003c/strong>, <strong>B\u003c/strong> et <strong>O\u003c/strong>.\u003c/p>\n      <ul>\n        <li>Les 2 chromosomes d'une même paire peuvent porter <strong>2 allèles identiques\u003c/strong> (ex : A et A) ou <strong>2 allèles différents\u003c/strong> (ex : A et O).\u003c/li>\n        <li>La réalisation d'un caractère héréditaire dépend d'<strong>un seul\u003c/strong> ou des <strong>deux\u003c/strong> allèles du gène (l'allèle dominant « masque » le récessif ; deux allèles co-dominants s'expriment ensemble).\u003c/li>\n        <li>Les différentes <strong>formules alléliques\u003c/strong> sont des combinaisons qui définissent le <span class=\"highlight\">génotype\u003c/span>.\u003c/li>\n      \u003c/ul>\n\n      <div class=\"grid-3\">\n        <div class=\"card card-accent\">\n          <h3>🧬 Génotype\u003c/h3>\n          <p>Les <strong>allèles\u003c/strong> que l'on possède (on ne les voit pas).\u003c/p>\n          <span class=\"formula\">A // O\u003c/span>\n        \u003c/div>\n        <div class=\"card card-accent\">\n          <h3>👀 Phénotype\u003c/h3>\n          <p>Ce qu'on <strong>observe\u003c/strong> (le caractère qui s'exprime).\u003c/p>\n          <span class=\"formula\">groupe A\u003c/span>\n        \u003c/div>\n        <div class=\"card card-accent\">\n          <h3>🌍 Environnement\u003c/h3>\n          <p>Mode de vie, alimentation, soleil… peuvent modifier le phénotype.\u003c/p>\n          <span class=\"formula\">bronzage\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      <div class=\"callout retenir\">\n        <p class=\"callout-title\">La formule à connaître\u003c/p>\n        <span class=\"formula\">PHÉNOTYPE = GÉNOTYPE + ENVIRONNEMENT\u003c/span>\n        <p>Le phénotype dépend du génotype <strong>et\u003c/strong> de facteurs de l'environnement. Les modifications dues à l'environnement ne s'inscrivent pas dans l'ADN : elles ne sont <strong>pas héréditaires\u003c/strong>.\u003c/p>\n      \u003c/div>\n\n      <div class=\"callout exemple\">\n        <p class=\"callout-title\">Exemple\u003c/p>\n        <p>Deux vrais jumeaux ont <strong>exactement le même génotype\u003c/strong>. Mais si l'un fait beaucoup de sport et prend le soleil, son phénotype (musculature, bronzage) sera un peu différent de celui de son frère.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    <section class=\"card chapitre c3\">\n      <h2>3. Comment l'information est-elle transmise sans perte ?\u003c/h2>\n      <p>Au cours des <strong>divisions successives de la cellule-œuf\u003c/strong>, le nombre de chromosomes est <strong>conservé\u003c/strong> : toutes les cellules du corps ont 46 chromosomes (23 paires).\u003c/p>\n      <ol>\n        <li><strong>Avant chaque division\u003c/strong>, chacun des 46 chromosomes est <strong>copié\u003c/strong> (duplication).\u003c/li>\n        <li>Chaque chromosome est alors formé de <strong>2 chromatides\u003c/strong>, chacune étant <strong>identique\u003c/strong> à l'autre : l'information est <strong>en double\u003c/strong>.\u003c/li>\n        <li><strong>Au moment de la division\u003c/strong>, les 2 chromatides de chaque chromosome <strong>se séparent\u003c/strong>.\u003c/li>\n        <li>Chaque <strong>cellule-fille\u003c/strong> reçoit <strong>une chromatide de chaque chromosome\u003c/strong> : soit <strong>46 chromosomes\u003c/strong> (23 paires) <strong>identiques\u003c/strong> à ceux de la cellule-œuf.\u003c/li>\n      \u003c/ol>\n      <p>👉 Va dans l'onglet <strong>🔬 Division cellulaire\u003c/strong> pour voir le schéma animé étape par étape.\u003c/p>\n      <div class=\"btn-row\"><button type=\"button\" class=\"btn btn-secondary\" data-goto=\"division\">Voir la division →\u003c/button>\u003c/div>\n    \u003c/section>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 2 : DIVISION CELLULAIRE ===================== -->\n  <section id=\"division\" class=\"tab-content\">\n    <h2>🔬 La division d'une cellule, étape par étape\u003c/h2>\n    <p class=\"muted\">Pour que ce soit lisible, le schéma ne montre que <strong>4 chromosomes\u003c/strong> (2 paires) au lieu de 46. Un chromosome de chaque paire vient du père (bleu), l'autre de la mère (rouge).\u003c/p>\n\n    <div class=\"steps-nav\" id=\"div-nav\">\u003c/div>\n    <div class=\"fig\"><div id=\"div-svg\">\u003c/div>\u003c/div>\n    <div class=\"stage-box\" id=\"div-text\" aria-live=\"polite\">\u003c/div>\n    <div class=\"count-row\" id=\"div-count\">\u003c/div>\n    <div class=\"btn-row center\">\n      <button type=\"button\" class=\"btn btn-secondary\" id=\"div-prev\">← Précédent\u003c/button>\n      <button type=\"button\" class=\"btn btn-primary\" id=\"div-next\">Suivant →\u003c/button>\n    \u003c/div>\n\n    <div class=\"callout retenir\" style=\"margin-top: var(--space-5)\">\n      <p class=\"callout-title\">Pourquoi l'information n'est-elle pas perdue ?\u003c/p>\n      <p>Parce que chaque chromosome est <strong>copié avant la division\u003c/strong>, puis les copies (<strong>chromatides\u003c/strong>) sont <strong>réparties équitablement\u003c/strong>. Chaque cellule-fille reçoit donc le <strong>même programme génétique\u003c/strong> que la cellule de départ.\u003c/p>\n    \u003c/div>\n    <details class=\"reveal\">\n      <summary><span>🤔 Une chromatide, c'est quoi ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <p>Quand un chromosome est copié, on obtient <strong>2 chromatides identiques\u003c/strong>, accrochées l'une à l'autre. Le tout compte encore pour <strong>1 seul chromosome\u003c/strong>. Au moment de la division, elles se séparent et chacune devient un chromosome complet dans une cellule-fille.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 3 : GROUPES SANGUINS ===================== -->\n  <section id=\"sang\" class=\"tab-content\">\n    <h2>🩸 Activité sur les groupes sanguins\u003c/h2>\n\n    <div class=\"callout definition\">\n      <p class=\"callout-title\">Le gène du groupe sanguin\u003c/p>\n      <p>Ce gène existe sous <strong>3 allèles\u003c/strong> : <strong>A\u003c/strong>, <strong>B\u003c/strong> et <strong>O\u003c/strong>. <strong>A\u003c/strong> et <strong>B\u003c/strong> sont <strong>dominants\u003c/strong> sur <strong>O\u003c/strong>. <strong>A\u003c/strong> et <strong>B\u003c/strong> sont <strong>co-dominants\u003c/strong> : s'ils sont présents ensemble, les deux s'expriment (groupe AB).\u003c/p>\n    \u003c/div>\n\n    <div class=\"table-wrap\">\n      <table class=\"tbl-c\">\n        <thead><tr><th>Phénotype (groupe)\u003c/th><th>Génotypes possibles\u003c/th>\u003c/tr>\u003c/thead>\n        <tbody>\n          <tr><td>Groupe A\u003c/td><td>A // A &nbsp;ou&nbsp; A // O\u003c/td>\u003c/tr>\n          <tr><td>Groupe B\u003c/td><td>B // B &nbsp;ou&nbsp; B // O\u003c/td>\u003c/tr>\n          <tr><td>Groupe AB\u003c/td><td>A // B\u003c/td>\u003c/tr>\n          <tr><td>Groupe O\u003c/td><td>O // O\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    <p class=\"muted\">Astuce : pour être de groupe <strong>O\u003c/strong>, il faut avoir l'allèle O en <strong>double\u003c/strong> (il est récessif). Un groupe <strong>A\u003c/strong> ou <strong>B\u003c/strong> peut cacher un allèle O.\u003c/p>\n\n    <h2 class=\"section-title\"><span class=\"num\">1\u003c/span> L'arbre généalogique de l'activité\u003c/h2>\n    <p>Le père est de groupe <strong>AB\u003c/strong>, la mère de groupe <strong>O\u003c/strong>. Leurs trois enfants ont les groupes <strong>A\u003c/strong>, <strong>B\u003c/strong> et « <strong>?\u003c/strong> ». On complète les génotypes.\u003c/p>\n\n    <div class=\"fig\">\n      <svg class=\"bio\" viewBox=\"0 0 480 330\" role=\"img\" aria-label=\"Arbre généalogique : père AB (A//B), mère O (O//O), enfants A (A//O), B (B//O) et un enfant de groupe inconnu (?//O)\">\n        \u003c!-- parents -->\n        <rect class=\"sq\" x=\"90\" y=\"20\" width=\"70\" height=\"60\" rx=\"6\"/>\n        <text class=\"big\" x=\"125\" y=\"58\" text-anchor=\"middle\">AB\u003c/text>\n        <circle class=\"sq\" cx=\"330\" cy=\"50\" r=\"32\"/>\n        <text class=\"big\" x=\"330\" y=\"58\" text-anchor=\"middle\">O\u003c/text>\n        <text class=\"sm\" x=\"125\" y=\"98\" text-anchor=\"middle\">génotype : A // B\u003c/text>\n        <text class=\"sm\" x=\"330\" y=\"98\" text-anchor=\"middle\">génotype : O // O\u003c/text>\n        \u003c!-- lignes -->\n        <path class=\"line\" d=\"M125 80 V110 H330 V82 M227 110 V135 M70 135 H390 M70 135 V165 M240 135 V165 M390 135 V165\"/>\n        \u003c!-- enfants -->\n        <rect class=\"sq\" x=\"35\" y=\"165\" width=\"70\" height=\"60\" rx=\"6\"/>\n        <text class=\"big\" x=\"70\" y=\"203\" text-anchor=\"middle\">A\u003c/text>\n        <circle class=\"sq\" cx=\"240\" cy=\"195\" r=\"32\"/>\n        <text class=\"big\" x=\"240\" y=\"203\" text-anchor=\"middle\">B\u003c/text>\n        <circle class=\"sq\" cx=\"390\" cy=\"195\" r=\"32\"/>\n        <text class=\"big\" x=\"390\" y=\"204\" text-anchor=\"middle\">?\u003c/text>\n        <text class=\"b\" x=\"70\" y=\"250\" text-anchor=\"middle\">A // O\u003c/text>\n        <text class=\"b\" x=\"240\" y=\"250\" text-anchor=\"middle\">B // O\u003c/text>\n        <text class=\"b\" x=\"390\" y=\"250\" text-anchor=\"middle\">? // O\u003c/text>\n        <text class=\"sm\" x=\"70\" y=\"268\" text-anchor=\"middle\">père → A, mère → O\u003c/text>\n        <text class=\"sm\" x=\"240\" y=\"268\" text-anchor=\"middle\">père → B, mère → O\u003c/text>\n        <text class=\"sm\" x=\"390\" y=\"268\" text-anchor=\"middle\">père → A ou B, mère → O\u003c/text>\n        <text class=\"sm\" x=\"240\" y=\"305\" text-anchor=\"middle\">carré = garçon · rond = fille\u003c/text>\n      \u003c/svg>\n      <p class=\"cap\">Chaque enfant reçoit <strong>un allèle de chacun de ses parents\u003c/strong>.\u003c/p>\n    \u003c/div>\n\n    <details class=\"reveal\">\n      <summary><span>Pourquoi la mère donne-t-elle toujours l'allèle O ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Parce qu'elle est de groupe O, donc de génotype O // O.\u003c/span>\n        <p>Elle n'a que des allèles O : elle ne peut transmettre que « O » à ses enfants.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Pourquoi le père ne donne-t-il que A <u>ou\u003c/u> B ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Père AB = génotype A // B : il donne soit A, soit B.\u003c/span>\n        <p>Chaque cellule reproductrice (spermatozoïde) ne reçoit qu'<strong>un seul\u003c/strong> chromosome de chaque paire, donc <strong>un seul allèle\u003c/strong>.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Quel est le groupe sanguin de l'enfant « ? » ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Groupe A (génotype A // O) ou groupe B (génotype B // O).\u003c/span>\n        <p>Il reçoit O de sa mère, et A <em>ou\u003c/em> B de son père. Il ne peut <strong>pas\u003c/strong> être AB (la mère n'a ni A ni B) et <strong>pas\u003c/strong> O (le père n'a pas d'allèle O). Pour savoir lequel, il faudrait connaître son groupe sanguin.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    <h2 class=\"section-title\"><span class=\"num\">2\u003c/span> Simulateur : quels enfants possibles ?\u003c/h2>\n    <p class=\"muted\">Choisis le génotype de chaque parent. Le tableau montre les 4 combinaisons possibles pour un enfant.\u003c/p>\n    <div class=\"ctrl\"><label for=\"p1\">Parent 1\u003c/label>\n      <select id=\"p1\"><option value=\"AA\">A // A (groupe A)\u003c/option><option value=\"AO\">A // O (groupe A)\u003c/option><option value=\"BB\">B // B (groupe B)\u003c/option><option value=\"BO\">B // O (groupe B)\u003c/option><option value=\"AB\" selected>A // B (groupe AB)\u003c/option><option value=\"OO\">O // O (groupe O)\u003c/option>\u003c/select>\u003c/div>\n    <div class=\"ctrl\"><label for=\"p2\">Parent 2\u003c/label>\n      <select id=\"p2\"><option value=\"AA\">A // A (groupe A)\u003c/option><option value=\"AO\">A // O (groupe A)\u003c/option><option value=\"BB\">B // B (groupe B)\u003c/option><option value=\"BO\">B // O (groupe B)\u003c/option><option value=\"AB\">A // B (groupe AB)\u003c/option><option value=\"OO\" selected>O // O (groupe O)\u003c/option>\u003c/select>\u003c/div>\n    <div id=\"punnett\">\u003c/div>\n    <div class=\"res-box\" id=\"punnett-res\">\u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">3\u003c/span> Autre exemple : les lobes d'oreille\u003c/h2>\n    <p>Le lobe de l'oreille peut être <strong>détaché\u003c/strong> (libre) ou <strong>attaché\u003c/strong> : ce sont deux <strong>phénotypes\u003c/strong> d'un même caractère héréditaire, déterminés par deux <strong>allèles\u003c/strong> d'un même gène. Comme pour les groupes sanguins, on peut avoir <strong>2 allèles identiques\u003c/strong> ou <strong>2 allèles différents\u003c/strong>.\u003c/p>\n    <div class=\"callout exemple\">\n      <p class=\"callout-title\">Notation classique\u003c/p>\n      <p>Allèle <strong>D\u003c/strong> = lobe détaché (dominant) ; allèle <strong>a\u003c/strong> = lobe attaché (récessif).\u003c/p>\n      <ul>\n        <li>Lobe <strong>attaché\u003c/strong> → génotype <strong>a // a\u003c/strong> (obligatoirement).\u003c/li>\n        <li>Lobe <strong>détaché\u003c/strong> → <strong>D // D\u003c/strong> ou <strong>D // a\u003c/strong>.\u003c/li>\n      \u003c/ul>\n      <p class=\"muted\">Ta fiche d'activité peut utiliser d'autres lettres : l'idée reste la même.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 4 : TP ADN ===================== -->\n  <section id=\"adn\" class=\"tab-content\">\n    <h2>🍌 TP : extraire l'ADN d'une banane\u003c/h2>\n    <div class=\"callout definition\">\n      <p class=\"callout-title\">Objectif du TP\u003c/p>\n      <p>Extraire les molécules qui constituent les <strong>chromosomes\u003c/strong> (l'<strong>ADN\u003c/strong>) des cellules de banane, pour pouvoir les <strong>voir\u003c/strong>.\u003c/p>\n    \u003c/div>\n\n    <div class=\"card card-accent tp-step\">\n      <div class=\"tp-num\">1\u003c/div>\n      <div>\n        <h3>Broyer la banane\u003c/h3>\n        <p><strong>Geste :\u003c/strong> couper ¼ de banane en petits fragments et les déposer dans le mortier.\u003c/p>\n        <p><strong>Objectif :\u003c/strong> séparer les différentes cellules du tissu étudié.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    <div class=\"card card-accent tp-step\">\n      <div class=\"tp-num\">2\u003c/div>\n      <div>\n        <h3>Ajouter le liquide d'extraction\u003c/h3>\n        <p><strong>Geste :\u003c/strong> continuer le broyage en ajoutant 40 mL de liquide d'extraction (eau salée + 4 gouttes de liquide vaisselle).\u003c/p>\n        <p><strong>Objectif :\u003c/strong> casser les membranes pour libérer l'ADN.\u003c/p>\n        <p><strong>Moyen :\u003c/strong> le liquide vaisselle et le sel désorganisent les membranes (y compris celle qui délimite le noyau).\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    <div class=\"card card-accent tp-step\">\n      <div class=\"tp-num\">3\u003c/div>\n      <div>\n        <h3>Filtrer\u003c/h3>\n        <p><strong>Geste :\u003c/strong> filtrer le broyat en le versant dans un tube à essai. <em>Ne pas comprimer le filtre !\u003c/em>\u003c/p>\n        <p><strong>Objectif :\u003c/strong> séparer l'ADN du reste des constituants de la cellule.\u003c/p>\n        <p><strong>Moyen :\u003c/strong> le papier filtre retient les plus gros constituants cellulaires et laisse passer l'ADN.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    <div class=\"card card-accent tp-step\">\n      <div class=\"tp-num\">4\u003c/div>\n      <div>\n        <h3>Faire précipiter l'ADN\u003c/h3>\n        <p><strong>Geste :\u003c/strong> transférer une partie du filtrat dans un autre tube, puis verser <strong>lentement\u003c/strong> le long de la paroi (tube bien incliné) <strong>2 volumes d'alcool réfrigéré\u003c/strong>.\u003c/p>\n        <p><strong>Objectifs :\u003c/strong> faire <strong>précipiter\u003c/strong> l'ADN afin de le voir <strong>et\u003c/strong> éviter la destruction de l'ADN.\u003c/p>\n        <p><strong>Moyens :\u003c/strong> l'alcool déshydrate les molécules d'ADN, qui s'agglutinent alors pour devenir visibles. Le froid limite les réactions qui détruisent l'ADN quand il sort du noyau.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">R\u003c/span> Le résultat : le tube final\u003c/h2>\n    <p>On doit voir se former un <strong>précipité blanc\u003c/strong> (une sorte de « méduse »).\u003c/p>\n    <div class=\"fig small\">\n      <svg class=\"bio\" viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Tube à essai : alcool au-dessus, ADN à l'interface, filtrat en dessous\">\n        \u003c!-- liquides -->\n        <rect class=\"liq2\" x=\"110\" y=\"90\" width=\"54\" height=\"40\"/>\n        <rect class=\"liq1\" x=\"110\" y=\"130\" width=\"54\" height=\"110\"/>\n        <path class=\"liq1\" d=\"M110 240 a27 27 0 0 0 54 0z\"/>\n        \u003c!-- tube -->\n        <path class=\"tube\" d=\"M110 30 V240 a27 27 0 0 0 54 0 V30\"/>\n        \u003c!-- ADN -->\n        <path class=\"dna\" d=\"M120 128 q6 -10 12 0 t12 0 t10 0 M124 122 q5 8 10 0 t12 0 M128 134 q6 8 12 0 t10 0 M118 125 q4 -8 9 -3\"/>\n        \u003c!-- légendes -->\n        <path class=\"line\" d=\"M164 36 H196 M164 110 H196 M164 176 H196 M110 128 H78\"/>\n        <text class=\"b\" x=\"200\" y=\"40\">tube à essai\u003c/text>\n        <text class=\"b\" x=\"200\" y=\"114\">alcool (éthanol)\u003c/text>\n        <text class=\"sm\" x=\"200\" y=\"129\">froid, versé lentement\u003c/text>\n        <text class=\"b\" x=\"200\" y=\"180\">filtrat\u003c/text>\n        <text class=\"sm\" x=\"200\" y=\"195\">(extrait filtré)\u003c/text>\n        <text class=\"b\" x=\"10\" y=\"124\">ADN\u003c/text>\n        <text class=\"sm\" x=\"10\" y=\"140\">précipité blanc\u003c/text>\n      \u003c/svg>\n      <p class=\"cap\">Schéma légendé du tube : l'ADN se forme à la limite entre l'alcool et le filtrat.\u003c/p>\n    \u003c/div>\n\n    <h3>🧠 Teste-toi sur le TP\u003c/h3>\n    <details class=\"reveal\">\n      <summary><span>Pourquoi ajoute-t-on du liquide vaisselle et du sel ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\"><span class=\"solution\">Pour casser (désorganiser) les membranes et libérer l'ADN.\u003c/span>\n      <p>Les membranes de la cellule et du noyau sont détruites, ce qui libère l'ADN dans le liquide.\u003c/p>\u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Pourquoi utilise-t-on un papier filtre ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\"><span class=\"solution\">Il retient les gros constituants des cellules et laisse passer l'ADN.\u003c/span>\u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Pourquoi l'alcool est-il réfrigéré et versé lentement ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\"><span class=\"solution\">Le froid évite la destruction de l'ADN ; l'alcool précipite l'ADN pour le rendre visible.\u003c/span>\n      <p>En le versant lentement, le long de la paroi, l'alcool reste au-dessus du filtrat et l'ADN apparaît à la limite entre les deux liquides.\u003c/p>\u003c/div>\n    \u003c/details>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 5 : EXERCICES ===================== -->\n  <section id=\"exercices\" class=\"tab-content\">\n    <h2>✏️ Exercices\u003c/h2>\n\n    <h2 class=\"section-title\"><span class=\"num\">1\u003c/span> Le rôle des gènes contenus dans les chromosomes\u003c/h2>\n    <p class=\"src\">Exercice du cours : « Comment les chromosomes d'un être humain déterminent-ils ses caractères ? »\u003c/p>\n\n    <div class=\"doc\">\n      <p><strong>Document 1 (texte).\u003c/strong> On connaît des individus de sexe <strong>féminin\u003c/strong> dont le caryotype comporte un chromosome X et un chromosome Y, mais une étude biochimique montre l'<strong>absence d'un fragment A\u003c/strong> sur leur chromosome Y. Par ailleurs, chez des individus de sexe <strong>masculin\u003c/strong> bien que de caryotype XX, on a découvert la <strong>présence anormale\u003c/strong> de ce même fragment A de chromosome Y. Ce fragment A est un gène appelé <strong>TDF\u003c/strong> (<em>testis determining factor\u003c/em>).\u003c/p>\n      <p><strong>Document 2 (cartes génétiques).\u003c/strong> Une carte génétique est une présentation schématisée des différents gènes portés par un chromosome.\u003c/p>\n    \u003c/div>\n\n    <div class=\"grid-2\">\n      <div class=\"fig\" style=\"margin:0\"><div id=\"map11\">\u003c/div>\u003c/div>\n      <div class=\"fig\" style=\"margin:0\"><div id=\"mapX\">\u003c/div>\u003c/div>\n    \u003c/div>\n\n    <details class=\"reveal\">\n      <summary><span>Q1. À partir du texte, précise ce qui est responsable du sexe masculin ou féminin d'un individu.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">C'est la présence du gène TDF qui détermine le sexe masculin ; son absence détermine le sexe féminin.\u003c/span>\n        <p>Des individus XY mais <strong>sans\u003c/strong> le fragment A sont de sexe <strong>féminin\u003c/strong>. Des individus XX mais <strong>avec\u003c/strong> le fragment A sont de sexe <strong>masculin\u003c/strong>. Ce n'est donc pas le caryotype seul, mais ce gène qui décide.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Q2. Explique, à partir de cet exemple, ce qu'on appelle un gène.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Un gène est un morceau (une portion) de chromosome qui détermine un caractère précis.\u003c/span>\n        <p>Ici, le gène TDF est une portion du chromosome Y qui détermine un caractère héréditaire précis : le sexe masculin.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Q3. Avec la carte du chromosome X, explique comment ce chromosome peut être responsable de plusieurs caractères.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Le chromosome X renferme plusieurs gènes, donc plusieurs caractères.\u003c/span>\n        <p>La carte montre sur le même chromosome X des gènes pour l'albinisme (yeux), la myopie, le daltonisme, l'hémophilie A et B, la maladie de Duchenne, la goutte… Chaque gène commande un caractère précis : un chromosome qui porte de nombreux gènes détermine donc de nombreux caractères.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Q4. Indique combien d'exemplaires de chaque gène sont présents dans chacune de nos cellules et où ils sont localisés.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Il existe 2 exemplaires de chaque gène, au même endroit sur les 2 chromosomes d'une même paire.\u003c/span>\n        <p>Cela vient du fait que nos chromosomes vont par paires (un venant du père, un de la mère). Les 2 exemplaires peuvent être identiques ou être 2 versions différentes (allèles).\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>Q5. Construis une conclusion qui répond au problème posé.\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Les chromosomes portent les gènes, et chaque gène détermine un caractère précis.\u003c/span>\n        <p>Chaque chromosome contient de très nombreux gènes (environ 30 000 pour les 23 paires de l'espèce humaine), et chaque gène commande un caractère héréditaire précis. Chaque gène existe en 2 exemplaires dans nos cellules. C'est ainsi que les chromosomes déterminent les caractères d'un être humain, même s'il y a des milliers de caractères pour seulement 46 chromosomes.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    <h2 class=\"section-title\"><span class=\"num\">2\u003c/span> Groupes sanguins\u003c/h2>\n    <details class=\"reveal\">\n      <summary><span>a. Un enfant de groupe O peut-il naître d'un père AB et d'une mère O ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Non.\u003c/span>\n        <p>Pour être de groupe O, l'enfant doit avoir O // O, donc recevoir un allèle O de chacun de ses parents. Le père A // B n'a pas d'allèle O.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Quels sont les génotypes possibles d'une personne de groupe A ? De groupe AB ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Groupe A : A // A ou A // O. Groupe AB : A // B seulement.\u003c/span>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>c. Deux parents de groupe A peuvent-ils avoir un enfant de groupe O ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Oui, s'ils sont tous les deux A // O.\u003c/span>\n        <p>Chacun peut donner son allèle O, et l'enfant sera alors O // O. (Utilise le simulateur de l'onglet 🩸 pour le vérifier avec A // O × A // O.)\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>d. Une personne de groupe B a une mère de groupe O. Quel est son génotype ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">B // O.\u003c/span>\n        <p>Sa mère O // O lui a donné un allèle O. Pour être de groupe B, elle a donc reçu B de son père : génotype B // O.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n\n    <h2 class=\"section-title\"><span class=\"num\">3\u003c/span> Lobes d'oreille\u003c/h2>\n    <p class=\"src\">Avec la notation D (détaché, dominant) et a (attaché, récessif).\u003c/p>\n    <details class=\"reveal\">\n      <summary><span>a. Quel est le génotype d'une personne qui a les lobes attachés ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\"><span class=\"solution\">a // a.\u003c/span><p>L'allèle « attaché » est récessif : il ne s'exprime que s'il est présent en deux exemplaires.\u003c/p>\u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Deux parents aux lobes détachés peuvent-ils avoir un enfant aux lobes attachés ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\"><span class=\"solution\">Oui, s'ils sont tous les deux D // a.\u003c/span><p>Chacun donne l'allèle a à l'enfant, qui est alors a // a : lobes attachés.\u003c/p>\u003c/div>\n    \u003c/details>\n\n    <h2 class=\"section-title\"><span class=\"num\">4\u003c/span> Division cellulaire\u003c/h2>\n    <details class=\"reveal\">\n      <summary><span>a. Une cellule-œuf humaine se prépare à se diviser. Combien a-t-elle de chromosomes avant la duplication ? Et de chromatides après ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">46 chromosomes ; après la duplication, chacun a 2 chromatides (donc 92 chromatides en tout).\u003c/span>\n        <p>Il y a toujours <strong>46 chromosomes\u003c/strong> : ils sont seulement devenus « doubles ».\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>b. Combien de chromosomes reçoit chaque cellule-fille ? Ressemblent-ils à ceux de la cellule-œuf ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">46 chromosomes (23 paires), identiques à ceux de la cellule-œuf.\u003c/span>\n        <p>Chaque cellule-fille reçoit une chromatide de chaque chromosome : le programme génétique est conservé sans perte.\u003c/p>\n      \u003c/div>\n    \u003c/details>\n    <details class=\"reveal\">\n      <summary><span>c. Pourquoi une cellule de la peau et une cellule du foie ont-elles la même information génétique ?\u003c/span>\u003c/summary>\n      <div class=\"reveal-body\">\n        <span class=\"solution\">Elles viennent toutes de la cellule-œuf par des divisions successives qui conservent l'information.\u003c/span>\n      \u003c/div>\n    \u003c/details>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 6 : À RETENIR ===================== -->\n  <section id=\"retenir\" class=\"tab-content\">\n    <h2>📌 Ce qu'il faut retenir\u003c/h2>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">1. Les gènes\u003c/p>\n      <ul>\n        <li>Un <strong>gène\u003c/strong> est une portion de chromosome qui commande un <strong>caractère héréditaire précis\u003c/strong>, à un emplacement déterminé.\u003c/li>\n        <li>L'ensemble des gènes = le <strong>génome\u003c/strong> (≈ 30 000 gènes chez l'humain, sur 23 paires de chromosomes).\u003c/li>\n        <li>Chaque gène existe en <strong>2 exemplaires\u003c/strong>, au même endroit sur les 2 chromosomes d'une paire.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">2. Allèles, génotype, phénotype\u003c/p>\n      <ul>\n        <li>Un gène existe sous plusieurs versions : les <strong>allèles\u003c/strong>.\u003c/li>\n        <li>Les 2 allèles peuvent être <strong>identiques\u003c/strong> ou <strong>différents\u003c/strong>. Leur combinaison = le <strong>génotype\u003c/strong>.\u003c/li>\n        <li>Le caractère dépend d'<strong>un seul\u003c/strong> ou des <strong>deux\u003c/strong> allèles (dominant / récessif / co-dominants).\u003c/li>\n      \u003c/ul>\n      <span class=\"formula\">PHÉNOTYPE = GÉNOTYPE + ENVIRONNEMENT\u003c/span>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">3. Groupes sanguins\u003c/p>\n      <ul>\n        <li>Allèles <strong>A, B, O\u003c/strong> ; A et B dominants sur O ; A et B co-dominants.\u003c/li>\n        <li>A : A//A ou A//O · B : B//B ou B//O · AB : A//B · O : O//O.\u003c/li>\n        <li>Chaque enfant reçoit <strong>un allèle de chaque parent\u003c/strong>.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">4. Transmission sans perte\u003c/p>\n      <ul>\n        <li>Au cours des divisions de la cellule-œuf, le nombre de chromosomes est <strong>conservé\u003c/strong> (46).\u003c/li>\n        <li><strong>Avant\u003c/strong> la division : duplication → chaque chromosome a <strong>2 chromatides identiques\u003c/strong>.\u003c/li>\n        <li><strong>Pendant\u003c/strong> la division : les chromatides se <strong>séparent\u003c/strong>.\u003c/li>\n        <li><strong>Après\u003c/strong> : chaque cellule-fille a 46 chromosomes identiques à ceux de la cellule de départ.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <div class=\"callout retenir\">\n      <p class=\"callout-title\">5. Extraction de l'ADN\u003c/p>\n      <ul>\n        <li><strong>Broyer\u003c/strong> → séparer les cellules · <strong>liquide vaisselle + sel\u003c/strong> → casser les membranes · <strong>filtrer\u003c/strong> → séparer l'ADN du reste · <strong>alcool froid\u003c/strong> → faire précipiter l'ADN (le voir) et éviter sa destruction.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <h2>🃏 Cartes mémoire\u003c/h2>\n    <p class=\"muted\">Réponds dans ta tête, puis touche la carte pour la retourner.\u003c/p>\n    <div id=\"cartes\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 7 : QCM ===================== -->\n  <section id=\"qcm\" class=\"tab-content\">\n    <h2>🎯 QCM : 12 questions tirées au hasard\u003c/h2>\n    <p class=\"muted\">À chaque nouvelle partie, les questions changent. Clique sur « Recommencer » pour rejouer.\u003c/p>\n    <div id=\"quiz-qcm\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ===================== ONGLET 8 : VRAI / FAUX ===================== -->\n  <section id=\"vf\" class=\"tab-content\">\n    <h2>✔️ Vrai ou faux ?\u003c/h2>\n    <p class=\"muted\">Lis bien chaque affirmation avant de répondre.\u003c/p>\n    <div id=\"quiz-vf\">\u003c/div>\n  \u003c/section>\n\n\u003c/main>\n\n<script>\n(function () {\n  'use strict';\n  var $ = function (s) { return document.querySelector(s); };\n\n  /* ============ Bouton « Voir la division » ============ */\n  var go = document.querySelector('[data-goto]');\n  if (go) go.addEventListener('click', function () {\n    var t = document.querySelector('.tab[data-tab=\"' + go.getAttribute('data-goto') + '\"]');\n    if (t) t.click();\n  });\n\n  /* ============ Cartes génétiques (document 2) ============ */\n  function geneMap(sel, title, items, pair) {\n    var rowH = 26, n = items.length, h = Math.max(190, 60 + n * rowH);\n    var chrH = h - 70, cx = pair ? [50, 82] : [60];\n    var s = '<svg class=\"bio\" viewBox=\"0 0 330 ' + h + '\" role=\"img\" aria-label=\"Carte génétique : ' + title + '\">';\n    cx.forEach(function (x, k) {\n      s += '<rect class=\"' + (k ? 'fb2' : 'fa2') + '\" x=\"' + (x - 10) + '\" y=\"30\" width=\"20\" height=\"' + chrH + '\" rx=\"10\"/>';\n      for (var i = 0; i < n; i++) {\n        var y = 40 + (chrH - 30) * (i + .5) / n;\n        s += '<rect class=\"' + (i % 2 ? 'band2' : 'band') + '\" x=\"' + (x - 10) + '\" y=\"' + (y - 3) + '\" width=\"20\" height=\"6\"/>';\n      }\n    });\n    var xr = cx[cx.length - 1] + 10;\n    for (var j = 0; j < n; j++) {\n      var yy = 40 + (chrH - 30) * (j + .5) / n, ty = 40 + 14 + j * ((h - 84) / n);\n      s += '<path class=\"line\" d=\"M' + xr + ' ' + yy + ' L' + (xr + 22) + ' ' + ty + ' H' + (xr + 34) + '\"/>';\n      s += '<text class=\"sm\" x=\"' + (xr + 38) + '\" y=\"' + (ty + 4) + '\">' + items[j] + '\u003c/text>';\n    }\n    s += '<text class=\"b\" x=\"165\" y=\"18\" text-anchor=\"middle\">' + title + '\u003c/text>';\n    return $(sel).innerHTML = s + '\u003c/svg><p class=\"cap\">Carte génétique : chaque trait = un gène.\u003c/p>';\n  }\n  geneMap('#map11', 'Chromosome n° 11', ['Prédisposition au diabète', 'Thalassémie bêta', 'Drépanocytose', 'Surdité', 'Albinisme (peau, yeux)', 'Excès de lipides (sang)', 'Trouble cardiaque'], true);\n  geneMap('#mapX', 'Chromosome X', ['Albinisme (yeux)', 'Maladie de Duchenne', 'Myopie', 'Goutte', 'Hémophilie B', 'Daltonisme', 'Hémophilie A', '41 gènes : retard mental'], false);\n\n  /* ============ Division cellulaire : schéma en 4 étapes ============ */\n  var stages = [\n    { name: '1. Cellule de départ', txt: 'La <b>cellule-œuf\u003c/b> contient <b>46 chromosomes\u003c/b> (23 paires). Chaque chromosome est formé d\\'<b>une seule chromatide\u003c/b>.', chrom: 46, chrmt: 46, cells: 1 },\n    { name: '2. Duplication', txt: '<b>Avant la division\u003c/b>, chaque chromosome est <b>copié\u003c/b> : il est maintenant formé de <b>2 chromatides identiques\u003c/b>. L\\'information est <b>en double\u003c/b>. Il y a toujours 46 chromosomes.', chrom: 46, chrmt: 92, cells: 1 },\n    { name: '3. Séparation', txt: '<b>Au moment de la division\u003c/b>, les <b>2 chromatides\u003c/b> de chaque chromosome <b>se séparent\u003c/b> et partent chacune vers un pôle de la cellule.', chrom: 46, chrmt: 92, cells: 1 },\n    { name: '4. Deux cellules-filles', txt: 'Chaque <b>cellule-fille\u003c/b> reçoit <b>une chromatide de chaque chromosome\u003c/b> : <b>46 chromosomes\u003c/b> (23 paires), <b>identiques\u003c/b> à ceux de la cellule de départ.', chrom: 46, chrmt: 46, cells: 2 }\n  ];\n  var cur = 0;\n  var chromDef = [{ x: 138, h: 74, c: 'fa' }, { x: 162, h: 74, c: 'fb' }, { x: 198, h: 46, c: 'fa' }, { x: 222, h: 46, c: 'fb' }];\n\n  function rod(x, cy, h, c, double) {\n    if (!double) return '<rect class=\"' + c + '\" x=\"' + (x - 4) + '\" y=\"' + (cy - h / 2) + '\" width=\"8\" height=\"' + h + '\" rx=\"4\"/>';\n    return '<rect class=\"' + c + '\" x=\"' + (x - 8.5) + '\" y=\"' + (cy - h / 2) + '\" width=\"7\" height=\"' + h + '\" rx=\"3.5\"/>' +\n           '<rect class=\"' + c + '\" x=\"' + (x + 1.5) + '\" y=\"' + (cy - h / 2) + '\" width=\"7\" height=\"' + h + '\" rx=\"3.5\"/>' +\n           '<circle class=\"cen\" cx=\"' + x + '\" cy=\"' + cy + '\" r=\"3.2\"/>';\n  }\n  function drawStage(i) {\n    var s = '<svg class=\"bio\" viewBox=\"0 0 360 340\" role=\"img\" aria-label=\"Division cellulaire, étape ' + (i + 1) + ' sur 4\">';\n    if (i < 2) {\n      s += '<ellipse class=\"cell\" cx=\"180\" cy=\"170\" rx=\"122\" ry=\"120\"/>';\n      s += '<ellipse class=\"nuc\" cx=\"180\" cy=\"170\" rx=\"80\" ry=\"78\"/>';\n      chromDef.forEach(function (d) { s += rod(d.x + 0, 170, d.h, d.c, i === 1); });\n      s += '<text class=\"sm\" x=\"180\" y=\"318\" text-anchor=\"middle\">' + (i === 0 ? 'chaque chromosome = 1 chromatide' : 'chaque chromosome = 2 chromatides identiques') + '\u003c/text>';\n    } else if (i === 2) {\n      s += '<path class=\"cell\" d=\"M180 30 C 270 30 300 80 290 120 C 270 138 270 150 290 170 C 300 210 270 306 180 306 C 90 306 60 210 70 170 C 90 150 90 138 70 120 C 60 80 90 30 180 30 Z\"/>';\n      s += '<path class=\"dash\" d=\"M70 168 H290\"/>';\n      chromDef.forEach(function (d) { s += rod(d.x + 0, 98, d.h, d.c, false) + rod(d.x + 0, 238, d.h, d.c, false); });\n      s += '<text class=\"sm\" x=\"180\" y=\"328\" text-anchor=\"middle\">les chromatides se séparent\u003c/text>';\n    } else {\n      [{ cy: 88 }, { cy: 252 }].forEach(function (c) {\n        s += '<circle class=\"cell\" cx=\"180\" cy=\"' + c.cy + '\" r=\"76\"/>';\n        s += '<circle class=\"nuc\" cx=\"180\" cy=\"' + c.cy + '\" r=\"52\"/>';\n        chromDef.forEach(function (d) { s += rod(d.x, c.cy, d.h * .82, d.c, false); });\n      });\n      s += '<text class=\"b sm\" x=\"262\" y=\"92\">cellule-fille 1\u003c/text>';\n      s += '<text class=\"b sm\" x=\"262\" y=\"256\">cellule-fille 2\u003c/text>';\n    }\n    return s + '\u003c/svg>';\n  }\n  function renderDiv() {\n    var st = stages[cur];\n    $('#div-svg').innerHTML = drawStage(cur);\n    $('#div-text').innerHTML = st.txt;\n    var nch = cur === 2 ? '2 × 46' : '46';\n    $('#div-count').innerHTML =\n      '<div class=\"count\"><b>' + (cur === 3 ? '2' : '1') + '\u003c/b><small>cellule' + (cur === 3 ? 's' : '') + '\u003c/small>\u003c/div>' +\n      '<div class=\"count\"><b>' + nch + '\u003c/b><small>' + (cur === 3 ? 'chromosomes dans chaque cellule-fille' : cur === 2 ? 'chromosomes (un lot par pôle)' : 'chromosomes') + '\u003c/small>\u003c/div>' +\n      '<div class=\"count\"><b>' + (cur === 1 ? '2' : '1') + '\u003c/b><small>chromatide' + (cur === 1 ? 's' : '') + ' par chromosome\u003c/small>\u003c/div>';\n    var pills = document.querySelectorAll('#div-nav .step-pill');\n    for (var k = 0; k < pills.length; k++) pills[k].classList.toggle('on', k === cur);\n    $('#div-prev').disabled = cur === 0;\n    $('#div-next').textContent = cur === stages.length - 1 ? '↻ Recommencer' : 'Suivant →';\n  }\n  stages.forEach(function (st, k) {\n    var b = document.createElement('button');\n    b.type = 'button'; b.className = 'step-pill'; b.textContent = st.name;\n    b.addEventListener('click', function () { cur = k; renderDiv(); });\n    $('#div-nav').appendChild(b);\n  });\n  $('#div-prev').addEventListener('click', function () { if (cur > 0) { cur--; renderDiv(); } });\n  $('#div-next').addEventListener('click', function () { cur = cur === stages.length - 1 ? 0 : cur + 1; renderDiv(); });\n  renderDiv();\n\n  /* ============ Simulateur de croisement (groupes sanguins) ============ */\n  function pheno(g) {\n    var a = g.indexOf('A') >= 0, b = g.indexOf('B') >= 0;\n    return a && b ? 'AB' : a ? 'A' : b ? 'B' : 'O';\n  }\n  function fmt(g) { return g.charAt(0) + ' // ' + g.charAt(1); }\n  function punnett() {\n    var g1 = $('#p1').value, g2 = $('#p2').value, rows = '', found = {}, order = ['A', 'B', 'AB', 'O'];\n    var p1 = g1.split(''), p2 = g2.split('');\n    var head = '<tr><th>\u003c/th><th>' + p2[0] + '\u003c/th><th>' + p2[1] + '\u003c/th>\u003c/tr>';\n    p1.forEach(function (a) {\n      rows += '<tr><th>' + a + '\u003c/th>';\n      p2.forEach(function (b) {\n        var g = [a, b].sort().join(''), ph = pheno(g);\n        found[ph] = (found[ph] || 0) + 1;\n        rows += '<td><b>' + fmt(g) + '\u003c/b><small>groupe ' + ph + '\u003c/small>\u003c/td>';\n      });\n      rows += '\u003c/tr>';\n    });\n    $('#punnett').innerHTML = '<table class=\"punnett\" aria-label=\"Tableau de croisement\"><tbody>' + head + rows + '\u003c/tbody>\u003c/table>';\n    var list = order.filter(function (k) { return found[k]; }).map(function (k) {\n      return '<span class=\"gp\">' + k + '\u003c/span> ' + (found[k] * 25) + ' %';\n    }).join(' &nbsp; ');\n    var imp = order.filter(function (k) { return !found[k]; }).map(function (k) { return '<span class=\"gp\">' + k + '\u003c/span>'; }).join(' ');\n    $('#punnett-res').innerHTML = '<b>Groupes possibles pour un enfant :\u003c/b> ' + list +\n      (imp ? '<br><b>Impossibles :\u003c/b> ' + imp : '<br>Tous les groupes sont possibles.') +\n      '<br><small>Parent 1 : ' + fmt(g1) + ' → groupe ' + pheno(g1) + ' · Parent 2 : ' + fmt(g2) + ' → groupe ' + pheno(g2) + '\u003c/small>';\n  }\n  $('#p1').addEventListener('change', punnett);\n  $('#p2').addEventListener('change', punnett);\n  punnett();\n\n  /* ============ Cartes mémoire ============ */\n  Lecon.flashcards('#cartes', [\n    { front: 'Gène', back: 'Portion d\\'un chromosome qui commande l\\'expression d\\'<b>un caractère héréditaire précis\u003c/b>, à un emplacement déterminé.' },\n    { front: 'Génome', back: 'L\\'ensemble des gènes d\\'une espèce (environ <b>30 000 gènes\u003c/b> chez l\\'humain, sur 23 paires de chromosomes).' },\n    { front: 'Combien d\\'exemplaires de chaque gène ?', back: '<b>2 exemplaires\u003c/b>, au même endroit sur les 2 chromosomes d\\'une même paire.' },\n    { front: 'Allèle', back: 'Une <b>version\u003c/b> possible d\\'un gène (ex : allèles A, B ou O du groupe sanguin).' },\n    { front: 'Génotype', back: 'La <b>combinaison des allèles\u003c/b> d\\'un individu pour un gène (ex : A // O).' },\n    { front: 'Phénotype', back: 'Ce qui est <b>observable\u003c/b> chez l\\'individu. Il dépend du génotype <b>et\u003c/b> de l\\'environnement.' },\n    { front: 'Formule du phénotype', back: '<b>Phénotype = génotype + environnement\u003c/b>' },\n    { front: 'Quels génotypes pour le groupe sanguin O ?', back: 'Un seul : <b>O // O\u003c/b> (l\\'allèle O est récessif).' },\n    { front: 'Quels génotypes pour le groupe sanguin AB ?', back: 'Un seul : <b>A // B\u003c/b> (A et B sont co-dominants).' },\n    { front: 'Chromatide', back: 'Chacune des <b>2 copies identiques\u003c/b> d\\'un chromosome dupliqué, avant la division cellulaire.' },\n    { front: 'Que se passe-t-il avant la division ?', back: 'Chaque chromosome est <b>copié\u003c/b> (duplication) : il a alors <b>2 chromatides identiques\u003c/b>.' },\n    { front: 'Que se passe-t-il pendant la division ?', back: 'Les <b>2 chromatides\u003c/b> de chaque chromosome <b>se séparent\u003c/b> : chaque cellule-fille en reçoit une.' },\n    { front: 'Gène TDF', back: 'Gène du chromosome <b>Y\u003c/b> : sa <b>présence\u003c/b> détermine le sexe masculin, son <b>absence\u003c/b> le sexe féminin.' },\n    { front: 'Pourquoi du liquide vaisselle et du sel (TP) ?', back: 'Pour <b>casser les membranes\u003c/b> et libérer l\\'ADN.' },\n    { front: 'Pourquoi de l\\'alcool froid (TP) ?', back: 'L\\'alcool <b>fait précipiter\u003c/b> l\\'ADN (on le voit) ; le froid <b>évite sa destruction\u003c/b>.' }\n  ]);\n\n  /* ============ QCM (12 questions tirées parmi 24) ============ */\n  Lecon.qcm('#quiz-qcm', [\n    { question: 'Un gène est…', choices: ['une portion de chromosome qui commande un caractère héréditaire précis', 'un chromosome entier', 'une cellule reproductrice'], answer: 0,\n      explanation: 'Un gène est une <b>portion de chromosome\u003c/b> qui co >Phénotype = génotype + environnement\u003c/b>.' },\n    { question: 'Une personne a les allèles A et O. Quel est son groupe sanguin ?', choices: ['A', 'O', 'AB'], answer: 0,\n      explanation: 'A est <b>dominant\u003c/b> sur O : le phénotype est le groupe A.' },\n    { question: 'Une personne a les allèles A et B. Quel est son groupe sanguin ?', choices: ['AB', 'A', 'O'], answer: 0,\n      explanation: 'A et B sont <b>co-dominants\u003c/b> : les deux s\\'expriment, c\\'est le groupe AB.' },\n    { question: 'Quel est le seul génotype possible d\\'une personne de groupe O ?', choices: ['O // O', 'A // O', 'B // O'], answer: 0,\n      explanation: 'L\\'allèle O est récessif : il faut l\\'avoir <b>en double\u003c/b> pour être de groupe O.' },\n    { question: 'Une personne de groupe A peut avoir pour génotype…', choices: ['A // A ou A // O', 'seulement A // A', 'A // B'], answer: 0,\n      explanation: 'Un groupe A peut cacher un allèle O : <b>A // A\u003c/b> ou <b>A // O\u003c/b>.' },\n    { question: 'Un père AB et une mère O ne peuvent avoir que des enfants…', choices: ['A ou B', 'AB ou O', 'O uniquement'], answer: 0,\n      explanation: 'La mère donne O, le père donne A ou B : les enfants sont <b>A // O\u003c/b> (groupe A) ou <b>B // O\u003c/b> (groupe B).' },\n    { question: 'Un enfant reçoit…', choices: ['un allèle de chacun de ses deux parents', 'les deux allèles de sa mère', 'les deux allèles de son père'], answer: 0,\n      explanation: 'Un enfant reçoit <b>un allèle de chaque parent\u003c/b> pour chaque gène.' },\n    { question: 'Dans le texte sur le sexe, quel gène du chromosome Y détermine le sexe masculin ?', choices: ['TDF', 'ADN', 'Duchenne'], answer: 0,\n      explanation: 'Le gène <b>TDF\u003c/b> (<i>testis determining factor\u003c/i>) : sa présence détermine le sexe masculin.' },\n    { question: 'Pourquoi un chromosome peut-il être responsable de plusieurs caractères ?', choices: ['parce qu\\'il porte de nombreux gènes', 'parce qu\\'il contient plusieurs noyaux', 'parce qu\\'il change de forme'], answer: 0,\n      explanation: 'Un chromosome porte <b>de nombreux gènes\u003c/b>, et chaque gène détermine un caractère précis.' },\n    { question: 'Au cours des divisions successives de la cellule-œuf, le nombre de chromosomes…', choices: ['est conservé', 'est divisé par 2 à chaque fois', 'double à chaque fois'], answer: 0,\n      explanation: 'Le nombre de chromosomes est <b>conservé\u003c/b> : 46 dans chaque cellule.' },\n    { question: 'Avant la division d\\'une cellule, chaque chromosome…', choices: ['est copié (dupliqué)', 'disparaît', 'se coupe en 23 morceaux'], answer: 0,\n      explanation: 'Avant la division, il y a <b>duplication\u003c/b> : chaque chromosome est copié.' },\n    { question: 'Après la duplication, un chromosome est formé de…', choices: ['2 chromatides identiques', '2 chromatides différentes', '1 seule chromatide'], answer: 0,\n      explanation: 'Les <b>2 chromatides\u003c/b> sont identiques : l\\'information est en double.' },\n    { question: 'Combien de chromosomes possède chaque cellule-fille après la division ?', choices: ['46 (23 paires)', '23', '92'], answer: 0,\n      explanation: 'Chaque cellule-fille reçoit une chromatide de chaque chromosome : <b>46 chromosomes\u003c/b>, identiques à ceux de la cellule de départ.' },\n    { question: 'Au moment de la division, que deviennent les 2 chromatides d\\'un chromosome ?', choices: ['elles se séparent', 'elles restent collées', 'elles disparaissent'], answer: 0,\n      explanation: 'Elles <b>se séparent\u003c/b> et chaque cellule-fille en reçoit une.' },\n    { question: 'Dans le TP, pourquoi ajoute-t-on du liquide vaisselle et du sel ?', choices: ['pour casser les membranes et libérer l\\'ADN', 'pour colorer l\\'ADN', 'pour filtrer l\\'ADN'], answer: 0,\n      explanation: 'Ils <b>désorganisent les membranes\u003c/b> (y compris celle du noyau) et libèrent l\\'ADN.' },\n    { question: 'Dans le TP, à quoi sert le papier filtre ?', choices: ['à retenir les gros constituants de la cellule et laisser passer l\\'ADN', 'à faire précipiter l\\'ADN', 'à casser les membranes'], answer: 0,\n      explanation: 'Il sépare l\\'ADN du reste des constituants cellulaires.' },\n    { question: 'Dans le TP, que fait l\\'alcool réfrigéré ?', choices: ['il fait précipiter l\\'ADN et le rend visible', 'il casse les membranes', 'il broie la banane'], answer: 0,\n      explanation: 'L\\'alcool <b>déshydrate\u003c/b> l\\'ADN, qui s\\'agglutine et devient visible (précipité blanc). Le froid limite sa destruction.' }\n  ], { layout: 'step', shuffle: true, shuffleChoices: true, sampleSize: 12 });\n\n  /* ============ Vrai / Faux ============ */\n  Lecon.vraiFaux('#quiz-vf', [\n    { statement: 'Chaque gène existe en un seul exemplaire dans une cellule humaine.', answer: false,\n      explanation: 'Chaque gène existe en <b>2 exemplaires\u003c/b>, un sur chaque chromosome de la paire.' },\n    { statement: 'Un chromosome porte de nombreux gènes.', answer: true,\n      explanation: 'C\\'est pour cela qu\\'il y a des milliers de caractères pour seulement 46 chromosomes.' },\n    { statement: 'Les deux allèles d\\'un gène sont toujours identiques.', answer: false,\n      explanation: 'Ils peuvent être <b>identiques\u003c/b> (A // A) ou <b>différents\u003c/b> (A // O).' },\n    { statement: 'Le génotype se voit directement sur la personne.', answer: false,\n      explanation: 'On observe le <b>phénotype\u003c/b>. Le génotype (les allèles) ne se voit pas.' },\n    { statement: 'Le bronzage est inscrit dans l\\'ADN et sera transmis aux enfants.', answer: false,\n      explanation: 'C\\'est une modification due à l\\'<b>environnement\u003c/b> : elle n\\'est pas héréditaire.' },\n    { statement: 'Une personne de groupe sanguin A peut avoir un allèle O.', answer: true,\n      explanation: 'Avec le génotype <b>A // O\u003c/b>, l\\'allèle A est dominant et masque O.' },\n    { statement: 'Un père de groupe AB et une mère de groupe O peuvent avoir un enfant de groupe O.', answer: false,\n      explanation: 'Il faudrait que le père donne un allèle O, mais il est A // B.' },\n    { statement: 'Deux parents de groupe A peuvent avoir un enfant de groupe O.', answer: true,\n      explanation: 'Oui, s\\'ils sont tous les deux <b>A // O\u003c/b> : chacun peut donner son allèle O.' },\n    { statement: 'La présence du gène TDF sur le chromosome Y détermine le sexe masculin.', answer: true,\n      explanation: 'Son absence, au contraire, détermine le sexe féminin.' },\n    { statement: 'Au cours des divisions de la cellule-œuf, le nombre de chromosomes est divisé par 2 à chaque fois.', answer: false,\n      explanation: 'Il est <b>conservé\u003c/b> : chaque cellule-fille a 46 chromosomes.' },\n    { statement: 'Après la duplication, un chromosome est formé de 2 chromatides identiques.', answer: true,\n      explanation: 'C\\'est ce qui permet de transmettre l\\'information <b>sans perte\u003c/b>.' },\n    { statement: 'Chaque cellule-fille reçoit les deux chromatides d\\'un même chromosome.', answer: false,\n      explanation: 'Les 2 chromatides <b>se séparent\u003c/b> : chaque cellule-fille en reçoit <b>une seule\u003c/b>.' },\n    { statement: 'Dans le TP, l\\'alcool est versé froid pour limiter la destruction de l\\'ADN.', answer: true,\n      explanation: 'Le froid limite les réactions qui détruisent l\\'ADN quand il sort du noyau.' },\n    { statement: 'Un caryotype et un génome, c\\'est la même chose.', answer: false,\n      explanation: 'Le <b>caryotype\u003c/b> est la présentation classée des chromosomes ; le <b>génome\u003c/b> est l\\'ensemble des gènes.' }\n  ], { shuffle: true });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}}</script>

  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',
  expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  shrink: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
};

/* ---------- Thème & couleur de la matière ---------- */
const app = document.getElementById('app');
const crumbs = document.getElementById('crumbs');
function setColor(color) {
  document.documentElement.style.setProperty('--c', color);
  document.querySelector('meta[name="theme-color"]').content = color;
}
function renderThemeBtn() {
  document.getElementById('themeBtn').innerHTML = document.documentElement.classList.contains('dark') ? ICONS.sun : ICONS.moon;
}
document.getElementById('themeBtn').onclick = () => {
  const dark = document.documentElement.classList.toggle('dark');
  state.theme = dark ? 'dark' : 'light'; save();
  renderThemeBtn(); styleFrame();
};

/* ---------- Plein écran ---------- */
const root = document.documentElement;
const fsSupported = !!(root.requestFullscreen || root.webkitRequestFullscreen);
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
function isFull() { return fsSupported ? !!fsElement() : document.body.classList.contains('focus'); }
function renderFsBtn() { document.getElementById('fsBtn').innerHTML = isFull() ? ICONS.shrink : ICONS.expand; }
function toggleFull() {
  if (fsSupported) {
    if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  } else {
    document.body.classList.toggle('focus');
    renderFsBtn();
  }
}
document.getElementById('fsBtn').onclick = toggleFull;
document.getElementById('exitFocus').onclick = toggleFull;
document.addEventListener('fullscreenchange', renderFsBtn);
document.addEventListener('webkitfullscreenchange', renderFsBtn);

/* ---------- Fil d'Ariane ---------- */
function setCrumbs(parts) {
  crumbs.innerHTML = parts.map((p, i) =>
    (i ? '<span class="sep">›</span>' : '') + (p.href ? `<a href="${p.href}">${esc(p.label)}</a>` : `<span>${esc(p.label)}</span>`)
  ).join('');
}

/* ---------- Vues ---------- */
function chip(c) {
  return `<a class="card chip" href="${href(c)}" style="--sc:${c.subject.color}" title="${esc(c.title)} — ${esc(c.subject.name)}, ajouté le ${fmtDate(c.added)}">
    <span class="ico">${esc(c.subject.icon)}</span>
    <span class="txt">
      <span class="t">${esc(c.title)}</span>
      <span class="s"><span>${esc(c.subject.name)}</span>${isNew(c) ? '<span class="tag new">Nouveau</span>' : ''}</span>
    </span>
  </a>`;
}

function viewHome() {
  setColor(DEFAULT_COLOR);
  setCrumbs([]);
  const g = progress(ALL);
  const last = state.last && byKey(state.last);
  const recent = [...ALL].sort((a, b) => b.added.localeCompare(a.added) || b.order - a.order).slice(0, 6);

  app.innerHTML = `
    <section class="card hero">
      <div>
        <h1>Bonjour ${esc(STUDENT)} !</h1>
        <p>${g.d === g.t ? 'Bravo, tout est terminé !' : `Choisis une matière pour réviser. ${g.t - g.d} chapitre${g.t - g.d > 1 ? 's' : ''} restant${g.t - g.d > 1 ? 's' : ''}.`}</p>
      </div>
      <div class="ring" style="--p:${g.p}" title="Chapitres terminés"><div>${g.d}/${g.t}<small>terminés</small></div></div>
    </section>

    <div class="search">${ICONS.search}<input id="q" type="search" placeholder="Rechercher un chapitre…" autocomplete="off"></div>
    <div id="results"></div>

    <div id="homeSections">
      ${last ? `
        <h2 class="section">Reprendre</h2>
        <a class="card resume" href="${href(last)}" style="--sc:${last.subject.color}">
          <span class="badge-ico">${esc(last.subject.icon)}</span>
          <span><b>${esc(last.title)}</b><br><small style="color:var(--muted)">${esc(last.subject.name)}</small></span>
          <span class="go">Continuer ›</span>
        </a>` : ''}

      <h2 class="section">Derniers ajouts</h2>
      <div class="recent">${recent.map(chip).join('')}</div>

      <h2 class="section">Matières</h2>
      <div class="grid">
        ${SUBJECTS.map(s => {
          const p = progress(ALL.filter(c => c.subject === s));
          const nb = s.chapters.length;
          const news = ALL.filter(c => c.subject === s && isNew(c)).length;
          return `<a class="card subject" href="#/${s.id}" style="--sc:${s.color}">
            <div class="row">
              <span class="badge-ico">${esc(s.icon)}</span>
              <div><h3>${esc(s.name)}</h3><span class="count">${nb} chapitre${nb > 1 ? 's' : ''}</span>
              ${news ? ` <span class="tag new">${news} nouveau${news > 1 ? 'x' : ''}</span>` : ''}</div>
            </div>
            <div class="bar"><i style="width:${p.p}%"></i></div>
            <span class="count">${p.d}/${p.t} terminé${p.d > 1 ? 's' : ''}</span>
          </a>`;
        }).join('')}
      </div>
    </div>`;

  const rec = app.querySelector('.recent');
  const fade = () => rec.classList.toggle('more', rec.scrollLeft + rec.clientWidth < rec.scrollWidth - 4);
  rec.addEventListener('scroll', fade, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(fade).observe(rec);
  fade();

  const q = document.getElementById('q');
  q.addEventListener('input', () => {
    const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const v = norm(q.value.trim());
    document.getElementById('homeSections').style.display = v ? 'none' : '';
    const res = v ? ALL.filter(c => norm(c.title + ' ' + c.subject.name).includes(v)) : [];
    document.getElementById('results').innerHTML = !v ? '' : res.length
      ? `<h2 class="section">Résultats</h2><div class="chip-wrap">${res.map(chip).join('')}</div>`
      : '<p class="empty">Aucun chapitre trouvé.</p>';
  });
}

function viewSubject(s) {
  setColor(s.color);
  setCrumbs([{ label: s.name }]);
  const list = ALL.filter(c => c.subject === s);
  const p = progress(list);
  app.innerHTML = `
    <section class="card banner" style="--sc:${s.color}">
      <span class="badge-ico">${esc(s.icon)}</span>
      <div>
        <h1>${esc(s.name)}</h1>
        <div>${p.d}/${p.t} chapitre${p.t > 1 ? 's' : ''} terminé${p.d > 1 ? 's' : ''}</div>
        <div class="bar"><i style="width:${p.p}%"></i></div>
      </div>
    </section>
    <div class="chapters">
      ${list.map((c, i) => `
        <a class="card chap ${state.done[c.key] ? 'is-done' : ''}" href="${href(c)}" style="--sc:${s.color}">
          <span class="num">${state.done[c.key] ? '✓' : i + 1}</span>
          <span class="info">
            <span class="t">${esc(c.title)}</span>
            <span class="meta">${statusTag(c)} <span>Ajouté le ${fmtDate(c.added)}</span></span>
          </span>
          <span class="arrow">›</span>
        </a>`).join('')}
    </div>`;
}

let frame = null, frameNative = false;
// Envoie le thème et la couleur de la matière à la leçon (assets/quiz.js les applique).
function postTheme() {
  if (!frame || !frame.contentWindow) return;
  try {
    frame.contentWindow.postMessage({
      type: 'rev3e:theme',
      dark: document.documentElement.classList.contains('dark'),
      color: getComputedStyle(document.documentElement).getPropertyValue('--c').trim(),
    }, '*');
  } catch (e) {}
}
// Une leçon qui charge assets/quiz.js annonce qu'elle gère le mode sombre : plus de filtre invert().
window.addEventListener('message', e => {
  if (!frame || e.source !== frame.contentWindow || !e.data || e.data.type !== 'rev3e:ready') return;
  frameNative = true;
  frame.classList.remove('legacy');
  postTheme();
});
function styleFrame() {
  postTheme();
  // Anciennes leçons (filtre invert) : si le navigateur l'autorise, on évite d'inverser les images
  if (!frame || frameNative) return;
  try {
    const doc = frame.contentDocument;
    if (!doc || !doc.head) return;
    let st = doc.getElementById('rev3e-dark');
    if (!st) {
      st = doc.createElement('style'); st.id = 'rev3e-dark'; doc.head.appendChild(st);
    }
    st.textContent = document.documentElement.classList.contains('dark')
      ? 'img, video, picture, canvas { filter: invert(1) hue-rotate(180deg); }' : '';
  } catch (e) { /* accès refusé (fichier local) : le filtre global suffit */ }
}

function viewChapter(c) {
  const s = c.subject;
  setColor(s.color);
  setCrumbs([{ label: s.name, href: '#/' + s.id }, { label: c.title }]);
  document.body.classList.add('reading');

  const list = ALL.filter(x => x.subject === s);
  const i = list.indexOf(c);
  const prev = list[i - 1], next = list[i + 1];

  state.visited[c.key] = Date.now();
  state.last = c.key;
  save();

  app.innerHTML = `
    <div class="reader" style="--sc:${s.color}">
      <div class="reader-bar">
        <button class="pill" id="prev" ${prev ? '' : 'disabled'} title="${prev ? esc(prev.title) : ''}">‹ <span class="lbl">Précédent</span></button>
        <span class="title">${esc(c.title)}</span>
        <button class="pill" id="done"></button>
        <button class="pill" id="next" ${next ? '' : 'disabled'} title="${next ? esc(next.title) : ''}"><span class="lbl">Suivant</span> ›</button>
      </div>
      <iframe id="frame" class="loading" title="${esc(c.title)}"></iframe>
    </div>`;

  frame = document.getElementById('frame');
  frameNative = false;
  frame.srcdoc = lessonDoc(c);
  frame.addEventListener('load', () => {
    if (!frameNative) frame.classList.add('legacy');
    styleFrame();
    frame.classList.remove('loading');
  });
  if (prev) document.getElementById('prev').onclick = () => location.hash = href(prev);
  if (next) document.getElementById('next').onclick = () => location.hash = href(next);

  const doneBtn = document.getElementById('done');
  const renderDone = () => {
    const on = !!state.done[c.key];
    doneBtn.className = 'pill' + (on ? ' done-on' : '');
    doneBtn.innerHTML = on ? '✓ <span class="lbl">Terminé</span>' : '○ <span class="lbl">Marquer terminé</span>';
    doneBtn.title = on ? 'Marquer comme non terminé' : 'Marquer comme terminé';
  };
  doneBtn.onclick = () => {
    if (state.done[c.key]) delete state.done[c.key]; else state.done[c.key] = Date.now();
    save(); renderDone();
  };
  renderDone();
}

/* ---------- Routeur (#/matiere/chapitre) ---------- */
function route() {
  document.body.classList.remove('reading');
  frame = null;
  const [sid, cid] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const s = SUBJECTS.find(x => x.id === sid);
  const c = s && cid && byKey(sid + '/' + cid);
  if (c) viewChapter(c);
  else if (s) viewSubject(s);
  else viewHome();
  if (!c) document.body.classList.remove('focus');
  renderFsBtn();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
renderThemeBtn();
route();
</script>
<script>
  // Installation (PWA) + fonctionnement hors-ligne
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
