      \"Que désigne la guerre éclair ?|Des offensives rapides combinant chars et aviation|Une guerre limitée à la marine|Une trêve entre deux armées|Une guerre sans armes|Cette tactique cherche à désorganiser rapidement l'adversaire.\",\n        \"Quand les armées allemandes remportent-elles la campagne de France ?|Mai-juin 1940|Janvier 1933|Août 1945|Mai 1919|L'offensive allemande aboutit à la défaite française.\",\n        \"Quel pays européen poursuit le combat contre Hitler après la défaite française ?|Le Royaume-Uni|L'Italie fasciste|L'Allemagne|L'Autriche annexée|Churchill refuse de céder face à l'Allemagne.\",\n        \"Qui devient Premier ministre britannique en mai 1940 ?|Winston Churchill|Harry Truman|Philippe Pétain|Rudolf Hess|Churchill dirige le Royaume-Uni pendant l'essentiel de la guerre.\",\n        \"Quel domaine est décisif lors de la bataille d'Angleterre en 1940 ?|Les combats aériens|Les combats de chars dans Londres|Les combats dans le désert|Les bombardements atomiques|L'aviation britannique résiste aux attaques allemandes.\",\n        \"Que désigne l'opération Barbarossa ?|L'invasion allemande de l'URSS|Le débarquement allié en Normandie|La libération de Paris|La création de l'ONU|Hitler rompt le pacte de non-agression.\",\n        \"Quand commence l'invasion allemande de l'URSS ?|22 juin 1941|22 juin 1940|6 juin 1944|30 janvier 1933|Barbarossa ouvre un immense front à l'Est.\",\n        \"Pourquoi l'URSS rejoint-elle le camp allié en 1941 ?|Elle est attaquée par l'Allemagne|Elle annexe les États-Unis|Elle devient une démocratie parlementaire|Elle quitte l'ONU|Son entrée dans ce camp n'implique pas une démocratisation.\",\n        \"Qui dirige l'URSS pendant la guerre ?|Joseph Staline|Adolf Hitler|Charles de Gaulle|Benito Mussolini|Staline dirige une dictature communiste.\",\n        \"Quel événement provoque l'entrée en guerre des États-Unis en décembre 1941 ?|L'attaque japonaise de Pearl Harbor|L'Anschluss|L'appel du 18 juin|Les accords de Munich|Les États-Unis déclarent la guerre au Japon le lendemain.\",\n        \"Quand a lieu l'attaque de Pearl Harbor ?|7 décembre 1941|1er septembre 1939|8 mai 1945|15 août 1944|L'attaque vise la flotte américaine dans le Pacifique.\",\n        \"Où se trouve Pearl Harbor ?|À Hawaï, dans le Pacifique|En Normandie|En Pologne|En Afrique du Nord|C'est une base navale américaine.\",\n        \"Qui est président des États-Unis lors de leur entrée en guerre ?|Franklin D. Roosevelt|Harry Truman|Winston Churchill|Hindenburg|Truman lui succède en avril 1945.\",\n        \"Quelle période correspond globalement aux victoires de l'Axe ?|1939-1942|1944-1945|1914-1918|1947-1950|Le tournant en faveur des Alliés se situe en 1942-1943.\",\n        // Tournant et libération (51-75).\n        \"Quelles années marquent le tournant militaire du conflit ?|1942-1943|1925-1926|1933-1934|1947-1948|Midway, El-Alamein et Stalingrad changent le rapport de force.\",\n        \"Quelle bataille navale de juin 1942 marque un revers japonais ?|Midway|Verdun|Stalingrad|El-Alamein|Midway est une victoire américaine dans le Pacifique.\",\n        \"Dans quel espace se déroule la bataille de Midway ?|Le Pacifique|La Manche|La mer Noire|La Baltique|Les forces américaines y affrontent le Japon.\",\n        \"Où se déroule la bataille d'El-Alamein ?|En Égypte|En URSS|En France|Au Japon|Elle se déroule en Afrique du Nord.\",\n        \"Quel camp remporte El-Alamein à l'automne 1942 ?|Les Alliés|L'Axe|Le Japon seul|L'Allemagne seule|Les forces britanniques et alliées repoussent l'Axe.\",\n        \"Dans quel pays se déroule Stalingrad ?|L'URSS|La France|Le Japon|L'Italie|C'est une bataille du front de l'Est.\",\n        \"Quand se déroule la bataille de Stalingrad ?|1942-1943|1933-1934|1916-1917|1945-1946|Les combats commencent à l'été 1942 et s'achèvent en février 1943.\",\n        \"À quelle date les dernières forces allemandes de Stalingrad capitulent-elles ?|2 février 1943|8 mai 1945|18 juin 1940|1er septembre 1939|Cette défaite constitue un tournant majeur à l'Est.\",\n        \"Quel camp gagne la bataille de Stalingrad ?|L'URSS et donc les Alliés|L'Allemagne et donc l'Axe|Le Japon|L'Italie|L'Armée rouge encercle les forces allemandes.\",\n        \"Pourquoi Stalingrad illustre-t-elle une guerre d'anéantissement ?|Par les combats acharnés, les pertes massives et les destructions|Parce qu'il n'y a aucun civil|Parce que les armées évitent toute violence|Parce que la ville reste intacte|L'extrême violence frappe les combattants et la ville.\",\n        \"Quelle bataille associer au tournant sur le front de l'Est ?|Stalingrad|Pearl Harbor|La bataille d'Angleterre|Le débarquement de Provence|Stalingrad est un grand revers allemand.\",\n        \"Que se passe-t-il en Italie en 1943 ?|Mussolini est renversé et l'Italie signe un armistice|Le Japon envahit Rome|Hitler rétablit la République française|L'Italie conquiert les États-Unis|L'Italie reste divisée et les combats continuent.\",\n        \"Quelle période correspond globalement aux victoires alliées finales ?|1943-1945|1923-1926|1933-1935|1939-1940|Les Alliés progressent sur plusieurs fronts jusqu'aux capitulations.\",\n        \"À quelle date a lieu le débarquement de Normandie ?|6 juin 1944|18 juin 1940|7 décembre 1941|2 septembre 1945|Il ouvre un grand front allié à l'ouest de l'Europe.\",\n        \"Quel est le but du débarquement de Normandie ?|Libérer l'Europe occidentale de l'occupation nazie|Envahir l'URSS avec Hitler|Établir le régime de Vichy|Déclencher la guerre en Pologne|Les troupes alliées progressent ensuite vers l'Allemagne.\",\n        \"Le débarquement de Normandie est-il uniquement français ?|Non, il mobilise plusieurs armées alliées|Oui, seulement des soldats de Vichy|Oui, uniquement des civils français|Non, il est mené par l'Axe|Américains, Britanniques, Canadiens et d'autres Alliés y participent.\",\n        \"Quand a lieu le débarquement de Provence ?|15 août 1944|30 janvier 1933|22 juin 1941|11 novembre 1918|Des forces françaises et alliées débarquent dans le sud de la France.\",\n        \"Quand Paris est-il libéré ?|25 août 1944|1er septembre 1939|22 juin 1940|2 février 1943|La Résistance et les forces alliées, notamment la 2e DB, participent à la libération.\",\n        \"Quelle armée progresse vers Berlin depuis l'Est ?|L'Armée rouge soviétique|L'armée japonaise|L'armée de Vichy|La seule armée italienne|L'URSS joue un rôle majeur dans la défaite allemande.\",\n        \"Quel repère commémore la victoire alliée en Europe ?|8 mai 1945|2 septembre 1945|7 décembre 1941|6 juin 1944|La capitulation allemande met fin à la guerre en Europe.\",\n        \"La guerre mondiale est-elle entièrement terminée le 8 mai 1945 ?|Non, elle continue contre le Japon|Oui, tous les pays capitulent ce jour-là|Oui, le Japon a capitulé en 1944|Non, la guerre européenne commence alors|La capitulation japonaise est signée le 2 septembre.\",\n        \"Quand Hiroshima subit-elle une bombe atomique américaine ?|6 août 1945|6 juin 1944|8 mai 1945|22 juin 1941|C'est le premier emploi d'une bombe atomique en guerre.\",\n        \"Quand Nagasaki subit-elle une bombe atomique américaine ?|9 août 1945|9 novembre 1938|3 septembre 1939|27 mai 1943|La seconde bombe atomique est larguée trois jours après Hiroshima.\",\n        \"Qui est président américain lors des bombardements atomiques ?|Harry Truman|Franklin Roosevelt|Hindenburg|Churchill|Truman succède à Roosevelt en avril 1945.\",\n        \"À quelle date le Japon signe-t-il sa capitulation ?|2 septembre 1945|8 mai 1945|22 juin 1940|30 janvier 1933|C'est le repère de la fin de la Seconde Guerre mondiale.\",\n        // Guerre totale et violences (76-100).\n        \"Qu'est-ce qu'une guerre totale ?|La mobilisation de toutes les ressources pour la guerre|Une guerre uniquement entre généraux|Une guerre sans industrie|Une guerre limitée à une seule ville|Ressources humaines, économiques, scientifiques et morales sont mobilisées.\",\n        \"Quelle mobilisation montre le caractère total de la guerre ?|La conversion des usines à la production d'armes|L'arrêt de toute production militaire|La disparition de la propagande|Le retrait de tous les civils de l'économie|L'économie est orientée vers l'effort de guerre.\",\n        \"Pourquoi les femmes participent-elles à l'effort de guerre ?|Elles travaillent notamment dans les usines, les services et parfois les forces armées|Elles sont toutes éloignées de la société|Elles ne jouent aucun rôle|Elles dirigent toutes les pays de l'Axe|La mobilisation ne concerne pas seulement les soldats masculins.\",\n        \"Quel rôle les scientifiques jouent-ils pendant le conflit ?|Ils contribuent notamment aux innovations militaires|Ils interdisent toute nouvelle arme|Ils remplacent tous les soldats|Ils dirigent seuls la diplomatie|Radar et recherches atomiques illustrent cette mobilisation.\",\n        \"À quoi sert le rationnement ?|Répartir des produits devenus rares|Garantir une consommation illimitée|Distribuer des bulletins de vote|Organiser les alliances|La guerre provoque pénuries et restrictions.\",\n        \"Quel exemple montre la mobilisation financière ?|Les emprunts et dépenses destinés à l'effort de guerre|La suppression de tout budget militaire|La fermeture de toutes les banques mondiales|Le refus de financer les armées|Faire la guerre nécessite des ressources financières considérables.\",\n        \"Les colonies participent-elles au conflit ?|Oui, par des soldats, travailleurs et ressources|Non, elles ne sont jamais concernées|Seulement comme lieux de vacances|Uniquement après 1945|Les empires coloniaux sont mobilisés par les puissances en guerre.\",\n        \"Pourquoi parle-t-on d'une guerre mondiale ?|Les combats et mobilisations touchent plusieurs continents et océans|Tous les pays sont envahis le même jour|Elle se déroule uniquement à Berlin|Aucun pays extérieur à l'Europe n'y participe|Europe, Afrique, Asie et Pacifique sont notamment concernés.\",\n        \"Quel ensemble présente des espaces du conflit ?|Europe, Afrique du Nord, Asie et Pacifique|Uniquement France et Belgique|Uniquement Allemagne et Autriche|Uniquement Londres et Paris|Le conflit a une dimension planétaire.\",\n        \"Quel exemple montre une guerre idéologique ?|Le nazisme justifie des conquêtes et persécutions par le racisme|Tous les camps défendent le nazisme|La guerre n'a aucun objectif politique|Les armées ne combattent que pour le sport|Les objectifs ne sont pas seulement territoriaux ou militaires.\",\n        \"Les Alliés défendent-ils tous le même régime politique ?|Non, l'URSS est une dictature tandis que d'autres Alliés sont des démocraties|Oui, ils sont tous nazis|Oui, ils sont tous des monarchies absolues|Oui, ils sont tous des démocraties pluralistes|Une alliance militaire peut réunir des régimes différents.\",\n        \"Que vise une guerre d'anéantissement ?|La destruction de l'adversaire avec des violences extrêmes|La seule signature d'un accord commercial|La protection systématique de tous les civils|Une compétition sans victimes|Elle dépasse la seule défaite d'une armée.\",\n        \"Quel front illustre particulièrement la guerre d'anéantissement ?|Le front de l'Est entre l'Allemagne et l'URSS|Un front en Antarctique|Un front entre la Suisse et le Canada|Le seul front portugais|Les violences militaires et la politique raciale nazie s'y combinent.\",\n        \"Pourquoi les civils sont-ils des victimes majeures ?|Ils subissent bombardements, massacres, génocides et privations|Ils combattent tous en uniforme|Ils sont toujours protégés|Ils quittent tous les continents en guerre|La séparation entre front et arrière ne les protège pas.\",\n        \"Quel événement frappe directement des populations civiles ?|Le bombardement d'une ville|Une réunion de diplomates|Un vote parlementaire|Un entraînement sans armes|Les bombardements urbains causent morts et destructions.\",\n        \"Que montrent les destructions de villes comme Dresde en 1945 ?|L'ampleur des violences des bombardements contre les villes|L'absence de victimes civiles|La fin de toute aviation|La neutralité allemande|Les violences massives contre les civils ne se limitent pas à un seul camp.\",\n        \"Quelle arme est employée contre Hiroshima et Nagasaki ?|La bombe atomique|Une arme utilisée à Verdun en 1916|Un missile spatial de 1969|Un simple fumigène|L'arme atomique produit des destructions et des effets durables.\",\n        \"Quelles conséquences les bombes atomiques ont-elles ?|Des morts massives, des destructions et des effets liés aux radiations|Uniquement des dégâts sur des navires vides|Aucun effet sur les civils|La disparition immédiate de toute maladie|Leurs conséquences dépassent le moment de l'explosion.\",\n        \"Pourquoi faut-il distinguer guerre totale et guerre d'anéantissement ?|La première concerne la mobilisation, la seconde la destruction de l'adversaire|Ce sont deux mots pour la même date|La première ne concerne que le Japon|La seconde signifie absence de violence|Ces notions se complètent mais ne sont pas synonymes.\",\n        \"Quel exemple relève d'abord de la guerre totale ?|Mobiliser des ouvriers pour fabriquer des avions|Créer un centre de mise à mort|Fusiller une population persécutée|Massacrer des prisonniers|La production industrielle montre la mobilisation des ressources.\",\n        \"Quel exemple illustre la volonté d'anéantissement ?|Les massacres de populations ciblées par les nazis|La tenue d'une élection libre|La signature d'une convention culturelle|La réouverture d'une école après la paix|Ces violences visent des personnes au-delà des seuls combattants.\",\n        \"Qu'est-ce que le travail forcé ?|Un travail imposé sous la contrainte|Un emploi librement choisi|Une formation volontaire|Une activité de loisir|L'occupant et le système concentrationnaire exploitent des travailleurs contraints.\",\n        \"Pourquoi la propagande compte-t-elle dans la guerre totale ?|Elle mobilise les opinions pour soutenir la guerre|Elle supprime les besoins militaires|Elle remplace toutes les armes|Elle garantit la vérité de chaque discours|Les États cherchent à maintenir le soutien et le moral.\",\n        \"Quel est le rôle du radar pendant la guerre ?|Détecter notamment des avions ou navires|Diffuser les lois de Nuremberg|Remplacer le rationnement|Écrire des traités de paix|C'est un exemple de technologie mobilisée militairement.\",\n        \"Quel argument prouve que la guerre ne concerne pas seulement le front ?|Les civils produisent, subissent des pénuries et sont attaqués|Toutes les villes restent intactes|Les États ferment leurs usines d'armes|Les colonies sont exclues de tout effort|L'arrière est engagé dans l'effort et exposé aux violences.\",\n        // Génocides (101-130).\n        \"Qu'est-ce qu'un génocide ?|La volonté de détruire tout ou partie d'un groupe national, ethnique, racial ou religieux|Toute défaite militaire|Une simple migration volontaire|Un changement de gouvernement|Le génocide vise un groupe en tant que tel.\",\n        \"Que désigne la Shoah ?|Le génocide des Juifs|La bataille d'Angleterre|Le débarquement de Provence|La création de l'ONU|Le terme désigne l'extermination des Juifs par les nazis et leurs complices.\",\n        \"Combien de Juifs sont assassinés pendant la Shoah, environ ?|Six millions|Six mille|Soixante mille|Six cents|Ce repère est central dans le bilan humain.\",\n        \"Quel autre groupe est victime d'un génocide nazi étudié en 3e ?|Les Roms et Sinti|Les seuls dirigeants britanniques|Les membres de l'ONU|Les seuls soldats américains|Le programme emploie aussi le terme Tziganes.\",\n        \"Pourquoi donner une fourchette pour les victimes roms et sinti ?|Les estimations historiques varient et les sources sont incomplètes|Il n'y a eu aucune victime|Les victimes ont toutes laissé un registre complet|Les chiffres n'ont aucune importance|On rencontre souvent une estimation de 200 000 à 500 000 victimes.\",\n        \"Qu'est-ce qu'un ghetto sous l'occupation nazie ?|Un quartier où les Juifs sont enfermés|Une base aérienne alliée|Un parlement élu librement|Une ville ouverte sans restrictions|L'enfermement s'accompagne de privations et de forte mortalité.\",\n        \"Quel ghetto se trouve dans la capitale de la Pologne ?|Le ghetto de Varsovie|Le ghetto de Londres|Le ghetto de Tokyo|Le ghetto de Madrid|Varsovie est un exemple important de l'enfermement des Juifs.\",\n        \"Quelle condition de vie caractérise les ghettos ?|La faim et la surpopulation|L'abondance pour tous|La libre circulation garantie|L'absence de surveillance|La politique nazie provoque une mortalité importante.\",\n        \"Qui sont les Einsatzgruppen ?|Des unités mobiles nazies responsables de fusillades de masse|Des associations de secours alliées|Des pilotes britanniques|Des juges de l'ONU|Ils opèrent notamment derrière le front de l'Est.\",\n        \"À partir de quelle année les fusillades de masse à l'Est se développent-elles fortement ?|1941|1914|1925|1950|L'invasion de l'URSS accompagne une radicalisation de la violence génocidaire.\",\n        \"Que désigne l'expression Shoah par balles ?|Les massacres de Juifs par fusillades de masse|Un combat naval|Une campagne électorale|Un débarquement allié|La Shoah ne se réduit pas aux chambres à gaz.\",\n        \"Que désigne Babi Yar en 1941 ?|Un massacre de Juifs près de Kiev|Une victoire navale américaine|Un traité franco-britannique|Un camp de réfugiés en Angleterre|C'est un exemple de fusillade de masse par les nazis.\",\n        \"Quand a lieu la conférence de Wannsee ?|Janvier 1942|Janvier 1933|Mai 1945|Septembre 1939|Elle coordonne administrativement la solution finale.\",\n        \"La conférence de Wannsee marque-t-elle le premier meurtre de Juifs par les nazis ?|Non, les massacres sont déjà engagés|Oui, aucune persécution n'existait avant|Oui, les ghettos ont tous été créés après 1945|Elle marque la libération de tous les Juifs|Elle coordonne un processus génocidaire déjà en cours.\",\n        \"Que recouvre l'expression nazie solution finale ?|Le projet d'extermination des Juifs d'Europe|Un plan de paix de l'ONU|Un projet d'élections libres|Un programme de reconstruction|C'est une formule administrative utilisée pour masquer un crime.\",\n        \"Qu'est-ce qu'une déportation ?|Un transfert forcé vers un lieu de détention ou de mise à mort|Un voyage touristique|Une émigration toujours volontaire|Une permission militaire|Elle fait partie du processus de persécution et d'extermination.\",\n        \"Quel moyen transporte de nombreux déportés vers les camps ?|Le train, dans des conditions inhumaines|Un vol touristique libre|Un navire de croisière de luxe|Un trajet choisi sans surveillance|Les transports forcés causent eux-mêmes de grandes souffrances.\",\n        \"Quelle est la fonction principale d'un centre de mise à mort ?|Assassiner massivement les déportés|Organiser une scolarité libre|Accueillir des touristes|Former des diplomates|Ces lieux sont conçus pour l'extermination.\",\n        \"Quel lieu est un centre de mise à mort nazi ?|Treblinka|Pearl Harbor|Londres|El-Alamein|Treblinka se situe en Pologne occupée.\",\n        \"Quelle particularité a Auschwitz-Birkenau ?|Il appartient à un complexe comprenant concentration et mise à mort|C'est seulement un port militaire|C'est une ville britannique|C'est le siège de l'ONU|Il faut distinguer les différentes fonctions du complexe d'Auschwitz.\",\n        \"Tous les camps de concentration sont-ils des centres de mise à mort ?|Non, leurs fonctions doivent être distinguées|Oui, ils sont tous identiques|Non, aucun détenu n'y meurt|Oui, ils n'ont jamais de travail forcé|La concentration implique détention et terreur ; la mise à mort systématique est une fonction spécifique.\",\n        \"Quelle violence caractérise aussi les camps de concentration ?|Le travail forcé, les privations et les mauvais traitements|Une liberté complète|Une justice indépendante garantie|Une nourriture abondante pour tous|La mortalité y est très élevée même sans fonction de centre de mise à mort.\",\n        \"Où les nazis installent-ils plusieurs grands centres de mise à mort ?|En Pologne occupée|Uniquement au Royaume-Uni|Uniquement aux États-Unis|Dans une Pologne indépendante alliée aux nazis|Ce sont des centres nazis implantés sur un territoire occupé.\",\n        \"Quel est le rôle des chambres à gaz dans les centres de mise à mort ?|Assassiner des groupes de déportés|Soigner les malades|Distribuer les repas|Protéger les détenus|Elles sont un outil de meurtre de masse.\",\n        \"Pourquoi ne faut-il pas réduire la Shoah aux camps ?|Elle comprend aussi ghettos, privations et fusillades de masse|Aucun Juif n'est déporté|Les camps n'existent pas|Elle désigne uniquement une bataille|Le génocide utilise plusieurs méthodes et se déroule dans de nombreux lieux.\",\n        \"Quand Auschwitz est-il libéré ?|27 janvier 1945|27 mai 1943|18 juin 1940|1er septembre 1939|Sa libération est un repère de la découverte des crimes nazis.\",\n        \"Quelle armée libère Auschwitz ?|L'Armée rouge|L'armée japonaise|L'armée de Vichy|L'armée italienne fasciste|Les troupes soviétiques arrivent en janvier 1945.\",\n        \"Les victimes des génocides sont-elles visées pour une faute individuelle ?|Non, elles sont visées pour leur appartenance supposée à un groupe|Oui, toutes sont condamnées équitablement|Oui, toutes sont des soldats ennemis|Oui, toutes ont participé à un putsch|Le racisme et l'antisémitisme désignent des populations à éliminer.\",\n        \"Quel lien faut-il établir entre idéologie nazie et génocide ?|Le racisme et l'antisémitisme fondent les persécutions qui se radicalisent|Le nazisme défend l'égalité de tous|Le génocide n'a aucun rapport avec les persécutions|Le livre de 1925 décrit chaque détail des centres de 1942|Il faut expliquer les étapes et le contexte de guerre.\",\n        \"Que doit faire une réponse historique sur les crimes nazis ?|Nommer les faits, les responsables et les victimes avec précision|Reprendre les préjugés nazis comme des vérités|Nier les sources|Confondre tous les lieux et toutes les dates|L'analyse critique s'appuie sur des faits établis.\",\n        // France défaite et Vichy (131-155).\n        \"Que désigne l'exode de 1940 en France ?|La fuite de millions de civils devant l'avancée allemande|Un débarquement allié|La déportation de tous les soldats japonais|Une migration de vacances|La défaite provoque peur et déplacements massifs.\",\n        \"Qui dirige le gouvernement français qui demande l'armistice en juin 1940 ?|Philippe Pétain|Charles de Gaulle|Jean Moulin|Winston Churchill|Le gouvernement de Pétain choisit d'arrêter les combats ; la délégation française signe l'accord.\",\n        \"Quand l'armistice franco-allemand est-il signé ?|22 juin 1940|18 juin 1940|8 mai 1945|3 septembre 1939|Ne pas confondre cette date avec l'appel de De Gaulle.\",\n        \"Qu'est-ce qu'un armistice ?|Un accord suspendant les combats|Une victoire électorale|Une déclaration de guerre|Une preuve que la paix est définitivement signée|L'armistice n'est pas nécessairement un traité de paix.\",\n        \"Dans quelle ville s'installe le gouvernement de Pétain ?|Vichy|Londres|Berlin|Varsovie|On parle du régime de Vichy ou de l'État français.\",\n        \"À quelle date Pétain reçoit-il les pleins pouvoirs constituants ?|10 juillet 1940|6 juin 1944|30 janvier 1933|2 septembre 1945|Cette décision ouvre la mise en place de l'État français.\",\n        \"Comment qualifier le régime de Vichy ?|Autoritaire, antisémite et collaborateur|Démocratique et pluraliste|Dirigé par Churchill|Opposé à toute relation avec l'Allemagne|Vichy supprime des libertés et participe aux persécutions.\",\n        \"Quelle devise Vichy adopte-t-il ?|Travail, Famille, Patrie|Liberté, Égalité, Fraternité|Paix, Vote, Justice|Union, Europe, Progrès|Cette devise remplace la devise républicaine.\",\n        \"Que devient la République avec Vichy ?|Elle est remplacée par l'État français|Elle garde toutes ses institutions démocratiques|Elle rejoint le Japon|Elle est transférée à Munich|Le régime rompt avec les principes républicains.\",\n        \"Que désigne la collaboration d'État ?|L'aide officielle de Vichy à l'occupant allemand|Le soutien de Vichy à la France libre|La création de l'ONU|L'organisation du débarquement américain|Elle est politique, économique et policière.\",\n        \"Quelle rencontre symbolise la collaboration de Pétain avec Hitler en 1940 ?|Montoire|Wannsee|Yalta|Midway|La rencontre d'octobre 1940 symbolise le choix de la collaboration.\",\n        \"Vichy adopte-t-il ses propres mesures antisémites ?|Oui, notamment le statut des Juifs de 1940|Non, il protège tous les Juifs|Non, il n'a aucune administration|Oui, seulement après la Libération|Le régime a sa propre responsabilité dans les persécutions.\",\n        \"Que fait le statut des Juifs de Vichy ?|Il exclut les Juifs de professions et de droits|Il leur garantit de nouveaux droits universels|Il crée la France libre|Il met fin à l'occupation|C'est une législation antisémite.\",\n        \"Que désigne une rafle ?|Une arrestation massive organisée|Une élection parlementaire|Un traité de paix|Une permission donnée aux soldats|Les rafles participent aux persécutions et déportations.\",\n        \"Quand a lieu la rafle du Vél' d'Hiv ?|16 et 17 juillet 1942|6 et 9 août 1945|1er et 3 septembre 1939|18 et 22 juin 1940|Des milliers de Juifs sont arrêtés à Paris.\",\n        \"Qui réalise la rafle du Vél' d'Hiv ?|La police française|La France libre|L'Armée rouge|Les pilotes britanniques|Elle montre la participation des autorités françaises aux persécutions.\",\n        \"Dans quelle ville a lieu la rafle du Vél' d'Hiv ?|Paris|Tokyo|Londres|Rome|Le Vélodrome d'Hiver sert de lieu d'enfermement pour une partie des personnes arrêtées.\",\n        \"La rafle du Vél' d'Hiv vise-t-elle seulement des combattants ?|Non, elle vise des Juifs, y compris des enfants|Oui, seulement des soldats allemands|Oui, seulement des militaires britanniques|Non, elle vise seulement des ministres nazis|Les victimes sont persécutées pour leur appartenance à un groupe.\",\n        \"Qu'est-ce que le STO instauré en 1943 ?|Le Service du travail obligatoire|La Société des traités ouverts|La Section touristique officielle|Le Service des troupes océaniques|Il impose à des Français de travailler pour l'Allemagne.\",\n        \"Pourquoi le STO peut-il favoriser les maquis ?|Des réfractaires se cachent et certains rejoignent la Résistance|Il autorise toutes les élections|Il libère tous les prisonniers|Il supprime l'occupation|Le refus du travail forcé alimente certains groupes résistants.\",\n        \"Qu'est-ce que la Milice créée en 1943 ?|Une organisation de Vichy qui traque notamment résistants et Juifs|Une branche de la France libre|Un tribunal international|Un mouvement de secours neutre|Elle participe à la répression et à la collaboration.\",\n        \"Que se passe-t-il en novembre 1942 dans la zone dite libre ?|L'Allemagne et l'Italie l'occupent|Elle devient entièrement indépendante|Elle accueille le siège de l'ONU|Le Japon la libère|Après cette invasion, la métropole est entièrement occupée.\",\n        \"La zone dite libre de 1940-1942 est-elle une démocratie ?|Non, elle est administrée par Vichy|Oui, elle est dirigée par le CNR|Oui, elle possède des élections libres permanentes|Elle est dirigée par Roosevelt|L'absence initiale d'occupation allemande ne signifie pas liberté politique.\",\n        \"Quelle attitude historique faut-il éviter à propos des Français sous l'Occupation ?|Dire qu'ils ont tous fait le même choix|Distinguer collaboration et Résistance|Étudier les contraintes quotidiennes|Reconnaître des parcours différents|Les attitudes et les engagements sont divers et évoluent.\",\n        \"Quel exemple montre une collaboration économique ?|Des livraisons et une production au service de l'Allemagne|Un sabotage de voie ferrée|Un journal résistant clandestin|L'accueil de parachutistes alliés|La collaboration prend plusieurs formes.\",\n        // Résistance et retour de la République (156-180).\n        \"Qui lance l'appel du 18 juin 1940 ?|Charles de Gaulle|Philippe Pétain|Adolf Hitler|Benito Mussolini|De Gaulle appelle à poursuivre le combat.\",\n        \"Depuis quelle ville De Gaulle lance-t-il son appel ?|Londres|Vichy|Berlin|Rome|Il utilise la radio britannique.\",\n        \"Quel est le message essentiel de l'appel du 18 juin ?|Continuer la lutte malgré la défaite française|Soutenir la collaboration|Entrer dans le parti nazi|Renoncer définitivement à combattre|L'appel est un repère de la Résistance extérieure.\",\n        \"Que désigne la France libre ?|L'organisation menée par De Gaulle pour poursuivre la guerre|Le gouvernement de Pétain|L'administration nazie de Paris|Le parti fasciste italien|Elle rassemble forces et territoires ralliés à De Gaulle.\",\n        \"Que signifie FFL ?|Forces françaises libres|Fédération fasciste de Londres|Forces fédérales de Leipzig|Front français légaliste de Vichy|Les FFL combattent aux côtés des Alliés.\",\n        \"Qu'est-ce que la Résistance intérieure ?|La lutte clandestine menée en France contre l'occupation et Vichy|La seule armée américaine au Japon|Le gouvernement nazi|Le seul travail industriel imposé|Elle prend des formes variées, armées ou non.\",\n        \"Quel exemple relève de la Résistance ?|Diffuser un journal clandestin contre l'occupant|Participer à une rafle antisémite|Dénoncer des résistants à la Milice|Appliquer les lois nazies|Informer et contester sont des formes de résistance.\",\n        \"Quel est le but d'un sabotage résistant ?|Gêner les transports ou la production utiles à l'occupant|Renforcer les livraisons allemandes|Organiser la propagande nazie|Interdire la Libération|Les voies ferrées sont notamment visées.\",\n        \"Pourquoi les résistants recueillent-ils des renseignements ?|Pour aider les Alliés et préparer leurs opérations|Pour soutenir les centres de mise à mort|Pour organiser les élections nazies|Pour éviter toute action militaire|Les informations sur les troupes et installations sont précieuses.\",\n        \"Cacher une personne persécutée peut-il être une forme de résistance ?|Oui, cela peut s'opposer à la politique de persécution|Non, seule une bataille compte|Non, il faut obligatoirement être général|Oui, seulement après 1945|La Résistance comprend aussi des actes de protection et de solidarité.\",\n        \"Qu'est-ce qu'un maquis ?|Un groupe de résistants armés dans une zone difficile d'accès|Une ambassade japonaise|Un centre de mise à mort|Un parti légal de Vichy|Les maquis utilisent notamment des espaces ruraux ou montagneux.\",\n        \"Quels dangers les résistants affrontent-ils ?|Arrestation, torture, déportation et mort|Aucun risque|Uniquement une amende touristique|Seulement l'interdiction de voter en Angleterre|La répression de l'occupant et de Vichy est sévère.\",\n        \"Qui joue un rôle majeur dans l'unification de la Résistance intérieure ?|Jean Moulin|Rudolf Hess|Hirohito|Hindenburg|Il agit comme représentant de De Gaulle.\",\n        \"Que signifie CNR ?|Conseil national de la Résistance|Centre nazi de recrutement|Conseil naval de Rome|Comité national du rationnement|Il réunit des mouvements, partis et syndicats résistants.\",\n        \"En quelle année le CNR est-il créé ?|1943|1933|1939|1958|Sa première réunion a lieu le 27 mai 1943.\",\n        \"À quelle date se tient la première réunion du CNR ?|27 mai 1943|27 janvier 1945|22 juin 1940|7 décembre 1941|Jean Moulin joue un rôle clé dans cette réunion.\",\n        \"Quel est l'intérêt de l'unification de la Résistance ?|Coordonner les actions et préparer la Libération|Rétablir le parti unique nazi|Soutenir l'occupation|Interdire l'action des Alliés|Le CNR renforce la cohérence politique et militaire.\",\n        \"Que prévoit aussi le programme du CNR de 1944 ?|Des réformes pour la France libérée|La poursuite de Vichy|L'annexion de la France par le Japon|La suppression de toute protection sociale|Il prépare le rétablissement républicain et des réformes sociales.\",\n        \"Que signifie FFI ?|Forces françaises de l'intérieur|Forces fascistes italiennes|Fédération française impériale|Front fédéral international|Elles regroupent des forces de la Résistance intérieure en 1944.\",\n        \"Quel lien unit la Résistance et les débarquements alliés ?|Les résistants aident par les renseignements, sabotages et combats|Les résistants les empêchent systématiquement|Ils n'ont aucun rapport|Les débarquements sont organisés par Vichy|Les actions intérieures contribuent à la Libération.\",\n        \"Des femmes participent-elles à la Résistance ?|Oui, dans de nombreux rôles|Non, toutes en sont exclues|Uniquement en 1960|Seulement au Japon|Elles sont notamment agentes de liaison, combattantes et organisatrices.\",\n        \"La Résistance est-elle composée d'un seul courant politique ?|Non, elle rassemble des personnes de courants variés|Oui, uniquement des nazis|Oui, uniquement des monarchistes japonais|Oui, uniquement des membres de Vichy|Le CNR réunit cette diversité contre l'occupant.\",\n        \"Qui dirige le Gouvernement provisoire à la Libération ?|Charles de Gaulle|Adolf Hitler|Philippe Pétain|Rudolf Hess|Il affirme le rétablissement de la République.\",\n        \"Quel principe politique est rétabli à la Libération ?|La République|Le parti unique nazi|La monarchie absolue allemande|Le régime de Vichy|La Libération met fin au régime de Vichy.\",\n        \"Quel nouveau droit est accordé aux Françaises en 1944 ?|Le droit de vote et d'éligibilité|L'interdiction de travailler|L'obligation d'adhérer à la Milice|La suppression de tout droit politique|Elles votent pour la première fois en 1945.\",\n        // Bilan et méthode (181-200).\n        \"Quel ordre de grandeur retenir pour les morts de la guerre ?|Des dizaines de millions|Quelques centaines|Quelques milliers seulement|Moins de mille|Environ 60 millions dans beaucoup de bilans scolaires ; les estimations plus larges sont supérieures.\",\n        \"Pourquoi les bilans humains peuvent-ils varier selon les ouvrages ?|Les périmètres, sources et méthodes d'estimation diffèrent|Personne n'a été tué|Tous les chiffres sont identiques|Les historiens ne consultent jamais de sources|Il faut préciser qu'il s'agit d'estimations.\",\n        \"Quel groupe représente une part majeure des victimes ?|Les civils|Les seuls chefs d'État|Les seuls pilotes|Les seuls officiers japonais|Bombardements, génocides et privations frappent les populations.\",\n        \"Quel exemple appartient au bilan matériel ?|La destruction des logements et des usines|La nomination d'Hitler en 1933|L'appel du 18 juin|La rédaction de Mein Kampf|La reconstruction est un enjeu majeur après la guerre.\",\n        \"Quel exemple appartient au bilan moral ?|Le choc de la découverte des génocides|Le seul coût d'un pont|Le nombre de chars produits|La surface d'une route|Les crimes et l'arme atomique bouleversent les consciences.\",\n        \"Quelles deux puissances dominent le monde après 1945 ?|Les États-Unis et l'URSS|L'Allemagne et le Japon|L'Italie et Vichy|L'Autriche et la Hongrie|L'Europe est affaiblie par la guerre.\",\n        \"Que devient l'Allemagne vaincue en 1945 ?|Elle est occupée et divisée en zones|Elle conquiert les États-Unis|Elle conserve toutes ses conquêtes|Elle devient immédiatement le siège unique de l'ONU|Les vainqueurs organisent son occupation.\",\n        \"Quelle organisation internationale est créée en 1945 ?|L'ONU|La SDN en 1919|Le CNR|Le NSDAP|L'Organisation des Nations unies cherche à préserver la paix.\",\n        \"Quel est un objectif majeur de l'ONU ?|Maintenir la paix et la sécurité internationales|Imposer l'idéologie nazie|Préparer des génocides|Rétablir Vichy|Elle est créée après l'échec du maintien de la paix entre les deux guerres.\",\n        \"Quelle organisation avait été créée après la Première Guerre mondiale ?|La SDN|L'ONU en 1945|Le CNR en 1943|Les FFI en 1944|Ne pas confondre Société des Nations et Organisation des Nations unies.\",\n        \"Quand se déroule le procès de Nuremberg des grands responsables nazis ?|1945-1946|1925-1926|1933-1934|1914-1918|Le procès commence en novembre 1945.\",\n        \"Qui est jugé lors du grand procès de Nuremberg ?|De grands responsables nazis|Tous les civils allemands sans distinction|Les seuls résistants français|Les seuls dirigeants de l'ONU|Il vise des responsabilités individuelles dans les crimes du régime.\",\n        \"Quelle notion juridique est notamment utilisée à Nuremberg ?|Crime contre l'humanité|Espace vital|Guerre éclair|Rationnement|Elle concerne notamment les crimes et persécutions contre les populations civiles.\",\n        \"Les lois de Nuremberg et le procès de Nuremberg désignent-ils la même chose ?|Non, les lois sont antisémites en 1935 et le procès juge des nazis en 1945-1946|Oui, tous deux libèrent les camps|Oui, tous deux datent de 1933|Non, le procès a lieu en 1925|Le même nom de ville ne signifie pas le même événement.\",\n        \"Quelle conséquence politique suit les tensions entre États-Unis et URSS ?|La guerre froide|La Première Guerre mondiale|Le putsch de Munich|L'Anschluss|La rivalité des deux puissances structure l'après-guerre.\",\n        \"Quel type de source est une carte mentale de révision ?|Une synthèse pédagogique|Toujours un témoignage direct de 1940|Un traité international|Un ordre militaire original|Elle organise des connaissances mais comporte des simplifications.\",\n        \"Pourquoi distinguer un extrait d'Hitler d'un commentaire d'historien ?|L'un expose une idéologie, l'autre l'analyse et la contextualise|Les deux ont forcément le même but|Un historien approuve toujours l'auteur étudié|Un extrait est forcément une vérité scientifique|Identifier qui parle est essentiel pour analyser un document.\",\n        \"Deux photos de la même carte mentale sont-elles deux sources indépendantes ?|Non, elles montrent le même travail|Oui, elles prouvent chaque chiffre|Oui, elles ont deux auteurs différents par définition|Elles sont deux traités militaires|Plusieurs vues d'un document ne multiplient pas ses sources.\",\n        \"Comment traiter un chiffre illisible dans un document ?|Signaler la limite et ne pas inventer un chiffre exact|Le deviner et l'affirmer|Le remplacer toujours par zéro|Le présenter comme une preuve certaine|Une analyse fiable reconnaît les limites de lecture.\",\n        \"Quelle structure aide à rédiger une réponse de brevet ?|Une idée expliquée, un exemple précis et un lien avec le sujet|Une liste de mots sans explication|Un seul jugement personnel sans fait|Une copie de slogans nazis|Les exemples doivent appuyer une explication historique.\"\n    ];\n    const documentRows = [\n        \"Document 1 : quelles sont les grandes idées présentées ?|Racisme, antisémitisme, conquêtes et chef unique|Pacifisme et pluralisme|Égalité des droits et libre débat|Neutralité et démocratie|Les quatre branches relient contexte, idées, projet et conséquences.\",\n        \"Document 1 : quelle précision apporter à la publication de 1925 ?|C'est le premier volume ; le second paraît en 1926|Tout paraît en 1945|Il n'y a aucun second volume|Le livre paraît avant la naissance d'Hitler|La date de 1925 est un raccourci fréquent.\",\n        \"Document 1 : qui est l'auteur de Mein Kampf ?|Adolf Hitler|L'auteur non identifié de la fiche|Jean Moulin|Fabrice d'Almeida|Il faut distinguer l'auteur du livre et celui de la synthèse pédagogique.\",\n        \"Document 1 : que signifie le projet de Grande Allemagne ?|Unir les Allemands et étendre le territoire dominé par l'Allemagne|Créer une démocratie mondiale|Supprimer tous les États|Établir la France libre|La fiche le relie à un projet nationaliste et expansionniste.\",\n        \"Documents 2 et 4 : que montrent les deux photos ?|Deux vues de la même carte mentale|Deux sources indépendantes sur deux guerres|Deux discours différents de Churchill|Deux traités internationaux|Le même travail manuscrit apparaît sur les deux images.\",\n        \"Documents 2 et 4 : quel titre est placé au centre ?|Mein Kampf, Mon combat|La Charte des Nations unies|Le traité de Versailles|Le programme du CNR|Les branches partent du livre et de son contexte.\",\n        \"Documents 2 et 4 : quelle personne aide à la mise par écrit ?|Rudolf Hess|Harry Truman|Jean Moulin|Hirohito|Cette aide ne fait pas de Hess l'auteur principal.\",\n        \"Documents 2 et 4 : pourquoi rester prudent sur le nombre de lecteurs ?|La photo ne permet pas d'établir un chiffre exact et lecteurs n'est pas exemplaires|Tous les chiffres sont forcément vrais|Deux photos donnent automatiquement deux preuves|Le chiffre concerne les morts de Stalingrad|Il ne faut pas inventer ni confondre diffusion et lecture.\",\n        \"Document 3 : qui commente le livre ?|L'historien Fabrice d'Almeida|Hitler lui-même en direct|De Gaulle à Londres|Un juge du procès de Nuremberg|Le document est une transcription d'entretien avec un historien.\",\n        \"Document 3 : quelle est la source médiatique indiquée ?|France TV Info|Un journal clandestin de 1943|La radio de Vichy|Une affiche japonaise|Le lien imprimé renvoie à un entretien de France TV Info.\",\n        \"Document 3 : quels sont les deux grands volets du livre ?|Récit personnel et idéologie politique|Recettes de cuisine et exercices|Histoire de l'ONU et reconstruction|Journal de Stalingrad et procès de 1946|L'historien décrit l'organisation du livre en deux temps.\",\n        \"Document 3 : à quel moment son succès s'amplifie-t-il ?|Avec l'ascension nazie et l'arrivée au pouvoir en 1933|Après la création de l'ONU|Uniquement après 1960|Avant le putsch de 1923|La diffusion du livre suit le succès politique du nazisme.\",\n        \"Document 3 : que dit l'historien au sujet de la Shoah dans le livre ?|Le livre est antisémite mais ne décrit pas les modalités du génocide ultérieur|Le livre est sans antisémitisme|Le livre raconte la libération d'Auschwitz|Il décrit tous les détails de Wannsee|Il distingue l'idéologie du déroulement concret du génocide.\",\n        \"Document 3 : quel éditeur publie le livre en France en 1934 ?|Fernand Sorlot|Rudolf Hess|Jean Moulin|Winston Churchill|L'entretien explique cette publication et la position de l'éditeur.\",\n        \"Document 3 : quelle intention de Sorlot l'entretien met-il en avant ?|Dénoncer une menace allemande contre la France|Créer le CNR|Raconter Hiroshima|Préparer l'ONU|Le commentaire contextualise cette publication sans présenter Sorlot comme neutre.\",\n        \"Document 5 : quel historien est présenté en haut de la fiche ?|Claude Quétel|Fabrice d'Almeida|Jean Moulin|Hindenburg|La fiche mentionne son travail sur Mein Kampf et un lien vidéo.\",\n        \"Document 5 : où Hitler est-il né en 1889 ?|En Autriche|En France|Au Japon|Aux États-Unis|La biographie distingue le lieu de naissance et le pays qu'il dirige.\",\n        \"Document 5, extrait 1 : quelle orientation territoriale apparaît ?|La conquête vers l'Est|Le retrait de toutes les conquêtes|La libération des colonies françaises|L'annexion d'Hawaï par la France|Cela illustre le projet d'espace vital.\",\n        \"Document 5, extrait 1 : comment traiter la prétendue supériorité raciale ?|Comme une affirmation raciste fausse attribuée à Hitler|Comme un fait scientifique|Comme une valeur républicaine|Comme une idée de Jean Moulin|Une lecture critique n'adopte pas les préjugés de la source.\",\n        \"Document 5, extrait 2 : qui doit décider selon Hitler ?|Un chef unique|Les citoyens dans un débat libre|Plusieurs partis élus|L'ONU|L'extrait expose le rejet de la démocratie.\",\n        \"Document 5 : quelle précision corrige la biographie sur le début de la dictature ?|Elle s'installe dès 1933, pas seulement en 1934|Elle commence en 1945|Elle commence après le procès de Nuremberg|Elle n'a jamais existé|1934 marque le cumul des fonctions, pas le début de toutes les mesures dictatoriales.\",\n        \"Document 6 : combien de grands axes du programme sont affichés ?|Quatre|Deux|Sept|Dix|Racisme et antisémitisme, conquêtes, rejet de la démocratie, dictature.\",\n        \"Document 6 : à quel exercice la fiche sert-elle explicitement ?|Retenir des idées pour l'oral|Calculer des fractions|Lire une carte météo|Apprendre des verbes anglais|L'affiche porte l'indication À retenir pour l'oral.\",\n        \"Ensemble des documents : quelle limite commune faut-il rappeler ?|Ils éclairent surtout l'idéologie nazie, pas toute l'histoire de la guerre|Ils expliquent toutes les batailles du Pacifique|Ils racontent intégralement la Libération|Ils ne mentionnent jamais Hitler|La leçon complète doit ajouter fronts, génocides, Vichy, Résistance et bilan.\"\n    ];\n\n    function parseQuestions(rows) {\n        return rows.map(function (row) {\n            const parts = row.split(\"|\");\n            if (parts.length !== 6 || parts.some(function (part) { return !part.trim(); }) || new Set(parts.slice(1, 5)).size !== 4) {\n                throw new Error(\"Question mal formée : \" + row);\n            }\n            return { question: parts[0], choices: parts.slice(1, 5), answer: 0, explanation: parts[5] };\n        });\n    }\n    const questionsData = parseQuestions(questionRows);\n    const documentQuestions = parseQuestions(documentRows);\n    if (questionsData.length !== 200 || new Set(questionsData.map(function (q) { return q.question; })).size !== 200) {\n        throw new Error(\"Le grand QCM doit contenir exactement 200 questions distinctes.\");\n    }\n    const flashIndices = [0, 7, 12, 25, 26, 28, 42, 46, 50, 57, 63, 69, 74, 75, 86, 101, 102, 132, 155, 169];\n    document.addEventListener(\"DOMContentLoaded\", function () {\n        Lecon.qcm(\"#document-quiz\", documentQuestions, { shuffleChoices: true });\n        Lecon.qcm(\"#flash-quiz\", flashIndices.map(function (i) { return questionsData[i]; }), { sampleSize: 10, shuffleChoices: true });\n        const mainQuiz = Lecon.qcm(\"#main-quiz\", questionsData, { sampleSize: 50, shuffleChoices: true });\n        document.getElementById(\"new-series\").addEventListener(\"click\", function () { mainQuiz.restart(); });\n    });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Physique/Chapitre 1  Électricité.html":"\u003c!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Révisions de Physique - Chapitre 1 pour Aron\u003c/title>\n\u003c!--rev3e:css-->\n\u003c!--rev3e:quiz-->\n<style>\n  /* Titre d'encadré qui a déjà son propre emoji */\n  .callout-title.no-icon::before { content: none; }\n  .formula-card .formula { font-size: 1.15em; margin: var(--space-2) 0; }\n  .formula-card h3 { font-size: var(--text-base); margin: 0; }\n  .formula-card p { font-size: var(--text-sm); color: var(--text-2); }\n  .formula .cite { font-size: var(--text-xs); color: var(--muted); vertical-align: super; margin-left: 2px; }\n  .reveal-body .explanation { margin: var(--space-3) 0 0; font-size: var(--text-sm); color: var(--text-2); }\n\u003c/style>\n\u003c/head>\n<body>\n<main class=\"lecon\">\n\n  <header class=\"lecon-header\">\n    <div class=\"lecon-eyebrow\">Physique-Chimie\u003c/div>\n    <h1>🚀 Chapitre 1 : Électricité - Révise avec Aron !\u003c/h1>\n  \u003c/header>\n\n  <nav class=\"tabs\" role=\"tablist\">\n    <button type=\"button\" class=\"tab active\" data-tab=\"explications\">Explications Générales\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"formules\">Formules &amp; Vocabulaire\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"test\">Test (Réponses déroulantes)\u003c/button>\n    <button type=\"button\" class=\"tab\" data-tab=\"qcm-interactif\">QCM Interactif\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- ONGLET 1 : EXPLICATIONS GÉNÉRALES -->\n  <section id=\"explications\" class=\"tab-content active\">\n    <div class=\"callout retenir\">\n      <p class=\"callout-title no-icon\">🔑 Points clés à retenir :\u003c/p>\n      <ul>\n        <li>Une <strong>boucle de courant\u003c/strong> doit être fermée et contenir un générateur pour que le courant circule (de la borne + vers la borne -).\u003c/li>\n        <li>L'<strong>intensité (I)\u003c/strong> représente le débit des charges électriques. Analogie : c'est comme le nombre de bonhommes qui circulent.\u003c/li>\n        <li>La <strong>tension (U)\u003c/strong> représente la différence d'énergie. Analogie : c'est l'argent dépensé par les bonhommes au passage d'un récepteur.\u003c/li>\n        <li>La <strong>résistance (R)\u003c/strong> mesure la capacité à ralentir le courant. Plus elle est grande, plus l'intensité diminue.\u003c/li>\n        <li>Un <strong>court-circuit\u003c/strong> est dangereux : c'est quand les deux bornes d'un dipôle sont reliées par un simple fil de connexion.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    <h2 class=\"section-title\"><span class=\"num\">1\u003c/span> Le fonctionnement d'un circuit électrique\u003c/h2>\n    <p>Salut Aron ! Pour comprendre l'électricité, imagine un circuit comme un chemin. Les dipôles électriques sont les objets sur ce chemin qui possèdent deux pôles (ou bornes). Le <strong>générateur\u003c/strong> (comme une pile) fournit l'énergie, tandis que le <strong>récepteur\u003c/strong> (comme une lampe ou une résistance) reçoit cette énergie pour la transformer (en lumière ou en chaleur). Lorsque tout est branché à la suite dans la même boucle, on parle de <strong>circuit en série\u003c/strong>. S'il y a plusieurs chemins possibles (plusieurs boucles), c'est un <strong>circuit en dérivation\u003c/strong>.\u003c/p>\n\n    <h2 class=\"section-title\"><span class=\"num\">2\u003c/span> Le rôle de la Résistance et la Loi d'Ohm\u003c/h2>\n    <p>Tout matériau laisse passer le courant différemment. Un objet isolant aura une résistance très grande, tandis qu'un fil conducteur aura une résistance presque nulle. Lorsqu'on parle du composant électrique appelé \"résistance\" (ou conducteur ohmique), son seul rôle est de transformer toute l'énergie électrique qu'il reçoit en chaleur : c'est ce qu'on appelle l'<strong>effet Joule\u003c/strong>.\u003c/p>\n    <p>Sur un graphique représentant la tension en fonction de l'intensité, la caractéristique d'une résistance est une droite qui passe par l'origine, ce qui prouve qu'il y a une proportionnalité : c'est la fameuse <strong>Loi d'Ohm\u003c/strong>. Et n'oublie pas : pour mesurer une résistance, on utilise un ohmmètre <em>hors circuit\u003c/em>, et il faut toujours commencer par choisir le calibre le plus grand pour ne pas endommager le multimètre !\u003c/p>\n  \u003c/section>\n\n  \u003c!-- ONGLET 2 : FORMULES ET VOCABULAIRE -->\n  <section id=\"formules\" class=\"tab-content\">\n    <h2>📐 Les Formules du Chapitre\u003c/h2>\n    <div class=\"card-grid\">\n      <div class=\"card card-accent formula-card\">\n        <h3>Loi d'Ohm :\u003c/h3>\n        <span class=\"formula\">U<sub>R\u003c/sub> = R × I<sub>R\u003c/sub>\u003c/span>\n      \u003c/div>\n      <div class=\"card card-accent formula-card\">\n        <h3>Puissance électrique :\u003c/h3>\n        <span class=\"formula\">P = U × I\u003c/span>\n      \u003c/div>\n      <div class=\"card card-accent formula-card\">\n        <h3>Énergie électrique :\u003c/h3>\n        <span class=\"formula\">E = P × Δt\u003c/span>\n      \u003c/div>\n      <div class=\"card card-accent formula-card\">\n        <h3>Loi des nœuds (Intensité) :\u003c/h3>\n        <span class=\"formula\">I<sub>Entrant\u003c/sub> = I<sub>Sortant\u003c/sub>\u003c/span>\n        <p>(En tout point, l'intensité du courant qui entre est égale à l'intensité qui ressort).\u003c/p>\n      \u003c/div>\n      <div class=\"card card-accent formula-card\">\n        <h3>Loi des tensions (Boucle) :\u003c/h3>\n        <span class=\"formula\">U<sub>G\u003c/sub> = somme des U<sub>R\u003c/sub>\u003c/span>\n        <p>(Dans une boucle, la tension aux bornes du générateur est égale à la somme des tensions aux bornes des récepteurs).\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    <h2>🔤 Symboles et Unités\u003c/h2>\n    <div class=\"table-wrap\">\n      <table>\n        <thead>\n          <tr><th>Grandeur physique\u003c/th><th>Symbole\u003c/th><th>Unité\u003c/th><th>Appareil de mesure\u003c/th>\u003c/tr>\n        \u003c/thead>\n        <tbody>\n          <tr><td>Tension\u003c/td><td><strong>U\u003c/strong>\u003c/td><td>Volt (<strong>V\u003c/strong>)\u003c/td><td>Voltmètre\u003c/td>\u003c/tr>\n          <tr><td>Intensité\u003c/td><td><strong>I\u003c/strong>\u003c/td><td>Ampère (<strong>A\u003c/strong>)\u003c/td><td>Ampèremètre\u003c/td>\u003c/tr>\n          <tr><td>Résistance\u003c/td><td><strong>R\u003c/strong>\u003c/td><td>Ohm (<strong>Ω\u003c/strong>)\u003c/td><td>Ohmmètre (Mesure hors circuit)\u003c/td>\u003c/tr>\n          <tr><td>Puissance\u003c/td><td><strong>P\u003c/strong>\u003c/td><td>Watt (<strong>W\u003c/strong>)\u003c/td><td>-\u003c/td>\u003c/tr>\n          <tr><td>Énergie\u003c/td><td><strong>E\u003c/strong>\u003c/td><td>Joule (<strong>J\u003c/strong>)\u003c/td><td>-\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ONGLET 3 : TEST DÉROULANT -->\n  <section id=\"test\" class=\"tab-content\">\n    <h2>📝 Entraînement : 50 Questions pour maîtriser les bases !\u003c/h2>\n    <p class=\"muted\">Clique sur la question pour révéler la réponse et l'explication. Prends ton temps, Aron !\u003c/p>\n\n      <details class=\"reveal\">\n        <summary>Q1 : Quel composant fournit l'énergie électrique à un circuit ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Un générateur.\u003c/span>\n          <p class=\"explanation\">Explication : Un générateur, comme une pile ou un panneau solaire, fournit l'énergie électrique au circuit.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q2 : Quel composant reçoit l'énergie électrique et la transforme ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Un récepteur.\u003c/span>\n          <p class=\"explanation\">Explication : Les récepteurs comme les lampes ou les moteurs prennent l'énergie électrique et la transforment en lumière, chaleur, etc.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q3 : Dans quel sens le courant électrique circule-t-il dans une boucle fermée ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : De la borne positive (+) vers la borne négative (-) du générateur.\u003c/span>\n          <p class=\"explanation\">Explication : C'est le sens conventionnel du courant.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q4 : Comment appelle-t-on un circuit qui ne possède qu'une seule boucle ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Un circuit en série.\u003c/span>\n          <p class=\"explanation\">Explication : Dans un circuit en série, tous les dipôles sont branchés à la suite les uns des autres dans la même boucle.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q5 : Comment appelle-t-on un circuit qui possède plusieurs boucles ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Un circuit en dérivation.\u003c/span>\n          <p class=\"explanation\">Explication : Dès qu'il y a plusieurs chemins (boucles) possibles pour le courant, on parle de dérivation.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q6 : Que représente l'intensité électrique (I) ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Le débit des charges électriques.\u003c/span>\n          <p class=\"explanation\">Explication : On peut le comparer au nombre de \"bonhommes\" qui circulent à un endroit précis du circuit en une seconde.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q7 : Quelle est l'unité de mesure de l'intensité électrique ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : L'Ampère (A).\u003c/span>\n          <p class=\"explanation\">Explication : L'intensité se mesure toujours en Ampères.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q8 : Que représente la tension électrique (U) ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : La différence d'énergie d'une charge électrique au passage d'un dipôle.\u003c/span>\n          <p class=\"explanation\">Explication : C'est l'énergie gagnée ou dépensée, comme de \"l'argent\" dépensé par les bonhommes pour faire fonctionner une lampe.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q9 : Quelle est l'unité de mesure de la tension ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Le Volt (V).\u003c/span>\n          <p class=\"explanation\">Explication : La tension se mesure toujours en Volts.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q10 : Qu'est-ce que la \"loi des nœuds\" ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : L'intensité totale qui entre dans un nœud est égale à l'intensité totale qui en sort.\u003c/span>\n          <p class=\"explanation\">Explication : En tout point, IE = IS. Aucune charge n'est perdue.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q11 : Qu'est-ce qu'un nœud dans un circuit ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Un point où plus de deux fils se rejoignent.\u003c/span>\n          <p class=\"explanation\">Explication : Un nœud crée une intersection dans un circuit en dérivation.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q12 : Qu'est-ce que la \"loi des tensions\" (ou loi des mailles) dans une boucle ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : La tension du générateur est égale à la somme des tensions des récepteurs de la boucle.\u003c/span>\n          <p class=\"explanation\">Explication : UG = somme des UR.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q13 : Que se passe-t-il lorsqu'un récepteur est \"adapté\" à un générateur ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : La tension appliquée à ses bornes est égale à sa tension nominale.\u003c/span>\n          <p class=\"explanation\">Explication : La tension nominale est celle gravée par le constructeur pour un fonctionnement normal.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q14 : Quelle est la définition de la puissance électrique ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : L'énergie reçue ou fournie pour 1 seconde.\u003c/span>\n          <p class=\"explanation\">Explication : La puissance indique la vitesse à laquelle l'énergie est consommée ou produite.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q15 : Quelle est la formule de la Puissance (P) ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : P = U × I.\u003c/span>\n          <p class=\"explanation\">Explication : La puissance (Watts) est le produit de la Tension (Volts) et de l'Intensité (Ampères).\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q16 : Quelle est la formule de l'Énergie (E) ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : E = P × Δt.\u003c/span>\n          <p class=\"explanation\">Explication : L'énergie (Joules) est la Puissance (Watts) multipliée par le temps (secondes).\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q17 : Quel est le rôle de la résistance (R) dans un circuit ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Elle ralentit le débit des charges électriques.\u003c/span>\n          <p class=\"explanation\">Explication : La résistance provoque une diminution de l'intensité du courant dans le circuit.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q18 : Quelle est l'unité de la résistance ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : L'Ohm (Ω).\u003c/span>\n          <p class=\"explanation\">Explication : La résistance se mesure en Ohms.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q19 : Quel appareil utilise-t-on pour mesurer une résistance ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Un ohmmètre (ou un multimètre en mode ohmmètre).\u003c/span>\n          <p class=\"explanation\">Explication : Il doit toujours être utilisé hors circuit.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q20 : Quelle est la règle la plus importante lors de l'utilisation d'un multimètre ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Toujours commencer par utiliser le calibre le plus grand.\u003c/span>\n          <p class=\"explanation\">Explication : Choisir la valeur mesurable maximale au début évite d'endommager l'appareil.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q21 : Quelle conversion d'énergie spécifique est réalisée par un conducteur ohmique (une résistance) ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Il transforme entièrement l'énergie électrique en énergie thermique (chaleur).\u003c/span>\n          <p class=\"explanation\">Explication : C'est sa seule fonction.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q22 : Comment appelle-t-on la conversion de l'énergie électrique en chaleur par une résistance ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : L'effet Joule.\u003c/span>\n          <p class=\"explanation\">Explication : Ce phénomène physique est à la base du fonctionnement des radiateurs ou des grille-pains.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q23 : Quelle est la formule de la loi d'Ohm ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : U = R × I.\u003c/span>\n          <p class=\"explanation\">Explication : La tension (U) aux bornes d'une résistance est égale à sa valeur (R) multipliée par l'intensité (I) qui la traverse.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q24 : Quel est le lien mathématique entre U et I pour une résistance ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Ils sont proportionnels.\u003c/span>\n          <p class=\"explanation\">Explication : R correspond au coefficient de proportionnalité entre la tension et l'intensité.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q25 : À quoi ressemble le graphique de la caractéristique d'un dipôle ohmique ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : C'est une droite qui passe par l'origine.\u003c/span>\n          <p class=\"explanation\">Explication : Le tracé de U en fonction de I formant une droite passant par l'origine prouve la proportionnalité (Loi d'Ohm).\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q26 : Qu'est-ce qu'un court-circuit ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : C'est lorsque les deux bornes d'un même dipôle sont reliées par un fil de connexion.\u003c/span>\n          <p class=\"explanation\">Explication : Le courant prend le chemin le plus facile (sans résistance), ce qui peut être dangereux.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q27 : Pourquoi le court-circuit d'un générateur est-il dangereux ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Il peut provoquer une surchauffe et un incendie.\u003c/span>\n          <p class=\"explanation\">Explication : Sans récepteur pour ralentir le courant, l'intensité devient énorme et crée un fort dégagement de chaleur.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q28 : Si un circuit possède 2 boucles, les composants sont-ils en série ou en dérivation ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : En dérivation.\u003c/span>\n          <p class=\"explanation\">Explication : La présence de plusieurs chemins (boucles) définit un circuit en dérivation.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q29 : Si on ajoute une résistance dans un circuit en série, que se passe-t-il pour l'intensité du courant ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : L'intensité diminue.\u003c/span>\n          <p class=\"explanation\">Explication : La résistance totale augmente, ce qui ralentit le débit des charges dans tout le circuit.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q30 : Si U = 12V et P = 6W, quelle est l'intensité I ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : I = 0,5 A.\u003c/span>\n          <p class=\"explanation\">Explication : D'après P = U × I, on a I = P ÷ U = 6 ÷ 12 = 0,5 A.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q31 : Si U = 3,5V et R = 3Ω, quelle est l'intensité I ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : I = 1,17 A environ.\u003c/span>\n          <p class=\"explanation\">Explication : D'après la loi d'Ohm U = R × I, on a I = U ÷ R = 3,5 ÷ 3 ≈ 1,17 A.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q32 : Qu'est-ce que la branche principale d'un circuit ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : C'est la portion de circuit qui contient le générateur.\u003c/span>\n          <p class=\"explanation\">Explication : Les autres branches s'appellent les branches dérivées.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q33 : Dans une boucle simple, si le générateur délivre 9V et qu'une DEL utilise 2V, quelle est la tension aux bornes de la résistance associée ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : 7V.\u003c/span>\n          <p class=\"explanation\">Explication : D'après la loi des tensions, UG = U(DEL) + U(Résistance). Donc 9V - 2V = 7V.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q34 : Tu dois mesurer une résistance d'environ 1000 Ω. Les calibres dispo sont 200 Ω, 2 kΩ et 20 kΩ. Lequel choisis-tu ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : 2 kΩ (soit 2000 Ω).\u003c/span>\n          <p class=\"explanation\">Explication : Le meilleur calibre est celui juste au-dessus de la valeur mesurée pour avoir la meilleure précision sans afficher d'erreur.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q35 : Que signifie \"kΩ\" ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Kilo-ohm (1 000 ohms).\u003c/span>\n          <p class=\"explanation\">Explication : Le préfixe \"kilo\" correspond à 10^3 ou 1000.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q36 : Que signifie \"MΩ\" ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Méga-ohm (1 000 000 ohms).\u003c/span>\n          <p class=\"explanation\">Explication : Le préfixe \"méga\" correspond à 10^6 ou un million.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q37 : On branche en série 3 résistances : 33Ω, 100Ω, et 150Ω. Laquelle permet d'avoir le courant le plus faible ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : La résistance de 150Ω.\u003c/span>\n          <p class=\"explanation\">Explication : Plus la résistance est grande, plus l'intensité du courant diminue.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q38 : Dans un circuit en série, l'ordre des dipôles a-t-il une importance ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Non, aucune importance.\u003c/span>\n          <p class=\"explanation\">Explication : L'intensité du courant est la même en tout point d'un circuit en série, quel que soit l'ordre des composants.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q39 : A quelle condition le courant peut-il circuler dans un circuit ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : La boucle doit être fermée.\u003c/span>\n          <p class=\"explanation\">Explication : Si la boucle est ouverte (interrupteur ouvert ou fil coupé), le courant ne passe pas.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q40 : Si une lampe brille très faiblement, qu'est-ce que cela signifie concernant sa tension ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : La tension à ses bornes est inférieure à sa tension nominale.\u003c/span>\n          <p class=\"explanation\">Explication : Elle ne reçoit pas suffisamment d'énergie pour fonctionner normalement.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q41 : Comment isoler mathématiquement R dans la loi d'Ohm ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : R = U ÷ I.\u003c/span>\n          <p class=\"explanation\">Explication : Si U = R × I, on divise de chaque côté par I pour trouver R.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q42 : Que se passe-t-il si on choisit un calibre d'ohmmètre plus petit que la résistance qu'on mesure ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : L'écran affichera une erreur.\u003c/span>\n          <p class=\"explanation\">Explication : L'appareil ne peut pas afficher une valeur supérieure au calibre sélectionné.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q43 : Qu'est-ce qu'un dipôle ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Un composant électrique qui possède deux pôles (deux bornes).\u003c/span>\n          <p class=\"explanation\">Explication : Exemples : une pile, une lampe, un moteur, un fil.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q44 : Que fait la charge électrique au passage du générateur ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Elle gagne de l'énergie.\u003c/span>\n          <p class=\"explanation\">Explication : Le générateur lui fournit l'énergie nécessaire pour parcourir le circuit.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q45 : Vrai ou Faux : L'intensité du courant est plus faible après avoir traversé une résistance.\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Faux.\u003c/span>\n          <p class=\"explanation\">Explication : Dans un circuit en série, l'intensité est identique partout. La résistance ralentit tout le flux d'un coup, pas juste après elle.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q46 : Un fil de connexion est-il isolant ou conducteur ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Très conducteur (sa résistance est quasiment nulle).\u003c/span>\n          <p class=\"explanation\">Explication : Il est fait pour laisser passer le courant sans gaspiller d'énergie.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q47 : Un conducteur ohmique peut-il produire de la lumière ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Non, il ne produit que de la chaleur.\u003c/span>\n          <p class=\"explanation\">Explication : Par définition, la conversion s'appelle l'effet Joule (électrique -> thermique).\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q48 : Combien font 120 milliampères (mA) en Ampères (A) ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : 0,120 A.\u003c/span>\n          <p class=\"explanation\">Explication : Il faut diviser par 1000 pour passer des mA aux Ampères.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q49 : Si I = 0,10 A et R = 220 Ω, quelle est la tension U ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : U = 22 V.\u003c/span>\n          <p class=\"explanation\">Explication : Loi d'Ohm : U = R × I = 220 × 0,10 = 22 V.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n      <details class=\"reveal\">\n        <summary>Q50 : Pourquoi place-t-on une résistance en série avec une DEL (Diode) ?\u003c/summary>\n        <div class=\"reveal-body\">\n          <span class=\"solution\">Réponse : Pour la protéger et éviter qu'elle ne grille.\u003c/span>\n          <p class=\"explanation\">Explication : La résistance permet de faire baisser l'intensité du courant pour ne pas dépasser l'intensité maximale supportée par la DEL.\u003c/p>\n        \u003c/div>\n      \u003c/details>\n  \u003c/section>\n\n  \u003c!-- ONGLET 4 : QCM INTERACTIF -->\n  <section id=\"qcm-interactif\" class=\"tab-content\">\n    <h2>🎯 QCM Interactif : 25 questions pour valider tes connaissances !\u003c/h2>\n    <p class=\"muted\">Coche la bonne réponse pour chaque question, puis valide tout en bas pour découvrir ton score.\u003c/p>\n    <div id=\"quiz-elec\">\u003c/div>\n  \u003c/section>\n\n\u003c/main>\n\n<script>\n  Lecon.qcm('#quiz-elec', [\n    { question: \"Quel type de dipôle fournit l'énergie électrique au circuit ?\",\n      choices: [\"Un récepteur\",\"Un générateur\",\"Un fil de connexion\"], answer: 1 },\n    { question: \"Dans quel sens le courant circule-t-il ?\",\n      choices: [\"De la borne + vers la borne - du générateur\",\"De la borne - vers la borne + du générateur\",\"Il n'y a pas de sens précis\"], answer: 0 },\n    { question: \"Comment appelle-t-on un circuit qui ne possède qu'une seule boucle ?\",\n      choices: [\"Un circuit en dérivation\",\"Un court-circuit\",\"Un circuit en série\"], answer: 2 },\n    { question: \"Que représente l'intensité (I) du courant électrique ?\",\n      choices: [\"L'énergie dépensée par le circuit\",\"Le débit des charges électriques en un point\",\"La capacité à bloquer le courant\"], answer: 1 },\n    { question: \"Quelle est l'unité de l'intensité électrique ?\",\n      choices: [\"L'Ampère (A)\",\"Le Volt (V)\",\"Le Watt (W)\"], answer: 0 },\n    { question: \"Quelle est l'unité de la tension électrique (U) ?\",\n      choices: [\"L'Ampère (A)\",\"L'Ohm (Ω)\",\"Le Volt (V)\"], answer: 2 },\n    { question: \"Que nous dit la Loi d'Ohm ?\",\n      choices: [\"R = U × I\",\"U = R × I\",\"I = U × R\"], answer: 1 },\n    { question: \"Quel est le rôle d'une résistance dans un circuit ?\",\n      choices: [\"Ralentir le courant (diminuer l'intensité)\",\"Accélérer le courant\",\"Produire de l'énergie électrique\"], answer: 0 },\n    { question: \"Comment appelle-t-on la transformation de l'énergie électrique en chaleur par une résistance ?\",\n      choices: [\"L'effet Volta\",\"L'effet Ohm\",\"L'effet Joule\"], answer: 2 },\n    { question: \"Que dit la \\\"Loi des nœuds\\\" ?\",\n      choices: [\"L'intensité qui entre est égale à l'intensité qui sort\",\"La tension est la même partout\",\"Le courant est stoppé à chaque nœud\"], answer: 0 },\n    { question: \"Quel appareil utilise-t-on pour mesurer une résistance ?\",\n      choices: [\"Un Voltmètre\",\"Un Ohmmètre\",\"Un Ampèremètre\"], answer: 1 },\n    { question: \"Comment doit-on brancher un ohmmètre pour faire une mesure ?\",\n      choices: [\"En dérivation dans le circuit allumé\",\"En dehors du circuit (hors circuit)\",\"En série avec le générateur\"], answer: 1 },\n    { question: \"Qu'est-ce qu'un court-circuit ?\",\n      choices: [\"Un circuit très petit\",\"Quand les 2 bornes d'un composant sont reliées par un fil\",\"Quand l'interrupteur est ouvert\"], answer: 1 },\n    { question: \"Si on ajoute une résistance en série dans un circuit, que se passe-t-il ?\",\n      choices: [\"L'intensité diminue\",\"L'intensité augmente\",\"L'intensité ne change pas\"], answer: 0 },\n    { question: \"Quelle est la formule de la Puissance électrique (P) ?\",\n      choices: [\"P = U × I\",\"P = E × t\",\"P = R × I\"], answer: 0 },\n    { question: \"Quelle est l'unité de la puissance électrique ?\",\n      choices: [\"Le Joule (J)\",\"Le Watt (W)\",\"Le Volt (V)\"], answer: 1 },\n    { question: \"Comment calcule-t-on l'Énergie électrique (E) ?\",\n      choices: [\"E = P ÷ t\",\"E = P × Δt\",\"E = U × I\"], answer: 1 },\n    { question: \"Quelle est l'unité de l'énergie dans le système international ?\",\n      choices: [\"Le Watt (W)\",\"Le Volt (V)\",\"Le Joule (J)\"], answer: 2 },\n    { question: \"Que dit la Loi des tensions dans une boucle ?\",\n      choices: [\"U(Générateur) = somme des U(Récepteurs)\",\"U(Générateur) = U(Récepteur 1) - U(Récepteur 2)\",\"La tension est nulle partout\"], answer: 0 },\n    { question: \"Sur le graphique de la caractéri
